# firestore.rules değiştiğinde: önce kural testleri emülatörde çalışır, geçerse kurallar Firebase'e yüklenir.
name: Firebase kurallarını yükle

on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json, tests/**, .github/workflows/firebase-rules.yml]
  workflow_dispatch:

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test bağımlılıkları
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Kural testleri (emülatör)
        run: |
          cat > /tmp/fb-test.json <<'JSON'
          {"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8085},"ui":{"enabled":false}}}
          JSON
          cp /tmp/fb-test.json firebase.test.json
          npx --yes firebase-tools@13 emulators:exec --config firebase.test.json --only firestore --project demo-acil-sinav "node tests/rules.test.mjs" 2>&1 | tee /tmp/test.txt
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "✗|Error|error" /tmp/test.txt | head -5 | tr '\n' ' ' | cut -c1-700)
            echo "::error::Kural testleri başarısız: ${msg:-ayrıntı yok}"
            exit $rc
          fi
          echo "::notice::$(grep -E 'geçti' /tmp/test.txt | tail -1)"

  deploy-rules:
    needs: test-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Servis hesabı anahtarını hazırla
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT gizli anahtarı tanımlı değil (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node -e '
            let j; try { j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); }
            catch (e) { console.log("::error::Anahtar geçerli bir JSON değil; .json dosyasının tamamı yapıştırılmalı."); process.exit(1); }
            if (j.type !== "service_account") { console.log("::error::Anahtar bir servis hesabı anahtarı değil."); process.exit(1); }
            if (j.project_id !== "acil-sinav") { console.log("::error::Anahtar başka bir projeye ait: " + j.project_id); process.exit(1); }
            console.log("Anahtar uygun: " + j.client_email);
          ' "$RUNNER_TEMP/sa.json"
      - name: Kuralları yükle
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx --yes firebase-tools@13 deploy --only firestore:rules --project acil-sinav --non-interactive 2>&1 | tee "$RUNNER_TEMP/out.txt"
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            msg=$(grep -iE "error|denied|permission|not enabled|has not been used" "$RUNNER_TEMP/out.txt" | head -3 | tr '\n' ' ' | cut -c1-600)
            echo "::error::Kural yükleme başarısız: ${msg:-ayrıntı yok}"
            exit $rc
          fi
