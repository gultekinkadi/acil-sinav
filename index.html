      <button class="btn sm ${e.published?"":"primary"}" data-pub="${e.id}">${e.published?"Yayından kaldır":"Yayınla"}</button></div></div></div>`;
  }).join("");
  paint(`<div class="page-head"><div><h1>Sınavlar</h1><div class="sub">Sınav oluşturun, yayınlayın, sonuçları değerlendirin.</div></div>
    <button class="btn primary" id="newExam">+ Yeni sınav</button></div>
    <div class="list">${cards||`<div class="card empty">Henüz sınav yok. Önce Soru Bankası'na soru ekleyin, sonra yeni sınav oluşturun.</div>`}</div>`);
  document.getElementById("newExam").onclick=()=>go("examEdit",{id:null});
  $app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>go("examEdit",{id:b.dataset.edit}));
  $app.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>go("results",{id:b.dataset.res}));
  $app.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>shareExam(S.exams.find(x=>x.id===b.dataset.share)));
  $app.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>go("examEdit",{id:null,copyFrom:b.dataset.copy}));
  $app.querySelectorAll("[data-pub]").forEach(b=>b.onclick=async()=>{
    const e=S.exams.find(x=>x.id===b.dataset.pub);
    try{ await updateDoc(doc(db,"exams",e.id),{published:!e.published}); e.published=!e.published; await syncExamIndex(); toast(e.published?"Yayınlandı":"Yayından kaldırıldı"); viewExams(); }catch(err){ fail(err); }
  });
}

const approvedQ=q=>!q.status||q.status==="approved";
async function viewExamEdit(id,copyFrom){
  paint(`<div class="spinner"></div>`);
  await Promise.all([loadBank(),loadTemplates(),loadResidents()]);
  let ex=null, key=null, attCount=0;
  if(id){
    const [a,b,c]=await Promise.all([getDoc(doc(db,"exams",id)),getDoc(doc(db,"examKeys",id)),getDocs(query(collection(db,"attempts"),where("examId","==",id)))]);
    ex=a.exists()?a.data():null; key=b.exists()?b.data():null; attCount=c.size;
  } else if(copyFrom){
    const a=await getDoc(doc(db,"exams",copyFrom)); ex=a.exists()?a.data():null;
    if(ex) ex={...ex,title:ex.title+" (kopya)",startAt:null,endAt:null,published:false,resultsReleased:false,lateUntil:null};
  }
  const now=Date.now();
  const D={ title:ex?.title||"", description:ex?.description||"", durationMin:ex?.durationMin||40,
    startAt:tsMs(ex?.startAt)||now, endAt:tsMs(ex?.endAt)||now+7*864e5,
    shuffleQ:ex?ex.shuffleQ:true, shuffleO:ex?ex.shuffleO:true, penalty:ex?.penalty||0, published:ex?.published||false,
    passPct:hasPass(ex||{})?ex.passPct:"", sequential:!!ex?.sequential, fullscreen:!!ex?.fullscreen, deviceLock:!!ex?.deviceLock,
    sel:new Set(ex?.plan?.perResident?[]:(ex?.items||[]).map(i=>i.qid)),
    mode:ex?.plan?.perResident?"plan":"manual", perRes:!!ex?.plan?.perResident,
    plan:(ex?.plan?.rows||[{pool:"",topic:"",n:10}]).map(r=>({pool:r.pool||"",topic:r.topic||"",n:Number(r.n)||1})),
    asg:new Set(Array.isArray(ex?.assigned)?ex.assigned:S.residents.map(r=>r.email)) };
  // sınavda olup bankadan silinmiş sorular
  const orphan=ex?.plan?.perResident?[]:(ex?.items||[]).filter(i=>!S.questions.find(q=>q.id===i.qid));
  let filt="", topicF="", poolF=id?"":(lsGet("bankPool")||"");
  if(poolF && poolF!==NOPOOL && !S.pools[poolF]) poolF="";

  paint(`<div class="page-head"><div><h1>${id?"Sınavı düzenle":copyFrom?"Sınav kopyası":"Yeni sınav"}</h1>
      <div class="sub">Sorular kaydetme anında sınava kopyalanır; bankada sonradan yapılan değişiklik için sınavı yeniden kaydedin.${copyFrom?" Kopyada tarihleri güncelleyin; sınav taslak olarak kaydedilir.":""}</div></div>
      <div class="row"><button class="btn" id="cancel">Vazgeç</button>${id?`<button class="btn" id="shr">Paylaş</button><button class="btn danger" id="del">Sil</button>`:""}<button class="btn primary" id="save">Kaydet</button></div></div>
    ${attCount?`<div class="card pad" style="margin-bottom:14px;border-color:var(--warn)"><b style="color:var(--warn)">Dikkat:</b> Bu sınava ${attCount} katılım var. Soruları değiştirmek mevcut cevapların puanlamasını bozabilir; yalnızca tarih/süre gibi ayarları değiştirmeniz önerilir.</div>`:""}
    <div class="edgrid">
      <div class="card pad">
        <div class="field"><label class="f">Sınav adı</label><input type="text" id="e_title" value="${esc(D.title)}" placeholder="örn. Ekim 2026 Toksikoloji Sınavı"></div>
        <div class="field"><div class="row" style="justify-content:space-between;margin-bottom:5px;gap:6px"><label class="f" style="margin:0">Açıklama (isteğe bağlı)</label>
            <div class="row" style="gap:4px"><select id="tplSel" class="tplsel">${tplOptions()}</select><button class="btn sm ghost" id="tplMng" type="button">Şablonlar</button></div></div>
          <textarea id="e_desc" style="min-height:120px" placeholder="Asistanlar sınava başlamadan önce görür. Hazır metin için “Şablondan ekle”yi kullanın.">${esc(D.description)}</textarea>
          <div class="row" style="justify-content:space-between;margin-top:4px"><span class="small muted">{soru}, {süre} gibi alanlar sınav ayarlarıyla doldurulur.</span><button class="btn sm ghost" id="tplSave" type="button">Şablon olarak kaydet</button></div>
          <div id="descPrev" class="descprev hidden"></div></div>
        <div class="grid2"><div class="field"><label class="f">Süre (dakika)</label><input type="number" id="e_dur" min="1" max="600" value="${D.durationMin}"></div>
          <div class="field"><label class="f">Yanlış cezası</label><select id="e_pen"><option value="0">Yok</option><option value="0.25" ${D.penalty==0.25?"selected":""}>4 yanlış 1 doğru</option><option value="0.2" ${D.penalty==0.2?"selected":""}>5 yanlış 1 doğru</option></select></div></div>
        <div class="grid2"><div class="field"><label class="f">Geçme notu (%)</label><input type="number" id="e_pass" min="0" max="100" step="1" value="${esc(D.passPct)}" placeholder="isteğe bağlı"></div><div></div></div>
        <div class="field"><label class="f">Başlama açılışı</label><input type="datetime-local" id="e_start" value="${toLocalInput(D.startAt)}"></div>
        <div class="field"><label class="f">Son başlama / kapanış</label><input type="datetime-local" id="e_end" value="${toLocalInput(D.endAt)}">
          <div class="small muted" style="margin-top:4px">Asistan bu aralıkta istediği an başlar; süre başladığı andan itibaren işler.</div></div>
        <div class="field"><label class="check"><input type="checkbox" id="e_sq" ${D.shuffleQ?"checked":""}> Soru sırasını her asistana karıştır <span class="muted small">(vakanın soruları birlikte kalır)</span></label></div>
        <div class="field"><label class="check"><input type="checkbox" id="e_so" ${D.shuffleO?"checked":""}> Şık sırasını karıştır</label></div>
        <div class="field secbox"><div class="small muted" style="font-weight:600;margin-bottom:6px">Sınav güvenliği</div>
          <label class="check" style="margin-bottom:6px"><input type="checkbox" id="e_seq" ${D.sequential?"checked":""}> <span>Sıralı mod <span class="muted small">(önceki sorulara dönülemez)</span></span></label>
          <label class="check" style="margin-bottom:6px"><input type="checkbox" id="e_fs" ${D.fullscreen?"checked":""}> <span>Tam ekran zorunlu <span class="muted small">(çıkışlar kaydedilir; telefonlarda desteklenmeyebilir)</span></span></label>
          <label class="check"><input type="checkbox" id="e_dev" ${D.deviceLock?"checked":""}> <span>Tek cihaz kilidi <span class="muted small">(başlanan cihazdan devam edilir)</span></span></label></div>
        <div class="field"><label class="check"><input type="checkbox" id="e_pub" ${D.published?"checked":""}> Yayında (seçili asistanlar görebilir)</label></div>
        <div class="field asg"><div class="row" style="justify-content:space-between;margin-bottom:6px"><label class="f" style="margin:0">Sınava girecek asistanlar</label><span class="small muted" id="asgN"></span></div>
          <label class="check asg-all"><input type="checkbox" id="asgAll"> <b>Tümünü seç</b></label>
          <div class="row" style="gap:4px;margin:6px 0 8px" id="asgK"></div>
          <div class="asg-list" id="asgList"></div>
          ${S.residents.length?"":`<div class="small" style="color:var(--warn)">Asistan listesi boş. Önce Asistanlar sayfasından asistan ekleyin.</div>`}</div>
        <div class="card pad" style="background:var(--surface-2);box-shadow:none" id="summary"></div>
      </div>
      <div>
        <div class="seg" id="modeSeg"><button type="button" data-m="manual">Soruları elle seç</button><button type="button" data-m="plan">Sınav planı (rastgele)</button></div>
        <div id="planBox" class="card pad hidden" style="margin-bottom:14px">
          <div class="small muted" style="margin-bottom:10px">Havuz ve konuya göre kaç soru çekileceğini belirleyin. Yalnız onaylı ve vakaya bağlı olmayan sorular çekilir; satırlar aynı soruyu iki kez almaz.</div>
          <div id="planRows"></div>
          <button type="button" class="btn sm" id="planAdd">+ Satır ekle</button>
          <div style="margin-top:14px"><label class="check" style="margin-bottom:6px"><input type="radio" name="pmode" value="same" ${D.perRes?"":"checked"}> <span><b>Herkese aynı sorular</b> — şimdi çek, seçimi kontrol edip düzenleyin</span></label>
            <label class="check"><input type="radio" name="pmode" value="per" ${D.perRes?"checked":""}> <span><b>Her asistana farklı sorular</b> — her asistan başlarken plana göre kendi setini alır</span></label></div>
          <div class="row" style="margin-top:12px;justify-content:space-between"><span class="small" id="planSum"></span><button type="button" class="btn primary" id="planDraw">Soruları çek</button></div>
        </div>
        <div id="manualBox">
        <div class="toolbar"><select id="pp" style="width:auto"><option value="">Tüm havuzlar</option>${poolList().map(p=>`<option value="${p.id}" ${poolF===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}${S.questions.some(q=>poolOf(q)===NOPOOL)?`<option value="${NOPOOL}" ${poolF===NOPOOL?"selected":""}>Havuzsuz</option>`:""}</select><input type="search" id="pf" placeholder="Soru ara…"><select id="pt"><option value="">Tüm konular</option>${topics().map(t=>`<option>${esc(t)}</option>`).join("")}</select>
          <button class="btn sm" id="selAll">Görünenleri seç</button><button class="btn sm" id="selNone">Temizle</button></div>
        ${orphan.length?`<div class="small" style="color:var(--warn);margin-bottom:8px">${orphan.length} soru bankadan silinmiş; kaydederseniz sınavdan çıkarılır.</div>`:""}
        <div class="pick" id="pick"></div>
        </div>
      </div>
    </div>`);

  const visible = q => approvedQ(q) && (!poolF || poolOf(q)===poolF) && (!topicF || q.topic===topicF) && (!filt || trLower(q.stem+" "+(q.topic||"")+" "+(S.cases[q.caseId]?.title||"")+" "+(S.cases[q.caseId]?.text||"")).includes(filt));
  function drawPick(){
    const blocks=bankBlocks(S.questions.filter(visible));
    const row=(q,sub)=>`<label class="pr ${sub?"sub":""}"><input type="checkbox" data-q="${q.id}" ${D.sel.has(q.id)?"checked":""}>
      <span class="t">${esc(q.stem)}</span>${!poolF&&q.poolId&&S.pools[q.poolId]?`<span class="badge acc">${esc(poolName(q.poolId))}</span>`:""}<span class="badge">${q.type==="open"?"Açık uçlu":"ÇS"}</span>${q.topic?`<span class="badge">${esc(q.topic)}</span>`:""}${q.imageId?`<span class="badge info">Görsel</span>`:""}${q.dicomId?`<span class="badge info">BT/MR</span>`:""}${q.practice?`<span class="badge warn" title="Alıştırmaya açık: asistanlar cevabını görebilir">Alıştırma</span>`:""}${qhistBadge(q.id,true)}</label>`;
    document.getElementById("pick").innerHTML = blocks.length ? blocks.map(b=> b.kind==="q" ? row(b.q) :
      `<label class="pr case"><input type="checkbox" data-case="${b.c.id}" ${b.qs.every(q=>D.sel.has(q.id))?"checked":""}><span class="t">Vaka: ${esc(b.c.title||"(başlıksız)")}</span><span class="badge info">${b.qs.length} soru</span></label>${b.qs.map(q=>row(q,true)).join("")}`
    ).join("") : `<div class="empty">Soru bulunamadı.</div>`;
    document.querySelectorAll("#pick [data-q]").forEach(c=>c.onchange=()=>{ c.checked?D.sel.add(c.dataset.q):D.sel.delete(c.dataset.q); drawPick(); });
    document.querySelectorAll("#pick [data-case]").forEach(c=>c.onchange=()=>{ S.questions.filter(q=>q.caseId===c.dataset.case).forEach(q=>c.checked?D.sel.add(q.id):D.sel.delete(q.id)); drawPick(); });
    drawSummary();
  }
  function drawSummary(){
    const qs=S.questions.filter(q=>D.sel.has(q.id));
    const mcq=qs.filter(q=>q.type!=="open").length, open=qs.length-mcq, pts=qs.reduce((s,q)=>s+(Number(q.points)||1),0);
    const img=qs.filter(q=>q.imageId).length, cs=new Set(qs.map(q=>q.caseId).filter(Boolean)).size;
    const byPool={}; qs.forEach(q=>{ const n=poolName(poolOf(q)===NOPOOL?null:q.poolId); byPool[n]=(byPool[n]||0)+1; });
    const pl=Object.entries(byPool);
    D.drawPrev&&D.drawPrev();
    const prc=qs.filter(q=>q.practice).length;
    if(D.mode==="plan"&&D.perRes){ const c=planCands(), tot=D.plan.reduce((s,r)=>s+(Number(r.n)||0),0);
      document.getElementById("summary").innerHTML=`<b>Kişiye özel set: her asistana ${tot} soru</b><div class="small muted">${D.plan.length} plan satırı · toplam ${c.reduce((s,x)=>s+x.length,0)} aday soru${c.some(x=>x.some(q=>q.practice))?`<br><span style="color:var(--warn)">Aday sorular arasında alıştırmaya açık olanlar var; asistanlar cevaplarını önceden görebilir.</span>`:""}</div>`; return; }
    document.getElementById("summary").innerHTML=`<b>${qs.length} soru seçildi</b><div class="small muted">${mcq} çoktan seçmeli · ${open} açık uçlu · ${cs} vaka · ${img} görselli<br>Toplam ${fmtNum(pts)} puan${pl.length>1||(pl.length&&pl[0][0]!=="Havuzsuz")?`<br>${pl.map(([n,c])=>`${esc(n)}: ${c}`).join(" · ")}`:""}${prc?`<br><span style="color:var(--warn)">${prc} soru alıştırmaya açık; asistanlar cevaplarını önceden görebilir.</span>`:""}</div>`;
  }
  // ---- sınav planı ----
  function planCands(){ const used=new Set(); return D.plan.map(r=>{ const c=S.questions.filter(q=>approvedQ(q)&&!q.caseId&&!used.has(q.id)&&(!r.pool||poolOf(q)===r.pool)&&(!r.topic||q.topic===r.topic)); c.forEach(q=>used.add(q.id)); return c; }); }
  const topicsIn=pool=>[...new Set(S.questions.filter(q=>approvedQ(q)&&!q.caseId&&(!pool||poolOf(q)===pool)).map(q=>q.topic).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"tr"));
  function drawPlan(){
    const c=planCands();
    document.getElementById("planRows").innerHTML=D.plan.map((r,i)=>`<div class="planrow">
      <select data-pl="pool" data-i="${i}"><option value="">Tüm havuzlar</option>${poolList().map(p=>`<option value="${p.id}" ${r.pool===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}${S.questions.some(q=>poolOf(q)===NOPOOL)?`<option value="${NOPOOL}" ${r.pool===NOPOOL?"selected":""}>Havuzsuz</option>`:""}</select>
      <select data-pl="topic" data-i="${i}"><option value="">Tüm konular</option>${topicsIn(r.pool).map(t=>`<option ${r.topic===t?"selected":""}>${esc(t)}</option>`).join("")}</select>
      <input type="number" min="1" data-pl="n" data-i="${i}" value="${r.n}" title="Çekilecek soru sayısı">
      <span class="small ${c[i].length<r.n?"bad-t":"muted"}" style="white-space:nowrap">${c[i].length} uygun</span>
      <button type="button" class="btn sm ghost danger" data-plx="${i}" ${D.plan.length<2?"disabled":""}>✕</button></div>`).join("");
    document.querySelectorAll("[data-pl]").forEach(el=>el.onchange=()=>{ const r=D.plan[el.dataset.i]; if(el.dataset.pl==="n") r.n=Math.max(1,parseInt(el.value,10)||1); else { r[el.dataset.pl]=el.value; if(el.dataset.pl==="pool") r.topic=""; } drawPlan(); });
    document.querySelectorAll("[data-plx]").forEach(b=>b.onclick=()=>{ D.plan.splice(Number(b.dataset.plx),1); drawPlan(); });
    const tot=D.plan.reduce((s,r)=>s+r.n,0), short=D.plan.some((r,i)=>c[i].length<r.n);
    document.getElementById("planSum").innerHTML=short?`<span class="bad-t">Bazı satırlarda yeterli soru yok.</span>`:`Toplam ${tot} soru`;
    document.getElementById("planDraw").classList.toggle("hidden",D.perRes);
    drawSummary();
  }
  document.getElementById("planAdd").onclick=()=>{ D.plan.push({pool:"",topic:"",n:5}); drawPlan(); };
  document.querySelectorAll("[name=pmode]").forEach(r=>r.onchange=()=>{ D.perRes=r.value==="per"&&r.checked; drawPlan(); });
  document.getElementById("planDraw").onclick=()=>{
    const c=planCands(); if(D.plan.some((r,i)=>c[i].length<r.n)) return toast("Bazı satırlarda yeterli soru yok",true);
    D.sel=new Set(); D.plan.forEach((r,i)=>shuffle(c[i]).slice(0,r.n).forEach(q=>D.sel.add(q.id)));
    setMode("manual"); toast(`${D.sel.size} soru rastgele seçildi; listeden kontrol edip değiştirebilirsiniz`); };
  function setMode(m){ D.mode=m; if(m==="manual") D.perRes=false;
    document.querySelectorAll("#modeSeg [data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
    document.getElementById("planBox").classList.toggle("hidden",m!=="plan"); document.getElementById("manualBox").classList.toggle("hidden",m==="plan"&&D.perRes);
    if(m==="plan"){ document.querySelector(`[name=pmode][value=${D.perRes?"per":"same"}]`).checked=true; drawPlan(); } else drawPick(); }
  document.querySelectorAll("#modeSeg [data-m]").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  document.querySelectorAll("[name=pmode]").forEach(r=>r.addEventListener("change",()=>document.getElementById("manualBox").classList.toggle("hidden",D.perRes)));
  drawPick(); setMode(D.mode);
  if(!S.qhist) computeQHist().then(()=>{ if(S.view==="examEdit"&&D.mode==="manual"&&document.getElementById("pick")) drawPick(); }).catch(e=>console.error(e));
  document.getElementById("shr")?.addEventListener("click",()=>shareExam({id,...ex}));
  // sınava girecek asistanlar
  const kidemler=[...new Set(S.residents.map(r=>r.kidem).filter(Boolean))].sort((a,b)=>a-b);
  const drawAsg=()=>{
    const n=S.residents.filter(r=>D.asg.has(r.email)).length, all=S.residents.length;
    const cb=document.getElementById("asgAll"); cb.checked=all>0&&n===all; cb.indeterminate=n>0&&n<all; cb.disabled=!all;
    document.getElementById("asgN").textContent=`${n} / ${all} seçili`;
    document.getElementById("asgK").innerHTML=kidemler.map(k=>{ const g=S.residents.filter(r=>r.kidem===k), on=g.every(r=>D.asg.has(r.email));
      return `<button type="button" class="chip sm ${on?"on":""}" data-k="${k}" title="${on?"Kaldır":"Seç"}: tüm ${k}. yıllar">${k}. yıl<span class="n">${g.length}</span></button>`; }).join("");
    document.getElementById("asgList").innerHTML=S.residents.map(r=>`<label class="check"><input type="checkbox" data-asg="${esc(r.email)}" ${D.asg.has(r.email)?"checked":""}> <span class="grow">${esc(r.name)}</span><span class="small muted">${r.kidem?r.kidem+". yıl":""}</span></label>`).join("");
    document.querySelectorAll("[data-asg]").forEach(c=>c.onchange=()=>{ c.checked?D.asg.add(c.dataset.asg):D.asg.delete(c.dataset.asg); drawAsg(); });
    document.querySelectorAll("#asgK [data-k]").forEach(b=>b.onclick=()=>{ const g=S.residents.filter(r=>r.kidem===Number(b.dataset.k)); const on=g.every(r=>D.asg.has(r.email)); g.forEach(r=>on?D.asg.delete(r.email):D.asg.add(r.email)); drawAsg(); });
  };
  document.getElementById("asgAll").onchange=e=>{ S.residents.forEach(r=>e.target.checked?D.asg.add(r.email):D.asg.delete(r.email)); drawAsg(); };
  drawAsg();
  // açıklama şablonları ve önizleme
  const descEl=document.getElementById("e_desc"), tplSel=document.getElementById("tplSel");

}
const fmtSec=s=>s<60?`${s} sn`:`${Math.floor(s/60)} dk ${s%60?(s%60)+" sn":""}`.trim();
function awayBadge(att){ const a=awaySummary(att); if(!a.n&&!a.reopen&&!a.fs&&!a.dev) return `<span class="badge ok">Yok</span>`;
  return `${a.n?`<span class="badge ${a.n>=3||a.secs>=60?"bad":"warn"}">${a.n}× · ${fmtSec(a.secs)}</span>`:""}${a.fs?` <span class="badge warn">${a.fs} tam ekran çıkışı</span>`:""}${a.dev?` <span class="badge bad">${a.dev} başka cihaz</span>`:""}${a.reopen?` <span class="badge">${a.reopen} yeniden açma</span>`:""}`; }

/* ---------------- puanlama ---------------- */
// Cevap anahtarı: key[qid] tek şık (sayı) veya kabul edilen şıklar (dizi); voided[qid]: "correct" (herkese doğru) | "drop" (çıkarıldı)
const acceptedOf=(key,qid)=>{ const k=key?.key?.[qid]; return k==null?[]:(Array.isArray(k)?k:[k]); };
const voidOf=(key,qid)=>key?.voided?.[qid]||null;
const lateFor=(e,email)=>tsMs(e?.lateUntil?.[String(email||"").toLowerCase()])||null;
const personalEnd=(e,email)=>Math.max(tsMs(e.endAt)||0, lateFor(e,email)||0);
const qCount=e=>e.plan?.perResident?(e.drawCount||0):(e.items||[]).length;
const qPoints=e=>{ const it=e.items||[]; if(!e.plan?.perResident) return it.reduce((s,i)=>s+(Number(i.points)||1),0); const a=it.length?it.reduce((s,i)=>s+(Number(i.points)||1),0)/it.length:1; return Math.round(a*(e.drawCount||0)*100)/100; };
// Asistanın aldığı sorular (kişiye özel sette yalnız ona çekilenler)
function itemsFor(exam,att){ const set=exam.plan?.perResident&&att?.order?new Set(att.order):null; return (exam.items||[]).filter(it=>!set||set.has(it.qid)); }
function deadlineOf(exam, att){
  const s=tsMs(att.startedAt); if(!s) return null;
  if(att.deadlineAt) return tsMs(att.deadlineAt);
  return Math.min(s+exam.durationMin*60000, personalEnd(exam,att.email)+exam.durationMin*60000);
}
function isFinished(exam, att){ return att.status==="submitted" || (deadlineOf(exam,att)!=null && Date.now()>deadlineOf(exam,att)+120000); }
const hasPass=e=>e.passPct!=null&&e.passPct!==""&&!isNaN(Number(e.passPct));
function scoreAttempt(exam, key, att){
  const r={c:0,w:0,e:0,v:0,mcqPts:0,openPts:0,pending:0,max:0,items:[]};
  const ans=att.answers||{}, os=att.openScores||{}, cm=att.comments||{};
  for(const it of itemsFor(exam,att)){
    const a=ans[it.qid], v=voidOf(key,it.qid);
    if(v==="drop"){ r.items.push({qid:it.qid,type:it.type,given:it.type==="mcq"?(a??null):String(a||""),correct:it.type==="mcq"?acceptedOf(key,it.qid):null,earned:0,max:0,res:"x",dropped:true}); continue; }
    r.max+=it.points;
    if(it.type==="mcq"){
      const acc=acceptedOf(key,it.qid); let earned=0, res="e";
      if(v==="correct"){ r.c++; r.v++; earned=it.points; res="c"; }
      else if(a===undefined||a===null){ r.e++; }
      else if(acc.includes(a)){ r.c++; earned=it.points; res="c"; }
      else { r.w++; earned=-(exam.penalty||0)*it.points; res="w"; }
      r.mcqPts+=earned; r.items.push({qid:it.qid,type:"mcq",given:a??null,correct:acc,earned,max:it.points,res,...(v?{voided:true}:{})});
    } else {
      const txt=(a||"").trim(); let earned=v==="correct"?it.points:os[it.qid];
      if(earned==null){ if(txt) r.pending++; earned= txt?null:0; }
      r.openPts+=earned||0; r.items.push({qid:it.qid,type:"open",given:txt,earned,max:it.points,comment:cm[it.qid]||"",...(v?{voided:true}:{})});
    }
  }
  r.total=r.mcqPts+r.openPts; r.pct=r.max?r.total/r.max*100:0;
  r.pass=hasPass(exam)?r.pct>=Number(exam.passPct):null;
  return r;
}
function gradeDoc(exam, key, att, sc){
  return { uid:att.uid, examId:att.examId, examTitle:exam.title, total:sc.total, max:sc.max, pct:sc.pct, c:sc.c, w:sc.w, e:sc.e,
    pass:sc.pass, passPct:hasPass(exam)?Number(exam.passPct):null,
    items:sc.items.map(i=>({...i, earned:i.earned??0, explanation:key?.explanations?.[i.qid]||""})), releasedAt:serverTimestamp() };
}
// Sonuçlar yayındaysa, anahtar/iptal değişikliğinden sonra yayınlanmış notları günceller
async function regrade(exam,key,atts){
  if(!exam.resultsReleased) return 0;
  const fin=atts.filter(a=>isFinished(exam,a));
  await batchOps(fin.map(a=>b=>b.set(doc(db,"grades",a.id),gradeDoc(exam,key,a,scoreAttempt(exam,key,a)))));
  return fin.length;
}
const passBadge=p=>p==null?"":p?`<span class="badge ok">Başarılı</span>`:`<span class="badge bad">Başarısız</span>`;
const voidBadge=v=>v==="correct"?`<span class="badge warn">İptal · herkese doğru</span>`:v==="drop"?`<span class="badge warn">İptal · puanlama dışı</span>`:"";

/* ---------------- sınav istatistikleri ---------------- */
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
const sdev=a=>{ if(a.length<2) return 0; const m=avg(a); return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length); };
const fmt2=n=>n==null?"—":n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
// Madde puanı: ÇS'de doğruysa sorunun puanı (ceza hariç), açık uçluda verilen puan
const itemPts=i=>i.type==="mcq"?(i.res==="c"?i.max:0):Math.max(0,i.earned??0);
// done: [{att, sc, res}]
function examStats(exam, done, key){
  const N=done.length, items=(exam.items||[]).filter(it=>voidOf(key,it.qid)!=="drop");
  const perRes=!!exam.plan?.perResident;
  // M[i][qid]: yalnız o soruyu alan asistanlar için tanımlı
  const M=done.map(x=>{ const m={}; x.sc.items.forEach(i=>{ if(!i.dropped) m[i.qid]=itemPts(i); }); return m; });
  const pcts=done.map(x=>x.sc.pct);
  // Ayırt edicilik: üst %27 ile alt %27 grubun madde başarı farkı (−1…+1)
  const g=N>=4?Math.max(1,Math.round(N*0.27)):0;
  const ord=done.map((_,i)=>i).sort((a,b)=>pcts[b]-pcts[a]);
  const up=ord.slice(0,g), lo=ord.slice(N-g);
  const grp=(ix,q)=>ix.filter(i=>M[i][q]!==undefined).map(i=>M[i][q]);
  const disc={}; items.forEach(it=>{ const U=grp(up,it.qid), L=grp(lo,it.qid); disc[it.qid]=g&&U.length&&L.length?(avg(U)-avg(L))/it.points:null; });
  // Güvenirlik: Cronbach α (tümü 1 puanlık ÇS ise KR-20'ye eşittir). Kişiye özel setlerde hesaplanmaz.
  const relName=items.every(it=>it.type==="mcq")&&new Set(items.map(it=>it.points)).size===1?"KR-20":"Cronbach α";
  let rel=null;
  if(!perRes){ const totals=M.map(m=>items.reduce((s,it)=>s+(m[it.qid]||0),0)); const vt=sdev(totals)**2;
    if(N>=3&&items.length>=2&&vt>0){ const k=items.length; const sv=items.reduce((s,it)=>s+sdev(M.map(m=>m[it.qid]||0))**2,0); rel=k/(k-1)*(1-sv/vt); } }
  // Konu bazında grup başarısı
  const tp={}; items.forEach(it=>{ const t=it.topic||"Konu belirtilmemiş"; const o=tp[t]=tp[t]||{t,n:0,e:0,m:0}; o.n++; M.forEach(m=>{ if(m[it.qid]!==undefined){ o.e+=m[it.qid]; o.m+=it.points; } }); });
  const topics=Object.values(tp).filter(o=>o.m>0).map(o=>({...o,p:o.e/o.m*100})).sort((a,b)=>a.p-b.p);
  // Kıdeme göre
  const kd={}; done.forEach(x=>{ const k=x.res.kidem?String(x.res.kidem):"—"; (kd[k]=kd[k]||[]).push(x.sc.pct); });
  const kidem=Object.entries(kd).map(([k,a])=>({k,n:a.length,m:avg(a),min:Math.min(...a),max:Math.max(...a)})).sort((a,b)=>a.k.localeCompare(b.k,"tr"));
  // Puan dağılımı (%10'luk dilimler)
  const bins=Array.from({length:10},(_,i)=>({lo:i*10,hi:i*10+10,n:0,names:[]}));
  done.forEach(x=>{ const b=Math.min(9,Math.max(0,Math.floor(x.sc.pct/10))); bins[b].n++; bins[b].names.push(x.res.name||x.res.email); });
  return {N,g,disc,rel,relName,topics,kidem,bins,perRes,sd:sdev(pcts)};
}
function discBadge(d){
  if(d==null) return `<span class="muted">—</span>`;
  const [cls,l]=d<0?["bad","Negatif"]:d<0.2?["bad","Zayıf"]:d<0.3?["warn","Düzeltilmeli"]:d<0.4?["info","İyi"]:["ok","Çok iyi"];
  return `<span class="badge ${cls}" title="Ayırt edicilik indeksi">${fmt2(d)} · ${l}</span>`;
}
function relLabel(r){ return r==null?"":r>=0.8?"İyi":r>=0.7?"Kabul edilebilir":r>=0.5?"Düşük":"Çok düşük"; }
function discLabel(d){ return d==null?"":d<0?"Negatif":d<0.2?"Zayıf":d<0.3?"Düzeltilmeli":d<0.4?"İyi":"Çok iyi"; }

// Grafikler kapsayıcının gerçek genişliğinde çizilir (yazılar her ekranda aynı boyutta kalır)
const CHARTS=new Map();
function chartSlot(fn){ const id="c"+newId(); CHARTS.set(id,fn); return `<div class="chart-slot" data-chart="${id}"></div>`; }
function mountCharts(){

  document.querySelectorAll("[data-chart]").forEach(el=>{ const fn=CHARTS.get(el.dataset.chart); live.add(el.dataset.chart); if(fn) el.innerHTML=fn(Math.max(260,Math.floor(el.clientWidth))); });

let _rsz; window.addEventListener("resize",()=>{ clearTimeout(_rsz); _rsz=setTimeout(mountCharts,150); });
function histSVG(bins,W=520){
  const H=210,pl=30,pr=8,pt=12,pb=28, mx=Math.max(1,...bins.map(b=>b.n));
  const step=Math.max(1,Math.ceil(mx/4)), top=step*Math.ceil(mx/step), ih=H-pt-pb, cw=(W-pl-pr)/bins.length;
  const y=v=>H-pb-v/top*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Puan dağılımı histogramı">`;
  for(let v=0;v<=top;v+=step) s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  bins.forEach((b,i)=>{ const x=pl+i*cw+1, w=cw-2;
    if(b.n){ const h=b.n/top*ih, yy=H-pb-h, r=Math.min(4,h,w/2);
      s+=`<path class="bar1" d="M${x},${H-pb} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+w-r} Q${x+w},${yy} ${x+w},${yy+r} V${H-pb} Z"/>`;
      s+=`<text class="lbl" x="${x+w/2}" y="${yy-4}" text-anchor="middle">${b.n}</text>`; }
    s+=`<rect class="hit" x="${pl+i*cw}" y="${pt}" width="${cw}" height="${ih}"><title>%${b.lo}–${b.hi===100?100:b.hi}: ${b.n} asistan${b.names.length?"\n"+b.names.map(esc).join("\n"):""}</title></rect>`;
  });
  for(let i=0;i<=10;i+=2) s+=`<text class="ax" x="${pl+i*cw}" y="${H-pb+16}" text-anchor="middle">${i*10}</text>`;
  s+=`<line class="base" x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/></svg>`;
  return s+`<div class="small muted" style="text-align:center;margin-top:-2px">Başarı yüzdesi · çubuk üstü: asistan sayısı</div>`;
}
function hbars(rows){ // [{label, p, sub}]
  return `<div class="hbars">${rows.map(r=>`<div class="hb"><span class="hl" title="${esc(r.label)}">${esc(r.label)}</span><span class="track"><span style="width:${Math.max(0,Math.min(100,r.p))}%"></span></span><span class="hv">%${r1(r.p)}</span>${r.sub?`<span class="hs">${r.sub}</span>`:""}</div>`).join("")}</div>`;
}
function trendSVG(pts,W=680){ // [{label, title, you|null, cls}]
  const H=250,pl=34,pr=W<500?78:96,pt=14,pb=34, n=pts.length, iw=W-pl-pr, ih=H-pt-pb;
  const x=i=>n===1?pl+iw/2:pl+i*iw/(n-1), y=v=>pt+(1-Math.max(0,Math.min(100,v))/100)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sınavlara göre başarı">`;
  [0,25,50,75,100].forEach(v=>s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  const every=Math.ceil(n/Math.max(2,Math.floor(iw/80)));
  pts.forEach((p,i)=>{ if(i%every===0||i===n-1) s+=`<text class="ax" x="${x(i)}" y="${H-pb+16}" text-anchor="middle">${esc(p.label)}</text>`; });
  const line=(key,cls)=>{ let d="",pen=false; pts.forEach((p,i)=>{ if(p[key]==null){ pen=false; return; } d+=(pen?"L":"M")+x(i)+","+y(p[key])+" "; pen=true; }); return d?`<path class="${cls}" d="${d}"/>`:""; };
  s+=line("cls","ln2")+line("you","ln1");
  pts.forEach((p,i)=>{ if(p.cls!=null) s+=`<circle class="dt2" cx="${x(i)}" cy="${y(p.cls)}" r="4"/>`; if(p.you!=null) s+=`<circle class="dt1" cx="${x(i)}" cy="${y(p.you)}" r="5"/>`;
    s+=`<rect class="hit" x="${x(i)-Math.max(12,iw/(2*Math.max(1,n-1)))}" y="${pt}" width="${2*Math.max(12,iw/(2*Math.max(1,n-1)))}" height="${ih}"><title>${esc(p.title)}\nAsistan: ${p.you==null?"girmedi":"%"+r1(p.you)}\nSınıf ortalaması: %${r1(p.cls)}</title></rect>`; });
  // son noktalarda doğrudan etiket
  const lastY=pts.map((p,i)=>[i,p.you]).filter(z=>z[1]!=null).pop(), lastC=pts.length-1;
  if(lastY) s+=`<text class="dl1" x="${x(lastY[0])+9}" y="${y(lastY[1])+4}">Asistan %${r1(lastY[1])}</text>`;
  const cy=y(pts[lastC].cls), yy=lastY&&lastY[0]===lastC&&Math.abs(y(lastY[1])-cy)<14?cy+(cy>y(lastY[1])?14:-14):cy;
  s+=`<text class="dl2" x="${x(lastC)+9}" y="${yy+4}">Sınıf %${r1(pts[lastC].cls)}</text>`;
  return s+`</svg>`;
}

async function loadResultData(id){
  const [e,k,a]=await Promise.all([getDoc(doc(db,"exams",id)),getDoc(doc(db,"examKeys",id)),getDocs(query(collection(db,"attempts"),where("examId","==",id)))]);
  await loadResidents();
  return { exam:{id,...e.data()}, key:k.exists()?k.data():{key:{},explanations:{}}, atts:a.docs.map(d=>({id:d.id,...d.data()})) };
}
async function loadAppeals(examId){
  try{ const s=await getDocs(query(collection(db,"appeals"),where("examId","==",examId))); return s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(tsMs(a.createdAt)||0)-(tsMs(b.createdAt)||0)); }
  catch(e){ console.error(e); return []; }
}
const APPEAL_ST={pending:["Bekliyor","warn"],accepted:["Kabul edildi","ok"],rejected:["Reddedildi","bad"]};
const appealBadge=s=>{ const [l,c]=APPEAL_ST[s]||[s,""]; return `<span class="badge ${c}">${l}</span>`; };

// Soru iptali / cevap anahtarı düzeltme (tüm puanlar yeniden hesaplanır)
function itemDlg(exam,key,qid,atts,onDone){
  const it=exam.items.find(i=>i.qid===qid); if(!it) return;
  const acc=acceptedOf(key,qid), v=voidOf(key,qid)||"";
  const m=modal(`<div class="modal-h"><h2>Soru ${exam.items.indexOf(it)+1}: cevap anahtarı ve iptal</h2><button class="btn sm ghost" data-close>✕</button></div>
    <div class="modal-b"><div class="q-stem" style="font-size:15px;margin-bottom:14px">${esc(it.stem)}</div>
    ${it.type==="mcq"?`<label class="f">Kabul edilen cevap(lar)</label><div class="small muted" style="margin-bottom:8px">Birden fazla şık işaretlenirse hepsi doğru sayılır.</div>
      ${it.options.map((o,j)=>`<label class="check" style="margin-bottom:6px"><input type="checkbox" data-acc="${j}" ${acc.includes(j)?"checked":""}> <span><b>${LET[j]})</b> ${esc(o)}</span></label>`).join("")}
      <label class="check small" style="margin:8px 0 4px"><input type="checkbox" id="iBank" checked> Tek doğru şık seçiliyse soru bankasındaki cevabı da güncelle</label>`:""}
    <label class="f" style="margin-top:14px">Durum</label>
    <label class="check" style="margin-bottom:6px"><input type="radio" name="vd" value="" ${!v?"checked":""}> Geçerli</label>
    <label class="check" style="margin-bottom:6px"><input type="radio" name="vd" value="correct" ${v==="correct"?"checked":""}> <span>İptal: <b>herkese doğru</b> say (tam puan)</span></label>
    <label class="check"><input type="radio" name="vd" value="drop" ${v==="drop"?"checked":""}> <span>İptal: <b>puanlamadan çıkar</b> (toplam puan bu soru kadar azalır)</span></label>
    <p class="small muted" style="margin-bottom:0">Kaydettiğinizde tüm puanlar yeniden hesaplanır${exam.resultsReleased?"; yayınlanmış sonuçlar da güncellenir":""}.</p></div>
    <div class="modal-f"><button class="btn" data-close>Vazgeç</button><button class="btn primary" id="iSave">Kaydet ve yeniden puanla</button></div>`);
  m.el.querySelector("#iSave").onclick=async()=>{
    const nv=m.el.querySelector("[name=vd]:checked").value;
    const k2={key:{...(key.key||{})},explanations:{...(key.explanations||{})},voided:{...(key.voided||{})}};
    let one=null;
    if(it.type==="mcq"){ const sel=[...m.el.querySelectorAll("[data-acc]:checked")].map(c=>Number(c.dataset.acc));
      if(!sel.length&&!nv) return toast("En az bir doğru şık seçin",true);
      if(sel.length){ k2.key[qid]=sel.length===1?sel[0]:sel; if(sel.length===1) one=sel[0]; } }
    if(nv) k2.voided[qid]=nv; else delete k2.voided[qid];
    try{ m.el.querySelector("#iSave").disabled=true;
      await setDoc(doc(db,"examKeys",exam.id),k2);
      if(one!=null&&m.el.querySelector("#iBank")?.checked){ try{ await updateDoc(doc(db,"questions",qid),{correct:one}); }catch(e){} }
      const n=await regrade(exam,k2,atts); m.close(); toast(`Kaydedildi; puanlar yeniden hesaplandı${n?` · ${n} yayınlanmış sonuç güncellendi`:""}`); onDone&&onDone();
    }catch(e){ fail(e); m.el.querySelector("#iSave").disabled=false; }
  };
}
function decideAppeal(a,accept,onDone){
  const m=modal(`<div class="modal-h"><h2>İtirazı ${accept?"kabul et":"reddet"}</h2></div>
    <div class="modal-b"><p style="margin-top:0"><b>${esc(a.name||a.email)}</b>: “${esc(a.text)}”</p>
    <label class="f">Asistana yanıt (isteğe bağlı)</label><textarea id="apR" style="min-height:90px">${esc(a.reply||"")}</textarea>
    ${accept?`<p class="small muted">Kabul ettikten sonra soruyu iptal etme veya cevap anahtarını düzeltme penceresi açılır.</p>`:""}</div>
    <div class="modal-f"><button class="btn" data-close>Vazgeç</button><button class="btn ${accept?"primary":"danger"}" id="apOk">${accept?"Kabul et":"Reddet"}</button></div>`,"narrow");
  m.el.querySelector("#apOk").onclick=async()=>{
    try{ await updateDoc(doc(db,"appeals",a.id),{status:accept?"accepted":"rejected",reply:m.el.querySelector("#apR").value.trim(),decidedAt:serverTimestamp()}); m.close(); toast(accept?"İtiraz kabul edildi":"İtiraz reddedildi"); onDone&&onDone(accept); }catch(e){ fail(e); }
  };
}
function lateDlg(exam,res,onDone){
  const cur=lateFor(exam,res.email);
  const m=modal(`<div class="modal-h"><h2>Geç başlama izni</h2></div><div class="modal-b">
    <p style="margin-top:0"><b>${esc(res.name)}</b> sınava aşağıdaki zamana kadar başlayabilir. Diğer asistanlar için kapanış değişmez.</p>
    <label class="f">Son başlama</label><input type="datetime-local" id="lt" value="${toLocalInput(cur||Math.max(Date.now(),tsMs(exam.endAt))+864e5)}"></div>
    <div class="modal-f">${cur?`<button class="btn danger" id="ltDel">İzni kaldır</button>`:""}<button class="btn" data-close>Vazgeç</button><button class="btn primary" id="ltOk">Kaydet</button></div>`,"narrow");
  const save=async(ms)=>{ const lu={...(exam.lateUntil||{})}; if(ms) lu[res.email]=Timestamp.fromMillis(ms); else delete lu[res.email];
    try{ await updateDoc(doc(db,"exams",exam.id),{lateUntil:lu}); m.close(); toast(ms?"Geç başlama izni verildi":"İzin kaldırıldı"); onDone&&onDone(); }catch(e){ fail(e); } };
  m.el.querySelector("#ltOk").onclick=()=>{ const ms=new Date(m.el.querySelector("#lt").value).getTime(); if(!(ms>Date.now())) return toast("Gelecekte bir zaman seçin",true); save(ms); };
  m.el.querySelector("#ltDel")?.addEventListener("click",()=>save(null));
}

async function viewResults(id){
  paint(`<div class="spinner"></div>`);
  const {exam,key,atts}=await loadResultData(id);
  const appeals=await loadAppeals(id);
  const byEmail={}; atts.forEach(a=>byEmail[(a.email||"").toLowerCase()]=a);
  const rows=[];
  const elig=eligibleResidents(exam);
  for(const r of elig){ rows.push({res:r, att:byEmail[r.email]||null}); }
  atts.filter(a=>!elig.find(r=>r.email===(a.email||"").toLowerCase())).forEach(a=>rows.push({res:S.residents.find(r=>r.email===(a.email||"").toLowerCase())||{name:a.name,email:a.email,kidem:""},att:a}));
  rows.forEach(x=>{ if(x.att){ x.fin=isFinished(exam,x.att); x.sc=scoreAttempt(exam,key,x.att); } });
  const done=rows.filter(x=>x.att&&x.fin), pctArr=done.map(x=>x.sc.pct).sort((a,b)=>a-b);
  const mean=avg(pctArr);
  const med=pctArr.length?(pctArr.length%2?pctArr[(pctArr.length-1)/2]:(pctArr[pctArr.length/2-1]+pctArr[pctArr.length/2])/2):0;
  const pending=done.reduce((s,x)=>s+x.sc.pending,0);
  const max=qPoints(exam);
  const ST=examStats(exam,done,key);
  const HP=hasPass(exam), passN=done.filter(x=>x.sc.pass).length;
  const now=Date.now();

  const statusOf=x=>{ if(!x.att){ const l=lateFor(exam,x.res.email); return `<span class="badge">Girmedi</span>${l?` <span class="badge info" title="Geç başlama izni">${fmtDT(l)}'e kadar</span>`:""}`; }
    if(x.att.status==="submitted") return `<span class="badge ok">Teslim</span>`;
    return x.fin?`<span class="badge warn">Süre doldu</span>`:`<span class="badge acc">Sınavda</span>`; };
  rows.sort((a,b)=>(b.sc?.pct??-1e9)-(a.sc?.pct??-1e9));
  const tbody=rows.map(x=>`<tr class="${x.att?"click":""}" ${x.att?`data-uid="${x.att.uid}"`:""}>
    <td><b>${esc(x.res.name||"—")}</b><div class="small muted">${esc(x.res.email)}</div></td><td>${x.res.kidem?x.res.kidem+". yıl":"—"}</td><td>${statusOf(x)}</td>
    <td class="num">${x.sc?x.sc.c:"—"}</td><td class="num">${x.sc?x.sc.w:"—"}</td><td class="num">${x.sc?x.sc.e:"—"}</td>
    <td class="num">${x.sc?(x.sc.pending?`<span class="badge warn">${x.sc.pending} bekliyor</span>`:fmtNum(x.sc.openPts)):"—"}</td>
    <td class="num"><b>${x.sc?fmtNum(x.sc.total):"—"}</b></td><td class="num">${x.sc?"%"+r1(x.sc.pct):"—"}</td>
    ${HP?`<td>${x.sc&&x.fin?passBadge(x.sc.pass):""}</td>`:""}
    <td>${x.att?awayBadge(x.att):`<button class="btn sm ghost" data-late="${esc(x.res.email)}">Geç başlama</button>`}</td><td class="small muted">${x.att?fmtDT(x.att.submittedAt||x.att.startedAt):""}</td></tr>`).join("");

  // madde analizi
  const ia=exam.items.map((it,i)=>{
    const recv=done.filter(x=>x.sc.items.some(z=>z.qid===it.qid));
    const v=voidOf(key,it.qid), acc=acceptedOf(key,it.qid);
    const times=recv.map(x=>x.att.qtime?.[it.qid]).filter(t=>t>0);
    const base={i,it,v,acc,n:recv.length,d:ST.disc[it.qid]??null,t:times.length?avg(times):null,ap:appeals.filter(a=>a.qid===it.qid&&a.status==="pending").length};
    if(it.type==="mcq"){
      const vals=recv.map(x=>x.att.answers?.[it.qid]);
      const dist=it.options.map((_,j)=>vals.filter(v=>v===j).length), empty=vals.filter(v=>v==null).length;
      return {...base,dist,empty,p:recv.length?vals.filter(v=>acc.includes(v)).length/recv.length*100:null};
    }
    const sc=recv.map(x=>x.att.openScores?.[it.qid]).filter(v=>v!=null);
    return {...base,avg:sc.length?avg(sc):null};
  });
  const showIa=exam.plan?.perResident?ia.filter(r=>r.n>0):ia;
  const iaRows=showIa.map(r=>`<tr><td class="num">${r.i+1}</td><td style="white-space:normal;min-width:240px;max-width:420px">${esc(r.it.stem.slice(0,140))}${r.it.stem.length>140?"…":""}
      <div class="small muted">${esc(r.it.topic||"")}${exam.plan?.perResident?` · ${r.n} kişiye çıktı`:""}</div>${r.v||r.ap?`<div style="margin-top:4px">${voidBadge(r.v)}${r.ap?` <span class="badge bad">${r.ap} itiraz</span>`:""}</div>`:""}</td>

    <td class="num">${r.it.type==="mcq"?(r.p==null?"—":`<span class="badge ${r.p<30?"bad":r.p>85?"info":"ok"}">%${r.p.toFixed(0)}</span>`):(r.avg==null?"—":fmtNum(r.avg)+" / "+r.it.points)}</td>

  const flagged=ia.filter(r=>r.d!=null&&r.d<0.2&&!r.v).length;
  const smallN=done.length<10;
  const apPend=appeals.filter(a=>a.status==="pending").length, apOpen=exam.appealsOpen!==false;
  const apRows=appeals.map(a=>{ const it=exam.items.find(i=>i.qid===a.qid); const ix=exam.items.indexOf(it);
    return `<tr><td style="white-space:normal;min-width:200px;max-width:320px"><b>Soru ${ix+1}</b> ${voidBadge(voidOf(key,a.qid))}<div class="small muted">${esc((it?.stem||"").slice(0,90))}${(it?.stem||"").length>90?"…":""}</div></td>
      <td>${esc(a.name||a.email)}<div class="small muted">${fmtDT(a.createdAt)}</div></td>
      <td style="white-space:pre-wrap;min-width:220px;max-width:380px">${esc(a.text)}${a.reply?`<div class="small muted" style="margin-top:4px">Yanıt: ${esc(a.reply)}</div>`:""}</td>

  paint(`<div class="page-head"><div><button class="btn sm ghost" id="back" style="margin-left:-8px">← Sınavlar</button><h1>${esc(exam.title)}</h1>
      <div class="sub">${qCount(exam)} soru${exam.plan?.perResident?" (her asistana farklı set)":""} · ${fmtNum(max)} puan · ${exam.durationMin} dk${exam.penalty?" · yanlış cezası":""}${HP?` · geçme notu %${exam.passPct}`:""} · ${fmtDT(exam.startAt)} – ${fmtDT(exam.endAt)}</div></div>
    <div class="row"><button class="btn" id="shr">Paylaş</button><button class="btn" id="xls">Excel'e aktar</button>

    ${apPend?`<div class="note" style="background:var(--bad-soft)"><b>${apPend} itiraz</b> yanıt bekliyor. <a href="#itirazlar">İtirazlara git ↓</a></div>`:""}

      <div class="stat" title="İç tutarlılık: sınavın aynı yetkinliği ne kadar tutarlı ölçtüğü. ≥0,80 iyi, 0,70–0,79 kabul edilebilir."><div class="k">Güvenirlik (${ST.relName})</div><div class="v">${ST.rel==null?"—":fmt2(ST.rel)}${ST.rel!=null?`<span class="muted" style="font-size:13px;font-weight:500"> ${relLabel(ST.rel)}</span>`:""}</div>${ST.perRes?`<div class="small muted">Farklı setlerde hesaplanmaz</div>`:""}</div>
      <div class="stat"><div class="k">Puanlanacak açık uçlu</div><div class="v" style="${pending?"color:var(--warn)":""}">${pending}</div></div>

    ${done.length?`<div class="grid2 stat-grid">

async function viewProfile(email){
  paint(`<div class="spinner"></div>`);

  const keys={}; ks.docs.forEach(d=>keys[d.id]=d.data());
  const prq=pr.docs[0]?.data()?.q||{}; const prN=Object.keys(prq).length, prT=Object.values(prq).reduce((a,p)=>({c:a.c+(p.c||0),w:a.w+(p.w||0)}),{c:0,w:0});
  const atts=as.docs.map(d=>({id:d.id,...d.data()}));
  const res=S.residents.find(r=>r.email===email)||{name:(atts.find(a=>(a.email||"").toLowerCase()===email)?.name)||email,email};
  const list=[], tAgg={};
  for(const e of [...S.exams].sort((a,b)=>tsMs(a.startAt)-tsMs(b.startAt))){
    const fin=atts.filter(a=>a.examId===e.id&&isFinished(e,a)); if(!fin.length) continue;
    if(!isAssigned(e,email)&&!fin.some(a=>(a.email||"").toLowerCase()===email)) continue;
    const key=keys[e.id]||{key:{}};
    const scs=fin.map(a=>({a,sc:scoreAttempt(e,key,a)}));
    const mine=scs.find(x=>(x.a.email||"").toLowerCase()===email);
    const cls=avg(scs.map(x=>x.sc.pct));
    list.push({e,cls,n:scs.length,mine:mine?.sc||null,att:mine?.a||null,rank:mine?1+scs.filter(x=>x.sc.pct>mine.sc.pct).length:null});
    if(!mine) continue;
    e.items.forEach(it=>{ const g=sc=>sc.items.find(z=>z.qid===it.qid&&!z.dropped); const mi=g(mine.sc); if(!mi) return;
      const t=it.topic||"Konu belirtilmemiş"; const o=tAgg[t]=tAgg[t]||{t,n:0,me:0,mm:0,ce:0,cm:0};
      o.n++; o.me+=itemPts(mi); o.mm+=it.points; scs.forEach(x=>{ const xi=g(x.sc); if(xi){ o.ce+=itemPts(xi); o.cm+=it.points; } }); });
  }
  const taken=list.filter(r=>r.mine);
  const myAvg=avg(taken.map(r=>r.mine.pct)), clsAvg=avg(taken.map(r=>r.cls)), diff=myAvg-clsAvg;
  const topics=Object.values(tAgg).map(o=>({...o,p:o.mm?o.me/o.mm*100:0,c:o.cm?o.ce/o.cm*100:0})).sort((a,b)=>(a.p-a.c)-(b.p-b.c));
  const sign=v=>(v>0?"+":"")+r1(v);
  const dshort=t=>{ const d=new Date(tsMs(t)); return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"2-digit"}); };
  paint(`${printHead("Asistan Gelişim Raporu",`${res.name||email}${res.kidem?` · ${res.kidem}. yıl`:""}`)}
    <div class="page-head"><div><button class="btn sm ghost no-print" id="back" style="margin-left:-8px">← Asistanlar</button><h1>${esc(res.name||email)}</h1>
      <div class="sub">${esc(email)}${res.kidem?` · ${res.kidem}. yıl`:""} · Gelişim takibi</div></div><button class="btn no-print" id="prt">Yazdır / PDF</button></div>
    <div class="stats">
      <div class="stat"><div class="k">Girdiği sınav</div><div class="v">${taken.length}<span class="muted" style="font-size:14px"> / ${list.length}</span></div></div>
      <div class="stat"><div class="k">Ortalama başarı</div><div class="v">${taken.length?"%"+r1(myAvg):"—"}</div></div>
      <div class="stat"><div class="k">Aynı sınavlarda sınıf ort.</div><div class="v">${taken.length?"%"+r1(clsAvg):"—"}</div></div>
      <div class="stat"><div class="k">Sınıf ortalamasına göre</div><div class="v">${taken.length?sign(diff)+" puan":"—"}</div></div>
      <div class="stat"><div class="k">Son sınav</div><div class="v" style="font-size:18px">${taken.length?`%${r1(taken.at(-1).mine.pct)} · ${taken.at(-1).rank}/${taken.at(-1).n}. sıra`:"—"}</div></div>
      <div class="stat"><div class="k">Alıştırma</div><div class="v" style="font-size:18px">${prN?`${prN} soru · %${r1(prT.c/Math.max(1,prT.c+prT.w)*100)}`:"—"}</div></div>
    </div>
    ${list.length?`<div class="card pad" style="margin-bottom:18px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">Sınavlara göre başarı</h2>
      <div class="legend"><span><i class="lg1"></i>${esc(res.name||"Asistan")}</span><span><i class="lg2"></i>Sınıf ortalaması</span></div></div>
      ${chartSlot(w=>trendSVG(list.map(r=>({label:dshort(r.e.startAt),title:r.e.title,you:r.mine?r.mine.pct:null,cls:r.cls})),w))}</div>`:""}
    <h2>Sınavlar</h2>
    <div class="tbl-wrap" style="margin-bottom:22px"><table><thead><tr><th>Sınav</th><th>Tarih</th><th class="num">Asistan %</th><th class="num">Sınıf ort. %</th><th class="num">Fark</th><th class="num">Sıra</th><th class="num">D / Y / B</th></tr></thead><tbody>
      ${list.length?[...list].reverse().map(r=>`<tr class="${r.att?"click":""}" ${r.att?`data-ex="${r.e.id}" data-uid="${r.att.uid}"`:""}><td><b>${esc(r.e.title)}</b></td><td>${fmtDT(r.e.startAt).split(" ")[0]}</td>

    </tbody></table></div>
    ${topics.length?`<h2>Konu bazında (tüm sınavlar)</h2><div class="small muted" style="margin:-6px 0 8px">Sınıf ortalamasının en çok altında kaldığı konu üstte.</div>

      ${topics.map(t=>`<tr><td>${esc(t.t)}</td><td class="num">${t.n}</td><td><div class="track"><span style="width:${t.p}%"></span></div></td><td class="num">%${r1(t.p)}</td><td class="num">%${r1(t.c)}</td><td class="num"><span class="badge ${t.p-t.c>=0?"ok":"bad"}">${sign(t.p-t.c)}</span></td></tr>`).join("")}
    </tbody></table></div>`:""}`);
  document.getElementById("back").onclick=()=>go("residents");
  document.getElementById("prt").onclick=()=>window.print();

async function createPool(name){

  const id=newId(); await setDoc(doc(db,"pools",id),{name,createdAt:serverTimestamp()});
  S.pools[id]={id,name,createdAt:Timestamp.fromMillis(Date.now())}; return id;
}

function bindPoolSelect(sel, onChange){

      const none=sel.querySelector('option[value=""]')?.textContent??null; sel.innerHTML=poolOptions(id,{none,withNew:true}); sel.value=id; }

async function batchOps(ops){ for(let i=0;i<ops.length;i+=400){ const b=writeBatch(db); ops.slice(i,i+400).forEach(f=>f(b)); await b.commit(); } }
// Soruları (ve bağlı oldukları vakaları bütün olarak) havuza taşır
async function moveToPool(ids,target){
  const chosen=S.questions.filter(q=>ids.has(q.id));
  const caseIds=new Set(chosen.map(q=>q.caseId).filter(c=>c&&S.cases[c]));
  const all=new Map(chosen.map(q=>[q.id,q])); S.questions.filter(q=>caseIds.has(q.caseId)).forEach(q=>all.set(q.id,q));
  const prc=!!S.pools[target]?.practice;
  await batchOps([...[...all.values()].map(q=>b=>b.update(doc(db,"questions",q.id),{poolId:target||null,practice:prc&&approvedQ(q)})),
    ...[...caseIds].map(id=>b=>b.update(doc(db,"cases",id),{poolId:target||null,practice:prc}))]);
  return {n:all.size, extra:all.size-chosen.length};
}

/* ---------------- soru geçmişi (sınavlardaki güçlük / ayırt edicilik) ---------------- */
async function computeQHist(){
  const [ex,ks,as]=await Promise.all([getDocs(collection(db,"exams")),getDocs(collection(db,"examKeys")),getDocs(collection(db,"attempts"))]);
  const keys={}; ks.docs.forEach(d=>keys[d.id]=d.data());
  const atts=as.docs.map(d=>({id:d.id,...d.data()}));
  const H={};
  for(const d of ex.docs){ const e={id:d.id,...d.data()}; if(!e.items) continue; const key=keys[e.id]||{key:{}};
    const done=atts.filter(a=>a.examId===e.id&&isFinished(e,a)).map(a=>({att:a,sc:scoreAttempt(e,key,a),res:{}}));
    if(!done.length) continue;
    const st=examStats(e,done,key);
    e.items.forEach(it=>{ const recv=done.filter(x=>x.sc.items.some(i=>i.qid===it.qid&&!i.dropped)); if(!recv.length) return;
      const p=avg(recv.map(x=>itemPts(x.sc.items.find(z=>z.qid===it.qid))/(it.points||1)))*100;
      (H[it.qid]=H[it.qid]||[]).push({examId:e.id,title:e.title,date:tsMs(e.startAt)||0,n:recv.length,p,d:st.disc[it.qid]??null,v:voidOf(key,it.qid)}); });
  }
  Object.values(H).forEach(a=>a.sort((x,y)=>x.date-y.date));
  S.qhist=H; return H;
}
const lastHist=qid=>{ const h=S.qhist?.[qid]; return h&&h.length?h[h.length-1]:null; };
function qhistBadge(qid,compact){
  if(!S.qhist) return "";
  const h=S.qhist[qid]; if(!h||!h.length) return compact?"":`<span class="badge" title="Henüz hiçbir sınavda kullanılmadı">Kullanılmadı</span>`;
  const l=h[h.length-1], cls=l.d==null?"":l.d<0.2?"bad":l.d<0.3?"warn":"ok";
  return `<span class="badge ${cls} hist" data-hist="${qid}" title="Son kullanım: ${esc(l.title)} · ${l.n} kişi · tıklayın">${h.length} sınav · %${Math.round(l.p)}${l.d!=null?` · AE ${fmt2(l.d)}`:""}</span>`;
}

    document.getElementById("renPool")?.addEventListener("click",async()=>{ const n=await promptDlg("Havuzu yeniden adlandır","Havuz adı",cur.name); if(!n) return;
      try{ await updateDoc(doc(db,"pools",cur.id),{name:n}); S.pools[cur.id].name=n; drawPools(); draw(); toast("Kaydedildi"); }catch(e){ fail(e); } });
    document.getElementById("delPool")?.addEventListener("click",()=>deletePool(cur));
  }
  async function deletePool(p){
    const qs=S.questions.filter(q=>q.poolId===p.id), cs=Object.values(S.cases).filter(c=>c.poolId===p.id);
    const m=modal(`<div class="modal-h"><h2>Havuzu sil</h2></div><div class="modal-b"><p style="margin-top:0"><b>${esc(p.name)}</b> havuzunda ${qs.length} soru${cs.length?` ve ${cs.length} vaka`:""} var.</p>
      ${qs.length||cs.length?`<label class="check" style="margin-bottom:8px"><input type="radio" name="dm" value="keep" checked> Soruları “Havuzsuz”a taşı, yalnız havuzu sil</label>
      <label class="check"><input type="radio" name="dm" value="all"> <span>Havuzu <b style="color:var(--bad)">içindeki tüm sorularla birlikte</b> sil</span></label>`:""}
      <p class="small muted">Daha önce kaydedilmiş sınavlar etkilenmez.</p></div>
      <div class="modal-f"><button class="btn" data-close>Vazgeç</button><button class="btn danger" id="dp">Sil</button></div>`,"narrow");
    m.el.querySelector("#dp").onclick=async()=>{
      const all=m.el.querySelector('[name=dm][value=all]')?.checked;
      try{ m.el.querySelector("#dp").disabled=true;
        await batchOps([...qs.map(q=>b=>all?b.delete(doc(db,"questions",q.id)):b.update(doc(db,"questions",q.id),{poolId:null,practice:false})),
          ...cs.map(c=>b=>all?b.delete(doc(db,"cases",c.id)):b.update(doc(db,"cases",c.id),{poolId:null,practice:false})), b=>b.delete(doc(db,"pools",p.id))]);
        m.close(); lsSet("bankPool",""); toast("Havuz silindi"); viewBank(); }catch(e){ fail(e); }
    };
  }
  const approve=async ids=>{ const qs=S.questions.filter(q=>ids.includes(q.id));
    try{ await batchOps(qs.map(q=>b=>b.update(doc(db,"questions",q.id),{status:"approved",rejectReason:null,reviewedBy:S.email,reviewedAt:serverTimestamp(),practice:!!S.pools[q.poolId]?.practice}))); toast(`${qs.length} soru onaylandı`); viewBank(); }catch(e){ fail(e); } };
  function drawSel(){
    if(!isA) return;
    const vq=S.questions.filter(vis), nSel=vq.filter(q=>sel.has(q.id)).length, cb=document.getElementById("selAllCb");
    cb.checked=vq.length>0&&nSel===vq.length; cb.indeterminate=nSel>0&&nSel<vq.length; cb.disabled=!vq.length;
    document.getElementById("selAllLbl").textContent=vq.length?`Tümünü seç (${vq.length})`:"Tümünü seç";
    const bar=document.getElementById("selbar"); bar.classList.toggle("hidden",!sel.size); if(!sel.size){ bar.innerHTML=""; return; }
    const visN=vq.length, pendSel=S.questions.filter(q=>sel.has(q.id)&&q.status==="pending").length;
    bar.innerHTML=`<b>${sel.size} soru seçili</b>${sel.size<visN?`<button class="btn sm ghost" id="selAllBar">Tümünü seç (${visN})</button>`:""}<span class="grow"></span>
      ${pendSel?`<button class="btn sm primary" id="apSel">Onayla (${pendSel})</button>`:""}
      <select id="mvp" style="width:auto">${poolOptions("",{none:"Havuzsuz",withNew:true}).replace('<option value="">','<option value="" disabled selected hidden>Havuza taşı…</option><option value="">')}</select>
      <button class="btn sm primary" id="mvGo">Taşı</button><button class="btn sm" id="expSel">Excel'e aktar</button><button class="btn sm danger" id="delSel">Sil</button><button class="btn sm ghost" id="clrSel">Seçimi kaldır</button>`;
    const s=document.getElementById("mvp"); s.selectedIndex=0; bindPoolSelect(s);
    document.getElementById("apSel")?.addEventListener("click",()=>approve(S.questions.filter(q=>sel.has(q.id)&&q.status==="pending").map(q=>q.id)));
    document.getElementById("mvGo").onclick=async()=>{ if(s.selectedIndex===0) return toast("Hedef havuzu seçin",true);
      try{ const r=await moveToPool(sel,s.value||null); toast(`${r.n} soru “${poolName(s.value)}” havuzuna taşındı${r.extra?` (vaka bütünlüğü için +${r.extra} soru)`:""}`); sel.clear(); viewBank(); }catch(e){ fail(e); } };
    document.getElementById("expSel").onclick=()=>exportBank(S.questions.filter(q=>sel.has(q.id)));
    document.getElementById("delSel").onclick=async()=>{ if(!await confirmDlg("Seçilenleri sil",`<p>${sel.size} soru bankadan silinir. Kaydedilmiş sınavlar etkilenmez.</p>`,"Sil",true)) return;
      try{ await batchOps([...sel].map(id=>b=>b.delete(doc(db,"questions",id)))); toast("Silindi"); sel.clear(); viewBank(); }catch(e){ fail(e); } };
    document.getElementById("clrSel").onclick=()=>{ sel.clear(); draw(); };
    document.getElementById("selAllBar")?.addEventListener("click",()=>{ S.questions.filter(vis).forEach(q=>sel.add(q.id)); draw(); });
  }
  function draw(){
    const list=S.questions.filter(vis);
    const blocks=bankBlocks(list);
    const emptyCases=isA&&!stF&&!hsF?Object.values(S.cases).filter(c=>!S.questions.some(q=>q.caseId===c.id)&&(!poolF||(c.poolId&&S.pools[c.poolId]?c.poolId:NOPOOL)===poolF)&&!topicF&&!typeF&&(!filt||trLower(c.title+" "+c.text).includes(filt))).map(c=>({kind:"case",c,qs:[]})):[];
    // bir havuz seçiliyken eklenme sırası (1. soru üstte); "Tüm sorular"da en yeni üstte
    const all=poolF?[...blocks,...emptyCases]:[...blocks,...emptyCases].reverse();
    const scope=poolF?S.questions.filter(q=>poolOf(q)===poolF).length:S.questions.length;
    document.getElementById("bcount").textContent=(poolF?`${poolName(poolF===NOPOOL?null:poolF)} · ${scope} soru`:`${S.questions.length} soru · ${Object.keys(S.cases).length} vaka · ${poolList().length} havuz`)+(list.length!==scope?` · ${list.length} gösteriliyor`:"");
    const caseEdit=c=>isA||(isAu&&c.author===S.email&&c.status!=="approved");
    document.getElementById("blist").innerHTML=all.length?all.map(b=>b.kind==="q"?`<div class="card">${qRow(b.q)}</div>`:
      `<div class="case-card"><div class="case-head">${isA&&b.qs.length?`<input type="checkbox" class="qcheck" data-selcase="${b.c.id}" ${b.qs.every(q=>sel.has(q.id))?"checked":""} aria-label="Vakayı seç">`:""}<div class="grow" style="min-width:0"><div class="qmeta">${!poolF&&b.c.poolId&&S.pools[b.c.poolId]?`<span class="badge acc">${esc(poolName(b.c.poolId))}</span>`:""}${STATUS_B(b.c)}<span class="badge info">Vaka</span><span class="badge">${b.qs.length} soru</span></div>
        <b>${esc(b.c.title||"(başlıksız vaka)")}</b><div class="txt">${esc(b.c.text)}</div>${imgTag(b.c.imageId,true)}${dcmTag(b.c.dicomId,true)}</div>
        <div class="row" style="flex-wrap:nowrap">${isA&&b.c.status==="pending"?`<button class="btn sm primary" data-apc="${b.c.id}">Onayla</button>`:""}${caseEdit(b.c)?`<button class="btn sm" data-addq="${b.c.id}">+ Soru</button><button class="btn sm" data-ec="${b.c.id}">Düzenle</button>`:""}${isA?`<button class="btn sm ghost danger" data-dc="${b.c.id}">✕</button>`:""}</div></div>
        <div class="case-sub">${b.qs.map(qRow).join("")}</div></div>`).join("")
      :`<div class="card empty">${!S.questions.length?"Soru bankası boş. “+ Soru” ile başlayın veya Excel'den toplu aktarın.":poolF&&!scope?"Bu havuz boş. “+ Soru” veya “Excel'den içe aktar” ile bu havuza soru ekleyin.":"Eşleşen soru yok."}</div>`;
    hydrateImages(document.getElementById("blist"));
    $app.querySelectorAll("[data-sel]").forEach(c=>c.onchange=()=>{ c.checked?sel.add(c.dataset.sel):sel.delete(c.dataset.sel); drawSel(); const cb=c.closest(".case-card")?.querySelector("[data-selcase]"); if(cb) cb.checked=S.questions.filter(q=>q.caseId===cb.dataset.selcase&&vis(q)).every(q=>sel.has(q.id)); });
    $app.querySelectorAll("[data-selcase]").forEach(c=>c.onchange=()=>{ S.questions.filter(q=>q.caseId===c.dataset.selcase&&vis(q)).forEach(q=>c.checked?sel.add(q.id):sel.delete(q.id)); draw(); });
    $app.querySelectorAll("[data-hist]").forEach(b=>b.onclick=()=>showHist(b.dataset.hist));
    $app.querySelectorAll("[data-apq]").forEach(b=>b.onclick=()=>approve([b.dataset.apq]));
    $app.querySelectorAll("[data-apc]").forEach(b=>b.onclick=async()=>{ try{ await updateDoc(doc(db,"cases",b.dataset.apc),{status:"approved"}); await approve(S.questions.filter(q=>q.caseId===b.dataset.apc&&q.status==="pending").map(q=>q.id)); }catch(e){ fail(e); } });
    $app.querySelectorAll("[data-rjq]").forEach(b=>b.onclick=async()=>{ const r=await promptDlg("Soruyu reddet","Ret gerekçesi (soru yazarı görür)","","örn. Kaynak eksik, B şıkkı da doğru olabilir"); if(!r) return;
      try{ await updateDoc(doc(db,"questions",b.dataset.rjq),{status:"rejected",rejectReason:r,reviewedBy:S.email,reviewedAt:serverTimestamp(),practice:false}); toast("Soru reddedildi"); viewBank(); }catch(e){ fail(e); } });
    $app.querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>editQuestion(S.questions.find(q=>q.id===b.dataset.eq)));
    $app.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>{ const q=S.questions.find(x=>x.id===b.dataset.dup); editQuestion({...q,id:null}); });
    $app.querySelectorAll("[data-dq]").forEach(b=>b.onclick=async()=>{ if(!await confirmDlg("Soruyu sil","<p>Soru bankadan silinir. Daha önce kaydedilmiş sınavlardaki kopyası etkilenmez.</p>","Sil",true)) return;
      try{ await deleteDoc(doc(db,"questions",b.dataset.dq)); toast("Silindi"); viewBank(); }catch(e){ fail(e); } });
    $app.querySelectorAll("[data-addq]").forEach(b=>b.onclick=()=>editQuestion({caseId:b.dataset.addq,poolId:S.cases[b.dataset.addq]?.poolId||null}));
    $app.querySelectorAll("[data-ec]").forEach(b=>b.onclick=()=>editCase(S.cases[b.dataset.ec]));
    $app.querySelectorAll("[data-dc]").forEach(b=>b.onclick=async()=>{ const qs=S.questions.filter(q=>q.caseId===b.dataset.dc);
      if(!await confirmDlg("Vakayı sil",`<p>Vaka${qs.length?` ve bağlı <b>${qs.length} soru</b>`:""} bankadan silinir.</p>`,"Sil",true)) return;
      try{ const w=writeBatch(db); qs.forEach(q=>w.delete(doc(db,"questions",q.id))); w.delete(doc(db,"cases",b.dataset.dc)); await w.commit(); toast("Silindi"); viewBank(); }catch(e){ fail(e); } });
    drawSel();
  }
  drawPools(); draw();
  if(isA) computeQHist().then(()=>{ if(S.view==="bank"&&document.getElementById("blist")) draw(); }).catch(e=>console.error(e));
  const curPool=()=>poolF&&poolF!==NOPOOL?poolF:null;
  document.getElementById("bf").oninput=e=>{ filt=trLower(e.target.value); draw(); };
  document.getElementById("bt").onchange=e=>{ topicF=e.target.value; draw(); };
  document.getElementById("by").onchange=e=>{ typeF=e.target.value; draw(); };
  document.getElementById("bs").onchange=e=>{ stF=e.target.value; sel.clear(); draw(); };
  document.getElementById("bh")?.addEventListener("change",e=>{ hsF=e.target.value; sel.clear(); if(hsF&&!S.qhist) toast("İstatistikler hesaplanıyor…"); draw(); });
  document.getElementById("goPend")?.addEventListener("click",e=>{ e.preventDefault(); stF="pending"; document.getElementById("bs").value="pending"; poolF=""; drawPools(); draw(); });
  document.getElementById("selAllCb")?.addEventListener("change",e=>{ const vq=S.questions.filter(vis); if(e.target.checked) vq.forEach(q=>sel.add(q.id)); else vq.forEach(q=>sel.delete(q.id)); draw(); });
  document.getElementById("exp")?.addEventListener("click",()=>exportBank(S.questions.filter(vis)));
  document.getElementById("newQ").onclick=()=>editQuestion({poolId:curPool()});
  document.getElementById("rpGo")?.addEventListener("click",()=>go("reports"));
  document.getElementById("newCase").onclick=()=>editCase({poolId:curPool()});
  document.getElementById("imp").onclick=()=>importDialog(curPool());
}

function imageField(cur,dcm){
  return `<div class="field"><label class="f">Görsel (EKG, grafi vb. — isteğe bağlı)</label>
    <div id="imgPrev">${cur?imgTag(cur,true):""}</div>
    <div class="row"><label class="btn sm">Görsel seç<input type="file" accept="image/*" id="imgIn" hidden></label><button class="btn sm ghost danger ${cur?"":"hidden"}" id="imgDel" type="button">Görseli kaldır</button></div></div>
    <div class="field"><label class="f">BT / MR serisi (DICOM — isteğe bağlı)</label>
    <div id="dcmPrev">${dcm?dcmTag(dcm,true):""}</div>
    <div class="row"><button class="btn sm" id="dcmUp" type="button">DICOM yükle</button><button class="btn sm ${S.mode==="admin"?"":"hidden"}" id="dcmPick" type="button">Arşivden seç</button><button class="btn sm ghost danger ${dcm?"":"hidden"}" id="dcmDel" type="button">Seriyi kaldır</button></div></div>`;
}
function bindImageField(root, state){
  root.querySelector("#imgIn").onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    try{ state.newImg=await compressImage(f); state.imageId=null; root.querySelector("#imgPrev").innerHTML=`<img class="q-img thumb" src="${state.newImg}">`; root.querySelector("#imgDel").classList.remove("hidden"); state.onChange&&state.onChange(); }
    catch(err){ fail(err,"Görsel işlenemedi"); } };
  root.querySelector("#imgDel").onclick=()=>{ state.newImg=null; state.imageId=null; root.querySelector("#imgPrev").innerHTML=""; root.querySelector("#imgDel").classList.add("hidden"); state.onChange&&state.onChange(); };
  const setD=id=>{ state.dicomId=id||null; root.querySelector("#dcmPrev").innerHTML=id?dcmTag(id,true):""; root.querySelector("#dcmDel").classList.toggle("hidden",!id); hydrateDicom(root); state.onChange&&state.onChange(); };
  root.querySelector("#dcmUp").onclick=()=>dicomUploadDlg(id=>setD(id));
  root.querySelector("#dcmPick").onclick=()=>dicomPickDlg(id=>setD(id));
  root.querySelector("#dcmDel").onclick=()=>setD(null);
}
async function persistImage(state){
  if(state.newImg){ const id=newId(); await setDoc(doc(db,"images",id),{data:state.newImg,createdAt:serverTimestamp()}); imgCache.set(id,Promise.resolve(state.newImg)); return id; }
  return state.imageId||null;
}

function editQuestion(q,after){
  const isNew=!q.id; const st={imageId:q.imageId||null,newImg:null,dicomId:q.dicomId||null};
  let type=q.type||"mcq";
  const opts=[...(q.options||[]),"","","","",""].slice(0,5);
  const caseOpts=Object.values(S.cases).map(c=>`<option value="${c.id}" ${q.caseId===c.id?"selected":""}>${esc(c.title||c.text.slice(0,50))}${c.poolId&&S.pools[c.poolId]?` (${esc(poolName(c.poolId))})`:""}</option>`).join("");
  const m=modal(`<div class="modal-h"><h2>${isNew?"Yeni soru":"Soruyu düzenle"}</h2><button class="btn sm ghost" data-close>✕</button></div>
    <div class="modal-b">
      <div class="grid2">
        <div class="field"><label class="f">Havuz</label><select id="q_pool">${poolOptions(q.poolId&&S.pools[q.poolId]?q.poolId:"",{withNew:S.mode==="admin"})}</select><div class="small muted hidden" id="poolNote" style="margin-top:4px">Vakaya bağlı soru, vakanın havuzunda durur.</div></div>
        <div class="field"><label class="f">Bağlı vaka</label><select id="q_case"><option value="">— Bağımsız soru —</option>${caseOpts}</select></div>
      </div>
      <div class="grid3">
        <div class="field"><label class="f">Tür</label><select id="q_type"><option value="mcq">Çoktan seçmeli</option><option value="open" ${type==="open"?"selected":""}>Açık uçlu</option></select></div>
        <div class="field"><label class="f">Konu</label><input type="text" id="q_topic" list="tlist" value="${esc(q.topic||"")}" placeholder="örn. Toksikoloji"><datalist id="tlist">${topics().map(t=>`<option value="${esc(t)}">`).join("")}</datalist></div>
        <div class="field"><label class="f">Puan</label><input type="number" id="q_pts" min="0.5" step="0.5" value="${q.points||1}"></div>
      </div>
      <div class="field"><label class="f">Soru kökü</label><textarea id="q_stem" style="min-height:110px">${esc(q.stem||"")}</textarea></div>
      ${imageField(q.imageId,q.dicomId)}
      <div id="mcqBox" class="${type==="open"?"hidden":""}"><label class="f">Şıklar <span class="muted" style="font-weight:400">(doğru şıkkı işaretleyin; boş şıklar atlanır)</span></label>
        ${opts.map((o,j)=>`<div class="optedit"><input type="radio" name="cor" value="${j}" ${(q.correct??0)===j?"checked":""} title="Doğru cevap"><span class="L">${LET[j]}</span><input type="text" data-opt="${j}" value="${esc(o)}"></div>`).join("")}</div>
      <div class="field" style="margin-top:12px"><label class="f" id="explLbl">${type==="open"?"Model cevap / değerlendirme notu":"Açıklama (sonuçta asistana gösterilir)"}</label><textarea id="q_expl">${esc(q.explanation||"")}</textarea></div>
    </div>
    <div class="modal-f"><button class="btn" data-close>Vazgeç</button><button class="btn primary" id="qsave">Kaydet</button></div>`);
  hydrateImages(m.el); bindImageField(m.el, st);
  const poolSel=m.el.querySelector("#q_pool"), caseSel=m.el.querySelector("#q_case");
  bindPoolSelect(poolSel);
  const syncCase=()=>{ const c=S.cases[caseSel.value]; poolSel.disabled=!!c; m.el.querySelector("#poolNote").classList.toggle("hidden",!c);
    if(c) poolSel.value=c.poolId&&S.pools[c.poolId]?c.poolId:""; };
  caseSel.onchange=syncCase; syncCase();
  m.el.querySelector("#q_type").onchange=e=>{ type=e.target.value; m.el.querySelector("#mcqBox").classList.toggle("hidden",type==="open");
    m.el.querySelector("#explLbl").textContent=type==="open"?"Model cevap / değerlendirme notu":"Açıklama (sonuçta asistana gösterilir)"; };
  m.el.querySelector("#qsave").onclick=async()=>{
    const stem=m.el.querySelector("#q_stem").value.trim(); if(!stem) return toast("Soru kökü boş",true);
    const caseId=caseSel.value||null;
    const data={type,stem,topic:m.el.querySelector("#q_topic").value.trim(),points:Number(m.el.querySelector("#q_pts").value)||1,
      caseId,poolId:caseId?(S.cases[caseId]?.poolId||null):(poolSel.value&&poolSel.value!=="__new"?poolSel.value:null),explanation:m.el.querySelector("#q_expl").value.trim()};
    if(type==="mcq"){
      const raw=[...m.el.querySelectorAll("[data-opt]")].map(i=>i.value.trim()); const corRaw=Number(m.el.querySelector("[name=cor]:checked")?.value??0);
      if(!raw[corRaw]) return toast("İşaretli doğru şık boş",true);
      const kept=raw.map((t,j)=>({t,j})).filter(x=>x.t); if(kept.length<2) return toast("En az iki şık gerekli",true);
      data.options=kept.map(x=>x.t); data.correct=kept.findIndex(x=>x.j===corRaw);
    } else { data.options=null; data.correct=null; }
    try{
      const btn=m.el.querySelector("#qsave"); btn.disabled=true;
      data.imageId=await persistImage(st); data.dicomId=st.dicomId||null;
      const id=q.id||newId(); if(!q.id) data.createdAt=serverTimestamp(); data.updatedAt=serverTimestamp();
      if(S.mode==="author"){ data.status="pending"; data.author=S.email; data.practice=false; data.rejectReason=null; }
      else data.practice=!!S.pools[data.poolId]?.practice&&approvedQ({...q,...data});
      await setDoc(doc(db,"questions",id),data,{merge:true}); m.close(); toast(S.mode==="author"?"Soru kaydedildi; yönetici onayına gönderildi":"Soru kaydedildi"); (after||viewBank)();
    }catch(e){ fail(e,"Kaydedilemedi"); m.el.querySelector("#qsave").disabled=false; }
  };
}
function editCase(c){
  const st={imageId:c.imageId||null,newImg:null,dicomId:c.dicomId||null};
  const qs=c.id?S.questions.filter(q=>q.caseId===c.id):[];
  const m=modal(`<div class="modal-h"><h2>${c.id?"Vakayı düzenle":"Yeni vaka"}</h2><button class="btn sm ghost" data-close>✕</button></div>
    <div class="modal-b"><p class="small muted" style="margin-top:0">Vaka metni, bağlı her sorunun üstünde gösterilir. Sınavda vakanın soruları birlikte kalır.</p>
      <div class="field"><label class="f">Havuz</label><select id="c_pool">${poolOptions(c.poolId&&S.pools[c.poolId]?c.poolId:"",{withNew:S.mode==="admin"})}</select>
        ${qs.length?`<div class="small muted" style="margin-top:4px">Havuzu değiştirirseniz bağlı ${qs.length} soru da taşınır.</div>`:""}</div>
      <div class="field"><label class="f">Başlık</label><input type="text" id="c_title" value="${esc(c.title||"")}" placeholder="örn. 68 yaşında göğüs ağrısı"></div>
      <div class="field"><label class="f">Vaka metni</label><textarea id="c_text" style="min-height:160px">${esc(c.text||"")}</textarea></div>
      ${imageField(c.imageId,c.dicomId)}</div>
    <div class="modal-f"><button class="btn" data-close>Vazgeç</button><button class="btn primary" id="csave">Kaydet</button></div>`);
  hydrateImages(m.el); bindImageField(m.el, st); bindPoolSelect(m.el.querySelector("#c_pool"));
  m.el.querySelector("#csave").onclick=async()=>{
    const text=m.el.querySelector("#c_text").value.trim(); if(!text) return toast("Vaka metni boş",true);
    const pv=m.el.querySelector("#c_pool").value; const poolId=pv&&pv!=="__new"?pv:null;
    try{ const imageId=await persistImage(st); const id=c.id||newId();
      const au=S.mode==="author", prc=!au&&!!S.pools[poolId]?.practice;
      await setDoc(doc(db,"cases",id),{title:m.el.querySelector("#c_title").value.trim(),text,imageId,dicomId:st.dicomId||null,poolId,practice:prc,...(au?{status:"pending",author:S.email}:{}),...(c.id?{}:{createdAt:serverTimestamp()})},{merge:true});
      const moved=qs.filter(q=>(q.poolId||null)!==poolId);

async function startAttempt(e){
  let pool=e.items;
  if(e.plan?.perResident){ const ok=new Set(e.items.map(i=>i.qid)), drawn=new Set();
    for(const r of e.plan.rows||[]) shuffle((r.qids||[]).filter(q=>ok.has(q)&&!drawn.has(q))).slice(0,r.n).forEach(q=>drawn.add(q));
    pool=e.items.filter(it=>drawn.has(it.qid)); }
  // grupları oluştur (vaka soruları bitişik kalır)
  const groups=[]; let cur=null;
  for(const it of pool){ if(it.caseId && cur && cur.caseId===it.caseId) cur.q.push(it.qid); else { cur={caseId:it.caseId||null,q:[it.qid]}; groups.push(cur); } }
  const order=(e.shuffleQ?shuffle(groups):groups).flatMap(g=>g.q);
  const optOrder={}; pool.forEach(it=>{ if(it.type==="mcq"){ const idx=it.options.map((_,j)=>j); optOrder[it.qid]=e.shuffleO?shuffle(idx):idx; } });
  await setDoc(doc(db,"attempts",e.id+"_"+S.user.uid),{examId:e.id,uid:S.user.uid,email:S.email,name:S.resident?.name||S.user.displayName||"",
    status:"started",startedAt:serverTimestamp(),order,optOrder,answers:{},flags:{},qtime:{},pos:0,device:e.deviceLock?myDevice():null});
}
