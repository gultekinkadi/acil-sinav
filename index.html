<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acil Tıp Sınav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface-2:#faf9f6; --ink:#1b1e23; --muted:#646a73; --line:#e2dfd8; --line-2:#ece9e3;
  --accent:#a8231c; --accent-soft:#f7e6e4; --accent-ink:#ffffff;
  --ok:#1d7349; --ok-soft:#e3f2ea; --warn:#9a6200; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe5e3;
  --info:#24548f; --info-soft:#e4edf8;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 4px 16px rgba(20,20,20,.05);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171a; --surface:#1d2024; --surface-2:#22262b; --ink:#ebedf0; --muted:#9aa1ab; --line:#2f343a; --line-2:#292d32;
    --accent:#e0574e; --accent-soft:#3a2120; --accent-ink:#ffffff;
    --ok:#4cc38a; --ok-soft:#1b3027; --warn:#e3a33b; --warn-soft:#352a17; --bad:#ef6a61; --bad-soft:#3a2120;
    --info:#7fb0ec; --info-soft:#1d2a3a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}

/* Layout */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
nav.tabs{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{font-size:13px;color:var(--muted);text-align:right;line-height:1.25}
.who b{color:var(--ink);font-weight:600;display:block}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.015em}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--muted);margin-top:2px;font-size:14px}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 5px;color:var(--ink)}
.field{margin-bottom:14px}
input[type=text],input[type=email],input[type=number],input[type=datetime-local],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:14px}
.check input{margin-top:3px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.edgrid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.edgrid{grid-template-columns:1fr}}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.list{display:flex;flex-direction:column;gap:10px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.badge.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{text-align:center;color:var(--muted);padding:40px 16px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* Table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}

/* Question display */
.q-stem{white-space:pre-wrap;font-size:16px;line-height:1.6}
.q-img{display:block;max-width:100%;max-height:420px;border-radius:8px;border:1px solid var(--line);margin:10px 0;cursor:zoom-in;background:var(--surface-2)}
.q-img.thumb{max-height:110px;max-width:180px;margin:6px 0}
.case-box{border-left:3px solid var(--info);background:var(--info-soft);padding:12px 14px;border-radius:0 8px 8px 0;margin-bottom:14px}
.case-box .lbl{font-size:12px;font-weight:700;color:var(--info);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.case-box .txt{white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 13px;cursor:pointer;width:100%;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--muted)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt .T{padding-top:2px;white-space:pre-wrap}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.static{cursor:default}

/* Exam taking */
.take{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
@media (max-width:860px){.take{grid-template-columns:1fr}}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:860px){.navgrid{grid-template-columns:repeat(10,1fr)}}
.nb{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:7px;height:34px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);font-variant-numeric:tabular-nums}
.nb.ans{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.nb.cur{outline:2px solid var(--accent);outline-offset:1px}
.nb.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.timer{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:20px;padding:4px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.savestate{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* Bank */
.qitem{padding:12px 14px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line-2)}
.qitem:last-child{border-bottom:0}
.qitem .body{flex:1;min-width:0}
.qitem .stem{white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.case-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.case-head{padding:12px 14px;background:var(--info-soft);display:flex;gap:12px;align-items:flex-start}
.case-head .txt{white-space:pre-wrap;font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.case-sub{padding-left:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}

/* Havuzlar */
.pools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink);white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip .n{color:var(--muted);font-weight:400;margin-left:6px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .n{color:inherit;opacity:.85}
.chip.add{border-style:dashed;color:var(--muted)}
.pool-act{display:inline-flex;gap:2px;margin-left:4px}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;margin-bottom:10px;background:var(--accent-soft);border-radius:var(--r)}
.qcheck{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none;cursor:pointer}
.case-head .qcheck{margin-top:2px}
.selall{align-items:center;white-space:nowrap;padding:0 6px;font-weight:500}
.selall input{margin-top:0;width:16px;height:16px}
@media (max-width:600px){.qitem,.case-head{flex-wrap:wrap}.qitem .body,.case-head>.grow{flex:1 1 calc(100% - 40px)}.qitem>.row,.case-head>.row{margin-left:28px}}

/* İstatistik grafikleri */
:root{--c1:#a8231c;--c2:#24548f}
@media (prefers-color-scheme: dark){:root{--c1:#e0574e;--c2:#5f98dc}}
.note{padding:10px 14px;border-radius:var(--r);background:var(--info-soft);color:var(--ink);font-size:14px;margin-bottom:16px}
.stat-grid{margin-bottom:16px;align-items:stretch}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart-slot{width:100%;min-height:40px}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .lbl{fill:var(--ink);font-size:11px;font-weight:600}
.chart .bar1{fill:var(--c2)}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--ink);fill-opacity:.05}
.chart .ln1{fill:none;stroke:var(--c1);stroke-width:2;stroke-linejoin:round}
.chart .ln2{fill:none;stroke:var(--c2);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round}
.chart .dt1{fill:var(--c1);stroke:var(--surface);stroke-width:2}
.chart .dt2{fill:var(--c2);stroke:var(--surface);stroke-width:2}
.chart .dl1,.chart .dl2{fill:var(--ink);font-size:12px;font-weight:600}
.chart .dl2{font-weight:500;fill:var(--muted)}
.legend .lg1,.legend .lg2{display:inline-block;width:16px;height:0;border-top:2px solid var(--c1);margin-right:6px;vertical-align:middle;border-radius:0}
.legend .lg2{border-top:2px dashed var(--c2)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr 52px;grid-template-areas:"l t v" ". s s";column-gap:10px;align-items:center;font-size:14px}
.hb .hl{grid-area:l;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{grid-area:t}
.hb .hv{grid-area:v;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hb .hs{grid-area:s;font-size:12px;color:var(--muted);margin-top:-2px}
.track{display:block;height:10px;border-radius:99px;background:var(--line-2);overflow:hidden}
.track>span{display:block;height:100%;background:var(--c2);border-radius:0 4px 4px 0}

/* Açıklama şablonları */
.tplsel{width:auto;max-width:190px;padding:4px 8px;font-size:13px}
.descprev{margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2);font-size:14px}
.descprev .txt{white-space:pre-wrap}
.clamp3{white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;color:var(--muted)}
.tplrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-2)}
.tplrow:last-child{border-bottom:0}
.tplprev{white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:2px}

/* Asistan atama */
.asg-list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--surface)}
.asg-list .check{padding:6px 0;border-bottom:1px solid var(--line-2);align-items:center}
.asg-list .check:last-child{border-bottom:0}
.asg-list .check input{margin-top:0}
.asg-all{align-items:center}.asg-all input{margin-top:0}
.chip.sm{padding:3px 10px;font-size:13px}

/* Yeni bileşenler */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface);margin-bottom:12px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.planrow{display:grid;grid-template-columns:1fr 1fr 74px auto auto;gap:6px;align-items:center;margin-bottom:6px}
@media (max-width:600px){.planrow{grid-template-columns:1fr 1fr;}}
.bad-t{color:var(--bad)}
.secbox{border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.share{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.share-qr{flex:none;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.qr{display:block}
.qr-full{position:fixed;inset:0;background:#fff;z-index:100;display:grid;place-items:center;cursor:zoom-out;color:#111}
.qr-full-in{text-align:center;padding:20px}.qr-full-in h1{font-size:28px;margin-bottom:16px;color:#111}.qr-full-in .qr{margin:0 auto}
.qr-url{font-family:"IBM Plex Mono",monospace;font-size:15px;margin:14px 0 6px;word-break:break-all}
.card.hl{outline:2px solid var(--accent);outline-offset:2px}
.apbox{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2)}
.fs-gate{position:fixed;inset:0;z-index:70;background:rgba(10,12,15,.75);display:grid;place-items:center;padding:16px}
.nb:disabled{cursor:default;opacity:.55}.nb.cur:disabled{opacity:1}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--info);margin-left:6px;vertical-align:middle}
.chip.on .pdot{background:currentColor}
.badge.hist{cursor:pointer}
.ptopics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ptopic{display:flex;flex-direction:column;gap:3px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.ptopic .small{color:var(--muted)}
.ptopic.on{border-color:var(--accent);background:var(--accent-soft)}
.ptopic .track{height:6px;margin-top:4px}
.pfb{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.pfb.ok{background:var(--ok-soft)}.pfb.bad{background:var(--bad-soft)}
.print-only{display:none}
.print-head{border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px;font-size:13px}
.print-head .ph-t{font-size:20px;font-weight:700;margin:4px 0}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#f6f6f6;--ink:#000;--muted:#444;--line:#ccc;--line-2:#ddd}
  body{background:#fff!important;font-size:12px}
  header.top,footer.credit,.no-print,.btn,#toast,.modal-bg,.toolbar,nav.tabs{display:none!important}
  .print-only{display:block!important}
  main{max-width:none;padding:0}
  .card,.stat{box-shadow:none!important}
  .stat,.scorebox,.case-box{break-inside:avoid}
  .qrev{break-inside:avoid}
  .opt{border-width:1px;padding:4px 8px}.opts{gap:4px;margin-top:8px}.qrev{padding:10px 12px}.opt .L{width:20px;height:20px;font-size:11px}
  .q-img{max-height:260px}
  a{color:#000;text-decoration:none}
}

/* Oyunlar */
body.game-mode{background:#15142a}
.gm{min-height:100vh;color:#fff;background:radial-gradient(1200px 600px at 50% -10%,#3a2f7a 0%,#15142a 60%);padding:0 18px 30px;font-size:17px}
.gm .spinner{border-color:#ffffff33;border-top-color:#fff}
.g-top{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:12px 0;font-size:15px;opacity:.95;flex-wrap:wrap}
.g-x{background:#ffffff1f;border:0;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.g-x:disabled{opacity:.4}
.g-btn{background:#fff;color:#1d1940;border:0;padding:14px 26px;border-radius:12px;font:inherit;font-weight:700;font-size:18px;cursor:pointer;box-shadow:0 4px 0 #0005}
.g-btn.ghost{background:#ffffff26;color:#fff;box-shadow:none}
.g-btn:disabled{opacity:.45;cursor:default}
.g-act{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.g-lobby{display:flex;gap:30px;justify-content:center;align-items:center;flex-wrap:wrap;margin:16px 0 22px}
.g-join{text-align:center}.g-join-l{font-size:20px;opacity:.85}.g-pin{font-size:clamp(56px,10vw,110px);font-weight:700;letter-spacing:.08em;line-height:1.05}
.g-url{opacity:.75;font-size:15px}
.g-qr{background:#fff;color:#333;border-radius:14px;padding:12px;text-align:center}
.g-plist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1000px;margin:0 auto}
.g-pl{background:#ffffff26;padding:8px 14px;border-radius:10px;font-weight:600;animation:tin .25s ease}
.g-wait{opacity:.7}
.g-qh{display:flex;justify-content:space-between;align-items:center;font-size:18px;opacity:.95;margin:6px 0 12px}
.g-timer{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#7c45b4;font-weight:700;font-size:26px;font-family:"IBM Plex Mono",monospace}
.g-timer.low{background:#d21f3c}.g-timer.sm{width:42px;height:42px;font-size:18px}
.g-stem{background:#fff;color:#1d1940;border-radius:14px;padding:22px 26px;font-size:clamp(20px,2.4vw,30px);font-weight:600;line-height:1.35;text-align:center;white-space:pre-wrap;max-width:1200px;margin:0 auto}
.g-img{text-align:center;margin:12px 0}.g-img .q-img{max-height:300px;margin:0 auto;display:inline-block}
.g-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:1200px;margin:16px auto 0}
.g-opts.n5 .g-opt:last-child{grid-column:1/-1}
.g-opt{position:relative;display:flex;align-items:center;gap:14px;background:var(--c);color:#fff;border:0;border-radius:12px;padding:18px 20px;font:inherit;font-size:clamp(16px,1.8vw,24px);font-weight:600;text-align:left;box-shadow:0 4px 0 #0004;min-height:76px}
button.g-opt{cursor:pointer}button.g-opt:active{transform:translateY(2px)}
.g-shape{font-size:30px;width:34px;text-align:center;flex:none}
.g-txt{flex:1}
.g-cnt{background:#0003;border-radius:8px;padding:2px 10px;font-family:"IBM Plex Mono",monospace}
.g-check{font-size:28px;font-weight:700}
.g-opt.dim{opacity:.35}
.g-opt.ok{outline:4px solid #fff;outline-offset:2px}
.g-expl{max-width:1000px;margin:16px auto 0;background:#ffffff1f;border-radius:12px;padding:12px 16px;font-size:16px;white-space:pre-wrap}
.g-h{text-align:center;font-size:32px;margin:10px 0 18px}
.g-lead{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.g-lr{display:flex;align-items:center;gap:14px;background:#fff;color:#1d1940;border-radius:12px;padding:12px 18px;font-size:20px;font-weight:600}
.g-lead.small .g-lr{font-size:16px;padding:8px 14px;background:#ffffffe6}
.g-rank{width:34px;font-family:"IBM Plex Mono",monospace;opacity:.6}.g-ln{flex:1}.g-ls{font-family:"IBM Plex Mono",monospace}
.g-delta{color:#23800f;font-size:15px}
.g-pod{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:10px 0 22px}
.g-pd{text-align:center;width:min(28vw,220px)}.g-pn{font-weight:700;font-size:20px;margin-bottom:4px}.g-ps{font-family:"IBM Plex Mono",monospace;margin-bottom:6px}
.g-pb{background:#fff;color:#1d1940;border-radius:12px 12px 0 0;font-size:40px;font-weight:700;display:grid;place-items:center}
.g-pd.p1 .g-pb{height:170px;background:#ffd34d}.g-pd.p2 .g-pb{height:120px;background:#d8dbe3}.g-pd.p3 .g-pb{height:90px;background:#e7a56b}
.gm.player{padding:0 12px 20px}
.g-ptop{display:flex;justify-content:space-between;padding:12px 2px;font-weight:600}
.g-pmsg{text-align:center;padding:40px 10px}.g-pmsg h2{font-size:26px;margin:8px 0}.g-big{font-size:64px;font-weight:700;line-height:1.1}
.g-pmsg.ok{color:#9ff59a}.g-pmsg.bad{color:#ffb3b3}.g-gain{font-size:36px;font-weight:700;font-family:"IBM Plex Mono",monospace}
.g-pq .g-ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.g-pstem{background:#ffffff1a;border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin-bottom:4px;max-height:110px;overflow:auto}
.g-pq .g-opts{grid-template-columns:1fr;gap:10px}
.g-pq .g-opt{min-height:64px;font-size:17px}
.pin-in{font-size:30px;text-align:center;letter-spacing:.3em;font-family:"IBM Plex Mono",monospace;margin:10px 0}
/* Bilgi tahtası */
.jb{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;max-width:1300px;margin:0 auto}
.jb.edit{gap:6px}
.jc{display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px}
.jc .btn{align-self:flex-end}
.jcell{border:0;border-radius:10px;font:inherit;cursor:pointer}
.jcell.e{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);padding:8px;min-height:84px;font-size:12px;color:var(--ink)}
.jcell.e b{font-size:15px;color:var(--accent)}.jcell.e span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.jcell.e.empty{opacity:.55;border-style:dashed}
.jh{background:#2b2466;color:#fff;border-radius:10px;padding:14px 8px;text-align:center;font-weight:700;font-size:clamp(13px,1.4vw,19px);display:grid;place-items:center;min-height:70px;text-transform:uppercase;letter-spacing:.02em}
.jb.play .jcell{background:#3d32a0;color:#ffd34d;font-size:clamp(24px,3.4vw,46px);font-weight:700;font-family:"IBM Plex Mono",monospace;min-height:clamp(64px,11vh,110px);box-shadow:0 4px 0 #0005}
.jb.play .jcell:hover{background:#4c40bf}
.jb.play .jcell.used{background:#ffffff0d;box-shadow:none;cursor:default}
.jteams{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.jt{background:#ffffff1a;border-radius:14px;padding:12px 18px;min-width:150px;text-align:center}
.jt.win{background:#ffd34d;color:#1d1940}
.jtn{font-weight:700;font-size:18px}.jts{font-size:34px;font-weight:700}.jts.neg{color:#ff8d8d}
.jtb{display:flex;gap:6px;justify-content:center;margin-top:6px}.jtb button{background:#ffffff26;color:inherit;border:0;border-radius:6px;padding:3px 8px;cursor:pointer;font:inherit;font-size:12px}
.jq-ov{position:fixed;inset:0;z-index:60;background:#15142a;overflow:auto;padding:18px;color:#fff}
.jq{width:min(1100px,100%);margin:0 auto}
.jq-h{display:flex;justify-content:space-between;font-size:22px;margin-bottom:12px;text-transform:uppercase}.jq-h b{color:#ffd34d;font-size:30px}
.jq-stem{background:#3d32a0;border-radius:14px;padding:22px;font-size:clamp(18px,2.2vw,28px);font-weight:600;line-height:1.35;white-space:pre-wrap;text-align:center}
.jq-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.jq-o{background:#ffffff1f;border-radius:10px;padding:14px 16px;font-size:clamp(15px,1.6vw,21px)}
.jq-o b{color:#ffd34d;margin-right:6px}.jq-o.ok{background:#23800f}.jq-o.dim{opacity:.4}
.jq-act{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.jq-teams{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.jq-t{background:#ffffff14;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:150px}
.jq-t button{border:0;border-radius:8px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer;width:100%}
.jq-t button.ok{background:#23800f;color:#fff}.jq-t button.bad{background:#ffffff26;color:#ffb3b3}
@media (max-width:700px){.g-opts,.jq-opts{grid-template-columns:1fr}.jb.play .jcell{font-size:20px}}

/* Picker */
.pick{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pick .pr{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line-2);align-items:flex-start;cursor:pointer}
.pick .pr:hover{background:var(--surface-2)}
.pick .pr.case{background:var(--info-soft);font-weight:600}
.pick .pr.sub{padding-left:34px}
.pick .pr input{margin-top:4px;accent-color:var(--accent)}
.pick .pr .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(720px,100%);max-height:92vh;overflow:auto}
.modal.narrow{width:min(460px,100%)}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2}
.modal-h h2{margin:0}
.modal-b{padding:18px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.optedit{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.optedit .L{width:24px;font-weight:700;color:var(--muted);text-align:center}
.optedit input[type=radio]{accent-color:var(--ok);width:18px;height:18px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:grid;place-items:center;cursor:zoom-out;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}

/* Toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:9px;font-size:14px;box-shadow:var(--shadow);animation:tin .2s ease}
.toast.err{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* Login */
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:min(420px,100%);padding:30px;text-align:center}
.login .mark{width:52px;height:52px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-weight:700;font-size:18px}
.gbtn{width:100%;justify-content:center;padding:11px;margin-top:18px}
.spinner{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* Footer credit */
footer.credit{text-align:center;padding:18px 0 26px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
footer.credit svg{width:16px;height:16px}

/* Score ring */
.scorebox{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.bigscore{font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;min-width:60px}
.bar>span{display:block;height:100%;background:var(--c2);border-radius:0 4px 4px 0}
.qrev{padding:16px;border-bottom:1px solid var(--line-2)}
.qrev:last-child{border-bottom:0}
.expl{margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:14px;white-space:pre-wrap}
.openans{white-space:pre-wrap;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2);min-height:44px}
/* DICOM görüntüleyici */
.modal.wide{width:min(1000px,100%)}
.pbar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-2);overflow:hidden;margin-top:6px}
.pbar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.serrow{padding:8px 10px;border:1px solid var(--line-2);border-radius:8px}
.dz-prev{width:100%;aspect-ratio:1;background:#000;border-radius:8px;display:block;object-fit:contain}
.dcm-slot{margin:10px 0}
.dcmv{background:#000;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;outline:none;color:#e8e8e8;user-select:none;-webkit-user-select:none}
.dcmv:focus-visible{box-shadow:0 0 0 3px var(--accent-soft)}
.dcm-bar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#15171a;border-bottom:1px solid #2a2d31;align-items:center}
.dcm-t{background:#22262b;border:1px solid #33383e;color:#dfe2e6;border-radius:6px;padding:4px 8px;font-size:13px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;line-height:1.2}
.dcm-t:hover{background:#2c3137}.dcm-t.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dcm-t .ic{font-size:14px}
.dcm-pre{width:auto!important;background:#22262b!important;border-color:#33383e!important;color:#dfe2e6!important;padding:4px 6px!important;font-size:13px}
.dcm-stage{position:relative;height:min(62vh,520px);touch-action:none}
.dcm-stage canvas{position:absolute;inset:0;cursor:ns-resize}
.dcm-ov{position:absolute;font:12px/1.35 "IBM Plex Mono",monospace;color:#ffe9a8;text-shadow:0 0 3px #000,0 0 2px #000;pointer-events:none}
.dcm-ov.tl{top:6px;left:8px}.dcm-ov.tr{top:6px;right:8px}.dcm-ov.bl{bottom:6px;left:8px;color:#cfd3d8}
.dcm-load{position:absolute;inset:0;display:grid;place-items:center;color:#cfd3d8;font-size:14px}.dcm-load.err{color:#ef6a61}
.dcm-slider{width:100%;margin:0;accent-color:var(--accent);background:#15171a;padding:6px 8px;box-sizing:border-box}
.dcm-full{position:fixed;inset:0;z-index:300;background:#000;display:flex}
.dcm-full>.dcmv{flex:1;border-radius:0}
.dcm-full .dcm-stage{height:auto;flex:1}
.dcm-chip{cursor:pointer;margin:6px 0}
@media (max-width:640px){ .dcm-t .lb{display:none} .dcm-stage{height:min(50vh,400px)} }
@media print{ .dcm-bar,.dcm-slider{display:none!important} .dcmv{break-inside:avoid} }
/* ATLS Ekip Oyunu · Altın Saat */
body.game-mode:has(.gm.atls){background:#0c1211}
.gm.atls{--a-panel:#141d1b;--a-panel2:#1a2523;--a-line:#26332f;--a-muted:#8fa29d;--a-ink:#e6efec;--a-acc:#3fb9a3;--a-gold:#f0b73a;--a-ok:#52c983;--a-warn:#f0a43a;--a-bad:#ff7a6e;--a-badsoft:#3a1c19;--a-oksoft:#15301f;
  --v-hr:#3ddc84;--v-bp:#ff6b6b;--v-spo2:#4fd1ff;--v-rr:#ffd166;--v-gcs:#e0e0e0;--v-tmp:#c3a6ff;
  background:#0c1211;color:var(--a-ink);font-size:15px;padding:0 max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
.gm.atls .g-x{display:inline-flex;align-items:center;gap:6px}
.gm.atls .g-x.at-danger{background:#ff7a6e2e;color:#ffb3ab}
.at-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 0;background:#0c1211;border-bottom:1px solid var(--a-line);margin-bottom:14px}
.at-team{flex:1;min-width:0;display:flex;flex-direction:column}.at-team b{font-size:20px;line-height:1.1}
.at-team small{color:var(--a-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at-l{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--a-muted);font-weight:600}
.at-clock{font-size:26px;font-weight:600;line-height:1.1}
.at-bank{position:relative;background:#3a2f12;border-radius:8px;padding:5px 12px}.at-bank .at-l{color:var(--a-gold)}
.at-ctl{display:flex;gap:6px;flex-wrap:wrap}
.at-coin{display:inline-flex;align-items:center;gap:4px;font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--a-gold,#b07a0c)}
.at-coin i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe28a,#d49a14 60%,#9c6c06);box-shadow:inset 0 0 0 1.5px #8a5e05;display:inline-block}
.at-coin.big{font-size:24px}.at-coin.big i{width:20px;height:20px}
.at-float{position:absolute;right:8px;top:-4px;color:var(--a-bad);font-weight:700;pointer-events:none;animation:atUp 1s ease-out forwards}
@keyframes atUp{to{transform:translateY(-26px);opacity:0}}
.at-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start;max-width:1400px;margin:0 auto}
@media (max-width:960px){.at-grid{grid-template-columns:1fr}}
.at-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.at-panel{background:var(--a-panel);border:1px solid var(--a-line);border-radius:10px;padding:14px}
.at-h{font-size:19px;margin:4px 0 0}.at-mist{margin:6px 0 0;color:var(--a-muted);font-size:14px}
.at-mon{background:#0b1110;border:1px solid var(--a-line);border-radius:10px;padding:12px}
.at-mon .top{display:flex;justify-content:space-between;margin-bottom:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5b6d69}
.at-mon canvas{width:100%;height:58px;display:block}
.at-monoff{display:grid;place-items:center;gap:10px;height:140px;text-align:center;color:#6f817d}
.at-vit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.at-vit .vt{border-top:1px solid var(--a-line);padding-top:6px}
.at-vit .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.at-vit .v{font-weight:600;font-size:clamp(22px,3.4vw,32px);line-height:1.05}.at-vit .u{font-size:11px;opacity:.6;font-family:"IBM Plex Sans",sans-serif}
.at-vit .alarm .v{animation:atBlink 1s steps(2) infinite}@keyframes atBlink{50%{opacity:.35}}
.at-finds{display:flex;flex-direction:column;gap:8px;max-height:460px;overflow:auto;margin-top:8px}
.at-find{border:1px solid var(--a-line);border-radius:8px;padding:8px 10px;background:var(--a-panel2)}
.at-find .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.at-find .h span{font-size:12px;color:var(--a-muted)}
.at-find p{margin:3px 0 0;font-size:14px}
.at-find.harm{border-color:var(--a-bad);background:var(--a-badsoft)}.at-find.sys{border-style:dashed;border-color:var(--a-warn)}
.at-find.new{animation:atFlash 1.2s ease-out}@keyframes atFlash{from{box-shadow:0 0 0 3px var(--a-gold)}to{box-shadow:0 0 0 0 transparent}}
.at-empty{color:var(--a-muted);font-size:14px;padding:6px 0}
.at-quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.at-q{width:100%;border:1px solid var(--a-line);background:var(--a-panel2);color:var(--a-ink);border-radius:8px;padding:9px 12px;font:inherit;margin-bottom:10px}
.at-q:focus{outline:2px solid var(--a-acc);outline-offset:1px}.at-tabs.dim{opacity:.4}
.at-state{padding:4px 12px;border-radius:999px;background:#ffffff1a;font-weight:600;font-size:14px}.at-state.live{background:#3ddc8430;color:#9ff5c2}
.gm.atls.pjv{font-size:18px}.pjv .at-h{font-size:24px}.pjv .at-find p{font-size:17px}.pjv .at-find .h b{font-size:17px}.pjv .at-finds.tall{max-height:64vh}.pjv .at-team b{font-size:26px}.pjv .at-clock{font-size:34px}
.at-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.at-tabs button{border:1px solid var(--a-line);background:var(--a-panel2);color:var(--a-ink);border-radius:8px;padding:6px 10px;min-width:46px;font:inherit;font-weight:700;font-size:16px;line-height:1.1;cursor:pointer}
.at-tabs button small{display:block;font-weight:500;font-size:11px;color:var(--a-muted)}
.at-tabs button[aria-selected="true"]{background:var(--a-acc);border-color:var(--a-acc);color:#06201b}.at-tabs button[aria-selected="true"] small{color:#06201b}
.at-acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.at-act{text-align:left;border:1px solid var(--a-line);background:var(--a-panel2);color:var(--a-ink);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-height:76px;font:inherit;cursor:pointer}
.at-act:hover:not(:disabled){border-color:var(--a-acc)}.at-act:disabled{opacity:.5;cursor:not-allowed}
.at-act .t{font-weight:600;font-size:14.5px;line-height:1.25}.at-act .m{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto}
.at-act.done{background:var(--a-oksoft);border-color:var(--a-ok)}.at-act .cnt{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--a-ok);font-weight:600}
.at-kind{text-transform:uppercase;letter-spacing:.07em;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid currentColor}

function encDelta(a){ const o=new Int16Array(a.length); let p=0; for(let i=0;i<a.length;i++){ o[i]=a[i]-p; p=a[i]; } return new Uint8Array(o.buffer); }

async function poolMap(arr,n,fn){ const out=new Array(arr.length); let i=0; await Promise.all(Array.from({length:Math.min(n,arr.length)},async()=>{ while(i<arr.length){ const k=i++; out[k]=await fn(arr[k],k); } })); return out; }
const fmtMB=b=>b>=1e6?(b/1e6).toLocaleString("tr-TR",{maximumFractionDigits:1})+" MB":Math.max(1,Math.round(b/1e3))+" KB";

/* ---- okuma (daikon) ---- */
function dcmVal(im,fn,def=null){ try{ const v=im[fn]?.(); return v==null?def:v; }catch(e){ return def; } }
async function scanDicomFiles(files,onProg){
  await loadScript(DAIKON_URL);
  const series={}; let i=0, skipped=0, rgb=0;
  for(const f of files){ i++; if(i%5===0) onProg&&onProg(i,files.length);
    if(f.size<132||/\.(txt|xml|html?|jpe?g|png|pdf|exe|inf|ini|zip)$/i.test(f.name)) { skipped++; continue; }
    try{
      const im=daikon.Series.parseImage(new DataView(await f.arrayBuffer()));
      if(!im||!im.hasPixelData()){ skipped++; continue; }
      if((dcmVal(im,"getNumberOfSamplesPerPixel",1))>1){ rgb++; continue; }
      const uid=dcmVal(im,"getSeriesInstanceUID")||dcmVal(im,"getSeriesId","?");
      const s=series[uid]=series[uid]||{uid,mod:dcmVal(im,"getModality",""),desc:String(dcmVal(im,"getSeriesDescription","")||"").trim(),items:[],rows:im.getRows(),cols:im.getCols()};
      const pos=dcmVal(im,"getImagePosition"), frames=dcmVal(im,"getNumberOfFrames",1)||1;
      for(let fr=0;fr<frames;fr++) s.items.push({file:f,frame:fr,frames,z:pos?Number(pos[2]):null,inst:Number(dcmVal(im,"getImageNumber",0))||0,
        sp:dcmVal(im,"getPixelSpacing"),thick:dcmVal(im,"getSliceThickness"),wc:dcmVal(im,"getWindowCenter"),ww:dcmVal(im,"getWindowWidth"),
        inv:/MONOCHROME1/.test(String(dcmVal(im,"getPhotometricInterpretation",""))),rows:im.getRows(),cols:im.getCols()});
    }catch(e){ skipped++; }
  }
  onProg&&onProg(files.length,files.length);
  const list=Object.values(series).map(s=>{ s.items=s.items.filter(x=>x.rows===s.rows&&x.cols===s.cols);
    const hasZ=s.items.every(x=>x.z!=null&&!isNaN(x.z)) && new Set(s.items.map(x=>x.z)).size===s.items.length;
    s.items.sort((a,b)=>hasZ?b.z-a.z:(a.inst-b.inst)||(a.frame-b.frame)); return s; }).filter(s=>s.items.length).sort((a,b)=>b.items.length-a.items.length);
  return {list,skipped,rgb};
}
// Bir kesiti (HU / ham değer) Int16 olarak çözer; isteğe bağlı 2×2 küçültme
const _fileCache=new Map();
async function readSlice(it,half){
  let im=_fileCache.get(it.file);
  if(!im){ im=daikon.Series.parseImage(new DataView(await it.file.arrayBuffer())); _fileCache.clear(); _fileCache.set(it.file,im); }
  const d=(it.frames>1?im.getInterpretedData(false,true,it.frame):im.getInterpretedData(false,true)).data, R=it.rows, C=it.cols, off=0;
  if(!half){ const o=new Int16Array(R*C); for(let i=0;i<R*C;i++){ const v=Math.round(d[off+i]); o[i]=v<-32768?-32768:v>32767?32767:v; } return {a:o,rows:R,cols:C}; }
  const r=R>>1, c=C>>1, o=new Int16Array(r*c);
  for(let y=0;y<r;y++) for(let x=0;x<c;x++){ const j=off+(2*y)*C+2*x; const v=Math.round((d[j]+d[j+1]+d[j+C]+d[j+C+1])/4); o[y*c+x]=v<-32768?-32768:v>32767?32767:v; }
  return {a:o,rows:r,cols:c};
}

    out.innerHTML=`<label class="f">Seri seçin</label><div class="list" style="gap:6px">${res.list.map((s,i)=>`<label class="check serrow"><input type="radio" name="ser" value="${i}" ${i===0?"checked":""}> <span><b>${esc(s.mod||"?")}</b> · ${esc(s.desc||"(açıklamasız seri)")} · <b>${s.items.length}</b> kesit · ${s.cols}×${s.rows}</span></label>`).join("")}</div>
      <div class="small muted" style="margin-top:6px">${res.skipped?`${res.skipped} dosya DICOM görüntüsü olmadığı için atlandı. `:""}${res.rgb?`${res.rgb} renkli görüntü atlandı.`:""}</div>
      <button class="btn primary" id="dzNext" style="margin-top:12px">Devam →</button>`;

  m.el.querySelector("#dzDir").onchange=e=>onFiles(e.target.files);
  m.el.querySelector("#dzFiles").onchange=e=>onFiles(e.target.files);

  async function step2(s){
    const n=s.items.length, big=s.cols>=400;
    const P={from:1,to:n,step:1,half:big&&n>100,cur:Math.ceil(n/2)};
    const it0=s.items[0], ct=/CT/i.test(s.mod);
    const W0=Number(Array.isArray(it0.ww)?it0.ww[0]:it0.ww)||(ct?80:0), L0=Number(Array.isArray(it0.wc)?it0.wc[0]:it0.wc)||(ct?40:0);
    out.innerHTML=`<div class="grid2" style="align-items:start">
      <div><canvas id="dzC" class="dz-prev"></canvas><input type="range" id="dzS" min="1" max="${n}" value="${P.cur}" style="width:100%"><div class="small muted" id="dzSL"></div></div>
      <div><div class="field"><label class="f">Başlık</label><input type="text" id="dzT" value="${esc((s.mod?s.mod+" · ":"")+(s.desc||"Seri"))}"><div class="small muted">Hasta adı veya kimlik bilgisi yazmayın.</div></div>
        <div class="grid2"><div class="field"><label class="f">İlk kesit</label><input type="number" id="dzF" min="1" max="${n}" value="1"></div><div class="field"><label class="f">Son kesit</label><input type="number" id="dzL" min="1" max="${n}" value="${n}"></div></div>
        <div class="grid2"><div class="field"><label class="f">Kesit seçimi</label><select id="dzK">${[1,2,3,4,5].map(k=>`<option value="${k}">${k===1?"Tüm kesitler":`Her ${k} kesitten 1`}</option>`).join("")}</select></div>
          <div class="field"><label class="f">Çözünürlük</label><select id="dzR"><option value="0">Tam (${s.cols}×${s.rows})</option><option value="1" ${P.half?"selected":""}>Yarı (${s.cols>>1}×${s.rows>>1}) · 4 kat küçük</option></select></div></div>
        <div class="card pad" style="box-shadow:none;background:var(--surface-2)" id="dzE">Boyut hesaplanıyor…</div>
        <div class="small muted" style="margin-top:6px">Önizlemedeki kaydırıcıyla ilk ve son kesiti bulun; “Bu kesit ilk / son” düğmeleriyle aralığı seçin.</div>
        <div class="row" style="margin-top:8px"><button class="btn sm" id="dzSF">Bu kesit ilk</button><button class="btn sm" id="dzSLs">Bu kesit son</button></div></div></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" id="dzGo">Anonimleştir ve yükle</button></div>`;
    const cv=m.el.querySelector("#dzC"), $=id=>m.el.querySelector("#"+id);
    let est=null, tok=0, etok=0;
    const draw=async()=>{ const t=++tok; const r=await readSlice(s.items[P.cur-1],false); if(t!==tok) return;
      cv.width=r.cols; cv.height=r.rows; const x=cv.getContext("2d"), img=x.createImageData(r.cols,r.rows);
      let W=W0, L=L0; if(!W){ let mn=1e9,mx=-1e9; for(const v of r.a){ if(v<mn)mn=v; if(v>mx)mx=v; } W=Math.max(1,mx-mn); L=(mx+mn)/2; }
      const lo=L-W/2, k=255/W; for(let i=0;i<r.a.length;i++){ let g=(r.a[i]-lo)*k; g=g<0?0:g>255?255:g; if(it0.inv) g=255-g; img.data[i*4]=img.data[i*4+1]=img.data[i*4+2]=g; img.data[i*4+3]=255; }
      x.putImageData(img,0,0); $("dzSL").textContent=`Kesit ${P.cur} / ${n}${P.cur<P.from||P.cur>P.to?" · seçim dışında":""}`; };
    const sel=()=>{ const a=[]; for(let i=P.from;i<=P.to;i+=P.step) a.push(i-1); return a; };
    const estimate=async()=>{ const t=++etok; const idx=sel(); if(!idx.length){ $("dzE").textContent="Seçim boş"; return; }
      const sample=[...new Set([0,1,2,3,4,5].map(k=>idx[Math.round(k*(idx.length-1)/5)]))]; let tot=0; $("dzE").textContent="Boyut hesaplanıyor…"; for(const i of sample){ const r=await readSlice(s.items[i],P.half); tot+=(await gz(encDelta(r.a))).length; }
      if(t!==etok) return; est=tot/sample.length*idx.length;
      $("dzE").innerHTML=`<b>${idx.length} kesit</b> · tahmini <b>${fmtMB(est)}</b>${est>60e6?`<div style="color:var(--bad)">Çok büyük (en fazla 60 MB). Aralığı daraltın, kesit atlayın veya yarı çözünürlük seçin.</div>`:est>25e6?`<div style="color:var(--warn)">Büyük bir seri; ücretsiz veritabanı kotası 1 GB'tır. Mümkünse daraltın.</div>`:""}`;
      $("dzGo").disabled=est>60e6; draw(); };
    const upd=()=>{ P.from=Math.max(1,Math.min(n,parseInt($("dzF").value,10)||1)); P.to=Math.max(P.from,Math.min(n,parseInt($("dzL").value,10)||n)); P.step=Number($("dzK").value); P.half=$("dzR").value==="1"; estimate(); };
    ["dzF","dzL","dzK","dzR"].forEach(i=>$(i).onchange=upd);
    $("dzS").oninput=()=>{ P.cur=Number($("dzS").value); draw(); };
    $("dzSF").onclick=()=>{ $("dzF").value=P.cur; if(P.cur>P.to) $("dzL").value=n; upd(); };
    $("dzSLs").onclick=()=>{ $("dzL").value=P.cur; if(P.cur<P.from) $("dzF").value=1; upd(); };
    $("dzGo").onclick=async()=>{
      const idx=sel(); if(!idx.length) return; const title=$("dzT").value.trim()||"Seri";
      out.innerHTML=`<div class="small muted" id="dzP">Kesitler anonimleştiriliyor ve sıkıştırılıyor…</div><div class="pbar"><span id="dzB"></span></div>`;
      const prog=(t,p)=>{ const a=m.el.querySelector("#dzP"), b=m.el.querySelector("#dzB"); if(a) a.textContent=t; if(b) b.style.width=(p*100)+"%"; };
      try{
        const comp=[]; let rows,cols;
        for(let j=0;j<idx.length;j++){ const r=await readSlice(s.items[idx[j]],P.half); rows=r.rows; cols=r.cols; comp.push(await gz(encDelta(r.a))); prog(`Kesit ${j+1} / ${idx.length} hazırlanıyor…`,(j+1)/idx.length*0.5); }

        const id=newId(); let done=0;
        await poolMap(chunks,3,async(ch,k)=>{ const tot=ch.reduce((a,c)=>a+c.length,0), u=new Uint8Array(tot); let o=0; ch.forEach(c=>{ u.set(c,o); o+=c.length; });
          await setDoc(doc(db,"dicoms",id,"c",String(k)),{d:Bytes.fromUint8Array(u),sizes:ch.map(c=>c.length)}); done++; prog(`Yükleniyor: ${done} / ${chunks.length} parça`,0.5+done/chunks.length*0.5); });
        const it=s.items[idx[0]], f=P.half?2:1, sp=(it.sp||[1,1]).map(Number), z0=s.items[idx[0]].z, z1=s.items[idx[idx.length-1]].z;
        const gap=idx.length>1&&z0!=null&&z1!=null?Math.abs(z1-z0)/(idx.length-1):Number(it.thick)||null;
        const meta={title,mod:s.mod||"",rows,cols,n:idx.length,chunks:chunks.length,sp:[sp[0]*f,sp[1]*f],thick:Number(it.thick)||null,gap:gap?Math.round(gap*100)/100:null,
          wc:L0||null,ww:W0||null,inv:!!it.inv,bytes:comp.reduce((a,c)=>a+c.length,0),enc:"i16-delta-gzip",createdAt:serverTimestamp(),by:S.email};
        await setDoc(doc(db,"dicoms",id),meta);
        m.close(); toast(`${idx.length} kesit yüklendi (${fmtMB(meta.bytes)})`); onDone&&onDone(id,meta);
      }catch(e){ console.error(e); out.innerHTML=`<div class="note" style="background:var(--bad-soft)">Yükleme başarısız: ${esc(e.message||String(e))}</div>`; }
    };
    draw(); estimate();
  }
}

/* ---- yükleme ve kesit çözme ---- */
const DCM=new Map();
function loadDicom(id,onProg){
  if(DCM.has(id)){ const p=DCM.get(id); if(onProg) p.then(()=>onProg(1,1)).catch(()=>{}); return p; }
  const p=(async()=>{ const m=await getDoc(doc(db,"dicoms",id)); if(!m.exists()) throw new Error("Görüntü serisi bulunamadı"); const meta=m.data(); let done=0;
    const parts=await poolMap([...Array(meta.chunks).keys()],4,async k=>{ const c=await getDoc(doc(db,"dicoms",id,"c",String(k))); done++; onProg&&onProg(done,meta.chunks); if(!c.exists()) throw new Error("Görüntü parçası eksik"); return c.data(); });
    const comp=[]; parts.forEach(c=>{ const u=c.d.toUint8Array(); let o=0; c.sizes.forEach(z=>{ comp.push(u.subarray(o,o+z)); o+=z; }); });
    return {id,meta,comp,dec:new Map()}; })();
  DCM.set(id,p); p.catch(()=>DCM.delete(id)); return p;
}
async function sliceArr(Sr,i){ let a=Sr.dec.get(i); if(a) return a; a=decDelta(await gunz(Sr.comp[i])); Sr.dec.set(i,a); if(Sr.dec.size>90){ Sr.dec.delete(Sr.dec.keys().next().value); } return a; }

    el.addEventListener("keydown",e=>{ if(["ArrowUp","ArrowDown","PageUp","PageDown","ArrowLeft","ArrowRight"].includes(e.key)){ e.preventDefault(); e.stopPropagation(); this.setSlice(this.i+(["ArrowUp","PageUp","ArrowLeft"].includes(e.key)?-1:1)); } });
    cv.addEventListener("wheel",e=>{ if(!this.S) return; e.preventDefault(); if(e.ctrlKey){ this.zoomAt(e,Math.exp(-e.deltaY*0.002)); } else this.setSlice(this.i+(e.deltaY>0?1:-1)); },{passive:false});
    cv.addEventListener("pointerdown",e=>{ if(!this.S) return; cv.setPointerCapture(e.pointerId); this.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); this.el.focus({preventScroll:true});
      this.drag={x:e.clientX,y:e.clientY,W:this.W,L:this.L,i:this.i,px:this.px,py:this.py,zoom:this.zoom,acc:0};
      if(this.tool==="meas"&&this.ptrs.size===1){ const p=this.toImg(e); this.meas={a:p,b:p}; }
      if(this.tool==="ann"&&this.anno&&this.ptrs.size===1){ this.anno.down(this.toNorm(e),this.i); this.draw(); }
      if(this.ptrs.size===2){ const [a,b]=[...this.ptrs.values()]; this.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),zoom:this.zoom}; } });
    cv.addEventListener("pointermove",e=>{ if(!this.S) return; this.readout(e);
      if(!this.ptrs.has(e.pointerId)) return; this.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(this.ptrs.size===2&&this.pinch){ const [a,b]=[...this.ptrs.values()]; this.zoom=Math.max(0.5,Math.min(10,this.pinch.zoom*Math.hypot(a.x-b.x,a.y-b.y)/this.pinch.d)); this.draw(); return; }
      const d=this.drag, dx=e.clientX-d.x, dy=e.clientY-d.y;
      if(this.tool==="slice"){ const n=Math.trunc(dy/8); if(this.i!==d.i+n) this.setSlice(d.i+n); }
      else if(this.tool==="wl"){ const base=d.W||this.autoW||400, s=Math.max(1,base/300); this.W=Math.max(1,base+dx*s); this.L=(d.L??this.autoL??0)+dy*s; this.draw(); }
      else if(this.tool==="zoom"){ this.zoom=Math.max(0.5,Math.min(10,d.zoom*Math.exp(-dy*0.01))); this.draw(); }
      else if(this.tool==="pan"){ this.px=d.px+dx; this.py=d.py+dy; this.draw(); }
      else if(this.tool==="meas"&&this.meas){ this.meas.b=this.toImg(e); this.draw(); }
      else if(this.tool==="ann"&&this.anno?.draft){ this.anno.move(this.toNorm(e)); this.draw(); } });
    const up=e=>{ this.ptrs.delete(e.pointerId); if(this.ptrs.size<2) this.pinch=null; if(this.tool==="ann"&&this.anno?.draft){ this.anno.up(this.i); this.draw(); } };
    cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
    cv.addEventListener("pointerleave",()=>{ const tr=this.el.querySelector(".dcm-ov.tr"); if(tr) tr.textContent=""; });
  }
  setTool(k){ this.tool=k; this.el.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on",x.dataset.tool===k)); this.cv.style.cursor=k==="ann"?"crosshair":""; }
  toNorm(e){ const p=this.toImg(e), m=this.S.meta; return {x:p.x/m.cols,y:p.y/m.rows}; }
  zoomAt(e,f){ this.zoom=Math.max(0.5,Math.min(10,this.zoom*f)); this.draw(); }
  setSlice(i){ if(!this.S) return; i=Math.max(0,Math.min(this.S.meta.n-1,i)); if(i===this.i) return; this.i=i; this.el.querySelector(".dcm-slider").value=i; this.draw(); this.onSlice&&this.onSlice(i); }
  geom(){ const m=this.S.meta, r=this.stage.getBoundingClientRect(), asp=(m.sp?.[0]||1)/(m.sp?.[1]||1);
    const base=Math.min(r.width/m.cols, r.height/(m.rows*asp)), sc=base*this.zoom, w=m.cols*sc, h=m.rows*asp*sc;
    return {r,sc,asp,ox:(r.width-w)/2+this.px,oy:(r.height-h)/2+this.py,w,h}; }
  toImg(e){ const g=this.geom(); return {x:(e.clientX-g.r.left-g.ox)/g.sc, y:(e.clientY-g.r.top-g.oy)/(g.sc*g.asp)}; }
  readout(e){ const tr=this.el.querySelector(".dcm-ov.tr"); if(!tr||!this.S) return; const p=this.toImg(e), m=this.S.meta, x=Math.floor(p.x), y=Math.floor(p.y);
    const a=this.S.dec.get(this.i); if(!a||x<0||y<0||x>=m.cols||y>=m.rows){ tr.textContent=""; return; } tr.textContent=`${this.ct?"HU":"Değer"} ${a[y*m.cols+x]}`; }
  draw(){ if(!this.S) return; cancelAnimationFrame(this.raf); this.raf=requestAnimationFrame(()=>this._draw()); }
  async _draw(){
    const m=this.S.meta, i=this.i, a=await sliceArr(this.S,i); if(i!==this.i) return;
    let W=this.W, L=this.L;
    if(W==null){ let mn=1e9,mx=-1e9; for(let k=0;k<a.length;k+=7){ const v=a[k]; if(v<mn)mn=v; if(v>mx)mx=v; } W=Math.max(1,mx-mn); L=(mx+mn)/2; this.autoW=W; this.autoL=L; }
    if(this.off.width!==m.cols||this.off.height!==m.rows){ this.off.width=m.cols; this.off.height=m.rows; this.img=null; }
    const ox=this.off.getContext("2d"); this.img=this.img||ox.createImageData(m.cols,m.rows); const d=this.img.data, lo=L-W/2, k=255/W, inv=this.invert;
    for(let p=0,q=0;p<a.length;p++,q+=4){ let g=(a[p]-lo)*k; g=g<0?0:g>255?255:g; if(inv) g=255-g; d[q]=d[q+1]=d[q+2]=g; d[q+3]=255; }
    ox.putImageData(this.img,0,0);
    const g=this.geom(), dpr=window.devicePixelRatio||1, cv=this.cv;
    cv.width=Math.round(g.r.width*dpr); cv.height=Math.round(g.r.height*dpr); cv.style.width=g.r.width+"px"; cv.style.height=g.r.height+"px";
    const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle="#000"; c.fillRect(0,0,g.r.width,g.r.height);
    c.imageSmoothingEnabled=this.zoom<3; c.drawImage(this.off,g.ox,g.oy,g.w,g.h);
    if(this.meas){ const A={x:g.ox+this.meas.a.x*g.sc,y:g.oy+this.meas.a.y*g.sc*g.asp}, B={x:g.ox+this.meas.b.x*g.sc,y:g.oy+this.meas.b.y*g.sc*g.asp};
      const mm=Math.hypot((this.meas.b.x-this.meas.a.x)*(m.sp?.[1]||1),(this.meas.b.y-this.meas.a.y)*(m.sp?.[0]||1));
      c.strokeStyle="#ffd34d"; c.lineWidth=2; c.beginPath(); c.moveTo(A.x,A.y); c.lineTo(B.x,B.y); c.stroke();
      [A,B].forEach(P=>{ c.beginPath(); c.arc(P.x,P.y,3,0,7); c.fillStyle="#ffd34d"; c.fill(); });
      if(mm>0.5){ c.font="600 13px IBM Plex Sans, sans-serif"; const t=(mm>=10?mm.toFixed(1):mm.toFixed(2))+" mm"; c.fillStyle="#000a"; c.fillRect(B.x+6,B.y-9,c.measureText(t).width+8,18); c.fillStyle="#ffd34d"; c.fillText(t,B.x+10,B.y+5); } }
    if(this.anno) this.anno.draw(c,{x:v=>g.ox+v*m.cols*g.sc,y:v=>g.oy+v*m.rows*g.sc*g.asp},i);
    this.el.querySelector(".dcm-ov.tl").innerHTML=`Kesit ${i+1} / ${m.n}<br>P ${Math.round(W)} · S ${Math.round(L)}${this.zoom!==1?`<br>×${this.zoom.toFixed(1)}`:""}`;
    this.el.querySelector(".dcm-ov.bl").textContent=`${esc(m.title||"")}${m.gap?` · ${m.gap} mm aralık`:""}`;
  }
}

async function dicomList(){
  const [ds,qs,cs]=await Promise.all([getDocs(collection(db,"dicoms")),getDocs(collection(db,"questions")),getDocs(collection(db,"cases"))]);
  const used={}; [...qs.docs,...cs.docs].forEach(d=>{ const x=d.data().dicomId; if(x) used[x]=(used[x]||0)+1; });
  const list=ds.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(tsMs(b.createdAt)||0)-(tsMs(a.createdAt)||0));
  return {list,used,tot:list.reduce((a,x)=>a+(x.bytes||0),0)};
}
const dcmRow=(x,used,act)=>`<div class="tplrow dcmrow"><span class="grow"><b>${esc(x.title||"Seri")}</b> <span class="small muted">· ${x.n} kesit · ${x.cols}×${x.rows} · ${fmtMB(x.bytes||0)} · ${fmtDT(x.createdAt)}${used[x.id]?` · ${used[x.id]} soru/vakada`:" · kullanılmıyor"}</span></span>
  <button class="btn sm ghost" type="button" data-dcmfull="${esc(x.id)}">Görüntüle</button>${act}</div>`;
function dicomPickDlg(onPick){
  if(S.mode!=="admin") return toast("Arşiv yalnız yöneticiye açık; yeni seri yükleyin",true);
  const m=modal(`<div class="modal-h"><h2>Arşivden BT/MR serisi seç</h2><button class="btn sm ghost" data-close>✕</button></div><div class="modal-b" id="dpB"><div class="spinner"></div></div>`);
  dicomList().then(({list,used})=>{ const b=m.el.querySelector("#dpB");
    b.innerHTML=list.length?list.map(x=>dcmRow(x,used,`<button class="btn sm primary" type="button" data-pick="${esc(x.id)}">Seç</button>`)).join(""):`<div class="small muted">Arşivde seri yok. “DICOM yükle” ile ekleyin.</div>`;
    hydrateDicom(b); b.querySelectorAll("[data-pick]").forEach(x=>x.onclick=()=>{ m.close(); onPick(x.dataset.pick); });
  }).catch(e=>{ fail(e); m.close(); });
}
async function dicomArchiveCard(host){
  let L; try{ L=await dicomList(); }catch(e){ host.innerHTML=`<div class="small muted">Arşiv okunamadı.</div>`; return; }
  const {list,used,tot}=L;
  host.innerHTML=`<div class="small muted" style="margin-bottom:10px">${list.length} seri · toplam ${fmtMB(tot)} (ücretsiz Firebase kotası 1 GB; sorular ve sonuçlarla paylaşılır). Seriler soru/vaka düzenleme penceresinden yüklenir.</div>
    ${list.map(x=>dcmRow(x,used,`<button class="btn sm ghost danger" type="button" data-dcmdel="${esc(x.id)}">Sil</button>`)).join("")||`<div class="small muted">Henüz seri yok.</div>`}`;
  hydrateDicom(host);
  host.querySelectorAll("[data-dcmdel]").forEach(b=>b.onclick=async()=>{ const id=b.dataset.dcmdel, u=used[id]||0;
    if(!await confirmDlg("Seriyi sil",`<p>Bu görüntü serisi kalıcı olarak silinecek.${u?` <b>${u} soru/vaka bu seriyi kullanıyor</b>; bu sorularda ve onları içeren sınavlarda görüntü açılmaz.`:""}</p>`,"Sil",true)) return;
    try{ const cs=await getDocs(collection(db,"dicoms",id,"c")); await batchOps([...cs.docs.map(d=>bt=>bt.delete(d.ref)),bt=>bt.delete(doc(db,"dicoms",id))]); DCM.delete(id); toast("Seri silindi"); dicomArchiveCard(host); }catch(e){ fail(e,"Silinemedi"); } });
}

async function hasOpenExam(){
  try{ const ix=await getDoc(doc(db,"meta","examIndex")); const ids=ix.exists()?(ix.data().ids||[]):[]; const now=Date.now();
    const r=await Promise.all(ids.slice(-30).map(async id=>{ try{ const e=await getDoc(doc(db,"exams",id)); if(!e.exists()) return false; const x={id,...e.data()};
      if(!x.published||!isAssigned(x,S.email)||now<(tsMs(x.startAt)||0)) return false;
      const a=await getDoc(doc(db,"attempts",id+"_"+S.user.uid)); if(!a.exists()) return now<=personalEnd(x,S.email);
      const at=a.data(); return at.status==="started"&&!isFinished(x,at); }catch(e){ return false; } }));
    return r.some(Boolean); }catch(e){ return false; } }

async function loadBank(){
  const [qs,cs,ps]=await Promise.all([getDocs(collection(db,"questions")),getDocs(collection(db,"cases")),getDocs(collection(db,"pools"))]);
  S.pools={}; ps.docs.forEach(d=>S.pools[d.id]={id:d.id,...d.data()});
  S.questions=qs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(tsMs(a.createdAt)||0)-(tsMs(b.createdAt)||0));
  S.cases={}; cs.docs.forEach(d=>S.cases[d.id]={id:d.id,...d.data()});
}
async function loadExams(){ const s=await getDocs(collection(db,"exams")); S.exams=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(tsMs(b.createdAt)||0)-(tsMs(a.createdAt)||0)); }
async function loadResidents(){ const s=await getDocs(collection(db,"residents")); S.residents=s.docs.map(d=>({email:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name),"tr")); }
function topics(){ return [...new Set(S.questions.map(q=>q.topic).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"tr")); }
// Bankayı sıralı bloklar halinde döndürür: vakalar (alt sorularıyla) ve tek sorular
function bankBlocks(list=S.questions){
  const blocks=[]; const seen=new Set();
  for(const q of list){
    if(q.caseId && S.cases[q.caseId]){
      if(seen.has(q.caseId)) continue; seen.add(q.caseId);
      blocks.push({kind:"case", c:S.cases[q.caseId], qs:list.filter(x=>x.caseId===q.caseId)});
    } else blocks.push({kind:"q", q});
  }
  return blocks;
}

async function syncExamIndex(exams){

}

/* ---------------- sınavı paylaş (bağlantı + QR) ---------------- */
const examLink=id=>location.origin+location.pathname+"#sinav="+id;
function qrMatrix(text){ if(!window.qrcode) return null; const q=qrcode(0,"M"); q.addData(text); q.make(); const n=q.getModuleCount(); return {n,dark:(r,c)=>q.isDark(r,c)}; }
function qrSVG(text,px=220){ const m=qrMatrix(text); if(!m) return `<div class="small muted">QR kütüphanesi yüklenemedi.</div>`; const q=4, N=m.n+q*2; let d="";
  for(let r=0;r<m.n;r++) for(let c=0;c<m.n;c++) if(m.dark(r,c)) d+=`M${c+q},${r+q}h1v1h-1z`;
  return `<svg class="qr" viewBox="0 0 ${N} ${N}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="Sınav QR kodu"><rect width="${N}" height="${N}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`; }
function qrPNG(text,title){ const m=qrMatrix(text); if(!m) return null; const cell=12, q=4, N=(m.n+q*2)*cell, pad=title?56:0;
  const c=document.createElement("canvas"); c.width=N; c.height=N+pad; const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.fillStyle="#000";
  for(let r=0;r<m.n;r++) for(let k=0;k<m.n;k++) if(m.dark(r,k)) x.fillRect((k+q)*cell,(r+q)*cell,cell,cell);
  if(title){ x.font="600 22px IBM Plex Sans, Arial, sans-serif"; x.textAlign="center"; x.fillText(title.length>40?title.slice(0,39)+"…":title,N/2,N+34); }
  return c.toDataURL("image/png"); }
function shareExam(e){
  const link=examLink(e.id), when=`${fmtDT(e.startAt)} – ${fmtDT(e.endAt)}`;
  const text=`${e.title}\nAçılış–kapanış: ${when}\nSüre: ${e.durationMin} dk\nSınava girmek için: ${link}`;
  const m=modal(`<div class="modal-h"><h2>Sınavı paylaş</h2><button class="btn sm ghost" data-close>✕</button></div>
    <div class="modal-b"><div class="share">
      <div class="share-qr">${qrSVG(link,200)}<div class="small muted" style="text-align:center;margin-top:6px">Telefon kamerasıyla okutun</div></div>
      <div class="grow" style="min-width:0"><b>${esc(e.title)}</b><div class="small muted" style="margin-bottom:10px">${when} · ${e.durationMin} dk</div>
        ${!e.published?`<div class="note" style="background:var(--warn-soft)">Sınav henüz yayında değil; bağlantıyı açan asistanlar sınavı göremez.</div>`:""}
        <label class="f">Bağlantı</label><div class="row" style="flex-wrap:nowrap"><input type="text" id="shL" value="${esc(link)}" readonly><button class="btn" id="shC">Kopyala</button></div>
        <div class="row" style="margin-top:12px;gap:6px">
          <a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(text)}">WhatsApp</a>
          <a class="btn" href="mailto:?subject=${encodeURIComponent(e.title)}&body=${encodeURIComponent(text)}">E-posta</a>
          ${navigator.share?`<button class="btn" id="shN">Paylaş…</button>`:""}
          <button class="btn" id="shQ">QR'ı indir (PNG)</button>
          <button class="btn" id="shF">Büyük QR göster</button></div>
        <p class="small muted" style="margin-bottom:0">Bağlantıyı açan asistan Google ile giriş yapar ve doğrudan bu sınava yönlendirilir. Yalnız sınava atanmış asistanlar girebilir.</p></div></div></div>`);
  m.el.querySelector("#shC").onclick=async()=>{ try{ await navigator.clipboard.writeText(link); toast("Bağlantı kopyalandı"); }catch(_){ const i=m.el.querySelector("#shL"); i.select(); document.execCommand("copy"); toast("Bağlantı kopyalandı"); } };
  m.el.querySelector("#shN")?.addEventListener("click",()=>navigator.share({title:e.title,text,url:link}).catch(()=>{}));
  m.el.querySelector("#shQ").onclick=()=>{ const u=qrPNG(link,e.title); if(!u) return toast("QR oluşturulamadı",true); const a=document.createElement("a"); a.href=u; a.download=`${e.title.replace(/[\\/:*?"<>|]/g,"_")} - QR.png`; document.body.appendChild(a); a.click(); a.remove(); };
  m.el.querySelector("#shF").onclick=()=>{ const d=document.createElement("div"); d.className="qr-full"; d.innerHTML=`<div class="qr-full-in"><h1>${esc(e.title)}</h1>${qrSVG(link,Math.min(innerWidth,innerHeight)*0.62)}<div class="qr-url">${esc(link)}</div><div class="small muted">Kapatmak için tıklayın</div></div>`; d.onclick=()=>d.remove(); document.body.appendChild(d); };
}

function examState(e){
  const now=Date.now();
  if(!e.published) return ["Taslak",""];
  if(now<tsMs(e.startAt)) return ["Planlandı","info"];
  if(now>tsMs(e.endAt)) return [e.resultsReleased?"Sonuçlar yayında":"Kapandı", e.resultsReleased?"ok":"warn"];
  return ["Açık","acc"];
}

  const apc={}; aps.docs.forEach(d=>{ const x=d.data(); apc[x.examId]=(apc[x.examId]||0)+1; });
  const cards=S.exams.map(e=>{
    const [st,cls]=examState(e); const pts=(e.items||[]).reduce((s,i)=>s+(i.points||0),0);

        <div class="small muted">${qCount(e)} soru${e.plan?.perResident?" (kişiye özel set)":""} · ${fmtNum(qPoints(e))} puan · ${e.durationMin} dk · ${fmtDT(e.startAt)} – ${fmtDT(e.endAt)}${hasPass(e)?` · geçme %${e.passPct}`:""}</div>
        <div class="small muted">${Array.isArray(e.assigned)?`${eligibleResidents(e).length} asistana atandı`:"Tüm asistanlar"} · ${cnt[e.id]||0} katılım${e.shuffleQ?" · soru karıştırma":""}${e.shuffleO?" · şık karıştırma":""}${e.penalty?" · 4Y=1D":""}${e.sequential?" · sıralı":""}${e.fullscreen?" · tam ekran":""}${e.deviceLock?" · tek cihaz":""}</div></div>
