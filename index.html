async function togglePractice(p,onDone){
  const on=!p.practice; const qs=S.questions.filter(q=>q.poolId===p.id), cs=Object.values(S.cases).filter(c=>c.poolId===p.id);
  if(on&&!await confirmDlg("Havuzu alıştırmaya aç",`<p><b>${esc(p.name)}</b> havuzundaki onaylı ${qs.filter(approvedQ).length} soru, doğru cevapları ve açıklamalarıyla birlikte asistanların <b>Alıştırma</b> bölümünde görünecek.</p><p class="small" style="color:var(--warn)">Bu soruları ileride sınavda kullanırsanız asistanlar cevaplarını önceden görmüş olur. Alıştırma için ayrı bir havuz kullanmanız önerilir.</p>`,"Alıştırmaya aç")) return;
  try{ await batchOps([b=>b.update(doc(db,"pools",p.id),{practice:on}), ...qs.map(q=>b=>b.update(doc(db,"questions",q.id),{practice:on&&approvedQ(q)})), ...cs.map(c=>b=>b.update(doc(db,"cases",c.id),{practice:on}))]);
    toast(on?"Havuz alıştırmaya açıldı":"Havuz alıştırmadan kaldırıldı"); onDone&&onDone(); }catch(e){ fail(e); }
}
function exportBank(list){
  if(!window.XLSX) return toast("Excel kütüphanesi yüklenemedi",true);
  const rows=list.map(q=>{ const l=lastHist(q.id); return {"Havuz":q.poolId&&S.pools[q.poolId]?S.pools[q.poolId].name:"","Konu":q.topic||"","Tür":q.type==="open"?"AU":"ÇS","Soru":q.stem,
    ...Object.fromEntries(LET.map((L,j)=>[L,q.type==="open"?"":(q.options||[])[j]||""])),"Doğru":q.type==="open"?"":LET[q.correct]||"","Puan":q.points||1,"Açıklama":q.explanation||"",
    "Vaka":q.caseId&&S.cases[q.caseId]?(S.cases[q.caseId].title||"(vaka)"):"","Görsel":q.imageId?"var":"","Durum":q.status==="pending"?"Onay bekliyor":q.status==="rejected"?"Reddedildi":"Onaylı","Yazar":q.author||"",
    "Kullanıldığı sınav":S.qhist?(S.qhist[q.id]||[]).length:"","Son doğru oranı %":l?Math.round(l.p):"","Son ayırt edicilik":l&&l.d!=null?Math.round(l.d*100)/100:"","Kimlik":q.id}; });
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"Soru":"—"}]); ws["!cols"]=[{wch:16},{wch:14},{wch:5},{wch:60},{wch:18},{wch:18},{wch:18},{wch:18},{wch:18},{wch:6},{wch:5},{wch:40}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Sorular");
  XLSX.writeFile(wb,`Soru bankası ${new Date().toLocaleDateString("tr-TR").replace(/\./g,"-")}.xlsx`);
}

/* =====================================================================
   YÖNETİCİ / SORU YAZARI — SORU BANKASI
   ===================================================================== */
async function viewBank(){
  paint(`<div class="spinner"></div>`);
  await loadBank();
  const isA=S.mode==="admin", isAu=S.mode==="author";
  let filt="", topicF="", typeF="", stF=isAu?"mine":"", hsF="", poolF=lsGet("bankPool")||"";
  if(poolF && poolF!==NOPOOL && !S.pools[poolF]) poolF="";
  const sel=new Set();
  const nPend=S.questions.filter(q=>q.status==="pending").length;
  paint(`<div class="page-head"><div><h1>Soru Bankası</h1><div class="sub" id="bcount"></div></div>
    <div class="row">${isA?`<button class="btn" id="exp">Excel'e aktar</button>`:""}<button class="btn" id="imp">Excel'den içe aktar</button><button class="btn" id="newCase">+ Vaka</button><button class="btn primary" id="newQ">+ Soru</button></div></div>
    ${isAu?`<div class="note">Soru yazarı olarak eklediğiniz sorular yönetici onayından sonra sınavlarda kullanılabilir. Onay bekleyen veya reddedilen kendi sorularınızı düzenleyebilirsiniz.</div>`:""}
    ${isA&&nPend?`<div class="note" style="background:var(--warn-soft)"><b>${nPend} soru</b> onay bekliyor. <a href="#" id="goPend">Göster</a></div>`:""}
    <div class="pools" id="pools"></div>
    <div class="toolbar">${isA?`<label class="check selall"><input type="checkbox" id="selAllCb"> <span id="selAllLbl">Tümünü seç</span></label>`:""}<input type="search" id="bf" placeholder="Soru, vaka veya konu ara…">
      <select id="bt"><option value="">Tüm konular</option>${topics().map(t=>`<option>${esc(t)}</option>`).join("")}</select>
      <select id="by"><option value="">Tüm türler</option><option value="mcq">Çoktan seçmeli</option><option value="open">Açık uçlu</option></select>
      <select id="bs">${isAu?`<option value="mine" selected>Benim sorularım</option><option value="">Tüm sorular</option>`:`<option value="">Tüm durumlar</option><option value="pending">Onay bekleyen (${nPend})</option><option value="rejected">Reddedilen</option><option value="approved">Onaylı</option>`}</select>
      ${isA?`<select id="bh"><option value="">İstatistik: tümü</option><option value="weak">Zayıf ayırt edici (&lt;0,20)</option><option value="hard">Çok zor (&lt;%30)</option><option value="easy">Çok kolay (&gt;%85)</option><option value="unused">Hiç kullanılmamış</option></select>`:""}</div>
    <div class="selbar hidden" id="selbar"></div>
    <div class="list" id="blist"></div>`);
  const stOk=q=>!stF||(stF==="mine"?q.author===S.email:stF==="approved"?approvedQ(q):q.status===stF);
  const hsOk=q=>{ if(!hsF) return true; const l=lastHist(q.id); if(hsF==="unused") return !l; if(!l) return false; return hsF==="weak"?(l.d!=null&&l.d<0.2):hsF==="hard"?l.p<30:l.p>85; };
  const vis=q=>(!poolF||poolOf(q)===poolF)&&(!topicF||q.topic===topicF)&&(!typeF||(q.type||"mcq")===typeF)&&stOk(q)&&hsOk(q)&&(!filt||trLower(q.stem+" "+(q.topic||"")+" "+(S.cases[q.caseId]?.title||"")+" "+(S.cases[q.caseId]?.text||"")).includes(filt));
  const canEdit=q=>isA||(isAu&&q.author===S.email&&q.status!=="approved");
  const qRow=q=>`<div class="qitem">${isA?`<input type="checkbox" class="qcheck" data-sel="${q.id}" ${sel.has(q.id)?"checked":""} aria-label="Seç">`:""}<div class="body"><div class="qmeta">${!poolF&&q.poolId&&S.pools[q.poolId]?`<span class="badge acc">${esc(poolName(q.poolId))}</span>`:""}${STATUS_B(q)}<span class="badge ${q.type==="open"?"warn":""}">${q.type==="open"?"Açık uçlu":"Çoktan seçmeli"}</span>${q.topic?`<span class="badge">${esc(q.topic)}</span>`:""}<span class="badge">${q.points||1} puan</span>${q.type!=="open"?`<span class="badge ok">Doğru: ${LET[q.correct]}</span>`:""}${q.practice?`<span class="badge info">Alıştırmada</span>`:""}${isA?qhistBadge(q.id):""}</div>
    <div class="stem">${esc(q.stem)}</div>${imgTag(q.imageId,true)}${dcmTag(q.dicomId,true)}${q.status==="rejected"&&q.rejectReason?`<div class="small" style="color:var(--bad);margin-top:4px">Ret gerekçesi: ${esc(q.rejectReason)}</div>`:""}</div>
    <div class="row" style="flex-wrap:nowrap">${isA&&q.status==="pending"?`<button class="btn sm primary" data-apq="${q.id}">Onayla</button><button class="btn sm" data-rjq="${q.id}">Reddet</button>`:""}${canEdit(q)?`<button class="btn sm" data-eq="${q.id}">Düzenle</button>`:""}${isA?`<button class="btn sm ghost" data-dup="${q.id}" title="Kopyala">⧉</button>`:""}${canEdit(q)?`<button class="btn sm ghost danger" data-dq="${q.id}" title="Sil">✕</button>`:""}</div></div>`;

  function drawPools(){
    const cnt={}; S.questions.forEach(q=>{ const p=poolOf(q); cnt[p]=(cnt[p]||0)+1; });
    const chip=(id,label,n,prc)=>`<button class="chip ${poolF===id?"on":""}" data-pool="${id}">${esc(label)}${prc?`<span class="pdot" title="Alıştırmaya açık"></span>`:""}<span class="n">${n||0}</span></button>`;
    const cur=poolF&&poolF!==NOPOOL?S.pools[poolF]:null;
    document.getElementById("pools").innerHTML=chip("","Tüm sorular",S.questions.length)+poolList().map(p=>chip(p.id,p.name,cnt[p.id],p.practice)).join("")
      +(cnt[NOPOOL]||poolF===NOPOOL?chip(NOPOOL,"Havuzsuz",cnt[NOPOOL]):"")+(isA?`<button class="chip add" id="addPool">+ Yeni havuz</button>`:"")
      +(cur&&isA?`<span class="pool-act"><button class="btn sm ghost" id="prcPool">${cur.practice?"Alıştırmadan kaldır":"Alıştırmaya aç"}</button><button class="btn sm ghost" id="renPool">Yeniden adlandır</button><button class="btn sm ghost danger" id="delPool">Havuzu sil</button></span>`:"");
    document.querySelectorAll("#pools [data-pool]").forEach(b=>b.onclick=()=>{ poolF=b.dataset.pool; lsSet("bankPool",poolF); sel.clear(); drawPools(); draw(); });
    document.getElementById("addPool")?.addEventListener("click",async()=>{ const id=await newPoolDlg(); if(id){ poolF=id; lsSet("bankPool",id); sel.clear(); drawPools(); draw(); toast("Havuz oluşturuldu"); } });
    document.getElementById("prcPool")?.addEventListener("click",()=>togglePractice(cur,()=>viewBank()));
    document.getElementById("renPool")?.addEventListener("click",async()=>{ const n=await promptDlg("Havuzu yeniden adlandır","Havuz adı",cur.name); if(!n) return;
      try{ await updateDoc(doc(db,"pools",cur.id),{name:n}); S.pools[cur.id].name=n; drawPools(); draw(); toast("Kaydedildi"); }catch(e){ fail(e); } });
    document.getElementById("delPool")?.addEventListener("click",()=>deletePool(cur));
  }
  async function deletePool(p){
    const qs=S.questions.filter(q=>q.poolId===p.id), cs=Object.values(S.cases).filter(c=>c.poolId===p.id);
    const m=modal(`<div class="modal-h"><h2>Havuzu sil</h2></div><div class="modal-b"><p style="margin-top:0"><b>${esc(p.name)}</b> havuzunda ${qs.length} soru${cs.length?` ve ${cs.length} vaka`:""} var.</p>
      ${qs.length||cs.length?`<label class="check" style="margin-bottom:8px"><input type="radio" name="dm" value="keep" checked> Soruları “Havuzsuz”a taşı, yalnız havuzu sil</label>
      <label class="check"><input type="radio" name="dm" value="all"> <span>Havuzu <b style="color:var(--bad)">içindeki tüm sorularla birlikte</b> sil</span></label>`:""}
      <p class="small muted">Daha önce kaydedilmiş sınavlar etkilenmez.</p></div>
      <div class="modal-f"><button class="btn" data-close>Vazgeç</button><button class="btn danger" id="dp">Sil</button></div>`,"narrow");
    m.el.querySelector("#dp").onclick=async()=>{
      const all=m.el.querySelector('[name=dm][value=all]')?.checked;
      try{ m.el.querySelector("#dp").disabled=true;
        await batchOps([...qs.map(q=>b=>all?b.delete(doc(db,"questions",q.id)):b.update(doc(db,"questions",q.id),{poolId:null,practice:false})),
          ...cs.map(c=>b=>all?b.delete(doc(db,"cases",c.id)):b.update(doc(db,"cases",c.id),{poolId:null,practice:false})), b=>b.delete(doc(db,"pools",p.id))]);
        m.close(); lsSet("bankPool",""); toast("Havuz silindi"); viewBank(); }catch(e){ fail(e); }
    };
  }
  const approve=async ids=>{ const qs=S.questions.filter(q=>ids.includes(q.id));
    try{ await batchOps(qs.map(q=>b=>b.update(doc(db,"questions",q.id),{status:"approved",rejectReason:null,reviewedBy:S.email,reviewedAt:serverTimestamp(),practice:!!S.pools[q.poolId]?.practice}))); toast(`${qs.length} soru onaylandı`); viewBank(); }catch(e){ fail(e); } };
  function drawSel(){
    if(!isA) return;
    const vq=S.questions.filter(vis), nSel=vq.filter(q=>sel.has(q.id)).length, cb=document.getElementById("selAllCb");
    cb.checked=vq.length>0&&nSel===vq.length; cb.indeterminate=nSel>0&&nSel<vq.length; cb.disabled=!vq.length;
    document.getElementById("selAllLbl").textContent=vq.length?`Tümünü seç (${vq.length})`:"Tümünü seç";
    const bar=document.getElementById("selbar"); bar.classList.toggle("hidden",!sel.size); if(!sel.size){ bar.innerHTML=""; return; }
    const visN=vq.length, pendSel=S.questions.filter(q=>sel.has(q.id)&&q.status==="pending").length;
    bar.innerHTML=`<b>${sel.size} soru seçili</b>${sel.size<visN?`<button class="btn sm ghost" id="selAllBar">Tümünü seç (${visN})</button>`:""}<span class="grow"></span>
      ${pendSel?`<button class="btn sm primary" id="apSel">Onayla (${pendSel})</button>`:""}
      <select id="mvp" style="width:auto">${poolOptions("",{none:"Havuzsuz",withNew:true}).replace('<option value="">','<option value="" disabled selected hidden>Havuza taşı…</option><option value="">')}</select>
      <button class="btn sm primary" id="mvGo">Taşı</button><button class="btn sm" id="expSel">Excel'e aktar</button><button class="btn sm danger" id="delSel">Sil</button><button class="btn sm ghost" id="clrSel">Seçimi kaldır</button>`;
    const s=document.getElementById("mvp"); s.selectedIndex=0; bindPoolSelect(s);
    document.getElementById("apSel")?.addEventListener("click",()=>approve(S.questions.filter(q=>sel.has(q.id)&&q.status==="pending").map(q=>q.id)));
    document.getElementById("mvGo").onclick=async()=>{ if(s.selectedIndex===0) return toast("Hedef havuzu seçin",true);
      try{ const r=await moveToPool(sel,s.value||null); toast(`${r.n} soru “${poolName(s.value)}” havuzuna taşındı${r.extra?` (vaka bütünlüğü için +${r.extra} soru)`:""}`); sel.clear(); viewBank(); }catch(e){ fail(e); } };
    document.getElementById("expSel").onclick=()=>exportBank(S.questions.filter(q=>sel.has(q.id)));
    document.getElementById("delSel").onclick=async()=>{ if(!await confirmDlg("Seçilenleri sil",`<p>${sel.size} soru bankadan silinir. Kaydedilmiş sınavlar etkilenmez.</p>`,"Sil",true)) return;
      try{ await batchOps([...sel].map(id=>b=>b.delete(doc(db,"questions",id)))); toast("Silindi"); sel.clear(); viewBank(); }catch(e){ fail(e); } };
    document.getElementById("clrSel").onclick=()=>{ sel.clear(); draw(); };
    document.getElementById("selAllBar")?.addEventListener("click",()=>{ S.questions.filter(vis).forEach(q=>sel.add(q.id)); draw(); });
  }
  function draw(){
    const list=S.questions.filter(vis);
    const blocks=bankBlocks(list);
    const emptyCases=isA&&!stF&&!hsF?Object.values(S.cases).filter(c=>!S.questions.some(q=>q.caseId===c.id)&&(!poolF||(c.poolId&&S.pools[c.poolId]?c.poolId:NOPOOL)===poolF)&&!topicF&&!typeF&&(!filt||trLower(c.title+" "+c.text).includes(filt))).map(c=>({kind:"case",c,qs:[]})):[];
    // bir havuz seçiliyken eklenme sırası (1. soru üstte); "Tüm sorular"da en yeni üstte
    const all=poolF?[...blocks,...emptyCases]:[...blocks,...emptyCases].reverse();
    const scope=poolF?S.questions.filter(q=>poolOf(q)===poolF).length:S.questions.length;
    document.getElementById("bcount").textContent=(poolF?`${poolName(poolF===NOPOOL?null:poolF)} · ${scope} soru`:`${S.questions.length} soru · ${Object.keys(S.cases).length} vaka · ${poolList().length} havuz`)+(list.length!==scope?` · ${list.length} gösteriliyor`:"");
    const caseEdit=c=>isA||(isAu&&c.author===S.email&&c.status!=="approved");
    document.getElementById("blist").innerHTML=all.length?all.map(b=>b.kind==="q"?`<div class="card">${qRow(b.q)}</div>`:
      `<div class="case-card"><div class="case-head">${isA&&b.qs.length?`<input type="checkbox" class="qcheck" data-selcase="${b.c.id}" ${b.qs.every(q=>sel.has(q.id))?"checked":""} aria-label="Vakayı seç">`:""}<div class="grow" style="min-width:0"><div class="qmeta">${!poolF&&b.c.poolId&&S.pools[b.c.poolId]?`<span class="badge acc">${esc(poolName(b.c.poolId))}</span>`:""}${STATUS_B(b.c)}<span class="badge info">Vaka</span><span class="badge">${b.qs.length} soru</span></div>
        <b>${esc(b.c.title||"(başlıksız vaka)")}</b><div class="txt">${esc(b.c.text)}</div>${imgTag(b.c.imageId,true)}${dcmTag(b.c.dicomId,true)}</div>
        <div class="row" style="flex-wrap:nowrap">${isA&&b.c.status==="pending"?`<button class="btn sm primary" data-apc="${b.c.id}">Onayla</button>`:""}${caseEdit(b.c)?`<button class="btn sm" data-addq="${b.c.id}">+ Soru</button><button class="btn sm" data-ec="${b.c.id}">Düzenle</button>`:""}${isA?`<button class="btn sm ghost danger" data-dc="${b.c.id}">✕</button>`:""}</div></div>
        <div class="case-sub">${b.qs.map(qRow).join("")}</div></div>`).join("")
      :`<div class="card empty">${!S.questions.length?"Soru bankası boş. “+ Soru” ile başlayın veya Excel'den toplu aktarın.":poolF&&!scope?"Bu havuz boş. “+ Soru” veya “Excel'den içe aktar” ile bu havuza soru ekleyin.":"Eşleşen soru yok."}</div>`;
    hydrateImages(document.getElementById("blist"));
    $app.querySelectorAll("[data-sel]").forEach(c=>c.onchange=()=>{ c.checked?sel.add(c.dataset.sel):sel.delete(c.dataset.sel); drawSel(); const cb=c.closest(".case-card")?.querySelector("[data-selcase]"); if(cb) cb.checked=S.questions.filter(q=>q.caseId===cb.dataset.selcase&&vis(q)).every(q=>sel.has(q.id)); });
    $app.querySelectorAll("[data-selcase]").forEach(c=>c.onchange=()=>{ S.questions.filter(q=>q.caseId===c.dataset.selcase&&vis(q)).forEach(q=>c.checked?sel.add(q.id):sel.delete(q.id)); draw(); });
    $app.querySelectorAll("[data-hist]").forEach(b=>b.onclick=()=>showHist(b.dataset.hist));
    $app.querySelectorAll("[data-apq]").forEach(b=>b.onclick=()=>approve([b.dataset.apq]));
    $app.querySelectorAll("[data-apc]").forEach(b=>b.onclick=async()=>{ try{ await updateDoc(doc(db,"cases",b.dataset.apc),{status:"approved"}); await approve(S.questions.filter(q=>q.caseId===b.dataset.apc&&q.status==="pending").map(q=>q.id)); }catch(e){ fail(e); } });
    $app.querySelectorAll("[data-rjq]").forEach(b=>b.onclick=async()=>{ const r=await promptDlg("Soruyu reddet","Ret gerekçesi (soru yazarı görür)","","örn. Kaynak eksik, B şıkkı da doğru olabilir"); if(!r) return;
      try{ await updateDoc(doc(db,"questions",b.dataset.rjq),{status:"rejected",rejectReason:r,reviewedBy:S.email,reviewedAt:serverTimestamp(),practice:false}); toast("Soru reddedildi"); viewBank(); }catch(e){ fail(e); } });
    $app.querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>editQuestion(S.questions.find(q=>q.id===b.dataset.eq)));
    $app.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>{ const q=S.questions.find(x=>x.id===b.dataset.dup); editQuestion({...q,id:null}); });
    $app.querySelectorAll("[data-dq]").forEach(b=>b.onclick=async()=>{ if(!await confirmDlg("Soruyu sil","<p>Soru bankadan silinir. Daha önce kaydedilmiş sınavlardaki kopyası etkilenmez.</p>","Sil",true)) return;
      try{ await deleteDoc(doc(db,"questions",b.dataset.dq)); toast("Silindi"); viewBank(); }catch(e){ fail(e); } });
    $app.querySelectorAll("[data-addq]").forEach(b=>b.onclick=()=>editQuestion({caseId:b.dataset.addq,poolId:S.cases[b.dataset.addq]?.poolId||null}));
    $app.querySelectorAll("[data-ec]").forEach(b=>b.onclick=()=>editCase(S.cases[b.dataset.ec]));
    $app.querySelectorAll("[data-dc]").forEach(b=>b.onclick=async()=>{ const qs=S.questions.filter(q=>q.caseId===b.dataset.dc);
      if(!await confirmDlg("Vakayı sil",`<p>Vaka${qs.length?` ve bağlı <b>${qs.length} soru</b>`:""} bankadan silinir.</p>`,"Sil",true)) return;
      try{ const w=writeBatch(db); qs.forEach(q=>w.delete(doc(db,"questions",q.id))); w.delete(doc(db,"cases",b.dataset.dc)); await w.commit(); toast("Silindi"); viewBank(); }catch(e){ fail(e); } });
    drawSel();
  }
  drawPools(); draw();
  if(isA) computeQHist().then(()=>{ if(S.view==="bank"&&document.getElementById("blist")) draw(); }).catch(e=>console.error(e));
  const curPool=()=>poolF&&poolF!==NOPOOL?poolF:null;
  document.getElementById("bf").oninput=e=>{ filt=trLower(e.target.value); draw(); };
  document.getElementById("bt").onchange=e=>{ topicF=e.target.value; draw(); };
  document.getElementById("by").onchange=e=>{ typeF=e.target.value; draw(); };
  document.getElementById("bs").onchange=e=>{ stF=e.target.value; sel.clear(); draw(); };
  document.getElementById("bh")?.addEventListener("change",e=>{ hsF=e.target.value; sel.clear(); if(hsF&&!S.qhist) toast("İstatistikler hesaplanıyor…"); draw(); });
  document.getElementById("goPend")?.addEventListener("click",e=>{ e.preventDefault(); stF="pending"; document.getElementById("bs").value="pending"; poolF=""; drawPools(); draw(); });
  document.getElementById("selAllCb")?.addEventListener("change",e=>{ const vq=S.questions.filter(vis); if(e.target.checked) vq.forEach(q=>sel.add(q.id)); else vq.forEach(q=>sel.delete(q.id)); draw(); });
  document.getElementById("exp")?.addEventListener("click",()=>exportBank(S.questions.filter(vis)));
  document.getElementById("newQ").onclick=()=>editQuestion({poolId:curPool()});
  document.getElementById("newCase").onclick=()=>editCase({poolId:curPool()});
  document.getElementById("imp").onclick=()=>importDialog(curPool());
}

function imageField(cur,dcm){
  return `<div class="field"><label class="f">Görsel (EKG, grafi vb. — isteğe bağlı)</label>
    <div id="imgPrev">${cur?imgTag(cur,true):""}</div>
    <div class="row"><label class="btn sm">Görsel seç<input type="file" accept="image/*" id="imgIn" hidden></label><button class="btn sm ghost danger ${cur?"":"hidden"}" id="imgDel" type="button">Görseli kaldır</button></div></div>
    <div class="field"><label class="f">BT / MR serisi (DICOM — isteğe bağlı)</label>
    <div id="dcmPrev">${dcm?dcmTag(dcm,true):""}</div>
    <div class="row"><button class="btn sm" id="dcmUp" type="button">DICOM yükle</button><button class="btn sm ${S.mode==="admin"?"":"hidden"}" id="dcmPick" type="button">Arşivden seç</button><button class="btn sm ghost danger ${dcm?"":"hidden"}" id="dcmDel" type="button">Seriyi kaldır</button></div></div>`;
}
function bindImageField(root, state){
  root.querySelector("#imgIn").onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    try{ state.newImg=await compressImage(f); state.imageId=null; root.querySelector("#imgPrev").innerHTML=`<img class="q-img thumb" src="${state.newImg}">`; root.querySelector("#imgDel").classList.remove("hidden"); state.onChange&&state.onChange(); }
    catch(err){ fail(err,"Görsel işlenemedi"); } };
  root.querySelector("#imgDel").onclick=()=>{ state.newImg=null; state.imageId=null; root.querySelector("#imgPrev").innerHTML=""; root.querySelector("#imgDel").classList.add("hidden"); state.onChange&&state.onChange(); };
  const setD=id=>{ state.dicomId=id||null; root.querySelector("#dcmPrev").innerHTML=id?dcmTag(id,true):""; root.querySelector("#dcmDel").classList.toggle("hidden",!id); hydrateDicom(root); state.onChange&&state.onChange(); };
  root.querySelector("#dcmUp").onclick=()=>dicomUploadDlg(id=>setD(id));
  root.querySelector("#dcmPick").onclick=()=>dicomPickDlg(id=>setD(id));
  root.querySelector("#dcmDel").onclick=()=>setD(null);
}
async function persistImage(state){
  if(state.newImg){ const id=newId(); await setDoc(doc(db,"images",id),{data:state.newImg,createdAt:serverTimestamp()}); imgCache.set(id,Promise.resolve(state.newImg)); return id; }
  return state.imageId||null;
}

function editQuestion(q){
  const isNew=!q.id; const st={imageId:q.imageId||null,newImg:null,dicomId:q.dicomId||null};
  let type=q.type||"mcq";
  const opts=[...(q.options||[]),"","","","",""].slice(0,5);
  const caseOpts=Object.values(S.cases).map(c=>`<option value="${c.id}" ${q.caseId===c.id?"selected":""}>${esc(c.title||c.text.slice(0,50))}${c.poolId&&S.pools[c.poolId]?` (${esc(poolName(c.poolId))})`:""}</option>`).join("");
  const m=modal(`<div class="modal-h"><h2>${isNew?"Yeni soru":"Soruyu düzenle"}</h2><button class="btn sm ghost" data-close>✕</button></div>
    <div class="modal-b">
      <div class="grid2">
        <div class="field"><label class="f">Havuz</label><select id="q_pool">${poolOptions(q.poolId&&S.pools[q.poolId]?q.poolId:"",{withNew:S.mode==="admin"})}</select><div class="small muted hidden" id="poolNote" style="margin-top:4px">Vakaya bağlı soru, vakanın havuzunda durur.</div></div>
        <div class="field"><label class="f">Bağlı vaka</label><select id="q_case"><option value="">— Bağımsız soru —</option>${caseOpts}</select></div>
      </div>
      <div class="grid3">
        <div class="field"><label class="f">Tür</label><select id="q_type"><option value="mcq">Çoktan seçmeli</option><option value="open" ${type==="open"?"selected":""}>Açık uçlu</option></select></div>
        <div class="field"><label class="f">Konu</label><input type="text" id="q_topic" list="tlist" value="${esc(q.topic||"")}" placeholder="örn. Toksikoloji"><datalist id="tlist">${topics().map(t=>`<option value="${esc(t)}">`).join("")}</datalist></div>
        <div class="field"><label class="f">Puan</label><input type="number" id="q_pts" min="0.5" step="0.5" value="${q.points||1}"></div>
      </div>
      <div class="field"><label class="f">Soru kökü</label><textarea id="q_stem" style="min-height:110px">${esc(q.stem||"")}</textarea></div>
      ${imageField(q.imageId,q.dicomId)}
      <div id="mcqBox" class="${type==="open"?"hidden":""}"><label class="f">Şıklar <span class="muted" style="font-weight:400">(doğru şıkkı işaretleyin; boş şıklar atlanır)</span></label>
        ${opts.map((o,j)=>`<div class="optedit"><input type="radio" name="cor" value="${j}" ${(q.correct??0)===j?"checked":""} title="Doğru cevap"><span class="L">${LET[j]}</span><input type="text" data-opt="${j}" value="${esc(o)}"></div>`).join("")}</div>
      <div class="field" style="margin-top:12px"><label class="f" id="explLbl">${type==="open"?"Model cevap / değerlendirme notu":"Açıklama (sonuçta asistana gösterilir)"}</label><textarea id="q_expl">${esc(q.explanation||"")}</textarea></div>
    </div>
    <div class="modal-f"><button class="btn" data-close>Vazgeç</button><button class="btn primary" id="qsave">Kaydet</button></div>`);
  hydrateImages(m.el); bindImageField(m.el, st);
  const poolSel=m.el.querySelector("#q_pool"), caseSel=m.el.querySelector("#q_case");
  bindPoolSelect(poolSel);
  const syncCase=()=>{ const c=S.cases[caseSel.value]; poolSel.disabled=!!c; m.el.querySelector("#poolNote").classList.toggle("hidden",!c);
    if(c) poolSel.value=c.poolId&&S.pools[c.poolId]?c.poolId:""; };
  caseSel.onchange=syncCase; syncCase();
  m.el.querySelector("#q_type").onchange=e=>{ type=e.target.value; m.el.querySelector("#mcqBox").classList.toggle("hidden",type==="open");
    m.el.querySelector("#explLbl").textContent=type==="open"?"Model cevap / değerlendirme notu":"Açıklama (sonuçta asistana gösterilir)"; };
  m.el.querySelector("#qsave").onclick=async()=>{
    const stem=m.el.querySelector("#q_stem").value.trim(); if(!stem) return toast("Soru kökü boş",true);
    const caseId=caseSel.value||null;
    const data={type,stem,topic:m.el.querySelector("#q_topic").value.trim(),points:Number(m.el.querySelector("#q_pts").value)||1,
      caseId,poolId:caseId?(S.cases[caseId]?.poolId||null):(poolSel.value&&poolSel.value!=="__new"?poolSel.value:null),explanation:m.el.querySelector("#q_expl").value.trim()};
    if(type==="mcq"){
      const raw=[...m.el.querySelectorAll("[data-opt]")].map(i=>i.value.trim()); const corRaw=Number(m.el.querySelector("[name=cor]:checked")?.value??0);
      if(!raw[corRaw]) return toast("İşaretli doğru şık boş",true);
      const kept=raw.map((t,j)=>({t,j})).filter(x=>x.t); if(kept.length<2) return toast("En az iki şık gerekli",true);
      data.options=kept.map(x=>x.t); data.correct=kept.findIndex(x=>x.j===corRaw);
    } else { data.options=null; data.correct=null; }
    try{
      const btn=m.el.querySelector("#qsave"); btn.disabled=true;
      data.imageId=await persistImage(st); data.dicomId=st.dicomId||null;
      const id=q.id||newId(); if(!q.id) data.createdAt=serverTimestamp(); data.updatedAt=serverTimestamp();
      if(S.mode==="author"){ data.status="pending"; data.author=S.email; data.practice=false; data.rejectReason=null; }
      else data.practice=!!S.pools[data.poolId]?.practice&&approvedQ({...q,...data});
      await setDoc(doc(db,"questions",id),data,{merge:true}); m.close(); toast(S.mode==="author"?"Soru kaydedildi; yönetici onayına gönderildi":"Soru kaydedildi"); viewBank();
    }catch(e){ fail(e,"Kaydedilemedi"); m.el.querySelector("#qsave").disabled=false; }
  };
}
function editCase(c){
  const st={imageId:c.imageId||null,newImg:null,dicomId:c.dicomId||null};
  const qs=c.id?S.questions.filter(q=>q.caseId===c.id):[];
  const m=modal(`<div class="modal-h"><h2>${c.id?"Vakayı düzenle":"Yeni vaka"}</h2><button class="btn sm ghost" data-close>✕</button></div>
    <div class="modal-b"><p class="small muted" style="margin-top:0">Vaka metni, bağlı her sorunun üstünde gösterilir. Sınavda vakanın soruları birlikte kalır.</p>
      <div class="field"><label class="f">Havuz</label><select id="c_pool">${poolOptions(c.poolId&&S.pools[c.poolId]?c.poolId:"",{withNew:S.mode==="admin"})}</select>
        ${qs.length?`<div class="small muted" style="margin-top:4px">Havuzu değiştirirseniz bağlı ${qs.length} soru da taşınır.</div>`:""}</div>
      <div class="field"><label class="f">Başlık</label><input type="text" id="c_title" value="${esc(c.title||"")}" placeholder="örn. 68 yaşında göğüs ağrısı"></div>
      <div class="field"><label class="f">Vaka metni</label><textarea id="c_text" style="min-height:160px">${esc(c.text||"")}</textarea></div>
      ${imageField(c.imageId,c.dicomId)}</div>
    <div class="modal-f"><button class="btn" data-close>Vazgeç</button><button class="btn primary" id="csave">Kaydet</button></div>`);
  hydrateImages(m.el); bindImageField(m.el, st); bindPoolSelect(m.el.querySelector("#c_pool"));
  m.el.querySelector("#csave").onclick=async()=>{
    const text=m.el.querySelector("#c_text").value.trim(); if(!text) return toast("Vaka metni boş",true);
    const pv=m.el.querySelector("#c_pool").value; const poolId=pv&&pv!=="__new"?pv:null;
    try{ const imageId=await persistImage(st); const id=c.id||newId();
      const au=S.mode==="author", prc=!au&&!!S.pools[poolId]?.practice;
      await setDoc(doc(db,"cases",id),{title:m.el.querySelector("#c_title").value.trim(),text,imageId,dicomId:st.dicomId||null,poolId,practice:prc,...(au?{status:"pending",author:S.email}:{}),...(c.id?{}:{createdAt:serverTimestamp()})},{merge:true});
      const moved=qs.filter(q=>(q.poolId||null)!==poolId);
      if(moved.length&&!au) await batchOps(moved.map(q=>b=>b.update(doc(db,"questions",q.id),{poolId,practice:prc&&approvedQ(q)})));
      m.close(); toast("Vaka kaydedildi"); viewBank(); }catch(e){ fail(e); }
  };
}

function importDialog(defPool){
  const m=modal(`<div class="modal-h"><h2>Excel'den soru aktar</h2><button class="btn sm ghost" data-close>✕</button></div>
    <div class="modal-b"><p style="margin-top:0">Şablonu indirin, her satıra bir soru yazın ve yükleyin. Görseller ve vakalar sonradan arayüzden eklenir.</p>
      <p class="small muted">Sütunlar: <span class="mono">Konu · Tür (ÇS/AU) · Soru · A · B · C · D · E · Doğru (A–E) · Puan · Açıklama</span>. İsteğe bağlı <span class="mono">Havuz</span> sütunu doluysa soru o havuza gider${S.mode==="admin"?" (yoksa oluşturulur)":""}; boşsa aşağıda seçtiğiniz havuza.</p>
      <div class="field"><label class="f">Hangi havuza aktarılsın?</label><select id="ip">${poolOptions(defPool||"",{withNew:S.mode==="admin"})}</select></div>
      <div class="row"><button class="btn" id="tpl">Şablonu indir</button><label class="btn primary">Dosya seç<input type="file" id="xf" accept=".xlsx,.xls,.csv" hidden></label></div>
      <div id="impRes" style="margin-top:14px"></div></div>`);
  const ip=m.el.querySelector("#ip"); bindPoolSelect(ip);
  m.el.querySelector("#tpl").onclick=()=>{
    const ws=XLSX.utils.aoa_to_sheet([["Konu","Tür","Soru","A","B","C","D","E","Doğru","Puan","Açıklama"],
      ["Toksikoloji","ÇS","Parasetamol zehirlenmesinde antidot hangisidir?","Flumazenil","N-asetilsistein","Nalokson","Fomepizol","Atropin","B",1,"NAC glutatyon depolarını yeniler."],
      ["Resüsitasyon","AU","VF'de ilk 3 dakikadaki yaklaşımı sırasıyla yazınız.","","","","","","",5,"Defibrilasyon, KPR, adrenalin zamanlaması…"]]);
    ws["!cols"]=[{wch:14},{wch:6},{wch:50},{wch:16},{wch:16},{wch:16},{wch:16},{wch:16},{wch:7},{wch:6},{wch:40}];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Sorular"); XLSX.writeFile(wb,"soru-sablonu.xlsx");
  };
  m.el.querySelector("#xf").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const wb=XLSX.read(await f.arrayBuffer()); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      const norm=s=>trLower(String(s).trim()); const pick=(r,...names)=>{ for(const k of Object.keys(r)) if(names.includes(norm(k))) return String(r[k]).trim(); return ""; };
      const ok=[], errs=[];
      rows.forEach((r,i)=>{
        const stem=pick(r,"soru","soru kökü"); if(!stem) return;
        const typ=norm(pick(r,"tür","tip"))==="au"||norm(pick(r,"tür","tip")).startsWith("açık")?"open":"mcq";
        const q={type:typ,stem,topic:pick(r,"konu"),points:Number(pick(r,"puan").replace(",","."))||1,explanation:pick(r,"açıklama","aciklama"),caseId:null,imageId:null,_pool:pick(r,"havuz")};
        if(typ==="mcq"){
          const raw=LET.map(l=>pick(r,trLower(l))); const corL=pick(r,"doğru","dogru","cevap").toUpperCase(); const cj=LET.indexOf(corL);
          const kept=raw.map((t,j)=>({t,j})).filter(x=>x.t);
          if(cj<0||!raw[cj]){ errs.push(`Satır ${i+2}: doğru şık geçersiz`); return; }
          if(kept.length<2){ errs.push(`Satır ${i+2}: en az iki şık gerekli`); return; }
          q.options=kept.map(x=>x.t); q.correct=kept.findIndex(x=>x.j===cj);
        } else { q.options=null; q.correct=null; }
        ok.push(q);
      });
      m.el.querySelector("#impRes").innerHTML=`<div class="card pad" style="box-shadow:none"><b>${ok.length} soru aktarılmaya hazır</b>${errs.length?`<div class="small" style="color:var(--bad);margin-top:6px">${errs.map(esc).join("<br>")}</div>`:""}
        ${ok.length?`<div class="row" style="margin-top:10px"><button class="btn primary" id="doImp">Aktar</button></div>`:""}</div>`;
      m.el.querySelector("#doImp")?.addEventListener("click", async()=>{
        const poolId=ip.value&&ip.value!=="__new"?ip.value:null;
        try{ m.el.querySelector("#doImp").disabled=true; const t0=Date.now(), au=S.mode==="author";
          const byName={}; poolList().forEach(p=>byName[trLower(p.name)]=p.id);
          for(const q of ok){ if(q._pool&&!byName[trLower(q._pool)]&&!au) byName[trLower(q._pool)]=await createPool(q._pool); }
          await batchOps(ok.map((q,j)=>{ const {_pool,...rest}=q; const pid=(_pool&&byName[trLower(_pool)])||poolId;
            return b=>b.set(doc(db,"questions",newId()),{...rest,poolId:pid,createdAt:Timestamp.fromMillis(t0+j),...(au?{status:"pending",author:S.email,practice:false}:{practice:!!S.pools[pid]?.practice})}); }));
          m.close(); lsSet("bankPool",poolId||""); toast(`${ok.length} soru “${poolName(poolId)}” havuzuna eklendi`); viewBank(); }catch(err){ fail(err); }
      });
    }catch(err){ fail(err,"Dosya okunamadı"); }
  };
}

      ${ADMIN_EMAILS.map(e=>`<div class="tplrow"><b>${esc(e)}</b></div>`).join("")}</div>`);
  const save=async list=>{ try{ await setDoc(doc(db,"meta","roles"),{authors:list,updatedAt:serverTimestamp()},{merge:true}); roles.authors=list; draw(); toast("Kaydedildi"); }catch(e){ fail(e); } };
  const draw=()=>{ document.getElementById("auList").innerHTML=roles.authors.length?roles.authors.map(e=>`<div class="tplrow"><span class="grow">${esc(e)}</span><button class="btn sm ghost danger" data-rm="${esc(e)}">Kaldır</button></div>`).join(""):`<div class="small muted">Henüz soru yazarı yok.</div>`;

async function viewResidents(){
  paint(`<div class="spinner"></div>`);
  await loadResidents();
  const rows=S.residents.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.email)}</td><td>${r.kidem?r.kidem+". yıl":"—"}</td>
    <td class="num"><button class="btn sm" data-pr="${esc(r.email)}">Gelişim</button><button class="btn sm ghost" data-er="${esc(r.email)}">Düzenle</button><button class="btn sm ghost danger" data-dr="${esc(r.email)}">✕</button></td></tr>`).join("");
  paint(`<div class="page-head"><div><h1>Asistanlar</h1><div class="sub">Yalnız bu listedeki Google hesapları sınavlara girebilir. (${S.residents.length} kişi)</div></div>
    <div class="row"><button class="btn" id="bulk">Toplu ekle</button><button class="btn primary" id="addR">+ Asistan</button></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Ad Soyad</th><th>Google e-posta</th><th>Kıdem</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="4" class="empty">Liste boş. Kendinizi de ekleyerek sınavları asistan gözüyle deneyebilirsiniz.</td></tr>`}</tbody></table></div>`);
  const form=r=>{ const m=modal(`<div class="modal-h"><h2>${r?"Asistanı düzenle":"Asistan ekle"}</h2><button class="btn sm ghost" data-close>✕</button></div>
    <div class="modal-b"><div class="field"><label class="f">Ad Soyad</label><input type="text" id="r_n" value="${esc(r?.name||"")}"></div>
      <div class="field"><label class="f">Google e-posta</label><input type="email" id="r_e" value="${esc(r?.email||"")}" ${r?"disabled":""}></div>
      <div class="field"><label class="f">Kıdem (yıl)</label><select id="r_k"><option value="">—</option>${[1,2,3,4,5].map(k=>`<option ${Number(r?.kidem)===k?"selected":""}>${k}</option>`).join("")}</select></div></div>
    <div class="modal-f"><button class="btn" data-close>Vazgeç</button><button class="btn primary" id="rs">Kaydet</button></div>`,"narrow");
    m.el.querySelector("#rs").onclick=async()=>{ const name=m.el.querySelector("#r_n").value.trim(), email=m.el.querySelector("#r_e").value.trim().toLowerCase(), kidem=Number(m.el.querySelector("#r_k").value)||null;
      if(!name||!/^\S+@\S+\.\S+$/.test(email)) return toast("Ad ve geçerli e-posta gerekli",true);
      try{ await setDoc(doc(db,"residents",email),{name,kidem},{merge:true}); m.close(); toast("Kaydedildi"); viewResidents(); }catch(e){ fail(e); } }; };
  document.getElementById("addR").onclick=()=>form(null);
  $app.querySelectorAll("[data-er]").forEach(b=>b.onclick=()=>form(S.residents.find(r=>r.email===b.dataset.er)));
  $app.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>go("profile",{email:b.dataset.pr}));
  $app.querySelectorAll("[data-dr]").forEach(b=>b.onclick=async()=>{ if(!await confirmDlg("Listeden çıkar",`<p>${esc(b.dataset.dr)} artık sınavlara giremeyecek. Eski sonuçları silinmez.</p>`,"Çıkar",true)) return;
    try{ await deleteDoc(doc(db,"residents",b.dataset.dr)); toast("Çıkarıldı"); viewResidents(); }catch(e){ fail(e); } });
  document.getElementById("bulk").onclick=()=>{
    const m=modal(`<div class="modal-h"><h2>Toplu asistan ekle</h2><button class="btn sm ghost" data-close>✕</button></div>
      <div class="modal-b"><p class="small muted" style="margin-top:0">Her satıra: <span class="mono">Ad Soyad; e-posta; kıdem</span> — virgül, noktalı virgül veya sekme ile ayırabilirsiniz. Excel'den iki-üç sütunu kopyalayıp yapıştırmak yeterli.</p>
      <textarea id="bl" style="min-height:200px" placeholder="Ayşe Yılmaz; ayse.yilmaz@gmail.com; 2"></textarea></div>
      <div class="modal-f"><button class="btn" data-close>Vazgeç</button><button class="btn primary" id="bs">Ekle</button></div>`);
    m.el.querySelector("#bs").onclick=async()=>{
      const lines=m.el.querySelector("#bl").value.split(/\n/).map(l=>l.split(/[;,\t]/).map(s=>s.trim())).filter(p=>p.length>=2);
      const ok=lines.map(p=>({name:p[0],email:(p[1]||"").toLowerCase(),kidem:Number(p[2])||null})).filter(x=>x.name&&/^\S+@\S+\.\S+$/.test(x.email));
      if(!ok.length) return toast("Geçerli satır bulunamadı",true);
      try{ const b=writeBatch(db); ok.forEach(x=>b.set(doc(db,"residents",x.email),{name:x.name,kidem:x.kidem},{merge:true})); await b.commit();
        m.close(); toast(`${ok.length} asistan eklendi${lines.length>ok.length?` · ${lines.length-ok.length} satır atlandı`:""}`); viewResidents(); }catch(e){ fail(e); }
    };
  };
}

async function startAttempt(e){
  let pool=e.items;
  if(e.plan?.perResident){ const ok=new Set(e.items.map(i=>i.qid)), drawn=new Set();
    for(const r of e.plan.rows||[]) shuffle((r.qids||[]).filter(q=>ok.has(q)&&!drawn.has(q))).slice(0,r.n).forEach(q=>drawn.add(q));
    pool=e.items.filter(it=>drawn.has(it.qid)); }
  // grupları oluştur (vaka soruları bitişik kalır)
  const groups=[]; let cur=null;
  for(const it of pool){ if(it.caseId && cur && cur.caseId===it.caseId) cur.q.push(it.qid); else { cur={caseId:it.caseId||null,q:[it.qid]}; groups.push(cur); } }
  const order=(e.shuffleQ?shuffle(groups):groups).flatMap(g=>g.q);
  const optOrder={}; pool.forEach(it=>{ if(it.type==="mcq"){ const idx=it.options.map((_,j)=>j); optOrder[it.qid]=e.shuffleO?shuffle(idx):idx; } });
  await setDoc(doc(db,"attempts",e.id+"_"+S.user.uid),{examId:e.id,uid:S.user.uid,email:S.email,name:S.resident?.name||S.user.displayName||"",
    status:"started",startedAt:serverTimestamp(),order,optOrder,answers:{},flags:{},qtime:{},pos:0,device:e.deviceLock?myDevice():null});
}

const EV_EXTRA={fsexit:"Tam ekrandan çıktı",device:"Başka cihazdan açma denemesi"};
function stopTake(){ if(T){ clearInterval(T.tick); clearTimeout(T.saveT); window.removeEventListener("beforeunload",T.unload); document.removeEventListener("keydown",T.keys);
  document.removeEventListener("visibilitychange",T.vis); window.removeEventListener("blur",T.vis); window.removeEventListener("focus",T.vis);
  document.removeEventListener("fullscreenchange",T.fsch); if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{}); } T=null; }
function flushQ(){ if(!T||T.qStart==null) return; const q=T.order[T.idx]; const s=Math.round((Date.now()-T.qStart)/1000); if(s>0) T.qtime[q]=(T.qtime[q]||0)+s; T.qStart=Date.now(); }

    events:[...(att.events||[])],away:null,deadline:deadlineOf(exam,att),dirty:false,saving:false,done:false};

  T.events.push({type:T.events.length?"reopen":"open",t:Date.now()}); if(T.events.length>300) T.events=T.events.slice(-300);

  $app.innerHTML=`<header class="top"><div class="top-in">

    </div></header>
    <main><div class="take">
      <aside class="card pad" style="position:sticky;top:76px">

        <div class="navgrid" id="nav"></div>
        <div class="legend"><span><i style="background:var(--ink)"></i>Cevaplandı</span>${T.seq?"":`<span><i style="background:var(--warn);border-radius:50%"></i>İşaretli</span>`}</div>
        ${T.seq?`<div class="small" style="margin-top:12px;color:var(--warn)">Sıralı sınav: önceki sorulara geri dönülemez.</div>`:""}
        <div class="small muted" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line-2)">Sınav sırasında başka sekmeye/uygulamaya geçişler saat ve süreyle kaydedilir.</div>

function answered(q){ const a=T.answers[q]; return a!=null && a!==""; }
function drawNav(){
  document.getElementById("nav").innerHTML=T.order.map((q,i)=>`<button class="nb ${answered(q)?"ans":""} ${T.flags[q]?"flag":""} ${i===T.idx?"cur":""}" data-i="${i}" ${T.seq&&i!==T.idx?"disabled":""}>${i+1}</button>`).join("");

}
function drawQ(){
  const q=T.order[T.idx], it=T.byId[q], prev=T.idx>0?T.byId[T.order[T.idx-1]]:null;
  let caseHtml="";
  if(it.caseId){ const c=T.exam.cases[it.caseId]; const cont=prev&&prev.caseId===it.caseId;
    caseHtml=`<div class="case-box"><div class="lbl">Vaka${c.title?": "+esc(c.title):""}${cont?" (devam)":""}</div><div class="txt">${esc(c.text)}</div>${imgTag(c.imageId)}${dcmTag(c.dicomId)}</div>`; }

  if(it.type==="mcq"){

  } else {

  }

      ${T.seq?"":`<button class="btn sm ${T.flags[q]?"":"ghost"}" id="flg">${T.flags[q]?"★ İşaretli":"☆ Sonra bak"}</button>`}</div>
    <div class="q-stem">${esc(it.stem)}</div>${imgTag(it.imageId)}${dcmTag(it.dicomId)}${body}

      <span class="small muted">${it.type==="mcq"?`Klavye: A–E ile seç${T.seq?", → ile ilerle":", ← → ile gez"}`:""}</span>

  const ta=el.querySelector("#oa"); if(ta) ta.oninput=()=>{ T.answers[q]=ta.value; queueSave(); drawNavLight(); };
  el.querySelector("#flg")?.addEventListener("click",()=>{ T.flags[q]=!T.flags[q]; if(!T.flags[q]) delete T.flags[q]; queueSave(); drawNav(); drawQ(); });

async function nextQ(){
  if(!T||T.idx>=T.order.length-1) return;
  if(T.seq){
    if(!answered(T.order[T.idx]) && !await confirmDlg("Boş geçiyorsunuz","<p>Bu soruyu boş bırakıyorsunuz. Sıralı sınavda bu soruya geri dönemezsiniz.</p>","Devam et")) return;
    if(!T) return; flushQ(); T.idx++; T.pos=Math.max(T.pos,T.idx); drawNav(); drawQ(); window.scrollTo({top:0,behavior:"smooth"}); saveNow().catch(()=>{}); return;
  }
  move(1);
}
function drawNavLight(){ const b=document.querySelector(`#nav .nb[data-i="${T.idx}"]`); if(b) b.classList.toggle("ans",answered(T.order[T.idx])); document.getElementById("cnt").textContent=`${T.order.filter(answered).length}/${T.order.length}`; }
function move(d){ if(T.seq&&d<0) return; const n=T.idx+d; if(n<0||n>=T.order.length) return; flushQ(); T.idx=n; drawNav(); drawQ(); window.scrollTo({top:0,behavior:"smooth"}); }
function choose(orig){ const q=T.order[T.idx]; T.answers[q]=orig; queueSave(); drawNav(); drawQ(); }
function setSave(txt){ const s=document.getElementById("sv"); if(s) s.textContent=txt; }
function queueSave(){ T.dirty=true; setSave("Kaydediliyor…"); clearTimeout(T.saveT); T.saveT=setTimeout(saveNow,700); }
async function saveNow(extra={}){
  if(!T) return; clearTimeout(T.saveT);
  const t=T; t.saving=true; t.dirty=false; if(t.qStart!=null) flushQ();
  try{ await updateDoc(doc(db,"attempts",t.exam.id+"_"+S.user.uid),{answers:t.answers,flags:t.flags,events:t.events,qtime:t.qtime,pos:t.pos,updatedAt:serverTimestamp(),...extra}); if(T===t) setSave("Kaydedildi"); }
  catch(e){ t.dirty=true; if(T===t) setSave("Kaydedilemedi — tekrar denenecek"); console.error(e); if(!extra.status) t.saveT=setTimeout(saveNow,4000); throw e; }
  finally{ t.saving=false; }
}
function tick(){
  if(!T) return; const left=T.deadline-Date.now(); const el=document.getElementById("tm");
  const s=Math.max(0,Math.floor(left/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  el.textContent=(h?h+":":"")+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
  el.classList.toggle("low",s<300);
  if(s===300) toast("Son 5 dakika");
  if(left<=0 && !T.done) finish(true);
}
async function finish(auto){
  if(!T||T.done) return;
  if(!auto){
    const empty=T.order.filter(q=>!answered(q)).length, fl=Object.keys(T.flags).length;
    const ok=await confirmDlg("Sınavı bitir",`<p>${empty?`<b style="color:var(--warn)">${empty} soru boş.</b> `:"Tüm sorular cevaplandı. "}${fl?`${fl} soru işaretli. `:""}</p><p>Teslim ettikten sonra cevaplarınızı değiştiremezsiniz.</p>`,"Teslim et");
    if(!ok||!T) return;
  }
  T.done=true; clearInterval(T.tick);
  const exam=T.exam;
  try{ await saveNow({status:"submitted",submittedAt:serverTimestamp()}); }
  catch(e){ /* süre aşımı: son kaydedilen cevaplar değerlendirilir */ }

    <div class="modal-f"><button class="btn primary" data-close id="okh">Tamam</button></div>`,"narrow").el.querySelector("#okh").addEventListener("click",()=>go("home"));

/* =====================================================================
   EĞİTİM (ÖĞREN) — ortak altyapı
   atlas/{id}, sims/{id}, modules/{id}, weekly/{id} (+ resp/{uid}), weeklyKeys/{id}, learn/{uid}

const $id=id=>document.getElementById(id);
const DAY_MS=864e5;
const ATLAS_CATS=["EKG","Akciğer grafisi","Direkt grafi","BT","MR","USG","Klinik fotoğraf","Diğer"];
// Basit ve güvenli biçimlendirme: **kalın**, *italik*, # başlık, - liste, [metin](https://...)
function md(src){
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g,"$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[]; let list=null, para=[];
  const flush=()=>{ if(para.length){ out.push(`<p>${inl(para.join("<br>"))}</p>`); para=[]; } if(list){ out.push(`<${list.t}>${list.items.map(i=>`<li>${inl(i)}</li>`).join("")}</${list.t}>`); list=null; } };
  for(const raw of esc(src||"").split(/\r?\n/)){ const l=raw.trimEnd();
    let m;
    if(!l.trim()){ flush(); continue; }
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){ flush(); out.push(`<h${m[1].length+2}>${inl(m[2])}</h${m[1].length+2}>`); continue; }
    if((m=l.match(/^\s*[-•]\s+(.*)$/))){ if(para.length||(list&&list.t!=="ul")) flush(); if(!list) list={t:"ul",items:[]}; list.items.push(m[1]); continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ if(para.length||(list&&list.t!=="ol")) flush(); if(!list) list={t:"ol",items:[]}; list.items.push(m[1]); continue; }
    if(list) flush(); para.push(l); }
  flush(); return `<div class="md">${out.join("")}</div>`;
}
function ytId(u){ const m=String(u||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/); return m?m[1]:null; }

/* ---- görüntü üzerinde işaretleme katmanı (koordinatlar 0–1 arası) ---- */
const r4=v=>Math.round(v*1e4)/1e4;
function shapeHit(f,p){
  if(f.shape==="rect") return p.x>=f.x&&p.x<=f.x+f.w&&p.y>=f.y&&p.y<=f.y+f.h;
  if(f.shape==="ellipse"){ const rx=f.w/2, ry=f.h/2; if(rx<=0||ry<=0) return false; return ((p.x-f.x-rx)/rx)**2+((p.y-f.y-ry)/ry)**2<=1; }
  if(f.shape==="poly"){ const P=f.pts||[]; let ins=false; for(let i=0,j=P.length-1;i<P.length;j=i++){ const a=P[i], b=P[j]; if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/((b.y-a.y)||1e-9)+a.x)) ins=!ins; } return ins; }
  return false;
}
const sliceOk=(f,z)=>z==null||f.z==null||Math.abs(z-f.z)<=(f.zr??2);
function shapePath(c,f,T){ c.beginPath();
  if(f.shape==="rect") c.rect(T.x(f.x),T.y(f.y),T.x(f.x+f.w)-T.x(f.x),T.y(f.y+f.h)-T.y(f.y));
  else if(f.shape==="ellipse") c.ellipse(T.x(f.x+f.w/2),T.y(f.y+f.h/2),Math.max(1,Math.abs(T.x(f.x+f.w)-T.x(f.x))/2),Math.max(1,Math.abs(T.y(f.y+f.h)-T.y(f.y))/2),0,0,Math.PI*2);
  else if(f.pts?.length){ f.pts.forEach((q,i)=>i?c.lineTo(T.x(q.x),T.y(q.y)):c.moveTo(T.x(q.x),T.y(q.y))); c.closePath(); } }
class Anno{
  constructor(o={}){ Object.assign(this,{shapes:[],mode:"view",tool:"ellipse",show:null,labels:true,marks:[],sel:null,onCreate:null,onPick:null,redraw:()=>{}},o); this.draft=null; }
  visible(z){ return this.shapes.filter(f=>(!this.filter||this.filter(f))&&(!this.show||this.show(f))&&sliceOk(f,z)); }
  draw(c,T,z){

    this.visible(z).forEach(f=>{ const n=this.shapes.indexOf(f)+1, col=f.id===this.sel?"#38bdf8":(f.color||"#ffd34d");
      shapePath(c,f,T); c.fillStyle=col+"26"; c.fill(); c.lineWidth=2.5; c.strokeStyle="#000a"; c.stroke(); c.lineWidth=1.8; c.strokeStyle=col; c.stroke();
      const bx=T.x(f.x), by=T.y(f.y); c.font="600 12px IBM Plex Sans, sans-serif";
      const t=this.labels&&f.label?`${n}. ${f.label}`:String(n), w=c.measureText(t).width+10, ty=Math.max(0,by-20);
      c.fillStyle="#000c"; c.fillRect(bx,ty,w,18); c.fillStyle=col; c.fillText(t,bx+5,ty+13); });
    if(this.draft){ shapePath(c,this.draft,T); c.setLineDash([5,4]); c.lineWidth=2; c.strokeStyle="#38bdf8"; c.stroke(); c.setLineDash([]); }
    this.marks.filter(m=>m.z==null||z==null||m.z===z).forEach(m=>{ const x=T.x(m.x), y=T.y(m.y), col=m.ok?"#22c55e":"#ef4444";

    c.restore();
  }
  down(p,z){
    if(this.mode==="pick"){ this.onPick&&this.onPick(p,z); return; }
    if(this.mode!=="edit") return;
    this.draft=this.tool==="poly"?{shape:"poly",pts:[p]}:{shape:this.tool,x0:p.x,y0:p.y,x:p.x,y:p.y,w:0,h:0};
  }
  move(p){ const d=this.draft; if(!d) return;
    if(d.shape==="poly"){ const l=d.pts[d.pts.length-1]; if(Math.hypot(p.x-l.x,p.y-l.y)>0.006) d.pts.push(p); }
    else { d.x=Math.min(d.x0,p.x); d.y=Math.min(d.y0,p.y); d.w=Math.abs(p.x-d.x0); d.h=Math.abs(p.y-d.y0); } }

    let f;

      f={shape:"poly",pts:d.pts.map(q=>({x:r4(q.x),y:r4(q.y)})),x:r4(Math.min(...xs)),y:r4(Math.min(...ys)),w:r4(Math.max(...xs)-Math.min(...xs)),h:r4(Math.max(...ys)-Math.min(...ys))}; }
    else f={shape:d.shape,x:r4(d.x),y:r4(d.y),w:r4(d.w),h:r4(d.h)};
    if(f.w<0.012&&f.h<0.012) return;

}

class ImgAnno{
  constructor(host,{imageId,src,anno}){ this.anno=anno; anno.redraw=()=>this.draw();
    host.innerHTML=`<div class="anno-wrap"><img alt=""><canvas></canvas><div class="anno-load">Görsel yükleniyor…</div></div>`;
    this.wrap=host.firstElementChild; this.img=this.wrap.querySelector("img"); this.cv=this.wrap.querySelector("canvas");
    const set=u=>{ const l=this.wrap.querySelector(".anno-load"); if(!u){ if(l) l.textContent="Görsel bulunamadı"; return; } this.img.onload=()=>{ l?.remove(); const r=this.img.naturalWidth/(this.img.naturalHeight||1); this.wrap.style.width=`min(100%, calc(72vh * ${r.toFixed(4)}))`; this.draw(); }; this.img.src=u; };
    if(src) set(src); else getImg(imageId).then(set);
    const P=e=>{ const r=this.cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}; };
    this.cv.addEventListener("pointerdown",e=>{ if(this.anno.mode==="view") return; e.preventDefault(); this.cv.setPointerCapture(e.pointerId); this.anno.down(P(e),null); this.draw(); });
    this.cv.addEventListener("pointermove",e=>{ if(this.anno.draft){ this.anno.move(P(e)); this.draw(); } });
    const up=()=>{ if(this.anno.draft){ this.anno.up(null); this.draw(); } };
    this.cv.addEventListener("pointerup",up); this.cv.addEventListener("pointercancel",up);
    this.ro=new ResizeObserver(()=>{ if(!this.wrap.isConnected){ this.ro.disconnect(); return; } this.draw(); }); this.ro.observe(this.img);
  }
  draw(){ const w=this.img.clientWidth, h=this.img.clientHeight; if(!w||!h) return; const dpr=window.devicePixelRatio||1, cv=this.cv;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.width=w+"px"; cv.style.height=h+"px";
    const v=this.anno.mode==="view"; cv.style.cursor=v?"":"crosshair"; cv.style.touchAction=v?"auto":"none"; cv.style.pointerEvents=v?"none":"auto";
    const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h); this.anno.draw(c,{x:t=>t*w,y:t=>t*h},null); }
  setSlice(){}
}

    };
    const fin=()=>{ anno.mode="view"; anno.onPick=null; setTool("slice"); F.forEach(f=>st.rev.add(f.id)); anno.marks=[]; anno.redraw();
      const ok=st.res.filter(r=>r?.ok).length, miss=st.res.filter(r=>r&&!r.ok);
      if(canLearn()){ const r=L.d.atlas[id]=L.d.atlas[id]||{}; r.done=Date.now(); r.ok=ok; r.n=TK.length; r.best=Math.max(r.best||0,ok); r.tries=(r.tries||0)+1; r.topic=A.topic||"";
        miss.forEach(m=>srsAdd(`a:${id}:${m.tid}`,{topic:A.topic||"",cat:A.cat||""})); saveLearn(true); }
      $id("aP").innerHTML=`<div class="scorebox" style="margin-bottom:10px"><div><div class="bigscore">${ok}/${TK.length}</div><div class="muted">ilk denemede doğru</div></div></div>
        <div class="flist">${TK.map((t,i)=>{ const r=st.res[i]; return `<div class="fnd on"><div class="fh"><span class="fn ${r?.ok?"ok":"bad"}">${r?.ok?"✓":"✗"}</span><span>${esc(t.prompt)}</span></div></div>`; }).join("")}</div>
        ${canLearn()&&miss.length?`<div class="note" style="margin-top:10px">${miss.length} görev tekrar listenize eklendi; birkaç gün içinde yeniden karşınıza çıkacak.</div>`:""}
        <div class="row" style="margin-top:12px"><button class="btn primary" id="qAg">Yeniden dene</button><button class="btn" id="qEx">Keşfet'e dön</button></div>`;
      $id("qAg").onclick=()=>quiz(); $id("qEx").onclick=()=>setTab("x"); };
    draw();
  };
  const setTab=t=>{ $id("aTabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===t)); if(t==="q") quiz(); else explore(); };
  $id("aTabs").querySelectorAll("button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  show(0); explore();
}

/* =====================================================================
   SANAL HASTA — dallanan vaka senaryoları
   nodes: { nid: {title,text,vitals,imageId,dicomId,end,outcome,opts:[{id,kind:"test"|"act",label,pts,min,res,resImg,resDcm,fb,to}]} }
   ===================================================================== */
const simDefBack=()=>S.mode==="resident"?{view:"sims"}:{view:"edu",params:{sec:"sims"}};
const OUTCOME={good:["İyi sonuç","ok"],mid:["Kısmen iyi","warn"],bad:["Kötü sonuç","bad"]};
function simMax(D){ const memo={};
  const best=(nid,seen)=>{ const n=D.nodes?.[nid]; if(!n||seen.has(nid)) return 0; if(memo[nid]!=null) return memo[nid];
    const s2=new Set(seen).add(nid); const tests=(n.opts||[]).filter(o=>o.kind==="test").reduce((a,o)=>a+Math.max(0,Number(o.pts)||0),0);
    const acts=n.end?[0]:(n.opts||[]).filter(o=>o.kind==="act").map(o=>(Number(o.pts)||0)+best(o.to,s2));
    return memo[nid]=tests+Math.max(0,...(acts.length?acts:[0])); };
  return Math.max(1,best(D.start,new Set())); }
function simIssues(D){ const out=[], ids=Object.keys(D.nodes||{});
  if(!D.nodes?.[D.start]) out.push("Başlangıç düğümü seçilmemiş.");
  const reach=new Set(), st=[D.start]; while(st.length){ const x=st.pop(); if(!x||reach.has(x)||!D.nodes[x]) continue; reach.add(x); (D.nodes[x].opts||[]).forEach(o=>o.kind==="act"&&st.push(o.to)); }
  ids.forEach(k=>{ const n=D.nodes[k], nm=`“${n.title||k}”`;
    if(!reach.has(k)) out.push(`${nm} düğümüne hiçbir yoldan ulaşılmıyor.`);
    if(!n.end&&!(n.opts||[]).some(o=>o.kind==="act")) out.push(`${nm}: bitiş düğümü değil ama karar seçeneği yok (vaka burada takılır).`);
    (n.opts||[]).forEach(o=>{ if(o.kind==="act"&&!D.nodes[o.to]) out.push(`${nm}: “${o.label||"karar"}” bir düğüme bağlı değil.`); }); });
  if(!ids.some(k=>D.nodes[k].end)) out.push("Hiç bitiş düğümü yok.");
  return out; }

        </div></div>`);
    $id("bk").onclick=async()=>{ if(G2.step===0||await confirmDlg("Vakadan çık","<p>İlerlemeniz kaydedilmeyecek.</p>","Çık")) goBack(back,simDefBack()); };
    $id("sEd")?.addEventListener("click",()=>go("simEdit",{id}));
    document.querySelectorAll(".simopt.test[data-o]:not([disabled])").forEach(b=>b.onclick=()=>{ const o=tests.find(t=>t.id===b.dataset.o);
      op.push(o.id); G2.score+=Number(o.pts)||0; G2.min+=Number(o.min)||0; G2.log.push({node:n.title||"",kind:"test",label:o.label,pts:Number(o.pts)||0,fb:o.fb||""}); G2.fb=null; draw(); });
    document.querySelectorAll(".simopt.act[data-o]").forEach(b=>b.onclick=()=>{ const o=acts.find(t=>t.id===b.dataset.o);

function pkgSummary(P){ return `<b>${esc(P.title||"Paket")}</b>${P.desc?`<div class="small muted">${esc(P.desc)}</div>`:""}

async function importPackage(P,onProg){
  if(!P||!Array.isArray(P.sims)) throw new Error("Geçersiz paket dosyası");
  const pid=String(P.id||"paket").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,40)||"paket";
  const [ss,qs,ps,ms]=await Promise.all([getDocs(collection(db,"sims")),getDocs(collection(db,"questions")),getDocs(collection(db,"pools")),getDocs(collection(db,"modules"))]);
  const haveS={}; ss.docs.forEach(d=>{ const k=d.data().pkg; if(k) haveS[k]=d.id; });
  const haveQ=new Set(qs.docs.map(d=>d.data().pkg).filter(Boolean));
  const ops=[], res={sims:0,skipS:0,qs:0,skipQ:0,mod:false}, simId={};
  for(const x of P.sims){ const key=`${pid}:${x.key}`; if(haveS[key]){ simId[x.key]=haveS[key]; res.skipS++; continue; }
    const id=newId(); simId[x.key]=id; const order=x.order||Object.keys(x.nodes||{});
    const D={title:x.title,topic:x.topic||"",intro:x.intro||"",start:x.start||order[0],order,nodes:{}};
    order.forEach(k=>{ const n=x.nodes[k]; D.nodes[k]={title:n.title||"",text:n.text||"",vitals:n.vitals||"",imageId:null,dicomId:null,end:!!n.end,outcome:n.end?(n.outcome||"mid"):null,
      opts:(n.opts||[]).map((o,j)=>({id:o.id||`${k}o${j}`,kind:o.kind==="act"?"act":"test",label:o.label,pts:Number(o.pts)||0,min:Number(o.min)||0,fb:o.fb||"",...(o.kind==="act"?{to:o.to}:{res:o.res||"",resImg:null,resDcm:null})}))}; });
    ops.push(b=>b.set(doc(db,"sims",id),{...D,maxScore:simMax(D),published:false,pkg:key,source:P.source||"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()})); res.sims++; }
  let poolId=null;
  if((P.questions||[]).length){ const pn=P.pool||P.title; const ex=ps.docs.find(d=>d.data().name===pn);
    poolId=ex?ex.id:newId(); if(!ex) ops.push(b=>b.set(doc(db,"pools",poolId),{name:pn,practice:false,createdAt:serverTimestamp()}));
    P.questions.forEach((q,i)=>{ const key=`${pid}:${q.key||"q"+i}`; if(haveQ.has(key)){ res.skipQ++; return; }
      ops.push(b=>b.set(doc(db,"questions",newId()),{type:"mcq",stem:q.stem,options:q.options,correct:Number(q.correct)||0,points:1,topic:q.topic||"",explanation:q.explanation||"",caseId:null,imageId:null,poolId,practice:false,pkg:key,createdAt:serverTimestamp(),updatedAt:serverTimestamp()})); res.qs++; }); }
  if(P.module&&!ms.docs.some(d=>d.data().pkg===pid)){ const M=P.module;
    const items=[...(M.intro?[{id:"intro",k:"text",title:M.introTitle||"Nasıl çalışılır?",body:M.intro,url:"",ref:""}]:[]),
      ...P.sims.map(x=>({id:"s_"+x.key,k:"sim",title:"",body:"",url:"",ref:simId[x.key]})),
      ...((P.questions||[]).length?[{id:"prac",k:"practice",title:"Pekiştirme soruları",body:M.practice||`Alıştırma sekmesinde “${P.pool||P.title}” havuzundaki soruları çözün.`,url:"",ref:""}]:[])];
    ops.push(b=>b.set(doc(db,"modules",newId()),{title:M.title||P.title,topic:M.topic||"",desc:M.desc||"",order:M.order??null,req:M.req||[],items,published:false,pkg:pid,createdAt:serverTimestamp(),updatedAt:serverTimestamp()})); res.mod=true; }
  onProg&&onProg(`${ops.length} kayıt yazılıyor…`);
  await batchOps(ops); S.questions=[]; return res;
}

          <div>${n.end?`<div class="field"><label class="f">Sonuç türü</label><select data-no>${Object.entries(OUTCOME).map(([v,[l]])=>`<option value="${v}" ${(n.outcome||"mid")===v?"selected":""}>${l}</option>`).join("")}</select></div>`
            :`<div class="field"><label class="f">Vital bulgular <span class="muted" style="font-weight:400">(“·” ile ayırın)</span></label><input type="text" data-nv value="${esc(n.vitals||"")}" placeholder="KB 85/50 · Nb 124 · SpO₂ %91 · Ateş 38.6"></div>`}
            <div class="field"><label class="f">Görüntü</label><div class="mm-own">${miniMedia(n,"imageId","dicomId")}</div></div></div></div>
        ${n.end?"":`<div class="lbl2" style="margin-top:6px">Seçenekler</div>

            <div class="row" style="flex-wrap:nowrap;gap:6px"><select data-okind style="width:auto"><option value="test" ${o.kind==="test"?"selected":""}>🔎 Tetkik</option><option value="act" ${o.kind==="act"?"selected":""}>➜ Karar</option></select>
              <input type="text" data-ol value="${esc(o.label||"")}" placeholder="${o.kind==="test"?"örn. 12 derivasyonlu EKG":"örn. Kateter laboratuvarına gönder"}">

      el.querySelector("[data-adda]")?.addEventListener("click",()=>{ (n.opts=n.opts||[]).push({id:newId().slice(0,8),kind:"act",label:"",pts:0,min:0,to:null,fb:""}); drawN(); });

  const clean=()=>{ const nodes={}; D.order.forEach(k=>{ const n=D.nodes[k];
    nodes[k]={title:String(n.title||"").trim(),text:String(n.text||"").trim(),vitals:String(n.vitals||"").trim(),imageId:n.imageId||null,dicomId:n.dicomId||null,end:!!n.end,outcome:n.end?(n.outcome||"mid"):null,
      opts:n.end?[]:(n.opts||[]).filter(o=>String(o.label||"").trim()).map(o=>({id:o.id,kind:o.kind==="act"?"act":"test",label:String(o.label).trim(),pts:Number(o.pts)||0,min:Number(o.min)||0,fb:String(o.fb||"").trim(),

    return nodes; };
  $id("sSave").onclick=async()=>{
    const title=$id("sTi").value.trim(); if(!title) return toast("Başlık girin",true);
    const nodes=clean(); const tmp={...D,nodes}; const iss=simIssues(tmp);
    if(isAdm&&$id("sPu").checked&&iss.length&&!await confirmDlg("Uyarılar var",`<p>Vaka yapısında ${iss.length} sorun var; asistan bir yerde takılabilir. Yine de yayınlansın mı?</p>`,"Yayınla")) return;

    if(isAdm){ data.published=$id("sPu").checked; if(D.status&&D.status!=="approved") data.status="approved"; } else { data.status="pending"; data.author=S.email; data.published=false; }
    try{ $id("sSave").disabled=true; await setDoc(doc(db,"sims",sid),data,{merge:true}); toast(isAdm?"Kaydedildi":"Kaydedildi; yönetici onayına gönderildi");
      if(!id){ S.params={id:sid}; return viewSimEdit(sid); } $id("sSave").disabled=false; }catch(e){ fail(e,"Kaydedilemedi"); $id("sSave").disabled=false; } };
  $id("sPrev")?.addEventListener("click",()=>go("simPlay",{id,back:{view:"simEdit",params:{id}}}));
  $id("sDel")?.addEventListener("click",async()=>{ if(!await confirmDlg("Vakayı sil","<p>Sanal hasta vakası kalıcı olarak silinecek.</p>","Sil",true)) return; try{ await deleteDoc(doc(db,"sims",id)); go("edu",{sec:"sims"}); }catch(e){ fail(e); } });
  drawN();

const MOD_KINDS={text:"📖 Okuma",video:"▶ Video / bağlantı",atlas:"🖼 Atlas görüntüsü",sim:"🩺 Sanal hasta",practice:"✎ Alıştırma"};
function modItemDone(m,it,AM){
  if(it.k==="atlas"){ const r=L?.d.atlas[it.ref]; const a=AM?.[it.ref]; return !!(r?.done||(r?.seen&&!(a?.tasks||[]).length)); }
  if(it.k==="sim") return !!(L?.d.sim[it.ref]?.n);
  return !!L?.d.mod[m.id]?.[it.id];
}
function modProg(m,AM){ const its=m.items||[]; const d=its.filter(it=>modItemDone(m,it,AM)).length; return {d,n:its.length,p:its.length?d/its.length*100:0}; }
const isReq=(m,k)=>Array.isArray(m.req)&&k!=null&&m.req.map(Number).includes(Number(k));
const progBar=p=>`<span class="track wide"><span style="width:${Math.max(0,Math.min(100,p))}%"></span></span>`;
const wkState=w=>{ const now=Date.now(), o=tsMs(w.openAt)||0, r=tsMs(w.revealAt)||0; return now<o?"soon":now<r?"open":"revealed"; };

async function viewLearn(){
  paint(`<div class="spinner"></div>`);
  const [mods,atlas,sims,weeks]=await Promise.all([loadEdu("modules"),loadEdu("atlas"),loadEdu("sims"),loadEdu("weekly"),loadLearn()].map(p=>Promise.resolve(p).catch(e=>{ console.error(e); return []; })));
  const AM={}; atlas.forEach(a=>AM[a.id]=a);
  const kid=S.resident?.kidem, due=srsDue().length, nCards=Object.keys(L.d.srs).length;
  const curW=weeks.filter(w=>wkState(w)!=="soon").sort((a,b)=>(tsMs(b.openAt)||0)-(tsMs(a.openAt)||0));
  const W=curW[0];
  const msort=mods.sort((a,b)=>(isReq(b,kid)-isReq(a,kid))||((a.order??99)-(b.order??99))||(a.title||"").localeCompare(b.title||"","tr"));
  const req=msort.filter(m=>isReq(m,kid)), reqDone=req.filter(m=>{ const p=modProg(m,AM); return p.n&&p.d===p.n; }).length;
  paint(`<div class="page-head"><div><h1>Öğren</h1><div class="sub">Merhaba ${esc((S.resident?.name||S.user.displayName||"").split(" ")[0])}. Görüntüleri inceleyin, sanal hastaları yönetin, modülleri tamamlayın; yanlışlarınız aralıklı tekrar listenize eklenir.</div></div></div>
    <div class="lhub">
      <button class="lcard srs ${due?"hot":""}" data-go="srs"><span class="ic">↻</span><b>Tekrar</b><span class="big">${due}</span><span class="small">${due?"kart bugün tekrar bekliyor":nCards?"bugün tekrar yok":"henüz kart yok"}</span></button>
      <button class="lcard" data-go="atlas"><span class="ic">🖼</span><b>Görüntü atlası</b><span class="big">${atlas.length}</span><span class="small">${atlas.filter(a=>L.d.atlas[a.id]?.done).length} sınandı · ${atlas.filter(a=>L.d.atlas[a.id]?.seen).length} görüldü</span></button>
      <button class="lcard" data-go="sims"><span class="ic">🩺</span><b>Sanal hasta</b><span class="big">${sims.length}</span><span class="small">${sims.filter(x=>L.d.sim[x.id]).length} vaka tamamlandı</span></button>
      <button class="lcard" data-go="practice"><span class="ic">✎</span><b>Alıştırma</b><span class="big">→</span><span class="small">konu konu soru çöz</span></button>
    </div>
    ${W?`<div class="card pad wkcard" style="margin-bottom:16px" id="wkHost"></div>`:""}
    <div class="card pad"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Modüller</h2>${req.length?`<span class="badge ${reqDone===req.length?"ok":"warn"}">Zorunlu: ${reqDone}/${req.length} tamamlandı</span>`:""}</div>
      ${msort.length?`<div class="mlist">${msort.map(m=>{ const p=modProg(m,AM); return `<button class="mrow" data-mod="${esc(m.id)}"><div class="grow"><b>${esc(m.title||"Modül")}</b> ${isReq(m,kid)?`<span class="badge warn">Zorunlu</span>`:""}${p.n&&p.d===p.n?`<span class="badge ok">✓ Tamamlandı</span>`:""}
          <div class="small muted">${esc(m.topic||"")}${m.topic?" · ":""}${p.n} öğe</div></div><div class="mprog">${progBar(p.p)}<span class="small">${p.d}/${p.n}</span></div></button>`; }).join("")}</div>`
        :`<div class="small muted" style="margin-top:8px">Henüz yayınlanmış modül yok.</div>`}</div>
    ${curW.length>1?`<div class="card pad" style="margin-top:16px"><h2 style="margin-top:0">Geçmiş haftanın görüntüleri</h2><div class="mlist">${curW.slice(1).map(w=>`<button class="mrow" data-wk="${esc(w.id)}"><div class="grow"><b>${esc(w.title||"Görüntü")}</b><div class="small muted">${fmtDT(w.openAt)}</div></div>${L.d.wk[w.id]?`<span class="badge ok">Yanıtladınız</span>`:""}</button>`).join("")}</div></div>`:""}`);
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>go("module",{id:b.dataset.mod}));
  document.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>go("weekly",{id:b.dataset.wk}));
  if(W) weeklyBlock($id("wkHost"),W,true);
}

/* ---- haftanın görüntüsü ---- */
async function weeklyBlock(host,w,compact){
  const stt=wkState(w), uid=S.user.uid;
  let mine=null, all=[], ans=null;
  try{ if(stt==="revealed"){ const [rs,k]=await Promise.all([getDocs(collection(db,"weekly",w.id,"resp")),getDoc(doc(db,"weeklyKeys",w.id))]); all=rs.docs.map(d=>d.data()).sort((a,b)=>(tsMs(a.at)||0)-(tsMs(b.at)||0)); mine=all.find(r=>r.uid===uid)||null; ans=k.exists()?k.data().answer:""; }
       else { const r=await getDoc(doc(db,"weekly",w.id,"resp",uid)); mine=r.exists()?r.data():null; } }catch(e){ console.error(e); }
  host.innerHTML=`<div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="lbl2">Haftanın görüntüsü</div><h2 style="margin:2px 0 4px">${esc(w.title||"")}</h2></div>
      <span class="badge ${stt==="open"?"warn":"ok"}">${stt==="open"?`Cevap ${fmtDT(w.revealAt)} açıklanacak`:"Cevap açıklandı"}</span></div>
    ${w.prompt?md(w.prompt):""}${mediaHtml(w.imageId,w.dicomId)}
    ${stt==="open"?`<div class="field" style="margin-top:12px"><label class="f">Yorumunuz</label><textarea id="wkT" style="min-height:90px" placeholder="Bulgularınızı ve ön tanınızı yazın. Cevap açıklanınca herkesin yorumu görünür.">${esc(mine?.text||"")}</textarea></div>
        <div class="row" style="justify-content:space-between"><span class="small muted" id="wkS">${mine?`Gönderildi · ${fmtDT(mine.at)}`:""}</span><button class="btn primary" id="wkGo">${mine?"Güncelle":"Gönder"}</button></div>`
      :`<div class="pearl" style="margin-top:12px"><div class="lbl">Cevap</div>${ans?md(ans):"<span class='muted'>—</span>"}</div>
        <details ${compact?"":"open"} style="margin-top:12px"><summary><b>Yorumlar (${all.length})</b>${mine?"":" · siz yorum yazmadınız"}</summary>
          <div class="wkresp">${all.map(r=>`<div class="${r.uid===uid?"me":""}"><b>${esc(r.name||"")}</b><span class="small muted"> · ${fmtDT(r.at)}</span><div class="txt">${esc(r.text||"")}</div></div>`).join("")||`<div class="small muted">Yorum yok.</div>`}</div></details>`}`;
  hydrateImages(host); hydrateDicom(host);
  $id("wkGo")?.addEventListener("click",async()=>{ if(pvBlock()) return; const t=$id("wkT").value.trim(); if(!t) return toast("Yorum boş",true);
    try{ await setDoc(doc(db,"weekly",w.id,"resp",uid),{uid,email:S.email,name:S.resident?.name||S.user.displayName||"",text:t.slice(0,3000),at:serverTimestamp()});
      if(L){ L.d.wk[w.id]=Date.now(); saveLearn(); } $id("wkS").textContent="Gönderildi · az önce"; $id("wkGo").textContent="Güncelle"; toast("Yorumunuz kaydedildi"); }catch(e){ fail(e,"Gönderilemedi (süre dolmuş olabilir)"); } });
}

async function viewModule(id){

  const [s,atlas,sims]=await Promise.all([getDoc(doc(db,"modules",id)),loadEdu("atlas").catch(()=>[]),loadEdu("sims").catch(()=>[]),loadLearn()]);
  if(!s.exists()){ toast("Modül bulunamadı",true); return go("learn"); }
  const m={id,...s.data()}, AM={}, SM={}; atlas.forEach(a=>AM[a.id]=a); sims.forEach(x=>SM[x.id]=x);
  const back={view:"module",params:{id}};
  const toggle=it=>{ const r=L.d.mod[id]=L.d.mod[id]||{}; if(r[it.id]) delete r[it.id]; else r[it.id]=Date.now(); saveLearn(true); draw(); };
  const draw=()=>{ const p=modProg(m,AM), its=m.items||[];
    paint(`<div class="page-head"><div><button class="btn sm ghost" id="bk">← Öğren</button><h1>${esc(m.title||"Modül")}</h1><div class="sub">${[esc(m.topic||""),isReq(m,S.resident?.kidem)?`<b>${S.resident.kidem}. yıl için zorunlu</b>`:""].filter(Boolean).join(" · ")}</div></div>
        <div class="mprog" style="min-width:200px">${progBar(p.p)}<span class="small">${p.d}/${p.n}</span></div></div>
      ${m.desc?`<div class="card pad" style="margin-bottom:16px">${md(m.desc)}</div>`:""}
      <div class="mitems">${its.map((it,i)=>{ const done=modItemDone(m,it,AM); let body="", act="";
        if(it.k==="text"){ body=it.body?md(it.body):""; act=`<button class="btn sm ${done?"":"primary"}" data-tg="${i}">${done?"✓ Okundu":"Okudum"}</button>`; }
        else if(it.k==="video"){ const y=ytId(it.url); body=`${it.body?md(it.body):""}${y?`<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${esc(y)}" allowfullscreen loading="lazy" title="${esc(it.title||"Video")}"></iframe></div>`:it.url?`<a class="btn sm" href="${esc(it.url)}" target="_blank" rel="noopener">Bağlantıyı aç ↗</a>`:""}`;
          act=`<button class="btn sm ${done?"":"primary"}" data-tg="${i}">${done?"✓ Tamamlandı":"Tamamladım"}</button>`; }
        else if(it.k==="atlas"){ const a=AM[it.ref]; body=a?`<button class="acard inline" data-oa="${esc(a.id)}">${mediaThumb(a)}<div class="ab"><b>${esc(a.title)}</b><span class="small muted">${esc(a.cat||"")}${(a.tasks||[]).length?` · ${a.tasks.length} görev`:""}</span></div></button>`:`<div class="small muted">Bu görüntü yayında değil.</div>`;
          act=a?`<span class="small muted">${(a.tasks||[]).length?"Kendini sına'yı bitirince tamamlanır":"Açınca tamamlanır"}</span>`:""; }
        else if(it.k==="sim"){ const x=SM[it.ref]; body=x?`<div>${esc(x.intro||"").slice(0,220)}</div>`:`<div class="small muted">Bu vaka yayında değil.</div>`;
          act=x?`<button class="btn sm primary" data-os="${esc(x.id)}">${L.d.sim[x.id]?`Yeniden oyna (en iyi %${L.d.sim[x.id].best})`:"Vakayı başlat"}</button>`:""; }
        else if(it.k==="practice"){ body=it.body?md(it.body):""; act=`<button class="btn sm" data-gp>Alıştırmaya git</button><button class="btn sm ${done?"":"primary"}" data-tg="${i}">${done?"✓ Tamamlandı":"Tamamladım"}</button>`; }
        return `<div class="card pad mitem ${done?"done":""}"><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:10px"><span class="mnum">${done?"✓":i+1}</span><div class="grow"><div class="small muted">${MOD_KINDS[it.k]||""}</div><h3 style="margin:2px 0 8px">${esc(it.title||(it.k==="atlas"?AM[it.ref]?.title:it.k==="sim"?SM[it.ref]?.title:"")||"")}</h3>${body}<div class="row" style="margin-top:10px;gap:6px">${act}</div></div></div></div>`; }).join("")||`<div class="card empty">Bu modülde henüz içerik yok.</div>`}</div>`);
    $id("bk").onclick=()=>go("learn");
    document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>toggle(its[Number(b.dataset.tg)]));
    document.querySelectorAll("[data-oa]").forEach(b=>b.onclick=()=>go("atlasView",{id:b.dataset.oa,back}));
    document.querySelectorAll("[data-os]").forEach(b=>b.onclick=()=>go("simPlay",{id:b.dataset.os,back}));
    document.querySelectorAll("[data-gp]").forEach(b=>b.onclick=()=>go("practice"));
    hydrateImages($app);
  };
  draw();
}
