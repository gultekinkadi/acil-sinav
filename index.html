const RHN={vf:'VF',pvt:'Nabızsız VT',pea:'NEA',asys:'Asistoli'};
function goArrest(R,lg,s){ const f=R.f; f.paced=0; f.chrono=0; f.si=0;
  arrestStart(R,s.seq[0],lg,s.arrestMsg||'Hasta aniden yanıtsızlaştı: solunumu yok, nabız alınmıyor!'); stageInit(R); }
function stageInit(R){ const f=R.f; f.sT=R.t; f.sShock=0; f.sEpi0=f.epi||0; f.mark['a'+(f.si+1)]=R.t; R.v.hr=f.rh==='pea'?40:0; }
function megaArrest(R,s){
  const f=R.f; if(f.roscReady) return;
  const q=f.cpr&&f.cprQ>=.6, sEpi=(f.epi||0)-(f.sEpi0||0), last=f.si>=s.seq.length-1;
  const adv=RH[f.rh].shock
    ? q&&(f.sShock||0)>=3&&(f.epi||0)>=1&&((f.amio||f.lido)||(f.sShock||0)>=5)&&R.t-(f.lastShock??-9)>=1
    : q&&sEpi>=1&&(R.done.t_ht||sEpi>=2)&&R.t-f.sT>=2;
  if(!adv) return;
  if(last){ setReady(R,'st',{hr:104,sbp:86,dbp:52,spo2:f.o2?98:92}); f.mark.rosc=R.t; return; }
  f.si++; f.rh=s.seq[f.si]; stageInit(R);
}
function megaCrit(d){
  const C=[{label:'Ekip lideri: kod mavi ve rol dağılımı',ids:['k_code'],within:1,pts:5}];
  const pads={label:'Monitör / pedler',ids:['r_pads'],within:2,pts:5}, iv={label:'Damar yolu',ids:['i_iv'],within:3,pts:5};
  if(d.pre==='brady') C.push(pads,{label:'O₂ (gerekirse)',ids:['h_o2'],within:3,pts:5},iv,
    {label:'Semptomatik / unstabil bradikardiyi tanı',ids:['k_resp','k_check','t_ecg12'],within:3,pts:5},
    {label:'Atropin 1 mg',ids:['i_atro'],within:4,pts:10},
    {label:'İkinci basamak: pacing veya dopamin / adrenalin infüzyonu',ids:['r_pace','i_dopa','i_epiinf'],within:7,pts:10});
  if(d.pre==='tachyU') C.push(pads,{label:'O₂ (gerekirse)',ids:['h_o2'],within:3,pts:5},iv,
    {label:'Unstabil taşikardiyi ve semptomlarını tanı',ids:['k_resp','k_check'],within:2,pts:5},
    {label:'Hemen senkronize kardiyoversiyon',ids:['r_sync'],within:4,pts:20});
  if(d.pre==='tachyS') C.push(pads,iv,
    {label:'Stabil olduğunu tanı (taşikardiye bağlı semptom yok)',ids:['k_resp'],within:3,pts:5},
    {label:'Spesifik tanı: 12 derivasyon EKG',ids:['t_ecg12'],within:4,pts:10},
    {label:'Uygun ilk tedavi: vagal manevra / adenozin',ids:['i_vagal','i_aden'],within:5,pts:15});
  d.seq.forEach((rh,i)=>{ const m='a'+(i+1), n=RHN[rh], first=i===0;
    if(first) C.push({label:`${n}: göğüs basısına hemen başla`,ids:['k_cpr'],from:m,within:1,pts:10});
    if(RH[rh].shock) C.push(
      {label:`${n}: ritmi tanı (ritim kontrolü)`,ids:['k_check'],from:m,within:first?2:3,pts:5},
      {label:`${n}: “herkes çekilsin” ve şok`,ids:['r_shock'],from:m,within:first?2:3,pts:15},
      {label:`${n}: adrenalin`,ids:['i_epi'],from:m,within:6,pts:10},
      {label:`${n}: amiodaron / lidokain`,ids:['i_amio300','i_lido'],from:m,within:8,pts:10});
    else C.push(
      {label:`${n}: ritmi tanı (ritim kontrolü)`,ids:['k_check'],from:m,within:3,pts:5},
      {label:`${n}: adrenalin`,ids:['i_epi'],from:m,within:3,pts:10},
      {label:`${n}: 5H–5T’yi say`,ids:['t_ht'],from:m,within:5,pts:10});
    if(first) C.push({label:'Uygun havayolu yönetimi (BVM / ileri havayolu)',ids:['h_bvm','h_sga','h_eti'],from:m,within:6,pts:5,any:1});
  });
  C.push(
    {label:'ROSC’u tanı',ids:['k_check'],from:'rosc',within:3,pts:10},
    {label:'ROSC: ileri havayolu',ids:['h_eti','h_sga'],from:'rosc',within:8,pts:5,any:1},
    {label:'ROSC: dalga formlu kapnografi',ids:['h_capno'],from:'rosc',within:8,pts:5,any:1},
    {label:'ROSC: TA’yı güvenceye al (sıvı / vazopresör)',ids:['i_fluid','i_norad','i_dopa','i_epiinf'],from:'rosc',within:6,pts:5},
    {label:'ROSC: 12 derivasyon EKG',ids:['t_ecg12'],from:'rosc',within:8,pts:5},
    {label:'ROSC: SpO₂ izlemi ve O₂ titrasyonu',ids:['p_o2'],from:'rosc',within:8,pts:5},
    {label:'ROSC: laboratuvar (kan gazı, elektrolit)',ids:['t_abg'],from:'rosc',within:10,pts:5},
    {label:'ROSC: sıcaklık kontrolü',ids:['p_ttm'],from:'rosc',within:12,pts:5});
  return C;
}

function mega(d){
  const pre=d.pre, isArr=R=>!!R.f.arrest, post=R=>!R.f.arrest&&!!R.f.rosc;
  const s={id:d.id,tag:d.tag,title:d.title,brief:d.brief,mist:d.mist,mistLabel:d.mistLabel,group:'Megakod (AHA sınav akışları)',
    limit:40,coins:250,brady:pre==='brady',seq:d.seq,ok:d.ok||[],rhDesc:d.rhDesc||{},
    init:{v:{...d.v,etco2:34,temp:36.6},f:{rh:d.preRh,cprQ:1,lastSwap:0,spo2base:d.v.spo2,mark:{},si:-1}},
    tick(R,lg,pen){ base(R,lg,pen); const f=R.f,v=R.v;
      if(f.arrest){ megaArrest(R,s); return; }
      if(f.rosc){ toward(v,'sbp',(f.norad||f.fluid)?108:86,4); v.hr=f.norad?96:104; if(f.ttm&&f.ecgPost&&(f.norad||f.fluid)) f.def=1; return; }
      if(pre==='brady'){
        if((f.paced||f.chrono)&&f.secondT==null) f.secondT=R.t;
        if(f.paced){ v.hr=70; toward(v,'sbp',100,6); } else if(f.chrono){ v.hr=58; toward(v,'sbp',94,5); }
        else if(f.atro&&d.preRh==='sb'){ v.hr=46; toward(v,'sbp',84,3); } else v.sbp-=.6;
        if((f.secondT!=null&&R.t-f.secondT>=2)||R.t>=7) goArrest(R,lg,s);
      } else if(pre==='tachyU'){
        if(f.rh==='svt') v.sbp-=.6; else { v.hr=104; toward(v,'sbp',98,4); }
        if((f.syncT!=null&&R.t-f.syncT>=2)||R.t>=6) goArrest(R,lg,s);
      } else {
        if(f.convT!=null){ v.hr=92; }
        if((f.convT!=null&&R.t-f.convT>=2)||R.t>=7) goArrest(R,lg,s);
      } },
    onShock(R){ R.f.sShock=(R.f.sShock||0)+1; },
    onPace(R){ if(pre!=='brady'||R.f.rosc) return null; R.f.paced=1; R.f.rh='paced'; return {text:'Transkütan pacing 70/dk: elektriksel ve mekanik yakalama sağlandı (femoral nabız 70/dk).'}; },
    onSync(R){ const f=R.f,v=R.v;
      if(f.rh!=='svt') return {text:'Kardiyoversiyon endikasyonu yok.',pen:[15,'Endikasyonsuz kardiyoversiyon']};
      f.rh='st'; v.hr=104; v.sbp=Math.max(v.sbp,94);
      if(pre==='tachyU'){ f.syncT=R.t; return {text:'Senkronize kardiyoversiyon (50–100 J): sinüs ritmine döndü, 104/dk.'}; }
      f.convT=R.t; return {text:'Kardiyoversiyon ile sinüs ritmine döndü.',pen:[10,'Stabil SVT’de ilk basamak vagal manevra / adenozin olmalıydı']}; },
    act:{
      i_atro:R=>{ if(isArr(R)||pre!=='brady'||R.f.rosc) return null; const f=R.f; f.atro=(f.atro||0)+1;
        return {text:d.preRh==='sb'?`Atropin 1 mg (${f.atro}. doz): kalp hızı 46/dk’ya çıktı ama hasta hâlâ hipotansif ve semptomatik. İkinci basamağa hazırlanın.`
          :`Atropin 1 mg (${f.atro}. doz): yanıt yok; bu tip blokta atropin çoğunlukla etkisizdir. İkinci basamağa geçin.`}; },
      i_aden:R=>{ if(isArr(R)) return null; const f=R.f;
        if(f.rh!=='svt') return {text:'Bu ritimde adenozin endikasyonu yok.',pen:[10,'Endikasyonsuz adenozin']};
        f.aden=(f.aden||0)+1;
        if(pre==='tachyU') return {text:'Adenozin: birkaç saniyelik AV blok, SVT yeniden başladı. Unstabil hastada kardiyoversiyonu geciktirmeyin.'};
        if(f.aden===1) return {text:'Adenozin 6 mg hızlı IV + SF ile itildi: birkaç saniyelik AV blok, SVT yeniden başladı. 12 mg verilebilir.'};
        f.rh='st'; R.v.hr=92; f.convT=R.t; return {text:'Adenozin 12 mg: sinüs ritmine döndü, 92/dk.'}; },
      i_vagal:R=>{ if(isArr(R)) return {text:'Arrestte vagal manevranın yeri yok.',pen:[5,'Arrestte vagal manevra']};
        if(R.f.rh!=='svt') return {text:'Vagal manevra endikasyonu yok.',pen:[5,'Endikasyonsuz vagal manevra']};
        R.f.vagal=1; return {text:'Modifiye Valsalva manevrası yapıldı: ritim değişmedi.'}; },
      i_dilt:R=>{ if(isArr(R)) return null; const f=R.f;
        if(pre==='tachyS'&&f.rh==='svt'){ f.rh='st'; R.v.hr=92; f.convT=R.t; return {text:'Diltiazem 0,25 mg/kg: sinüs ritmine döndü, 92/dk.'+(f.aden?'':' (Adenozin ilk basamaktır.)')}; }
        return null; } },
    find:{
      k_resp:R=>post(R)?'Yanıtsız (GKS 6), spontan solunum yüzeyel, karotis nabzı var.':d.resp,
      o_hist:d.hist,
      t_ecg12:R=>{ if(post(R)){ R.f.ecgPost=1; return d.ecgPost; } return R.f.rh==='paced'?'Pace ritmi 70/dk; her spike’ı geniş QRS izliyor.':R.f.rh==='st'?'Sinüs taşikardisi; taşikardi sonlandı.':d.ecgPre; },
      t_abg:R=>R.f.rosc?(d.abgPost||'pH 7.24, pCO₂ 48, laktat 4.6 mmol/L, K 4.2, iCa 1.12, glukoz 172.'):R.f.arrest?'pH 7.12, pCO₂ 58, laktat 7.1 mmol/L, K 4.4, iCa 1.10.':d.abgPre,
      t_echo:R=>R.f.arrest?(d.echoArr||'Koordinasyonsuz ya da zayıf kardiyak hareket; perikard temiz, sağ ventrikül dilate değil.'):d.echo||'Perikard temiz, EF ≈ %45.',
      t_glu:'Kan şekeri 164 mg/dL.',t_temp:'36,3 °C.',
      p_neuro:'GKS 6 (E1 V1 M4); pupiller izokorik ve reaktif. Komada: ileri havayolu ve sıcaklık kontrolü.'},
    crit:megaCrit(d),
    hints:[PRE_HINT[pre],...[...new Set(d.seq.map(r=>RH[r].shock?'s':'n'))].map(k=>k==='s'?'VF / nabızsız VT: şok, ardından ritme bakmadan 2 dk KPR. Adrenalin 2. şoktan sonra, amiodaron 300 mg 3. şoktan sonra.':'NEA / asistoli: adrenalini hemen verin ve 5H–5T’yi sayın. Ritim değişebilir; şoktan önce mutlaka ritme bakın.'),
      'ROSC sonrası: ileri havayolu + kapnografi, TA, 12 derivasyon EKG, SpO₂ titrasyonu, laboratuvar, sıcaklık kontrolü.']};
  return s;
}
