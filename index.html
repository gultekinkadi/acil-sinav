<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acil Tıp Sınav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface-2:#faf9f6; --ink:#1b1e23; --muted:#646a73; --line:#e2dfd8; --line-2:#ece9e3;
  --accent:#a8231c; --accent-soft:#f7e6e4; --accent-ink:#ffffff;
  --ok:#1d7349; --ok-soft:#e3f2ea; --warn:#9a6200; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe5e3;
  --info:#24548f; --info-soft:#e4edf8;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 4px 16px rgba(20,20,20,.05);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171a; --surface:#1d2024; --surface-2:#22262b; --ink:#ebedf0; --muted:#9aa1ab; --line:#2f343a; --line-2:#292d32;
    --accent:#e0574e; --accent-soft:#3a2120; --accent-ink:#ffffff;
    --ok:#4cc38a; --ok-soft:#1b3027; --warn:#e3a33b; --warn-soft:#352a17; --bad:#ef6a61; --bad-soft:#3a2120;
    --info:#7fb0ec; --info-soft:#1d2a3a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}

/* Layout */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
nav.tabs{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{font-size:13px;color:var(--muted);text-align:right;line-height:1.25}
.who b{color:var(--ink);font-weight:600;display:block}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.015em}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--muted);margin-top:2px;font-size:14px}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 5px;color:var(--ink)}
.field{margin-bottom:14px}
input[type=text],input[type=email],input[type=number],input[type=datetime-local],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:14px}
.check input{margin-top:3px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.edgrid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.edgrid{grid-template-columns:1fr}}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.list{display:flex;flex-direction:column;gap:10px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.badge.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{text-align:center;color:var(--muted);padding:40px 16px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* Table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}

/* Question display */
.q-stem{white-space:pre-wrap;font-size:16px;line-height:1.6}
.q-img{display:block;max-width:100%;max-height:420px;border-radius:8px;border:1px solid var(--line);margin:10px 0;cursor:zoom-in;background:var(--surface-2)}
.q-img.thumb{max-height:110px;max-width:180px;margin:6px 0}
.case-box{border-left:3px solid var(--info);background:var(--info-soft);padding:12px 14px;border-radius:0 8px 8px 0;margin-bottom:14px}
.case-box .lbl{font-size:12px;font-weight:700;color:var(--info);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.case-box .txt{white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 13px;cursor:pointer;width:100%;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--muted)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt .T{padding-top:2px;white-space:pre-wrap}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.static{cursor:default}

/* Exam taking */
.take{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
@media (max-width:860px){.take{grid-template-columns:1fr}}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:860px){.navgrid{grid-template-columns:repeat(10,1fr)}}
.nb{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:7px;height:34px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);font-variant-numeric:tabular-nums}
.nb.ans{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.nb.cur{outline:2px solid var(--accent);outline-offset:1px}
.nb.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.timer{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:20px;padding:4px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.savestate{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* Bank */
.qitem{padding:12px 14px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line-2)}
.qitem:last-child{border-bottom:0}
.qitem .body{flex:1;min-width:0}
.qitem .stem{white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.case-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.case-head{padding:12px 14px;background:var(--info-soft);display:flex;gap:12px;align-items:flex-start}
.case-head .txt{white-space:pre-wrap;font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.case-sub{padding-left:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}

/* Havuzlar */
.pools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink);white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip .n{color:var(--muted);font-weight:400;margin-left:6px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .n{color:inherit;opacity:.85}
.chip.add{border-style:dashed;color:var(--muted)}
.pool-act{display:inline-flex;gap:2px;margin-left:4px}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;margin-bottom:10px;background:var(--accent-soft);border-radius:var(--r)}
.qcheck{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none;cursor:pointer}
.case-head .qcheck{margin-top:2px}
.selall{align-items:center;white-space:nowrap;padding:0 6px;font-weight:500}
.selall input{margin-top:0;width:16px;height:16px}
@media (max-width:600px){.qitem,.case-head{flex-wrap:wrap}.qitem .body,.case-head>.grow{flex:1 1 calc(100% - 40px)}.qitem>.row,.case-head>.row{margin-left:28px}}

/* Picker */
.pick{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pick .pr{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line-2);align-items:flex-start;cursor:pointer}
.pick .pr:hover{background:var(--surface-2)}
.pick .pr.case{background:var(--info-soft);font-weight:600}
.pick .pr.sub{padding-left:34px}
.pick .pr input{margin-top:4px;accent-color:var(--accent)}
.pick .pr .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(720px,100%);max-height:92vh;overflow:auto}
.modal.narrow{width:min(460px,100%)}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2}
.modal-h h2{margin:0}
.modal-b{padding:18px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.optedit{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.optedit .L{width:24px;font-weight:700;color:var(--muted);text-align:center}
.optedit input[type=radio]{accent-color:var(--ok);width:18px;height:18px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:grid;place-items:center;cursor:zoom-out;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}

/* Toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:9px;font-size:14px;box-shadow:var(--shadow);animation:tin .2s ease}
.toast.err{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* Login */
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:min(420px,100%);padding:30px;text-align:center}
.login .mark{width:52px;height:52px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-weight:700;font-size:18px}
.gbtn{width:100%;justify-content:center;padding:11px;margin-top:18px}
.spinner{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* Footer credit */
footer.credit{text-align:center;padding:18px 0 26px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
footer.credit svg{width:16px;height:16px}

/* Score ring */
.scorebox{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.bigscore{font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;min-width:60px}
.bar>span{display:block;height:100%;background:var(--ok)}
.qrev{padding:16px;border-bottom:1px solid var(--line-2)}
.qrev:last-child{border-bottom:0}
.expl{margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:14px;white-space:pre-wrap}
.openans{white-space:pre-wrap;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2);min-height:44px}
</style>
</head>

<div id="app"><div class="spinner"></div></div>

<script type="module">
/* ==========================================================================

   ========================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCYYmTVUcYWg4ble5Cxstysnu3U1lpFP_o",
  authDomain: "acil-sinav.firebaseapp.com",
  projectId: "acil-sinav",

// Yönetici e-postaları (firestore.rules içindeki listeyle aynı olmalı)
const ADMIN_EMAILS = ["gultekinkadi@gmail.com", "gaziaciles@gmail.com"];
const SITE_TITLE = "Acil Tıp Sınav";
const SITE_SUB = "Gazi Üniversitesi Acil Tıp AD";
/* ========================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, collection, query, where,
  serverTimestamp, Timestamp, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $app = document.getElementById("app");
const LET = ["A","B","C","D","E"];

/* ---------------- yardımcılar ---------------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g,"").slice(0,20);
const tsMs = t => t ? (t.toMillis ? t.toMillis() : (t instanceof Date ? t.getTime() : Number(t))) : null;
const fmtDT = t => { const m = tsMs(t); if (!m) return "—"; return new Date(m).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); };
const toLocalInput = ms => { const d = new Date(ms); const p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const r1 = n => Math.round(n*10)/10;
const fmtNum = n => (Math.round(n*100)/100).toLocaleString("tr-TR");
const trLower = s => String(s||"").toLocaleLowerCase("tr-TR");
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const r=new Uint32Array(1); crypto.getRandomValues(r); const j=r[0]%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(msg, err){ const el=document.createElement("div"); el.className="toast"+(err?" err":""); el.textContent=msg; document.getElementById("toast").appendChild(el); setTimeout(()=>el.remove(), err?5000:2600); }
function fail(e, msg){ console.error(e); toast((msg||"İşlem başarısız")+(e?.code?` (${e.code})`:""), true); }

function modal(html, cls=""){
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal ${cls}">${html}</div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener("mousedown", e=>{ if(e.target===bg) close(); });
  bg.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click", close));
  return { el: bg.firstElementChild, close };
}
function confirmDlg(title, body, okLabel="Onayla", danger=false){
  return new Promise(res=>{
    const m=modal(`<div class="modal-h"><h2>${esc(title)}</h2></div><div class="modal-b">${body}</div>
      <div class="modal-f"><button class="btn" data-x>Vazgeç</button><button class="btn ${danger?"danger":"primary"}" data-ok>${esc(okLabel)}</button></div>`,"narrow");
    m.el.querySelector("[data-x]").onclick=()=>{m.close();res(false)};
    m.el.querySelector("[data-ok]").onclick=()=>{m.close();res(true)};
  });
}
function lightbox(src){ const d=document.createElement("div"); d.className="lightbox"; d.innerHTML=`<img src="${src}">`; d.onclick=()=>d.remove(); document.body.appendChild(d); }
document.addEventListener("click", e=>{ const im=e.target.closest("img.q-img"); if(im && im.src) lightbox(im.src); });

/* Görseller: Firestore'da sıkıştırılmış JPEG olarak tutulur (Storage gerektirmez) */
const imgCache = new Map();
async function getImg(id){
  if(!id) return null;
  if(imgCache.has(id)) return imgCache.get(id);
  const p = getDoc(doc(db,"images",id)).then(s=>s.exists()?s.data().data:null).catch(()=>null);
  imgCache.set(id,p); return p;
}
function imgTag(id, thumb){ return id ? `<img class="q-img${thumb?" thumb":""}" data-img="${esc(id)}" alt="">` : ""; }
async function hydrateImages(root=document){
  for(const im of root.querySelectorAll("img[data-img]")){ if(im.src) continue; const d=await getImg(im.dataset.img); if(d) im.src=d; }
}
function compressImage(file, maxDim=1500){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>{
      let {width:w,height:h}=im; const s=Math.min(1,maxDim/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d");
      x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h);
      let q=.85, out=c.toDataURL("image/jpeg",q);
      while(out.length>700000 && q>.4){ q-=.1; out=c.toDataURL("image/jpeg",q); }
      if(out.length>950000) return rej(new Error("Görsel çok büyük"));
      res(out);
    }; im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

async function loadBank(){
  const [qs,cs,ps]=await Promise.all([getDocs(collection(db,"questions")),getDocs(collection(db,"cases")),getDocs(collection(db,"pools"))]);
  S.pools={}; ps.docs.forEach(d=>S.pools[d.id]={id:d.id,...d.data()});
  S.questions=qs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(tsMs(a.createdAt)||0)-(tsMs(b.createdAt)||0));
  S.cases={}; cs.docs.forEach(d=>S.cases[d.id]={id:d.id,...d.data()});
}
async function loadExams(){ const s=await getDocs(collection(db,"exams")); S.exams=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(tsMs(b.createdAt)||0)-(tsMs(a.createdAt)||0)); }
async function loadResidents(){ const s=await getDocs(collection(db,"residents")); S.residents=s.docs.map(d=>({email:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name),"tr")); }
function topics(){ return [...new Set(S.questions.map(q=>q.topic).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"tr")); }
// Bankayı sıralı bloklar halinde döndürür: vakalar (alt sorularıyla) ve tek sorular
function bankBlocks(list=S.questions){
  const blocks=[]; const seen=new Set();
  for(const q of list){
    if(q.caseId && S.cases[q.caseId]){
      if(seen.has(q.caseId)) continue; seen.add(q.caseId);
      blocks.push({kind:"case", c:S.cases[q.caseId], qs:list.filter(x=>x.caseId===q.caseId)});
    } else blocks.push({kind:"q", q});
  }
  return blocks;
}

function examState(e){
  const now=Date.now();
  if(!e.published) return ["Taslak",""];
  if(now<tsMs(e.startAt)) return ["Planlandı","info"];
  if(now>tsMs(e.endAt)) return [e.resultsReleased?"Sonuçlar yayında":"Kapandı", e.resultsReleased?"ok":"warn"];
  return ["Açık","acc"];
}

  paint(`<div class="page-head"><div><h1>Sınavlar</h1><div class="sub">Sınav oluşturun, yayınlayın, sonuçları değerlendirin.</div></div>
    <button class="btn primary" id="newExam">+ Yeni sınav</button></div>
    <div class="list">${cards||`<div class="card empty">Henüz sınav yok. Önce Soru Bankası'na soru ekleyin, sonra yeni sınav oluşturun.</div>`}</div>`);
  document.getElementById("newExam").onclick=()=>go("examEdit",{id:null});

  $app.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>go("results",{id:b.dataset.res}));
  $app.querySelectorAll("[data-pub]").forEach(b=>b.onclick=async()=>{
    const e=S.exams.find(x=>x.id===b.dataset.pub);

  });
}

async function viewExamEdit(id){
  paint(`<div class="spinner"></div>`);
  await loadBank();
  let ex=null, key=null, attCount=0;
  if(id){
    const [a,b,c]=await Promise.all([getDoc(doc(db,"exams",id)),getDoc(doc(db,"examKeys",id)),getDocs(query(collection(db,"attempts"),where("examId","==",id)))]);
    ex=a.exists()?a.data():null; key=b.exists()?b.data():null; attCount=c.size;
  }
  const now=Date.now();
  const D={ title:ex?.title||"", description:ex?.description||"", durationMin:ex?.durationMin||40,
    startAt:tsMs(ex?.startAt)||now, endAt:tsMs(ex?.endAt)||now+7*864e5,
    shuffleQ:ex?ex.shuffleQ:true, shuffleO:ex?ex.shuffleO:true, penalty:ex?.penalty||0, published:ex?.published||false,
    sel:new Set((ex?.items||[]).map(i=>i.qid)) };
  // sınavda olup bankadan silinmiş sorular
  const orphan=(ex?.items||[]).filter(i=>!S.questions.find(q=>q.id===i.qid));
  let filt="", topicF="", poolF=id?"":(lsGet("bankPool")||"");
  if(poolF && poolF!==NOPOOL && !S.pools[poolF]) poolF="";

  paint(`<div class="page-head"><div><h1>${id?"Sınavı düzenle":"Yeni sınav"}</h1>
      <div class="sub">Sorular kaydetme anında sınava kopyalanır; bankada sonradan yapılan değişiklik için sınavı yeniden kaydedin.</div></div>
      <div class="row"><button class="btn" id="cancel">Vazgeç</button>${id?`<button class="btn danger" id="del">Sil</button>`:""}<button class="btn primary" id="save">Kaydet</button></div></div>
    ${attCount?`<div class="card pad" style="margin-bottom:14px;border-color:var(--warn)"><b style="color:var(--warn)">Dikkat:</b> Bu sınava ${attCount} katılım var. Soruları değiştirmek mevcut cevapların puanlamasını bozabilir; yalnızca tarih/süre gibi ayarları değiştirmeniz önerilir.</div>`:""}
    <div class="edgrid">
      <div class="card pad">
        <div class="field"><label class="f">Sınav adı</label><input type="text" id="e_title" value="${esc(D.title)}" placeholder="örn. Ekim 2026 Toksikoloji Sınavı"></div>
        <div class="field"><label class="f">Açıklama (isteğe bağlı)</label><textarea id="e_desc" style="min-height:60px">${esc(D.description)}</textarea></div>
        <div class="grid2"><div class="field"><label class="f">Süre (dakika)</label><input type="number" id="e_dur" min="1" max="600" value="${D.durationMin}"></div>
          <div class="field"><label class="f">Yanlış cezası</label><select id="e_pen"><option value="0">Yok</option><option value="0.25" ${D.penalty==0.25?"selected":""}>4 yanlış 1 doğru</option><option value="0.2" ${D.penalty==0.2?"selected":""}>5 yanlış 1 doğru</option></select></div></div>
        <div class="field"><label class="f">Başlama açılışı</label><input type="datetime-local" id="e_start" value="${toLocalInput(D.startAt)}"></div>
        <div class="field"><label class="f">Son başlama / kapanış</label><input type="datetime-local" id="e_end" value="${toLocalInput(D.endAt)}">
          <div class="small muted" style="margin-top:4px">Asistan bu aralıkta istediği an başlar; süre başladığı andan itibaren işler.</div></div>
        <div class="field"><label class="check"><input type="checkbox" id="e_sq" ${D.shuffleQ?"checked":""}> Soru sırasını her asistana karıştır <span class="muted small">(vakanın soruları birlikte kalır)</span></label></div>
        <div class="field"><label class="check"><input type="checkbox" id="e_so" ${D.shuffleO?"checked":""}> Şık sırasını karıştır</label></div>
        <div class="field"><label class="check"><input type="checkbox" id="e_pub" ${D.published?"checked":""}> Yayında (asistanlar görebilir)</label></div>
        <div class="card pad" style="background:var(--surface-2);box-shadow:none" id="summary"></div>
      </div>
      <div>
        <div class="toolbar"><select id="pp" style="width:auto"><option value="">Tüm havuzlar</option>${poolList().map(p=>`<option value="${p.id}" ${poolF===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}${S.questions.some(q=>poolOf(q)===NOPOOL)?`<option value="${NOPOOL}" ${poolF===NOPOOL?"selected":""}>Havuzsuz</option>`:""}</select><input type="search" id="pf" placeholder="Soru ara…"><select id="pt"><option value="">Tüm konular</option>${topics().map(t=>`<option>${esc(t)}</option>`).join("")}</select>
          <button class="btn sm" id="selAll">Görünenleri seç</button><button class="btn sm" id="selNone">Temizle</button></div>
        ${orphan.length?`<div class="small" style="color:var(--warn);margin-bottom:8px">${orphan.length} soru bankadan silinmiş; kaydederseniz sınavdan çıkarılır.</div>`:""}
        <div class="pick" id="pick"></div>
      </div>
    </div>`);

  const visible = q => (!poolF || poolOf(q)===poolF) && (!topicF || q.topic===topicF) && (!filt || trLower(q.stem+" "+(q.topic||"")+" "+(S.cases[q.caseId]?.title||"")+" "+(S.cases[q.caseId]?.text||"")).includes(filt));
  function drawPick(){
    const blocks=bankBlocks(S.questions.filter(visible));
    const row=(q,sub)=>`<label class="pr ${sub?"sub":""}"><input type="checkbox" data-q="${q.id}" ${D.sel.has(q.id)?"checked":""}>
      <span class="t">${esc(q.stem)}</span>${!poolF&&q.poolId&&S.pools[q.poolId]?`<span class="badge acc">${esc(poolName(q.poolId))}</span>`:""}<span class="badge">${q.type==="open"?"Açık uçlu":"ÇS"}</span>${q.topic?`<span class="badge">${esc(q.topic)}</span>`:""}${q.imageId?`<span class="badge info">Görsel</span>`:""}</label>`;
    document.getElementById("pick").innerHTML = blocks.length ? blocks.map(b=> b.kind==="q" ? row(b.q) :

    ).join("") : `<div class="empty">Soru bulunamadı.</div>`;
    document.querySelectorAll("#pick [data-q]").forEach(c=>c.onchange=()=>{ c.checked?D.sel.add(c.dataset.q):D.sel.delete(c.dataset.q); drawPick(); });
    document.querySelectorAll("#pick [data-case]").forEach(c=>c.onchange=()=>{ S.questions.filter(q=>q.caseId===c.dataset.case).forEach(q=>c.checked?D.sel.add(q.id):D.sel.delete(q.id)); drawPick(); });
    drawSummary();
  }
  function drawSummary(){
    const qs=S.questions.filter(q=>D.sel.has(q.id));
    const mcq=qs.filter(q=>q.type!=="open").length, open=qs.length-mcq, pts=qs.reduce((s,q)=>s+(Number(q.points)||1),0);
    const img=qs.filter(q=>q.imageId).length, cs=new Set(qs.map(q=>q.caseId).filter(Boolean)).size;
    const byPool={}; qs.forEach(q=>{ const n=poolName(poolOf(q)===NOPOOL?null:q.poolId); byPool[n]=(byPool[n]||0)+1; });
    const pl=Object.entries(byPool);
    document.getElementById("summary").innerHTML=`<b>${qs.length} soru seçildi</b><div class="small muted">${mcq} çoktan seçmeli · ${open} açık uçlu · ${cs} vaka · ${img} görselli<br>Toplam ${fmtNum(pts)} puan${pl.length>1||(pl.length&&pl[0][0]!=="Havuzsuz")?`<br>${pl.map(([n,c])=>`${esc(n)}: ${c}`).join(" · ")}`:""}</div>`;
  }
  drawPick();
  document.getElementById("pf").oninput=e=>{ filt=trLower(e.target.value); drawPick(); };

  document.getElementById("pt").onchange=e=>{ topicF=e.target.value; drawPick(); };
  document.getElementById("selAll").onclick=()=>{ S.questions.filter(visible).forEach(q=>D.sel.add(q.id)); drawPick(); };
  document.getElementById("selNone").onclick=()=>{ D.sel.clear(); drawPick(); };
  document.getElementById("cancel").onclick=()=>go("exams");

    if(!(st<en)) return toast("Kapanış, açılıştan sonra olmalı",true);
    if(!D.sel.size) return toast("En az bir soru seçin",true);
    const chosen=S.questions.filter(q=>D.sel.has(q.id)); // banka sırası (vakalar bitişik)
    const ordered=bankBlocks(chosen).flatMap(b=>b.kind==="q"?[b.q]:b.qs);
    const items=[], cases={}, k={}, expl={};
    for(const q of ordered){
      const it={qid:q.id,type:q.type==="open"?"open":"mcq",stem:q.stem,points:Number(q.points)||1,topic:q.topic||""};
      if(q.imageId) it.imageId=q.imageId;
      if(q.caseId && S.cases[q.caseId]){ it.caseId=q.caseId; const c=S.cases[q.caseId]; cases[q.caseId]={title:c.title||"",text:c.text||"",...(c.imageId?{imageId:c.imageId}:{})}; }
      if(it.type==="mcq"){ it.options=q.options; k[q.id]=q.correct; }
      expl[q.id]=q.explanation||"";
      items.push(it);
    }
    const eid=id||newId();
    const data={title,description:document.getElementById("e_desc").value.trim(),durationMin:dur,
      startAt:Timestamp.fromMillis(st),endAt:Timestamp.fromMillis(en),
      shuffleQ:document.getElementById("e_sq").checked,shuffleO:document.getElementById("e_so").checked,
      penalty:Number(document.getElementById("e_pen").value)||0,published:document.getElementById("e_pub").checked,
      items,cases,updatedAt:serverTimestamp(),resultsReleased:ex?.resultsReleased||false};
    if(!id) data.createdAt=serverTimestamp();
    try{
      const b=writeBatch(db);
      b.set(doc(db,"exams",eid),data,{merge:true});
      b.set(doc(db,"examKeys",eid),{key:k,explanations:expl});
      await b.commit(); toast("Sınav kaydedildi"); go("exams");
    }catch(e){ fail(e,"Kaydedilemedi"); }
  };
}

/* ---------------- sayfadan ayrılma kaydı ---------------- */
const EV_LBL={away:"Sayfadan ayrıldı",open:"Sınavı açtı",reopen:"Sayfayı yeniden açtı"};
function awaySummary(att){
  const ev=(att?.events||[]).filter(e=>e.type==="away");
  const secs=ev.reduce((s,e)=>s+(e.d||0),0);
  return {n:ev.length, secs, reopen:(att?.events||[]).filter(e=>e.type==="reopen").length};
}
const fmtSec=s=>s<60?`${s} sn`:`${Math.floor(s/60)} dk ${s%60?(s%60)+" sn":""}`.trim();
function awayBadge(att){ const a=awaySummary(att); if(!a.n&&!a.reopen) return `<span class="badge ok">Yok</span>`;
  return `<span class="badge ${a.n>=3||a.secs>=60?"bad":"warn"}">${a.n}× · ${fmtSec(a.secs)}</span>${a.reopen?` <span class="badge">${a.reopen} yeniden açma</span>`:""}`; }

/* ---------------- puanlama ---------------- */
function deadlineOf(exam, att){
  const s=tsMs(att.startedAt); if(!s) return null;
  return Math.min(s+exam.durationMin*60000, tsMs(exam.endAt)+exam.durationMin*60000);
}
function isFinished(exam, att){ return att.status==="submitted" || (deadlineOf(exam,att)!=null && Date.now()>deadlineOf(exam,att)+120000); }
function scoreAttempt(exam, key, att){
  const r={c:0,w:0,e:0,mcqPts:0,openPts:0,pending:0,max:0,items:[]};
  const ans=att.answers||{}, os=att.openScores||{}, cm=att.comments||{};
  for(const it of exam.items){
    r.max+=it.points; const a=ans[it.qid];
    if(it.type==="mcq"){
      const correct=key?.key?.[it.qid]; let earned=0, res="e";
      if(a===undefined||a===null){ r.e++; }
      else if(a===correct){ r.c++; earned=it.points; res="c"; }
      else { r.w++; earned=-(exam.penalty||0)*it.points; res="w"; }
      r.mcqPts+=earned; r.items.push({qid:it.qid,type:"mcq",given:a??null,correct:correct??null,earned,max:it.points,res});
    } else {
      const txt=(a||"").trim(); let earned=os[it.qid];
      if(earned==null){ if(txt) r.pending++; earned= txt?null:0; }
      r.openPts+=earned||0; r.items.push({qid:it.qid,type:"open",given:txt,earned,max:it.points,comment:cm[it.qid]||""});
    }
  }
  r.total=r.mcqPts+r.openPts; r.pct=r.max?r.total/r.max*100:0; return r;
}
function gradeDoc(exam, key, att, sc){
  return { uid:att.uid, examId:att.examId, examTitle:exam.title, total:sc.total, max:sc.max, pct:sc.pct, c:sc.c, w:sc.w, e:sc.e,
    items:sc.items.map(i=>({...i, earned:i.earned??0, explanation:key?.explanations?.[i.qid]||""})), releasedAt:serverTimestamp() };
}

async function loadResultData(id){
  const [e,k,a]=await Promise.all([getDoc(doc(db,"exams",id)),getDoc(doc(db,"examKeys",id)),getDocs(query(collection(db,"attempts"),where("examId","==",id)))]);
  await loadResidents();
  return { exam:{id,...e.data()}, key:k.exists()?k.data():{key:{},explanations:{}}, atts:a.docs.map(d=>({id:d.id,...d.data()})) };
}

async function viewAttempt(examId, uid){

  const {exam,key,atts}=await loadResultData(examId);
  const att=atts.find(a=>a.uid===uid); if(!att){ toast("Katılım bulunamadı",true); return go("results",{id:examId}); }
  const res=S.residents.find(r=>r.email===(att.email||"").toLowerCase())||{name:att.name,email:att.email};
  const sc=scoreAttempt(exam,key,att);
  const os={...(att.openScores||{})}, cm={...(att.comments||{})};
  let prevCase=null;
  const qs=exam.items.map((it,i)=>{
    const a=att.answers?.[it.qid]; let caseHtml="";
    if(it.caseId && it.caseId!==prevCase){ const c=exam.cases[it.caseId]; caseHtml=`<div class="case-box"><div class="lbl">Vaka${c.title?": "+esc(c.title):""}</div><div class="txt">${esc(c.text)}</div>${imgTag(c.imageId)}</div>`; }
    prevCase=it.caseId||null;
    let body;

      const cor=key.key[it.qid];

        ${a==null?`<div class="small muted" style="margin-top:6px">Boş bırakıldı</div>`:""}`;
    } else {
      body=`<div class="small muted" style="margin:10px 0 4px">Asistanın cevabı</div><div class="openans">${esc(a||"")||`<span class="muted">Boş</span>`}</div>
        ${key.explanations?.[it.qid]?`<div class="expl"><b>Model cevap / not:</b> ${esc(key.explanations[it.qid])}</div>`:""}
        <div class="row" style="margin-top:10px"><label class="f" style="margin:0">Puan</label><input type="number" data-os="${it.qid}" min="0" max="${it.points}" step="0.5" value="${os[it.qid]??""}" style="width:90px" placeholder="—"><span class="muted">/ ${it.points}</span>
        <input type="text" data-cm="${it.qid}" value="${esc(cm[it.qid]||"")}" placeholder="Geri bildirim (asistan görür)" class="grow" style="min-width:200px"></div>`;
    }
    return `<div class="qrev">${caseHtml}<div class="qmeta"><span class="badge">Soru ${i+1}</span><span class="badge">${it.points} puan</span>${it.topic?`<span class="badge">${esc(it.topic)}</span>`:""}</div>

      <div class="stat"><div class="k">Yüzde</div><div class="v">%${r1(sc.pct)}</div></div></div>
    <h2>Sayfa hareketleri</h2><div class="small muted" style="margin:-6px 0 8px">Başka sekmeye/uygulamaya geçiş, ekran kilidi ve sayfanın yeniden açılması. ${awayBadge(att)}</div>
    <div class="tbl-wrap" style="margin-bottom:22px"><table><thead><tr><th>Saat</th><th>Olay</th><th class="num">Süre</th><th>Sınav başından itibaren</th></tr></thead><tbody>

    let bad=false;
    $app.querySelectorAll("[data-os]").forEach(i=>{ const it=exam.items.find(x=>x.qid===i.dataset.os); const v=i.value.trim();
      if(v===""){ delete os[i.dataset.os]; return; } const n=Number(v.replace(",",".")); if(isNaN(n)||n<0||n>it.points){ bad=true; i.style.borderColor="var(--bad)"; } else os[i.dataset.os]=n; });
    $app.querySelectorAll("[data-cm]").forEach(i=>{ const v=i.value.trim(); if(v) cm[i.dataset.cm]=v; else delete cm[i.dataset.cm]; });
    if(bad) return toast("Puan 0 ile soru puanı arasında olmalı",true);
    try{
      await updateDoc(doc(db,"attempts",att.id),{openScores:os,comments:cm});
      if(exam.resultsReleased && isFinished(exam,att)){ const a2={...att,openScores:os,comments:cm}; await setDoc(doc(db,"grades",att.id),gradeDoc(exam,key,a2,scoreAttempt(exam,key,a2))); }
      toast("Puanlar kaydedildi"); viewAttempt(examId,uid);
    }catch(e){ fail(e); }
  });
}

  return new Promise(res=>{
    const m=modal(`<div class="modal-h"><h2>${esc(title)}</h2></div><div class="modal-b"><label class="f">${esc(label)}</label><input type="text" id="pv" value="${esc(val)}" placeholder="${esc(ph)}"></div>
      <div class="modal-f"><button class="btn" data-x>Vazgeç</button><button class="btn primary" data-ok>Kaydet</button></div>`,"narrow");
    const i=m.el.querySelector("#pv"); i.focus(); i.select();
    const ok=()=>{ const v=i.value.trim(); if(!v) return toast("Ad boş olamaz",true); m.close(); res(v); };
    m.el.querySelector("[data-ok]").onclick=ok; i.onkeydown=e=>{ if(e.key==="Enter") ok(); };
    m.el.querySelector("[data-x]").onclick=()=>{ m.close(); res(null); };
  });
}
async function createPool(name){
  name=(name||"").trim(); if(!name) return null;
  const dup=poolList().find(p=>trLower(p.name)===trLower(name)); if(dup){ toast("Bu adda bir havuz zaten var; o seçildi"); return dup.id; }
  const id=newId(); await setDoc(doc(db,"pools",id),{name,createdAt:serverTimestamp()});
  S.pools[id]={id,name,createdAt:Timestamp.fromMillis(Date.now())}; return id;
}
async function newPoolDlg(){ const n=await promptDlg("Yeni havuz","Havuz adı","","örn. 2026 Haziran Sınavı"); if(!n) return null; try{ return await createPool(n); }catch(e){ fail(e); return null; } }
// "+ Yeni havuz…" seçeneği olan bir select'i bağlar
function bindPoolSelect(sel, onChange){
  let prev=sel.value;
  sel.onchange=async()=>{
    if(sel.value==="__new"){ const id=await newPoolDlg(); if(!id){ sel.value=prev; return; }
      const none=sel.querySelector('option[value=""]')?.textContent??null; sel.innerHTML=poolOptions(id,{none,withNew:true}); sel.value=id; }
    prev=sel.value; onChange&&onChange(sel.value);
  };
}
async function batchOps(ops){ for(let i=0;i<ops.length;i+=400){ const b=writeBatch(db); ops.slice(i,i+400).forEach(f=>f(b)); await b.commit(); } }
// Soruları (ve bağlı oldukları vakaları bütün olarak) havuza taşır
async function moveToPool(ids,target){
  const chosen=S.questions.filter(q=>ids.has(q.id));
  const caseIds=new Set(chosen.map(q=>q.caseId).filter(c=>c&&S.cases[c]));
  const all=new Map(chosen.map(q=>[q.id,q])); S.questions.filter(q=>caseIds.has(q.caseId)).forEach(q=>all.set(q.id,q));
  await batchOps([...[...all.keys()].map(id=>b=>b.update(doc(db,"questions",id),{poolId:target||null})),
    ...[...caseIds].map(id=>b=>b.update(doc(db,"cases",id),{poolId:target||null}))]);
  return {n:all.size, extra:all.size-chosen.length};
}

async function viewBank(){
  paint(`<div class="spinner"></div>`);
  await loadBank();
  let filt="", topicF="", typeF="", poolF=lsGet("bankPool")||"";
  if(poolF && poolF!==NOPOOL && !S.pools[poolF]) poolF="";
  const sel=new Set();
  paint(`<div class="page-head"><div><h1>Soru Bankası</h1><div class="sub" id="bcount"></div></div>
    <div class="row"><button class="btn" id="imp">Excel'den içe aktar</button><button class="btn" id="newCase">+ Vaka</button><button class="btn primary" id="newQ">+ Soru</button></div></div>
    <div class="pools" id="pools"></div>
    <div class="toolbar"><label class="check selall"><input type="checkbox" id="selAllCb"> <span id="selAllLbl">Tümünü seç</span></label><input type="search" id="bf" placeholder="Soru, vaka veya konu ara…">
      <select id="bt"><option value="">Tüm konular</option>${topics().map(t=>`<option>${esc(t)}</option>`).join("")}</select>
      <select id="by"><option value="">Tüm türler</option><option value="mcq">Çoktan seçmeli</option><option value="open">Açık uçlu</option></select>
</div>
    <div class="selbar hidden" id="selbar"></div>
    <div class="list" id="blist"></div>`);
  const vis=q=>(!poolF||poolOf(q)===poolF)&&(!topicF||q.topic===topicF)&&(!typeF||(q.type||"mcq")===typeF)&&(!filt||trLower(q.stem+" "+(q.topic||"")+" "+(S.cases[q.caseId]?.title||"")+" "+(S.cases[q.caseId]?.text||"")).includes(filt));
  const qRow=q=>`<div class="qitem"><input type="checkbox" class="qcheck" data-sel="${q.id}" ${sel.has(q.id)?"checked":""} aria-label="Seç"><div class="body"><div class="qmeta">${!poolF&&q.poolId&&S.pools[q.poolId]?`<span class="badge acc">${esc(poolName(q.poolId))}</span>`:""}<span class="badge ${q.type==="open"?"warn":""}">${q.type==="open"?"Açık uçlu":"Çoktan seçmeli"}</span>${q.topic?`<span class="badge">${esc(q.topic)}</span>`:""}<span class="badge">${q.points||1} puan</span>${q.type!=="open"?`<span class="badge ok">Doğru: ${LET[q.correct]}</span>`:""}</div>
    <div class="stem">${esc(q.stem)}</div>${imgTag(q.imageId,true)}</div>
    <div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-eq="${q.id}">Düzenle</button><button class="btn sm ghost" data-dup="${q.id}" title="Kopyala">⧉</button><button class="btn sm ghost danger" data-dq="${q.id}" title="Sil">✕</button></div></div>`;

  function drawPools(){
    const cnt={}; S.questions.forEach(q=>{ const p=poolOf(q); cnt[p]=(cnt[p]||0)+1; });
    const chip=(id,label,n)=>`<button class="chip ${poolF===id?"on":""}" data-pool="${id}">${esc(label)}<span class="n">${n||0}</span></button>`;
    const cur=poolF&&poolF!==NOPOOL?S.pools[poolF]:null;
    document.getElementById("pools").innerHTML=chip("","Tüm sorular",S.questions.length)+poolList().map(p=>chip(p.id,p.name,cnt[p.id])).join("")
      +(cnt[NOPOOL]||poolF===NOPOOL?chip(NOPOOL,"Havuzsuz",cnt[NOPOOL]):"")+`<button class="chip add" id="addPool">+ Yeni havuz</button>`
      +(cur?`<span class="pool-act"><button class="btn sm ghost" id="renPool">Yeniden adlandır</button><button class="btn sm ghost danger" id="delPool">Havuzu sil</button></span>`:"");
    document.querySelectorAll("#pools [data-pool]").forEach(b=>b.onclick=()=>{ poolF=b.dataset.pool; lsSet("bankPool",poolF); sel.clear(); drawPools(); draw(); });
    document.getElementById("addPool").onclick=async()=>{ const id=await newPoolDlg(); if(id){ poolF=id; lsSet("bankPool",id); sel.clear(); drawPools(); draw(); toast("Havuz oluşturuldu"); } };
    document.getElementById("renPool")?.addEventListener("click",async()=>{ const n=await promptDlg("Havuzu yeniden adlandır","Havuz adı",cur.name); if(!n) return;
      try{ await updateDoc(doc(db,"pools",cur.id),{name:n}); S.pools[cur.id].name=n; drawPools(); draw(); toast("Kaydedildi"); }catch(e){ fail(e); } });
    document.getElementById("delPool")?.addEventListener("click",()=>deletePool(cur));
  }
  async function deletePool(p){
    const qs=S.questions.filter(q=>q.poolId===p.id), cs=Object.values(S.cases).filter(c=>c.poolId===p.id);
    const m=modal(`<div class="modal-h"><h2>Havuzu sil</h2></div><div class="modal-b"><p style="margin-top:0"><b>${esc(p.name)}</b> havuzunda ${qs.length} soru${cs.length?` ve ${cs.length} vaka`:""} var.</p>
      ${qs.length||cs.length?`<label class="check" style="margin-bottom:8px"><input type="radio" name="dm" value="keep" checked> Soruları “Havuzsuz”a taşı, yalnız havuzu sil</label>
      <label class="check"><input type="radio" name="dm" value="all"> <span>Havuzu <b style="color:var(--bad)">içindeki tüm sorularla birlikte</b> sil</span></label>`:""}
      <p class="small muted">Daha önce kaydedilmiş sınavlar etkilenmez.</p></div>
      <div class="modal-f"><button class="btn" data-close>Vazgeç</button><button class="btn danger" id="dp">Sil</button></div>`,"narrow");
    m.el.querySelector("#dp").onclick=async()=>{
      const all=m.el.querySelector('[name=dm][value=all]')?.checked;
      try{ m.el.querySelector("#dp").disabled=true;
        await batchOps([...qs.map(q=>b=>all?b.delete(doc(db,"questions",q.id)):b.update(doc(db,"questions",q.id),{poolId:null})),
          ...cs.map(c=>b=>all?b.delete(doc(db,"cases",c.id)):b.update(doc(db,"cases",c.id),{poolId:null})), b=>b.delete(doc(db,"pools",p.id))]);
        m.close(); lsSet("bankPool",""); toast("Havuz silindi"); viewBank(); }catch(e){ fail(e); }
    };
  }
  function drawSel(){
    // "Tümünü seç" kutusu: görünenlerin hepsi seçiliyse işaretli, bir kısmıysa yarım
    const vq=S.questions.filter(vis), nSel=vq.filter(q=>sel.has(q.id)).length, cb=document.getElementById("selAllCb");
    cb.checked=vq.length>0&&nSel===vq.length; cb.indeterminate=nSel>0&&nSel<vq.length; cb.disabled=!vq.length;
    document.getElementById("selAllLbl").textContent=vq.length?`Tümünü seç (${vq.length})`:"Tümünü seç";
    const bar=document.getElementById("selbar"); bar.classList.toggle("hidden",!sel.size); if(!sel.size){ bar.innerHTML=""; return; }
    const visN=S.questions.filter(vis).length;
    bar.innerHTML=`<b>${sel.size} soru seçili</b>${sel.size<visN?`<button class="btn sm ghost" id="selAllBar">Tümünü seç (${visN})</button>`:""}<span class="grow"></span>
      <select id="mvp" style="width:auto">${poolOptions("",{none:"Havuzsuz",withNew:true}).replace('<option value="">','<option value="" disabled selected hidden>Havuza taşı…</option><option value="">')}</select>
      <button class="btn sm primary" id="mvGo">Taşı</button><button class="btn sm danger" id="delSel">Sil</button><button class="btn sm ghost" id="clrSel">Seçimi kaldır</button>`;
    const s=document.getElementById("mvp"); s.selectedIndex=0; bindPoolSelect(s);
    document.getElementById("mvGo").onclick=async()=>{ if(s.selectedIndex===0) return toast("Hedef havuzu seçin",true);
      try{ const r=await moveToPool(sel,s.value||null); toast(`${r.n} soru “${poolName(s.value)}” havuzuna taşındı${r.extra?` (vaka bütünlüğü için +${r.extra} soru)`:""}`); sel.clear(); viewBank(); }catch(e){ fail(e); } };
    document.getElementById("delSel").onclick=async()=>{ if(!await confirmDlg("Seçilenleri sil",`<p>${sel.size} soru bankadan silinir. Kaydedilmiş sınavlar etkilenmez.</p>`,"Sil",true)) return;
      try{ await batchOps([...sel].map(id=>b=>b.delete(doc(db,"questions",id)))); toast("Silindi"); sel.clear(); viewBank(); }catch(e){ fail(e); } };
    document.getElementById("clrSel").onclick=()=>{ sel.clear(); draw(); };
    document.getElementById("selAllBar")?.addEventListener("click",()=>{ S.questions.filter(vis).forEach(q=>sel.add(q.id)); draw(); });
  }
  function draw(){
    const list=S.questions.filter(vis);
    const blocks=bankBlocks(list);
    const emptyCases=Object.values(S.cases).filter(c=>!S.questions.some(q=>q.caseId===c.id)&&(!poolF||(c.poolId&&S.pools[c.poolId]?c.poolId:NOPOOL)===poolF)&&!topicF&&!typeF&&(!filt||trLower(c.title+" "+c.text).includes(filt))).map(c=>({kind:"case",c,qs:[]}));
    // bir havuz seçiliyken eklenme sırası (1. soru üstte); "Tüm sorular"da en yeni üstte
    const all=poolF?[...blocks,...emptyCases]:[...blocks,...emptyCases].reverse();
    const scope=poolF?S.questions.filter(q=>poolOf(q)===poolF).length:S.questions.length;
    document.getElementById("bcount").textContent=(poolF?`${poolName(poolF===NOPOOL?null:poolF)} · ${scope} soru`:`${S.questions.length} soru · ${Object.keys(S.cases).length} vaka · ${poolList().length} havuz`)+(list.length!==scope?` · ${list.length} gösteriliyor`:"");
    document.getElementById("blist").innerHTML=all.length?all.map(b=>b.kind==="q"?`<div class="card">${qRow(b.q)}</div>`:
      `<div class="case-card"><div class="case-head">${b.qs.length?`<input type="checkbox" class="qcheck" data-selcase="${b.c.id}" ${b.qs.every(q=>sel.has(q.id))?"checked":""} aria-label="Vakayı seç">`:""}<div class="grow" style="min-width:0"><div class="qmeta">${!poolF&&b.c.poolId&&S.pools[b.c.poolId]?`<span class="badge acc">${esc(poolName(b.c.poolId))}</span>`:""}<span class="badge info">Vaka</span><span class="badge">${b.qs.length} soru</span></div>
        <b>${esc(b.c.title||"(başlıksız vaka)")}</b><div class="txt">${esc(b.c.text)}</div>${imgTag(b.c.imageId,true)}</div>
        <div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-addq="${b.c.id}">+ Soru</button><button class="btn sm" data-ec="${b.c.id}">Düzenle</button><button class="btn sm ghost danger" data-dc="${b.c.id}">✕</button></div></div>
        <div class="case-sub">${b.qs.map(qRow).join("")}</div></div>`).join("")
      :`<div class="card empty">${!S.questions.length?"Soru bankası boş. “+ Soru” ile başlayın veya Excel'den toplu aktarın.":poolF&&!scope?"Bu havuz boş. “+ Soru” veya “Excel'den içe aktar” ile bu havuza soru ekleyin.":"Eşleşen soru yok."}</div>`;
    hydrateImages(document.getElementById("blist"));
    $app.querySelectorAll("[data-sel]").forEach(c=>c.onchange=()=>{ c.checked?sel.add(c.dataset.sel):sel.delete(c.dataset.sel); drawSel(); const cb=c.closest(".case-card")?.querySelector("[data-selcase]"); if(cb) cb.checked=S.questions.filter(q=>q.caseId===cb.dataset.selcase&&vis(q)).every(q=>sel.has(q.id)); });
    $app.querySelectorAll("[data-selcase]").forEach(c=>c.onchange=()=>{ S.questions.filter(q=>q.caseId===c.dataset.selcase&&vis(q)).forEach(q=>c.checked?sel.add(q.id):sel.delete(q.id)); draw(); });
    $app.querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>editQuestion(S.questions.find(q=>q.id===b.dataset.eq)));
    $app.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>{ const q=S.questions.find(x=>x.id===b.dataset.dup); editQuestion({...q,id:null}); });
    $app.querySelectorAll("[data-dq]").forEach(b=>b.onclick=async()=>{ if(!await confirmDlg("Soruyu sil","<p>Soru bankadan silinir. Daha önce kaydedilmiş sınavlardaki kopyası etkilenmez.</p>","Sil",true)) return;
      try{ await deleteDoc(doc(db,"questions",b.dataset.dq)); toast("Silindi"); viewBank(); }catch(e){ fail(e); } });
    $app.querySelectorAll("[data-addq]").forEach(b=>b.onclick=()=>editQuestion({caseId:b.dataset.addq,poolId:S.cases[b.dataset.addq]?.poolId||null}));
    $app.querySelectorAll("[data-ec]").forEach(b=>b.onclick=()=>editCase(S.cases[b.dataset.ec]));
    $app.querySelectorAll("[data-dc]").forEach(b=>b.onclick=async()=>{ const qs=S.questions.filter(q=>q.caseId===b.dataset.dc);
      if(!await confirmDlg("Vakayı sil",`<p>Vaka${qs.length?` ve bağlı <b>${qs.length} soru</b>`:""} bankadan silinir.</p>`,"Sil",true)) return;
      try{ const w=writeBatch(db); qs.forEach(q=>w.delete(doc(db,"questions",q.id))); w.delete(doc(db,"cases",b.dataset.dc)); await w.commit(); toast("Silindi"); viewBank(); }catch(e){ fail(e); } });
    drawSel();
  }
  drawPools(); draw();
  const curPool=()=>poolF&&poolF!==NOPOOL?poolF:null;
  document.getElementById("bf").oninput=e=>{ filt=trLower(e.target.value); draw(); };
  document.getElementById("bt").onchange=e=>{ topicF=e.target.value; draw(); };
  document.getElementById("by").onchange=e=>{ typeF=e.target.value; draw(); };
  document.getElementById("selAllCb").onchange=e=>{ const vq=S.questions.filter(vis); if(e.target.checked) vq.forEach(q=>sel.add(q.id)); else vq.forEach(q=>sel.delete(q.id)); draw(); };
  document.getElementById("newQ").onclick=()=>editQuestion({poolId:curPool()});
  document.getElementById("newCase").onclick=()=>editCase({poolId:curPool()});
  document.getElementById("imp").onclick=()=>importDialog(curPool());
}

function imageField(cur){
  return `<div class="field"><label class="f">Görsel (EKG, grafi, BT vb. — isteğe bağlı)</label>
    <div id="imgPrev">${cur?imgTag(cur,true):""}</div>
    <div class="row"><label class="btn sm">Görsel seç<input type="file" accept="image/*" id="imgIn" hidden></label><button class="btn sm ghost danger ${cur?"":"hidden"}" id="imgDel" type="button">Görseli kaldır</button></div></div>`;
}
function bindImageField(root, state){
  root.querySelector("#imgIn").onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    try{ state.newImg=await compressImage(f); state.imageId=null; root.querySelector("#imgPrev").innerHTML=`<img class="q-img thumb" src="${state.newImg}">`; root.querySelector("#imgDel").classList.remove("hidden"); }
    catch(err){ fail(err,"Görsel işlenemedi"); } };
  root.querySelector("#imgDel").onclick=()=>{ state.newImg=null; state.imageId=null; root.querySelector("#imgPrev").innerHTML=""; root.querySelector("#imgDel").classList.add("hidden"); };
}
async function persistImage(state){
  if(state.newImg){ const id=newId(); await setDoc(doc(db,"images",id),{data:state.newImg,createdAt:serverTimestamp()}); imgCache.set(id,Promise.resolve(state.newImg)); return id; }
  return state.imageId||null;
}

function editQuestion(q){
  const isNew=!q.id; const st={imageId:q.imageId||null,newImg:null};
  let type=q.type||"mcq";
  const opts=[...(q.options||[]),"","","","",""].slice(0,5);
  const caseOpts=Object.values(S.cases).map(c=>`<option value="${c.id}" ${q.caseId===c.id?"selected":""}>${esc(c.title||c.text.slice(0,50))}${c.poolId&&S.pools[c.poolId]?` (${esc(poolName(c.poolId))})`:""}</option>`).join("");
  const m=modal(`<div class="modal-h"><h2>${isNew?"Yeni soru":"Soruyu düzenle"}</h2><button class="btn sm ghost" data-close>✕</button></div>
    <div class="modal-b">
      <div class="grid2">
        <div class="field"><label class="f">Havuz</label><select id="q_pool">${poolOptions(q.poolId&&S.pools[q.poolId]?q.poolId:"",{withNew:true})}</select><div class="small muted hidden" id="poolNote" style="margin-top:4px">Vakaya bağlı soru, vakanın havuzunda durur.</div></div>
        <div class="field"><label class="f">Bağlı vaka</label><select id="q_case"><option value="">— Bağımsız soru —</option>${caseOpts}</select></div>
      </div>
      <div class="grid3">
        <div class="field"><label class="f">Tür</label><select id="q_type"><option value="mcq">Çoktan seçmeli</option><option value="open" ${type==="open"?"selected":""}>Açık uçlu</option></select></div>
        <div class="field"><label class="f">Konu</label><input type="text" id="q_topic" list="tlist" value="${esc(q.topic||"")}" placeholder="örn. Toksikoloji"><datalist id="tlist">${topics().map(t=>`<option value="${esc(t)}">`).join("")}</datalist></div>
        <div class="field"><label class="f">Puan</label><input type="number" id="q_pts" min="0.5" step="0.5" value="${q.points||1}"></div>
      </div>
      <div class="field"><label class="f">Soru kökü</label><textarea id="q_stem" style="min-height:110px">${esc(q.stem||"")}</textarea></div>
      ${imageField(q.imageId)}
      <div id="mcqBox" class="${type==="open"?"hidden":""}"><label class="f">Şıklar <span class="muted" style="font-weight:400">(doğru şıkkı işaretleyin; boş şıklar atlanır)</span></label>
        ${opts.map((o,j)=>`<div class="optedit"><input type="radio" name="cor" value="${j}" ${(q.correct??0)===j?"checked":""} title="Doğru cevap"><span class="L">${LET[j]}</span><input type="text" data-opt="${j}" value="${esc(o)}"></div>`).join("")}</div>
      <div class="field" style="margin-top:12px"><label class="f" id="explLbl">${type==="open"?"Model cevap / değerlendirme notu":"Açıklama (sonuçta asistana gösterilir)"}</label><textarea id="q_expl">${esc(q.explanation||"")}</textarea></div>
    </div>
    <div class="modal-f"><button class="btn" data-close>Vazgeç</button><button class="btn primary" id="qsave">Kaydet</button></div>`);
  hydrateImages(m.el); bindImageField(m.el, st);
  const poolSel=m.el.querySelector("#q_pool"), caseSel=m.el.querySelector("#q_case");
  bindPoolSelect(poolSel);
  const syncCase=()=>{ const c=S.cases[caseSel.value]; poolSel.disabled=!!c; m.el.querySelector("#poolNote").classList.toggle("hidden",!c);
    if(c) poolSel.value=c.poolId&&S.pools[c.poolId]?c.poolId:""; };
  caseSel.onchange=syncCase; syncCase();
  m.el.querySelector("#q_type").onchange=e=>{ type=e.target.value; m.el.querySelector("#mcqBox").classList.toggle("hidden",type==="open");
    m.el.querySelector("#explLbl").textContent=type==="open"?"Model cevap / değerlendirme notu":"Açıklama (sonuçta asistana gösterilir)"; };
  m.el.querySelector("#qsave").onclick=async()=>{
    const stem=m.el.querySelector("#q_stem").value.trim(); if(!stem) return toast("Soru kökü boş",true);
    const caseId=caseSel.value||null;
    const data={type,stem,topic:m.el.querySelector("#q_topic").value.trim(),points:Number(m.el.querySelector("#q_pts").value)||1,
      caseId,poolId:caseId?(S.cases[caseId]?.poolId||null):(poolSel.value&&poolSel.value!=="__new"?poolSel.value:null),explanation:m.el.querySelector("#q_expl").value.trim()};
    if(type==="mcq"){
      const raw=[...m.el.querySelectorAll("[data-opt]")].map(i=>i.value.trim()); const corRaw=Number(m.el.querySelector("[name=cor]:checked")?.value??0);
      if(!raw[corRaw]) return toast("İşaretli doğru şık boş",true);
      const kept=raw.map((t,j)=>({t,j})).filter(x=>x.t); if(kept.length<2) return toast("En az iki şık gerekli",true);
      data.options=kept.map(x=>x.t); data.correct=kept.findIndex(x=>x.j===corRaw);
    } else { data.options=null; data.correct=null; }
    try{
      const btn=m.el.querySelector("#qsave"); btn.disabled=true;
      data.imageId=await persistImage(st);
      const id=q.id||newId(); if(!q.id) data.createdAt=serverTimestamp(); data.updatedAt=serverTimestamp();
      await setDoc(doc(db,"questions",id),data,{merge:true}); m.close(); toast("Soru kaydedildi"); viewBank();
    }catch(e){ fail(e,"Kaydedilemedi"); m.el.querySelector("#qsave").disabled=false; }
  };
}
function editCase(c){

function importDialog(defPool){
  const m=modal(`<div class="modal-h"><h2>Excel'den soru aktar</h2><button class="btn sm ghost" data-close>✕</button></div>
    <div class="modal-b"><p style="margin-top:0">Şablonu indirin, her satıra bir soru yazın ve yükleyin. Görseller ve vakalar sonradan arayüzden eklenir.</p>
      <p class="small muted">Sütunlar: <span class="mono">Konu · Tür (ÇS/AU) · Soru · A · B · C · D · E · Doğru (A–E) · Puan · Açıklama</span></p>
      <div class="field"><label class="f">Hangi havuza aktarılsın?</label><select id="ip">${poolOptions(defPool||"",{withNew:true})}</select></div>
      <div class="row"><button class="btn" id="tpl">Şablonu indir</button><label class="btn primary">Dosya seç<input type="file" id="xf" accept=".xlsx,.xls,.csv" hidden></label></div>
      <div id="impRes" style="margin-top:14px"></div></div>`);
  const ip=m.el.querySelector("#ip"); bindPoolSelect(ip);
  m.el.querySelector("#tpl").onclick=()=>{
    const ws=XLSX.utils.aoa_to_sheet([["Konu","Tür","Soru","A","B","C","D","E","Doğru","Puan","Açıklama"],
      ["Toksikoloji","ÇS","Parasetamol zehirlenmesinde antidot hangisidir?","Flumazenil","N-asetilsistein","Nalokson","Fomepizol","Atropin","B",1,"NAC glutatyon depolarını yeniler."],
      ["Resüsitasyon","AU","VF'de ilk 3 dakikadaki yaklaşımı sırasıyla yazınız.","","","","","","",5,"Defibrilasyon, KPR, adrenalin zamanlaması…"]]);
    ws["!cols"]=[{wch:14},{wch:6},{wch:50},{wch:16},{wch:16},{wch:16},{wch:16},{wch:16},{wch:7},{wch:6},{wch:40}];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Sorular"); XLSX.writeFile(wb,"soru-sablonu.xlsx");
  };
  m.el.querySelector("#xf").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const wb=XLSX.read(await f.arrayBuffer()); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      const norm=s=>trLower(String(s).trim()); const pick=(r,...names)=>{ for(const k of Object.keys(r)) if(names.includes(norm(k))) return String(r[k]).trim(); return ""; };
      const ok=[], errs=[];
      rows.forEach((r,i)=>{
        const stem=pick(r,"soru","soru kökü"); if(!stem) return;
        const typ=norm(pick(r,"tür","tip"))==="au"||norm(pick(r,"tür","tip")).startsWith("açık")?"open":"mcq";
        const q={type:typ,stem,topic:pick(r,"konu"),points:Number(pick(r,"puan").replace(",","."))||1,explanation:pick(r,"açıklama","aciklama"),caseId:null,imageId:null};
        if(typ==="mcq"){
          const raw=LET.map(l=>pick(r,trLower(l))); const corL=pick(r,"doğru","dogru","cevap").toUpperCase(); const cj=LET.indexOf(corL);
          const kept=raw.map((t,j)=>({t,j})).filter(x=>x.t);
          if(cj<0||!raw[cj]){ errs.push(`Satır ${i+2}: doğru şık geçersiz`); return; }
          if(kept.length<2){ errs.push(`Satır ${i+2}: en az iki şık gerekli`); return; }
          q.options=kept.map(x=>x.t); q.correct=kept.findIndex(x=>x.j===cj);
        } else { q.options=null; q.correct=null; }
        ok.push(q);
      });
      m.el.querySelector("#impRes").innerHTML=`<div class="card pad" style="box-shadow:none"><b>${ok.length} soru aktarılmaya hazır</b>${errs.length?`<div class="small" style="color:var(--bad);margin-top:6px">${errs.map(esc).join("<br>")}</div>`:""}
        ${ok.length?`<div class="row" style="margin-top:10px"><button class="btn primary" id="doImp">Aktar</button></div>`:""}</div>`;
      m.el.querySelector("#doImp")?.addEventListener("click", async()=>{
        const poolId=ip.value&&ip.value!=="__new"?ip.value:null;
        try{ m.el.querySelector("#doImp").disabled=true; const t0=Date.now();
          await batchOps(ok.map((q,j)=>b=>b.set(doc(db,"questions",newId()),{...q,poolId,createdAt:Timestamp.fromMillis(t0+j)})));
          m.close(); lsSet("bankPool",poolId||""); toast(`${ok.length} soru “${poolName(poolId)}” havuzuna eklendi`); viewBank(); }catch(err){ fail(err); }
      });
    }catch(err){ fail(err,"Dosya okunamadı"); }
  };
}

async function viewHome(){

      <div class="row">${btn}</div></div></div>`;

    <div class="list">${info.length?info.map(card).join(""):`<div class="card empty">Şu an size açık bir sınav yok.</div>`}</div>`, "");

  $app.querySelectorAll("[data-rev]").forEach(b=>b.onclick=()=>go("review",{id:b.dataset.rev}));
  $app.querySelectorAll("[data-start]").forEach(b=>b.onclick=async()=>{
    const e=exams.find(x=>x.id===b.dataset.start);
    const ok=await confirmDlg("Sınava başla",`<p><b>${esc(e.title)}</b></p><ul style="padding-left:18px;margin:0">

      <li>Cevaplarınız otomatik kaydedilir; bağlantı koparsa kaldığınız yerden devam edebilirsiniz.</li><li>Süre bitince sınav otomatik teslim edilir.</li><li>Sınav sayfasından ayrılmalarınız (başka sekme, uygulama, ekran kilidi) kaydedilir ve sorumlu öğretim üyesine gösterilir.</li>
      ${e.penalty?`<li>Yanlış cevaplar doğruları götürür (${e.penalty===0.25?"4 yanlış 1 doğru":"5 yanlış 1 doğru"}).</li>`:""}</ul>`,"Başla");
    if(!ok) return;
    try{ await startAttempt(e); go("take",{id:e.id}); }catch(err){ fail(err,"Sınav başlatılamadı"); }
  });
}
async function startAttempt(e){
  // grupları oluştur (vaka soruları bitişik kalır)
  const groups=[]; let cur=null;
  for(const it of e.items){ if(it.caseId && cur && cur.caseId===it.caseId) cur.q.push(it.qid); else { cur={caseId:it.caseId||null,q:[it.qid]}; groups.push(cur); } }
  const order=(e.shuffleQ?shuffle(groups):groups).flatMap(g=>g.q);
  const optOrder={}; e.items.forEach(it=>{ if(it.type==="mcq"){ const idx=it.options.map((_,j)=>j); optOrder[it.qid]=e.shuffleO?shuffle(idx):idx; } });
  await setDoc(doc(db,"attempts",e.id+"_"+S.user.uid),{examId:e.id,uid:S.user.uid,email:S.email,name:S.resident?.name||S.user.displayName||"",
    status:"started",startedAt:serverTimestamp(),order,optOrder,answers:{},flags:{}});
}

/* =====================================================================
   ASİSTAN — SINAV EKRANI
   ===================================================================== */
function stopTake(){ if(T){ clearInterval(T.tick); clearTimeout(T.saveT); window.removeEventListener("beforeunload",T.unload); document.removeEventListener("keydown",T.keys);
  document.removeEventListener("visibilitychange",T.vis); window.removeEventListener("blur",T.vis); window.removeEventListener("focus",T.vis); } T=null; }
async function viewTake(id){
  stopTake();
  $app.innerHTML=`<div class="spinner"></div>`;
  const [es,as]=await Promise.all([getDoc(doc(db,"exams",id)),getDoc(doc(db,"attempts",id+"_"+S.user.uid))]);
  if(!es.exists()||!as.exists()){ toast("Sınav bulunamadı",true); return go("home"); }
  const exam={id,...es.data()}, att=as.data();
  if(isFinished(exam,att)){ toast("Bu sınav tamamlanmış"); return go("home"); }
  const byId={}; exam.items.forEach(it=>byId[it.qid]=it);
  const order=att.order.filter(q=>byId[q]);
  T={exam,att,order,byId,idx:0,answers:{...(att.answers||{})},flags:{...(att.flags||{})},events:[...(att.events||[])],away:null,deadline:deadlineOf(exam,att),dirty:false,saving:false,done:false};
  // açık kalmış (sayfa kapanırken bitmemiş) ayrılma kaydını kapat; açılışı kaydet
  const lastEv=T.events[T.events.length-1]; if(lastEv&&lastEv.type==="away"&&lastEv.d==null) lastEv.d=Math.max(0,Math.round((Date.now()-lastEv.t)/1000));
  T.events.push({type:T.events.length?"reopen":"open",t:Date.now()}); if(T.events.length>300) T.events=T.events.slice(-300);
  // ilk boş soruya git
  const firstEmpty=order.findIndex(q=>T.answers[q]==null||T.answers[q]===""); if(firstEmpty>0) T.idx=firstEmpty;

  $app.innerHTML=`<header class="top"><div class="top-in">
      <div class="brand"><div class="mark">AT</div><div>${esc(exam.title)}<small>${order.length} soru</small></div></div>
      <div class="top-right"><span class="savestate" id="sv">Kaydedildi</span><span class="timer" id="tm">--:--</span><button class="btn primary" id="finish">Sınavı bitir</button></div>
    </div></header>
    <main><div class="take">
      <aside class="card pad" style="position:sticky;top:76px">
        <div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Sorular</b><span class="small muted" id="cnt"></span></div>
        <div class="navgrid" id="nav"></div>
        <div class="legend"><span><i style="background:var(--ink)"></i>Cevaplandı</span><span><i style="background:var(--warn);border-radius:50%"></i>İşaretli</span></div>
        <div class="small muted" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line-2)">Sınav sırasında başka sekmeye/uygulamaya geçişler saat ve süreyle kaydedilir.</div>
      </aside>
      <section class="card pad" id="qv" style="min-height:360px"></section>
    </div></main>`;
  T.unload=e=>{ if(T&&(T.dirty||T.saving)){ e.preventDefault(); e.returnValue=""; } };
  // sekme/uygulama değişimi: ayrılınca hemen kaydet (geri dönmese de iz kalsın), dönünce süreyi yaz
  T.vis=()=>{ if(!T||T.done) return; const gone=document.hidden||!document.hasFocus();
    if(gone && !T.away){ T.away={type:"away",t:Date.now(),d:null}; T.events.push(T.away); saveNow().catch(()=>{}); }
    else if(!gone && T.away){ T.away.d=Math.max(1,Math.round((Date.now()-T.away.t)/1000)); const d=T.away.d; T.away=null; queueSave();
      toast(`Sayfadan ayrılmanız kaydedildi (${fmtSec(d)})`,true); } };
  document.addEventListener("visibilitychange",T.vis); window.addEventListener("blur",T.vis); window.addEventListener("focus",T.vis);
  window.addEventListener("beforeunload",T.unload);
  T.keys=e=>{ if(!T||e.target.closest("textarea,input")) return;
    const it=byId[order[T.idx]];
    if(e.key==="ArrowRight") move(1); else if(e.key==="ArrowLeft") move(-1);
    else if(it.type==="mcq"){ const k=e.key.toUpperCase(); const p=LET.indexOf(k); if(p>=0&&p<it.options.length){ choose(T.att.optOrder[it.qid][p]); } } };
  document.addEventListener("keydown",T.keys);
  document.getElementById("finish").onclick=()=>finish(false);
  drawNav(); drawQ(); tick(); T.tick=setInterval(tick,1000);
}
function answered(q){ const a=T.answers[q]; return a!=null && a!==""; }
function drawNav(){
  document.getElementById("nav").innerHTML=T.order.map((q,i)=>`<button class="nb ${answered(q)?"ans":""} ${T.flags[q]?"flag":""} ${i===T.idx?"cur":""}" data-i="${i}">${i+1}</button>`).join("");
  document.querySelectorAll("#nav .nb").forEach(b=>b.onclick=()=>{ T.idx=Number(b.dataset.i); drawNav(); drawQ(); });
  document.getElementById("cnt").textContent=`${T.order.filter(answered).length}/${T.order.length}`;
}
function drawQ(){
  const q=T.order[T.idx], it=T.byId[q], prev=T.idx>0?T.byId[T.order[T.idx-1]]:null;
  let caseHtml="";
  if(it.caseId){ const c=T.exam.cases[it.caseId]; const cont=prev&&prev.caseId===it.caseId;
    caseHtml=`<div class="case-box"><div class="lbl">Vaka${c.title?": "+esc(c.title):""}${cont?" (devam)":""}</div><div class="txt">${esc(c.text)}</div>${imgTag(c.imageId)}</div>`; }
  let body;
  if(it.type==="mcq"){
    const perm=T.att.optOrder[q]; const a=T.answers[q];
    body=`<div class="opts">${perm.map((orig,p)=>`<button class="opt ${a===orig?"sel":""}" data-o="${orig}"><span class="L">${LET[p]}</span><span class="T">${esc(it.options[orig])}</span></button>`).join("")}</div>
      ${a!=null?`<button class="btn sm ghost" id="clr" style="margin-top:8px">Seçimi temizle</button>`:""}`;
  } else {
    body=`<textarea id="oa" style="min-height:180px;margin-top:14px" placeholder="Cevabınızı yazın…">${esc(T.answers[q]||"")}</textarea>`;
  }
  const el=document.getElementById("qv");
  el.innerHTML=`${caseHtml}<div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="qmeta" style="margin:0"><span class="badge acc">Soru ${T.idx+1} / ${T.order.length}</span><span class="badge">${it.points} puan</span>${it.type==="open"?`<span class="badge warn">Açık uçlu</span>`:""}</div>
      <button class="btn sm ${T.flags[q]?"":"ghost"}" id="flg">${T.flags[q]?"★ İşaretli":"☆ Sonra bak"}</button></div>
    <div class="q-stem">${esc(it.stem)}</div>${imgTag(it.imageId)}${body}
    <div class="row" style="justify-content:space-between;margin-top:20px"><button class="btn" id="pv" ${T.idx===0?"disabled":""}>← Önceki</button>
      <span class="small muted">${it.type==="mcq"?"Klavye: A–E ile seç, ← → ile gez":""}</span>
      ${T.idx<T.order.length-1?`<button class="btn primary" id="nx">Sonraki →</button>`:`<button class="btn primary" id="nx">Bitir</button>`}</div>`;
  hydrateImages(el);
  el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>choose(Number(b.dataset.o)));
  el.querySelector("#clr")?.addEventListener("click",()=>{ delete T.answers[q]; queueSave(); drawNav(); drawQ(); });
  const ta=el.querySelector("#oa"); if(ta) ta.oninput=()=>{ T.answers[q]=ta.value; queueSave(); drawNavLight(); };
  el.querySelector("#flg").onclick=()=>{ T.flags[q]=!T.flags[q]; if(!T.flags[q]) delete T.flags[q]; queueSave(); drawNav(); drawQ(); };
  el.querySelector("#pv").onclick=()=>move(-1);
  el.querySelector("#nx").onclick=()=> T.idx<T.order.length-1?move(1):finish(false);
}
function drawNavLight(){ const b=document.querySelector(`#nav .nb[data-i="${T.idx}"]`); if(b) b.classList.toggle("ans",answered(T.order[T.idx])); document.getElementById("cnt").textContent=`${T.order.filter(answered).length}/${T.order.length}`; }
function move(d){ const n=T.idx+d; if(n<0||n>=T.order.length) return; T.idx=n; drawNav(); drawQ(); window.scrollTo({top:0,behavior:"smooth"}); }
function choose(orig){ const q=T.order[T.idx]; T.answers[q]=orig; queueSave(); drawNav(); drawQ(); }
function setSave(txt){ const s=document.getElementById("sv"); if(s) s.textContent=txt; }
function queueSave(){ T.dirty=true; setSave("Kaydediliyor…"); clearTimeout(T.saveT); T.saveT=setTimeout(saveNow,700); }
async function saveNow(extra={}){
  if(!T) return; clearTimeout(T.saveT);
  const t=T; t.saving=true; t.dirty=false;
  try{ await updateDoc(doc(db,"attempts",t.exam.id+"_"+S.user.uid),{answers:t.answers,flags:t.flags,events:t.events,updatedAt:serverTimestamp(),...extra}); if(T===t) setSave("Kaydedildi"); }
  catch(e){ t.dirty=true; if(T===t) setSave("Kaydedilemedi — tekrar denenecek"); console.error(e); if(!extra.status) t.saveT=setTimeout(saveNow,4000); throw e; }
  finally{ t.saving=false; }
}
function tick(){
  if(!T) return; const left=T.deadline-Date.now(); const el=document.getElementById("tm");
  const s=Math.max(0,Math.floor(left/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  el.textContent=(h?h+":":"")+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
  el.classList.toggle("low",s<300);
  if(s===300) toast("Son 5 dakika");
  if(left<=0 && !T.done) finish(true);
}
async function finish(auto){
  if(!T||T.done) return;
  if(!auto){
    const empty=T.order.filter(q=>!answered(q)).length, fl=Object.keys(T.flags).length;
    const ok=await confirmDlg("Sınavı bitir",`<p>${empty?`<b style="color:var(--warn)">${empty} soru boş.</b> `:"Tüm sorular cevaplandı. "}${fl?`${fl} soru işaretli. `:""}</p><p>Teslim ettikten sonra cevaplarınızı değiştiremezsiniz.</p>`,"Teslim et");
    if(!ok||!T) return;
  }
  T.done=true; clearInterval(T.tick);
  const exam=T.exam;
  try{ await saveNow({status:"submitted",submittedAt:serverTimestamp()}); }
  catch(e){ /* süre aşımı: son kaydedilen cevaplar değerlendirilir */ }
  stopTake();
  modal(`<div class="modal-h"><h2>${auto?"Süre doldu":"Sınav teslim edildi"}</h2></div><div class="modal-b"><p>${esc(exam.title)} için cevaplarınız kaydedildi. Sonuçlar yayınlandığında “Sınavlarım” sayfasında görebilirsiniz.</p></div>
    <div class="modal-f"><button class="btn primary" data-close id="okh">Tamam</button></div>`,"narrow").el.querySelector("#okh").addEventListener("click",()=>go("home"));
  go("home");
}

/* =====================================================================
   ASİSTAN — SONUÇ İNCELEME
   ===================================================================== */
async function viewReview(id){
  paint(`<div class="spinner"></div>`,"");
  const [es,gs,as]=await Promise.all([getDoc(doc(db,"exams",id)),getDoc(doc(db,"grades",id+"_"+S.user.uid)),getDoc(doc(db,"attempts",id+"_"+S.user.uid))]);
  if(!es.exists()||!gs.exists()){ toast("Sonuç bulunamadı",true); return go("home"); }
  const exam=es.data(), g=gs.data(), att=as.exists()?as.data():null;
  const gi={}; g.items.forEach(i=>gi[i.qid]=i);
  const order=(att?.order||exam.items.map(i=>i.qid)).filter(q=>exam.items.find(i=>i.qid===q));
  const byId={}; exam.items.forEach(i=>byId[i.qid]=i);
  let prevCase=null;
  const qs=order.map((q,n)=>{
    const it=byId[q], r=gi[q]||{}; let caseHtml="";
    if(it.caseId&&it.caseId!==prevCase){ const c=exam.cases[it.caseId]; caseHtml=`<div class="case-box"><div class="lbl">Vaka${c.title?": "+esc(c.title):""}</div><div class="txt">${esc(c.text)}</div>${imgTag(c.imageId)}</div>`; }
    prevCase=it.caseId||null;
    let body, badge;
    if(it.type==="mcq"){
      const perm=att?.optOrder?.[q]||it.options.map((_,j)=>j);
      body=`<div class="opts">${perm.map((orig,p)=>`<div class="opt static ${orig===r.correct?"right":(orig===r.given?"wrong":"")}"><span class="L">${LET[p]}</span><span class="T">${esc(it.options[orig])}</span></div>`).join("")}</div>`;
      badge=r.res==="c"?`<span class="badge ok">Doğru</span>`:r.res==="w"?`<span class="badge bad">Yanlış</span>`:`<span class="badge">Boş</span>`;
    } else {
      body=`<div class="small muted" style="margin:10px 0 4px">Cevabınız</div><div class="openans">${esc(r.given||"")||`<span class="muted">Boş</span>`}</div>${r.comment?`<div class="expl"><b>Geri bildirim:</b> ${esc(r.comment)}</div>`:""}`;
      badge=`<span class="badge info">${fmtNum(r.earned||0)} / ${it.points}</span>`;
    }
    return `<div class="qrev">${caseHtml}<div class="qmeta"><span class="badge">Soru ${n+1}</span>${badge}${it.topic?`<span class="badge">${esc(it.topic)}</span>`:""}</div>
      <div class="q-stem">${esc(it.stem)}</div>${imgTag(it.imageId)}${body}${r.explanation?`<div class="expl"><b>${it.type==="mcq"?"Açıklama":"Model cevap"}:</b> ${esc(r.explanation)}</div>`:""}</div>`;
  }).join("");
  // konu bazlı başarı
  const byTopic={}; exam.items.forEach(it=>{ const t=it.topic||"Diğer"; const r=gi[it.qid]; byTopic[t]=byTopic[t]||{e:0,m:0}; byTopic[t].e+=Math.max(0,r?.earned||0); byTopic[t].m+=it.points; });
  const tps=Object.entries(byTopic);
  paint(`<div class="page-head"><div><button class="btn sm ghost" id="back" style="margin-left:-8px">← Sınavlarım</button><h1>${esc(exam.title)}</h1></div></div>
    <div class="card pad" style="margin-bottom:16px"><div class="scorebox"><div><div class="bigscore">%${r1(g.pct)}</div><div class="muted">${fmtNum(g.total)} / ${fmtNum(g.max)} puan</div></div>
      <div class="stats" style="margin:0;flex:1;min-width:240px"><div class="stat"><div class="k">Doğru</div><div class="v" style="color:var(--ok)">${g.c}</div></div><div class="stat"><div class="k">Yanlış</div><div class="v" style="color:var(--bad)">${g.w}</div></div><div class="stat"><div class="k">Boş</div><div class="v">${g.e}</div></div></div></div>
      ${tps.length>1?`<div style="margin-top:14px"><b class="small">Konu bazında</b>${tps.map(([t,v])=>`<div class="row" style="margin-top:6px;flex-wrap:nowrap"><span class="small" style="width:160px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t)}</span><div class="bar grow"><span style="width:${v.m?v.e/v.m*100:0}%"></span></div><span class="small muted" style="width:44px;text-align:right">%${v.m?Math.round(v.e/v.m*100):0}</span></div>`).join("")}</div>`:""}
    </div>
    <div class="card">${qs}</div>`,"");
  document.getElementById("back").onclick=()=>go("home");
}
</script>
</body>
</html>
