  if(!es.exists()||!as.exists()){ toast("Sınav bulunamadı",true); return go("home"); }
  const exam={id,...es.data()}, att=as.data();
  if(isFinished(exam,att)){ toast("Bu sınav tamamlanmış"); return go("home"); }
  // tek cihaz kilidi
  if(exam.deviceLock){
    if(att.device && att.device!==myDevice()){
      try{ await updateDoc(doc(db,"attempts",id+"_"+S.user.uid),{events:[...(att.events||[]),{type:"device",t:Date.now()}].slice(-300)}); }catch(e){}
      $app.innerHTML=`<div class="center"><div class="card login"><div class="mark">!</div><h1>Başka cihazda açık</h1><p class="muted">Bu sınav başka bir cihazda başlatıldı ve yalnız o cihazdan devam edilebilir. Bu deneme kaydedildi. Cihaz değiştirmeniz gerekiyorsa sorumlu öğretim üyesinden cihaz kilidini kaldırmasını isteyin.</p><button class="btn gbtn" id="bk">Sınavlarıma dön</button></div></div>`;
      document.getElementById("bk").onclick=()=>go("home"); return; }
    if(!att.device){ try{ await updateDoc(doc(db,"attempts",id+"_"+S.user.uid),{device:myDevice()}); att.device=myDevice(); }catch(e){ console.error(e); } }
  }
  const byId={}; itemsFor(exam,att).forEach(it=>byId[it.qid]=it);
  const order=att.order.filter(q=>byId[q]);
  T={exam,att,order,byId,idx:0,seq:!!exam.sequential,answers:{...(att.answers||{})},flags:{...(att.flags||{})},qtime:{...(att.qtime||{})},pos:att.pos||0,qStart:Date.now(),
    events:[...(att.events||[])],away:null,deadline:deadlineOf(exam,att),dirty:false,saving:false,done:false};
  // açık kalmış (sayfa kapanırken bitmemiş) ayrılma kaydını kapat; açılışı kaydet
  const lastEv=T.events[T.events.length-1]; if(lastEv&&lastEv.type==="away"&&lastEv.d==null) lastEv.d=Math.max(0,Math.round((Date.now()-lastEv.t)/1000));
  T.events.push({type:T.events.length?"reopen":"open",t:Date.now()}); if(T.events.length>300) T.events=T.events.slice(-300);
  if(T.seq) T.idx=Math.min(T.pos,order.length-1);
  else { const firstEmpty=order.findIndex(q=>T.answers[q]==null||T.answers[q]===""); if(firstEmpty>0) T.idx=firstEmpty; }

  $app.innerHTML=`<header class="top"><div class="top-in">
      <div class="brand"><div class="mark">AT</div><div>${esc(exam.title)}<small>${order.length} soru${T.seq?" · sıralı":""}</small></div></div>
      <div class="top-right"><span class="savestate" id="sv">Kaydedildi</span><span class="timer" id="tm">--:--</span><button class="btn primary" id="finish">Sınavı bitir</button></div>
    </div></header>
    <main><div class="take">
      <aside class="card pad" style="position:sticky;top:76px">
        <div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Sorular</b><span class="small muted" id="cnt"></span></div>
        <div class="navgrid" id="nav"></div>
        <div class="legend"><span><i style="background:var(--ink)"></i>Cevaplandı</span>${T.seq?"":`<span><i style="background:var(--warn);border-radius:50%"></i>İşaretli</span>`}</div>
        ${T.seq?`<div class="small" style="margin-top:12px;color:var(--warn)">Sıralı sınav: önceki sorulara geri dönülemez.</div>`:""}
        <div class="small muted" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line-2)">Sınav sırasında başka sekmeye/uygulamaya geçişler saat ve süreyle kaydedilir.</div>
      </aside>
      <section class="card pad" id="qv" style="min-height:360px"></section>
    </div></main><div id="fsGate" class="fs-gate hidden"><div class="card pad" style="max-width:420px;text-align:center"><h2>Tam ekran gerekli</h2><p class="muted">Bu sınav tam ekranda yapılır. Tam ekrandan çıkışlar kaydedilir.</p><button class="btn primary" id="fsGo">Tam ekrana geç</button></div></div>`;
  T.unload=e=>{ if(T&&(T.dirty||T.saving)){ e.preventDefault(); e.returnValue=""; } };
  // sekme/uygulama değişimi: ayrılınca hemen kaydet (geri dönmese de iz kalsın), dönünce süreyi yaz
  T.vis=()=>{ if(!T||T.done) return; const gone=document.hidden||!document.hasFocus();
    if(gone && !T.away){ flushQ(); T.qStart=null; T.away={type:"away",t:Date.now(),d:null}; T.events.push(T.away); saveNow().catch(()=>{}); }
    else if(!gone && T.away){ T.away.d=Math.max(1,Math.round((Date.now()-T.away.t)/1000)); const d=T.away.d; T.away=null; T.qStart=Date.now(); queueSave();
      toast(`Sayfadan ayrılmanız kaydedildi (${fmtSec(d)})`,true); } };
  document.addEventListener("visibilitychange",T.vis); window.addEventListener("blur",T.vis); window.addEventListener("focus",T.vis);
  window.addEventListener("beforeunload",T.unload);
  // tam ekran
  const fsOn=exam.fullscreen&&document.fullscreenEnabled;
  const gate=on=>document.getElementById("fsGate")?.classList.toggle("hidden",!on);
  if(fsOn){
    T.fsch=()=>{ if(!T||T.done) return; if(!document.fullscreenElement){ T.events.push({type:"fsexit",t:Date.now()}); queueSave(); gate(true); } else gate(false); };
    document.addEventListener("fullscreenchange",T.fsch);
    document.getElementById("fsGo").onclick=()=>document.documentElement.requestFullscreen().catch(()=>toast("Tarayıcı tam ekrana izin vermedi",true));
    if(!document.fullscreenElement) gate(true);
  }
  T.keys=e=>{ if(!T||e.target.closest("textarea,input,.dcmv,.dcm-full")) return;
    const it=byId[order[T.idx]];
    if(e.key==="ArrowRight") nextQ(); else if(e.key==="ArrowLeft"&&!T.seq) move(-1);
    else if(it.type==="mcq"){ const k=e.key.toUpperCase(); const p=LET.indexOf(k); if(p>=0&&p<it.options.length){ choose(T.att.optOrder[it.qid][p]); } } };
  document.addEventListener("keydown",T.keys);
  document.getElementById("finish").onclick=()=>finish(false);
  drawNav(); drawQ(); tick(); T.tick=setInterval(tick,1000);
}
function answered(q){ const a=T.answers[q]; return a!=null && a!==""; }
function drawNav(){
  document.getElementById("nav").innerHTML=T.order.map((q,i)=>`<button class="nb ${answered(q)?"ans":""} ${T.flags[q]?"flag":""} ${i===T.idx?"cur":""}" data-i="${i}" ${T.seq&&i!==T.idx?"disabled":""}>${i+1}</button>`).join("");
  if(!T.seq) document.querySelectorAll("#nav .nb").forEach(b=>b.onclick=()=>{ flushQ(); T.idx=Number(b.dataset.i); drawNav(); drawQ(); });
  document.getElementById("cnt").textContent=`${T.order.filter(answered).length}/${T.order.length}`;
}
function drawQ(){
  const q=T.order[T.idx], it=T.byId[q], prev=T.idx>0?T.byId[T.order[T.idx-1]]:null;
  let caseHtml="";
  if(it.caseId){ const c=T.exam.cases[it.caseId]; const cont=prev&&prev.caseId===it.caseId;
    caseHtml=`<div class="case-box"><div class="lbl">Vaka${c.title?": "+esc(c.title):""}${cont?" (devam)":""}</div><div class="txt">${esc(c.text)}</div>${imgTag(c.imageId)}${dcmTag(c.dicomId)}</div>`; }
  let body;
  if(it.type==="mcq"){
    const perm=T.att.optOrder[q]; const a=T.answers[q];
    body=`<div class="opts">${perm.map((orig,p)=>`<button class="opt ${a===orig?"sel":""}" data-o="${orig}"><span class="L">${LET[p]}</span><span class="T">${esc(it.options[orig])}</span></button>`).join("")}</div>
      ${a!=null?`<button class="btn sm ghost" id="clr" style="margin-top:8px">Seçimi temizle</button>`:""}`;
  } else {
    body=`<textarea id="oa" style="min-height:180px;margin-top:14px" placeholder="Cevabınızı yazın…">${esc(T.answers[q]||"")}</textarea>`;
  }
  const last=T.idx>=T.order.length-1;
  const el=document.getElementById("qv");
  el.innerHTML=`${caseHtml}<div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="qmeta" style="margin:0"><span class="badge acc">Soru ${T.idx+1} / ${T.order.length}</span><span class="badge">${it.points} puan</span>${it.type==="open"?`<span class="badge warn">Açık uçlu</span>`:""}</div>
      ${T.seq?"":`<button class="btn sm ${T.flags[q]?"":"ghost"}" id="flg">${T.flags[q]?"★ İşaretli":"☆ Sonra bak"}</button>`}</div>
    <div class="q-stem">${esc(it.stem)}</div>${imgTag(it.imageId)}${dcmTag(it.dicomId)}${body}
    <div class="row" style="justify-content:space-between;margin-top:20px">${T.seq?"<span></span>":`<button class="btn" id="pv" ${T.idx===0?"disabled":""}>← Önceki</button>`}
      <span class="small muted">${it.type==="mcq"?`Klavye: A–E ile seç${T.seq?", → ile ilerle":", ← → ile gez"}`:""}</span>
      ${!last?`<button class="btn primary" id="nx">Sonraki →</button>`:`<button class="btn primary" id="nx">Bitir</button>`}</div>`;
  hydrateImages(el);
  el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>choose(Number(b.dataset.o)));
  el.querySelector("#clr")?.addEventListener("click",()=>{ delete T.answers[q]; queueSave(); drawNav(); drawQ(); });
  const ta=el.querySelector("#oa"); if(ta) ta.oninput=()=>{ T.answers[q]=ta.value; queueSave(); drawNavLight(); };
  el.querySelector("#flg")?.addEventListener("click",()=>{ T.flags[q]=!T.flags[q]; if(!T.flags[q]) delete T.flags[q]; queueSave(); drawNav(); drawQ(); });
  el.querySelector("#pv")?.addEventListener("click",()=>move(-1));
  el.querySelector("#nx").onclick=()=> last?finish(false):nextQ();
}
async function nextQ(){
  if(!T||T.idx>=T.order.length-1) return;
  if(T.seq){
    if(!answered(T.order[T.idx]) && !await confirmDlg("Boş geçiyorsunuz","<p>Bu soruyu boş bırakıyorsunuz. Sıralı sınavda bu soruya geri dönemezsiniz.</p>","Devam et")) return;
    if(!T) return; flushQ(); T.idx++; T.pos=Math.max(T.pos,T.idx); drawNav(); drawQ(); window.scrollTo({top:0,behavior:"smooth"}); saveNow().catch(()=>{}); return;
  }
  move(1);
}
function drawNavLight(){ const b=document.querySelector(`#nav .nb[data-i="${T.idx}"]`); if(b) b.classList.toggle("ans",answered(T.order[T.idx])); document.getElementById("cnt").textContent=`${T.order.filter(answered).length}/${T.order.length}`; }
function move(d){ if(T.seq&&d<0) return; const n=T.idx+d; if(n<0||n>=T.order.length) return; flushQ(); T.idx=n; drawNav(); drawQ(); window.scrollTo({top:0,behavior:"smooth"}); }
function choose(orig){ const q=T.order[T.idx]; T.answers[q]=orig; queueSave(); drawNav(); drawQ(); }
function setSave(txt){ const s=document.getElementById("sv"); if(s) s.textContent=txt; }
function queueSave(){ T.dirty=true; setSave("Kaydediliyor…"); clearTimeout(T.saveT); T.saveT=setTimeout(saveNow,700); }
async function saveNow(extra={}){
  if(!T) return; clearTimeout(T.saveT);
  const t=T; t.saving=true; t.dirty=false; if(t.qStart!=null) flushQ();
  try{ await updateDoc(doc(db,"attempts",t.exam.id+"_"+S.user.uid),{answers:t.answers,flags:t.flags,events:t.events,qtime:t.qtime,pos:t.pos,updatedAt:serverTimestamp(),...extra}); if(T===t) setSave("Kaydedildi"); }
  catch(e){ t.dirty=true; if(T===t) setSave("Kaydedilemedi — tekrar denenecek"); console.error(e); if(!extra.status) t.saveT=setTimeout(saveNow,4000); throw e; }
  finally{ t.saving=false; }
}
function tick(){
  if(!T) return; const left=T.deadline-Date.now(); const el=document.getElementById("tm");
  const s=Math.max(0,Math.floor(left/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  el.textContent=(h?h+":":"")+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
  el.classList.toggle("low",s<300);
  if(s===300) toast("Son 5 dakika");
  if(left<=0 && !T.done) finish(true);
}
async function finish(auto){
  if(!T||T.done) return;
  if(!auto){
    const empty=T.order.filter(q=>!answered(q)).length, fl=Object.keys(T.flags).length;
    const ok=await confirmDlg("Sınavı bitir",`<p>${empty?`<b style="color:var(--warn)">${empty} soru boş.</b> `:"Tüm sorular cevaplandı. "}${fl?`${fl} soru işaretli. `:""}</p><p>Teslim ettikten sonra cevaplarınızı değiştiremezsiniz.</p>`,"Teslim et");
    if(!ok||!T) return;
  }
  T.done=true; clearInterval(T.tick);
  const exam=T.exam;
  try{ await saveNow({status:"submitted",submittedAt:serverTimestamp()}); }
  catch(e){ /* süre aşımı: son kaydedilen cevaplar değerlendirilir */ }
  stopTake();
  modal(`<div class="modal-h"><h2>${auto?"Süre doldu":"Sınav teslim edildi"}</h2></div><div class="modal-b"><p>${esc(exam.title)} için cevaplarınız kaydedildi. Sonuçlar yayınlandığında “Sınavlarım” sayfasında görebilirsiniz.</p></div>
    <div class="modal-f"><button class="btn primary" data-close id="okh">Tamam</button></div>`,"narrow").el.querySelector("#okh").addEventListener("click",()=>go("home"));
  go("home");
}

async function viewReview(id){
  paint(`<div class="spinner"></div>`,residentTabs());
  const uid=S.user.uid;
  const [es,gs,as,aps]=await Promise.all([getDoc(doc(db,"exams",id)),getDoc(doc(db,"grades",id+"_"+uid)),getDoc(doc(db,"attempts",id+"_"+uid)),
    getDocs(query(collection(db,"appeals"),where("examId","==",id),where("uid","==",uid))).catch(()=>({docs:[]}))]);
  if(!es.exists()||!gs.exists()){ toast("Sonuç bulunamadı",true); return go("home"); }
  const exam={id,...es.data()}, g=gs.data(), att=as.exists()?as.data():null;
  const myAp={}; aps.docs.forEach(d=>{ const a=d.data(); myAp[a.qid]={id:d.id,...a}; });
  const apOpen=exam.appealsOpen!==false;
  const gi={}; g.items.forEach(i=>gi[i.qid]=i);
  const byId={}; exam.items.forEach(i=>byId[i.qid]=i);
  const order=(att?.order||exam.items.map(i=>i.qid)).filter(q=>byId[q]&&gi[q]);
  let prevCase=null;
  const qs=order.map((q,n)=>{
    const it=byId[q], r=gi[q]||{}; let caseHtml="";
    if(it.caseId&&it.caseId!==prevCase){ const c=exam.cases[it.caseId]; caseHtml=`<div class="case-box"><div class="lbl">Vaka${c.title?": "+esc(c.title):""}</div><div class="txt">${esc(c.text)}</div>${imgTag(c.imageId)}${dcmTag(c.dicomId)}</div>`; }
    prevCase=it.caseId||null;
    const acc=Array.isArray(r.correct)?r.correct:(r.correct==null?[]:[r.correct]);
    let body, badge;
    if(it.type==="mcq"){
      const perm=att?.optOrder?.[q]||it.options.map((_,j)=>j);
      body=`<div class="opts">${perm.map((orig,p)=>`<div class="opt static ${acc.includes(orig)?"right":(orig===r.given?"wrong":"")}"><span class="L">${LET[p]}</span><span class="T">${esc(it.options[orig])}</span></div>`).join("")}</div>`;
      badge=r.dropped?"":r.res==="c"?`<span class="badge ok">Doğru</span>`:r.res==="w"?`<span class="badge bad">Yanlış</span>`:`<span class="badge">Boş</span>`;
    } else {
      body=`<div class="small muted" style="margin:10px 0 4px">Cevabınız</div><div class="openans">${esc(r.given||"")||`<span class="muted">Boş</span>`}</div>${r.comment?`<div class="expl"><b>Geri bildirim:</b> ${esc(r.comment)}</div>`:""}`;
      badge=r.dropped?"":`<span class="badge info">${fmtNum(r.earned||0)} / ${it.points}</span>`;
    }
    const vb=r.dropped?`<span class="badge warn">İptal edildi · puanlamaya katılmadı</span>`:r.voided?`<span class="badge warn">İptal edildi · herkese doğru sayıldı</span>`:"";
    const ap=myAp[q];
    const apHtml=ap?`<div class="apbox"><div class="row" style="gap:6px"><b class="small">İtirazınız</b>${appealBadge(ap.status)}</div><div class="small" style="white-space:pre-wrap;margin-top:4px">${esc(ap.text)}</div>${ap.reply?`<div class="small" style="margin-top:6px"><b>Yanıt:</b> ${esc(ap.reply)}</div>`:""}</div>`
      :(apOpen&&!r.dropped&&!r.voided?`<button class="btn sm ghost no-print" data-ap="${q}" data-n="${n+1}" style="margin-top:10px">İtiraz et</button>`:"");
    return `<div class="qrev">${caseHtml}<div class="qmeta"><span class="badge">Soru ${n+1}</span>${badge}${vb}${it.topic?`<span class="badge">${esc(it.topic)}</span>`:""}</div>
      <div class="q-stem">${esc(it.stem)}</div>${imgTag(it.imageId)}${dcmTag(it.dicomId)}${body}${r.explanation?`<div class="expl"><b>${it.type==="mcq"?"Açıklama":"Model cevap"}:</b> ${esc(r.explanation)}</div>`:""}${apHtml}</div>`;
  }).join("");
  // konu bazlı başarı
  const byTopic={}; order.forEach(q=>{ const it=byId[q], r=gi[q]; if(r.dropped) return; const t=it.topic||"Diğer"; byTopic[t]=byTopic[t]||{e:0,m:0}; byTopic[t].e+=Math.max(0,r?.earned||0); byTopic[t].m+=it.points; });
  const tps=Object.entries(byTopic);
  paint(`${printHead("Sınav Sonuç Belgesi",`${exam.title} · ${S.resident?.name||S.user.displayName||S.email}`)}
    <div class="page-head"><div><button class="btn sm ghost no-print" id="back" style="margin-left:-8px">← Sınavlarım</button><h1>${esc(exam.title)}</h1></div><button class="btn no-print" id="prt">Yazdır / PDF</button></div>
    <div class="card pad" style="margin-bottom:16px"><div class="scorebox"><div><div class="bigscore">%${r1(g.pct)}</div><div class="muted">${fmtNum(g.total)} / ${fmtNum(g.max)} puan</div>${g.pass!=null?`<div style="margin-top:6px">${passBadge(g.pass)} <span class="small muted">geçme notu %${g.passPct}</span></div>`:""}</div>
      <div class="stats" style="margin:0;flex:1;min-width:240px"><div class="stat"><div class="k">Doğru</div><div class="v" style="color:var(--ok)">${g.c}</div></div><div class="stat"><div class="k">Yanlış</div><div class="v" style="color:var(--bad)">${g.w}</div></div><div class="stat"><div class="k">Boş</div><div class="v">${g.e}</div></div></div></div>
      ${tps.length>1?`<div style="margin-top:14px"><b class="small">Konu bazında</b>${tps.map(([t,v])=>`<div class="row" style="margin-top:6px;flex-wrap:nowrap"><span class="small" style="width:160px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t)}</span><div class="bar grow"><span style="width:${v.m?v.e/v.m*100:0}%"></span></div><span class="small muted" style="width:44px;text-align:right">%${v.m?Math.round(v.e/v.m*100):0}</span></div>`).join("")}</div>`:""}
    </div>
    ${apOpen?`<div class="note no-print">Bir sorunun cevabına katılmıyorsanız sorunun altındaki “İtiraz et” ile gerekçenizi yazabilirsiniz.</div>`:""}
    <div class="card">${qs}</div>`,residentTabs());
  document.getElementById("back").onclick=()=>go("home");
  document.getElementById("prt").onclick=()=>window.print();
  $app.querySelectorAll("[data-ap]").forEach(b=>b.onclick=()=>{
    const qid=b.dataset.ap;
    const m=modal(`<div class="modal-h"><h2>Soru ${b.dataset.n} için itiraz</h2><button class="btn sm ghost" data-close>✕</button></div>
      <div class="modal-b"><label class="f">Gerekçeniz</label><textarea id="apT" style="min-height:130px" placeholder="Hangi cevabın neden doğru olduğunu düşündüğünüzü, varsa kaynağıyla yazın."></textarea>
      <div class="small muted" style="margin-top:6px">İtiraz gönderildikten sonra değiştirilemez; sorumlu öğretim üyesi değerlendirip yanıtlar.</div></div>
      <div class="modal-f"><button class="btn" data-close>Vazgeç</button><button class="btn primary" id="apS">Gönder</button></div>`);
    m.el.querySelector("#apS").onclick=async()=>{ const text=m.el.querySelector("#apT").value.trim(); if(text.length<10) return toast("Lütfen gerekçenizi biraz daha açık yazın",true);
      try{ await setDoc(doc(db,"appeals",`${id}_${uid}_${qid}`),{examId:id,uid,email:S.email,name:S.resident?.name||S.user.displayName||"",qid,text,status:"pending",createdAt:serverTimestamp()});
        m.close(); toast("İtirazınız iletildi"); viewReview(id); }catch(e){ fail(e,"İtiraz gönderilemedi"); } };
  });
}

let PR=null; // aktif alıştırma
async function viewPractice(){
  paint(`<div class="spinner"></div>`,residentTabs());
  const uid=S.user.uid;
  const [qs,cs,ps]=await Promise.all([
    getDocs(query(collection(db,"questions"),where("practice","==",true))).catch(e=>{ console.error(e); return {docs:[]}; }),
    getDocs(query(collection(db,"cases"),where("practice","==",true))).catch(()=>({docs:[]})),
    getDoc(doc(db,"practice",uid)).catch(()=>null),loadLearn()]);
  const Q=qs.docs.map(d=>({id:d.id,...d.data()})).filter(q=>!q.status||q.status==="approved");
  const C={}; cs.docs.forEach(d=>C[d.id]={id:d.id,...d.data()});
  const P=ps?.exists?.()?{...(ps.data().q||{})}:{};
  PR={Q,C,P,uid};
  if(!Q.length){ paint(`<div class="page-head"><div><h1>Alıştırma</h1></div></div><div class="card empty">Şu an alıştırmaya açık soru yok. Sorumlu öğretim üyesi bir soru havuzunu alıştırmaya açtığında burada görünecek.</div>`,residentTabs()); return; }
  const tps={}; Q.forEach(q=>{ const t=q.topic||"Diğer"; const o=tps[t]=tps[t]||{t,n:0,seen:0,c:0,w:0}; o.n++; const p=P[q.id]; if(p){ o.seen++; o.c+=p.c||0; o.w+=p.w||0; } });
  const T2=Object.values(tps).sort((a,b)=>a.t.localeCompare(b.t,"tr"));

// Basit ve güvenli biçimlendirme: **kalın**, *italik*, # başlık, - liste, [metin](https://...)
function md(src){
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g,"$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[]; let list=null, para=[];
  const flush=()=>{ if(para.length){ out.push(`<p>${inl(para.join("<br>"))}</p>`); para=[]; } if(list){ out.push(`<${list.t}>${list.items.map(i=>`<li>${inl(i)}</li>`).join("")}</${list.t}>`); list=null; } };
  for(const raw of esc(src||"").split(/\r?\n/)){ const l=raw.trimEnd();
    let m;
    if(!l.trim()){ flush(); continue; }
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){ flush(); out.push(`<h${m[1].length+2}>${inl(m[2])}</h${m[1].length+2}>`); continue; }
    if((m=l.match(/^\s*[-•]\s+(.*)$/))){ if(para.length||(list&&list.t!=="ul")) flush(); if(!list) list={t:"ul",items:[]}; list.items.push(m[1]); continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ if(para.length||(list&&list.t!=="ol")) flush(); if(!list) list={t:"ol",items:[]}; list.items.push(m[1]); continue; }
    if(list) flush(); para.push(l); }
  flush(); return `<div class="md">${out.join("")}</div>`;
}

const r4=v=>Math.round(v*1e4)/1e4;
function shapeHit(f,p){
  if(f.shape==="rect") return p.x>=f.x&&p.x<=f.x+f.w&&p.y>=f.y&&p.y<=f.y+f.h;
  if(f.shape==="ellipse"){ const rx=f.w/2, ry=f.h/2; if(rx<=0||ry<=0) return false; return ((p.x-f.x-rx)/rx)**2+((p.y-f.y-ry)/ry)**2<=1; }
  if(f.shape==="poly"){ const P=f.pts||[]; let ins=false; for(let i=0,j=P.length-1;i<P.length;j=i++){ const a=P[i], b=P[j]; if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/((b.y-a.y)||1e-9)+a.x)) ins=!ins; } return ins; }
  return false;
}
const sliceOk=(f,z)=>z==null||f.z==null||Math.abs(z-f.z)<=(f.zr??2);
function shapePath(c,f,T){ c.beginPath();
  if(f.shape==="rect") c.rect(T.x(f.x),T.y(f.y),T.x(f.x+f.w)-T.x(f.x),T.y(f.y+f.h)-T.y(f.y));
  else if(f.shape==="ellipse") c.ellipse(T.x(f.x+f.w/2),T.y(f.y+f.h/2),Math.max(1,Math.abs(T.x(f.x+f.w)-T.x(f.x))/2),Math.max(1,Math.abs(T.y(f.y+f.h)-T.y(f.y))/2),0,0,Math.PI*2);
  else if(f.pts?.length){ f.pts.forEach((q,i)=>i?c.lineTo(T.x(q.x),T.y(q.y)):c.moveTo(T.x(q.x),T.y(q.y))); c.closePath(); } }
class Anno{
  constructor(o={}){ Object.assign(this,{shapes:[],mode:"view",tool:"ellipse",show:null,labels:true,marks:[],sel:null,onCreate:null,onPick:null,redraw:()=>{}},o); this.draft=null; }
  visible(z){ return this.shapes.filter(f=>(!this.filter||this.filter(f))&&(!this.show||this.show(f))&&sliceOk(f,z)); }
  draw(c,T,z){
    c.save(); c.lineJoin="round";
    this.visible(z).forEach(f=>{ const n=this.shapes.indexOf(f)+1, col=f.id===this.sel?"#38bdf8":(f.color||"#ffd34d");
      shapePath(c,f,T); c.fillStyle=col+"26"; c.fill(); c.lineWidth=2.5; c.strokeStyle="#000a"; c.stroke(); c.lineWidth=1.8; c.strokeStyle=col; c.stroke();
      const bx=T.x(f.x), by=T.y(f.y); c.font="600 12px IBM Plex Sans, sans-serif";
      const t=this.labels&&f.label?`${n}. ${f.label}`:String(n), w=c.measureText(t).width+10, ty=Math.max(0,by-20);
      c.fillStyle="#000c"; c.fillRect(bx,ty,w,18); c.fillStyle=col; c.fillText(t,bx+5,ty+13); });
    if(this.draft){ shapePath(c,this.draft,T); c.setLineDash([5,4]); c.lineWidth=2; c.strokeStyle="#38bdf8"; c.stroke(); c.setLineDash([]); }
    this.marks.filter(m=>m.z==null||z==null||m.z===z).forEach(m=>{ const x=T.x(m.x), y=T.y(m.y), col=m.ok?"#22c55e":"#ef4444";
      c.lineWidth=3; c.strokeStyle="#000b"; c.beginPath(); c.arc(x,y,9,0,7); c.stroke(); c.lineWidth=2; c.strokeStyle=col; c.beginPath(); c.arc(x,y,9,0,7); c.moveTo(x-14,y); c.lineTo(x+14,y); c.moveTo(x,y-14); c.lineTo(x,y+14); c.stroke(); });
    c.restore();
  }
  down(p,z){
    if(this.mode==="pick"){ this.onPick&&this.onPick(p,z); return; }
    if(this.mode!=="edit") return;
    this.draft=this.tool==="poly"?{shape:"poly",pts:[p]}:{shape:this.tool,x0:p.x,y0:p.y,x:p.x,y:p.y,w:0,h:0};
  }
  move(p){ const d=this.draft; if(!d) return;
    if(d.shape==="poly"){ const l=d.pts[d.pts.length-1]; if(Math.hypot(p.x-l.x,p.y-l.y)>0.006) d.pts.push(p); }
    else { d.x=Math.min(d.x0,p.x); d.y=Math.min(d.y0,p.y); d.w=Math.abs(p.x-d.x0); d.h=Math.abs(p.y-d.y0); } }
  up(z){ const d=this.draft; this.draft=null; if(!d) return;
    let f;
    if(d.shape==="poly"){ if(d.pts.length<3) return; const xs=d.pts.map(q=>q.x), ys=d.pts.map(q=>q.y);
      f={shape:"poly",pts:d.pts.map(q=>({x:r4(q.x),y:r4(q.y)})),x:r4(Math.min(...xs)),y:r4(Math.min(...ys)),w:r4(Math.max(...xs)-Math.min(...xs)),h:r4(Math.max(...ys)-Math.min(...ys))}; }
    else f={shape:d.shape,x:r4(d.x),y:r4(d.y),w:r4(d.w),h:r4(d.h)};
    if(f.w<0.012&&f.h<0.012) return;
    this.onCreate&&this.onCreate(f,z); this.redraw(); }
}
// Görsel + işaret katmanı
class ImgAnno{
  constructor(host,{imageId,src,anno}){ this.anno=anno; anno.redraw=()=>this.draw();
    host.innerHTML=`<div class="anno-wrap"><img alt=""><canvas></canvas><div class="anno-load">Görsel yükleniyor…</div></div>`;
    this.wrap=host.firstElementChild; this.img=this.wrap.querySelector("img"); this.cv=this.wrap.querySelector("canvas");
    const set=u=>{ const l=this.wrap.querySelector(".anno-load"); if(!u){ if(l) l.textContent="Görsel bulunamadı"; return; } this.img.onload=()=>{ l?.remove(); const r=this.img.naturalWidth/(this.img.naturalHeight||1); this.wrap.style.width=`min(100%, calc(72vh * ${r.toFixed(4)}))`; this.draw(); }; this.img.src=u; };
    if(src) set(src); else getImg(imageId).then(set);
    const P=e=>{ const r=this.cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}; };
    this.cv.addEventListener("pointerdown",e=>{ if(this.anno.mode==="view") return; e.preventDefault(); this.cv.setPointerCapture(e.pointerId); this.anno.down(P(e),null); this.draw(); });
    this.cv.addEventListener("pointermove",e=>{ if(this.anno.draft){ this.anno.move(P(e)); this.draw(); } });
    const up=()=>{ if(this.anno.draft){ this.anno.up(null); this.draw(); } };
    this.cv.addEventListener("pointerup",up); this.cv.addEventListener("pointercancel",up);
    this.ro=new ResizeObserver(()=>{ if(!this.wrap.isConnected){ this.ro.disconnect(); return; } this.draw(); }); this.ro.observe(this.img);
  }
  draw(){ const w=this.img.clientWidth, h=this.img.clientHeight; if(!w||!h) return; const dpr=window.devicePixelRatio||1, cv=this.cv;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.width=w+"px"; cv.style.height=h+"px";
    const v=this.anno.mode==="view"; cv.style.cursor=v?"":"crosshair"; cv.style.touchAction=v?"auto":"none"; cv.style.pointerEvents=v?"none":"auto";
    const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h); this.anno.draw(c,{x:t=>t*w,y:t=>t*h},null); }
  setSlice(){}
}

function mountMedia(host,{imageId,src,dicomId},anno,opt={}){

}

let _lSave;
function saveLearn(now){ if(!L||S.mode!=="resident"||S.preview) return; clearTimeout(_lSave);
  const f=()=>setDoc(doc(db,"learn",L.uid),{...L.d,email:S.email,name:S.resident?.name||S.user.displayName||"",kidem:S.resident?.kidem||null,updatedAt:serverTimestamp()}).catch(e=>console.error(e));

const SRS_INT=[1,3,7,21,60];
function srsAdd(key,meta={}){ if(!canLearn()) return false; const c=L.d.srs[key];
  if(c){ c.b=0; c.due=Date.now(); } else L.d.srs[key]={b:0,due:Date.now(),add:Date.now(),n:0,...meta}; saveLearn(); return true; }
function srsGrade(key,ok){ const c=L?.d.srs[key]; if(!c) return;
  c.n=(c.n||0)+1; c.last=ok?1:0; c.t=Date.now();
  if(ok){ c.b=Math.min(5,(c.b||0)+1); c.due=Date.now()+SRS_INT[c.b-1]*DAY_MS; } else { c.b=0; c.due=Date.now()+DAY_MS; }
  saveLearn(); }
const srsDue=()=>L?Object.entries(L.d.srs).filter(([k,c])=>(c.due||0)<=Date.now()).sort((a,b)=>a[1].due-b[1].due):[];

    anno.onPick=(p,z)=>{ const t=TK[st.i]; if(!t||st.wait) return; const f=F.find(x=>x.id===t.fid);
      const mok=fM(f)===cur, hit=mok&&shapeHit(f,p), zok=sliceOk(f,M.isDcm?z:null), ok=hit&&zok; st.tries++;
      anno.marks.push({x:p.x,y:p.y,z:M.isDcm?z:null,ok}); anno.redraw();
      const fb=$id("qFb");
      if(ok||st.tries>=3){ st.wait=true; st.rev.add(f.id); st.res[st.i]={ok:ok&&st.tries===1,solved:ok,tries:st.tries,tid:t.id};
        if(!ok) jump(f); anno.redraw();
        fb.innerHTML=`<div class="pfb ${ok?"ok":"bad"}"><b>${ok?(st.tries===1?"Doğru!":`Doğru (${st.tries}. denemede).`):"Bulgu burada işaretli."}</b> ${esc(f.label||"")}${f.text?`<div style="margin-top:6px">${md(f.text)}</div>`:""}</div>
          <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" id="qNx">${st.i<TK.length-1?"Sonraki görev →":"Sonucu gör"}</button></div>`;
        $id("qNx").onclick=()=>{ st.i++; st.tries=0; st.wait=false; anno.marks=[]; anno.redraw(); draw(); }; return; }
      let hint=!mok?`Bu bulgu bu görüntüde değil.${st.tries===2?` İpucu: <b>${fM(f)+1}. görüntüye</b> bakın.`:""}`
        :M.isDcm&&!zok?`Bu kesitte değil; bulgu <b>${Math.max(1,f.z+1-(f.zr??2))}–${Math.min(M.viewer?.S?.meta?.n||f.z+1,f.z+1+(f.zr??2))}</b>. kesitler arasında.`:"Tam orası değil.";
      if(st.tries===2&&mok) hint+=` İpucu: bulgu ${where(f)}.`;
      fb.innerHTML=`<div class="pfb bad">${hint} <span class="small muted">(${3-st.tries} hak kaldı)</span></div>`;
    };
    const fin=()=>{ anno.mode="view"; anno.onPick=null; setTool("slice"); F.forEach(f=>st.rev.add(f.id)); anno.marks=[]; anno.redraw();
      const ok=st.res.filter(r=>r?.ok).length, miss=st.res.filter(r=>r&&!r.ok);
      if(canLearn()){ const r=L.d.atlas[id]=L.d.atlas[id]||{}; r.done=Date.now(); r.ok=ok; r.n=TK.length; r.best=Math.max(r.best||0,ok); r.tries=(r.tries||0)+1; r.topic=A.topic||"";
        miss.forEach(m=>srsAdd(`a:${id}:${m.tid}`,{topic:A.topic||"",cat:A.cat||""})); saveLearn(true); }
      $id("aP").innerHTML=`<div class="scorebox" style="margin-bottom:10px"><div><div class="bigscore">${ok}/${TK.length}</div><div class="muted">ilk denemede doğru</div></div></div>
        <div class="flist">${TK.map((t,i)=>{ const r=st.res[i]; return `<div class="fnd on"><div class="fh"><span class="fn ${r?.ok?"ok":"bad"}">${r?.ok?"✓":"✗"}</span><span>${esc(t.prompt)}</span></div></div>`; }).join("")}</div>
        ${canLearn()&&miss.length?`<div class="note" style="margin-top:10px">${miss.length} görev tekrar listenize eklendi; birkaç gün içinde yeniden karşınıza çıkacak.</div>`:""}
        <div class="row" style="margin-top:12px"><button class="btn primary" id="qAg">Yeniden dene</button><button class="btn" id="qEx">Keşfet'e dön</button></div>`;
      $id("qAg").onclick=()=>quiz(); $id("qEx").onclick=()=>setTab("x"); };
    draw();
  };
  const setTab=t=>{ $id("aTabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===t)); if(t==="q") quiz(); else explore(); };
  $id("aTabs").querySelectorAll("button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  show(0); explore();
}

      if(isAdm){ data.published=$id("ePu").checked; if(A.status&&A.status!=="approved") data.status="approved"; }

  $id("eDel")?.addEventListener("click",async()=>{ if(!await confirmDlg("Görüntüyü sil","<p>Atlas kaydı, tüm görüntüleri ve görevleri silinecek. Modüllerdeki bağlantılar çalışmaz hale gelir.</p>","Sil",true)) return;
    try{ await deleteDoc(doc(db,"atlas",id)); toast("Silindi"); go("edu",{sec:"atlas"}); }catch(e){ fail(e); } });
  drawMs(); remount(); drawK();

/* =====================================================================
   SANAL HASTA — dallanan vaka senaryoları
   nodes: { nid: {title,text,vitals,imageId,dicomId,end,outcome,opts:[{id,kind:"test"|"act",label,pts,min,res,resImg,resDcm,fb,to}]} }
   ===================================================================== */
const simDefBack=()=>S.mode==="resident"?{view:"sims"}:{view:"edu",params:{sec:"sims"}};
const OUTCOME={good:["İyi sonuç","ok"],mid:["Kısmen iyi","warn"],bad:["Kötü sonuç","bad"]};
function simMax(D){ const memo={};
  const best=(nid,seen)=>{ const n=D.nodes?.[nid]; if(!n||seen.has(nid)) return 0; if(memo[nid]!=null) return memo[nid];
    const s2=new Set(seen).add(nid); const tests=(n.opts||[]).filter(o=>o.kind==="test"||o.kind==="do").reduce((a,o)=>a+Math.max(0,Number(o.pts)||0),0);
    const acts=n.end?[0]:(n.opts||[]).filter(o=>o.kind==="act").map(o=>(Number(o.pts)||0)+best(o.to,s2));
    return memo[nid]=tests+Math.max(0,...(acts.length?acts:[0])); };
  return Math.max(1,best(D.start,new Set())); }
function simIssues(D){ const out=[], ids=Object.keys(D.nodes||{});
  if(!D.nodes?.[D.start]) out.push("Başlangıç düğümü seçilmemiş.");
  const reach=new Set(), st=[D.start]; while(st.length){ const x=st.pop(); if(!x||reach.has(x)||!D.nodes[x]) continue; reach.add(x); (D.nodes[x].opts||[]).forEach(o=>o.kind==="act"&&st.push(o.to)); }
  ids.forEach(k=>{ const n=D.nodes[k], nm=`“${n.title||k}”`;
    if(!reach.has(k)) out.push(`${nm} düğümüne hiçbir yoldan ulaşılmıyor.`);
    if(!n.end&&!(n.opts||[]).some(o=>o.kind==="act")) out.push(`${nm}: bitiş düğümü değil ama karar seçeneği yok (vaka burada takılır).`);
    (n.opts||[]).forEach(o=>{ if(o.kind==="act"&&!D.nodes[o.to]) out.push(`${nm}: “${o.label||"karar"}” bir düğüme bağlı değil.`); }); });
  if(!ids.some(k=>D.nodes[k].end)) out.push("Hiç bitiş düğümü yok.");
  return out; }
const vitalsHtml=v=>v?`<div class="vitals">${String(v).split(/\s*[·|;\n]\s*/).filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:"";
const mediaHtml=(img,dcm)=>`${imgTag(img)}${dcmTag(dcm)}`;
// Tetkik sonucunda yorum gizli mi? (açıkça ayarlanmadıysa: görsel/DICOM varsa gizli)
const hideOf=o=>o.kind==="test"&&(o.hide??!!(o.resImg||o.resDcm))&&!!(o.res||o.fb);
const hpenOf=o=>Math.max(0,Number(o.hpen??1)||0);

// Sanal hasta listesi: arama, konu, durum, paket filtreleri ve sıralama (filtre tercihleri bu tarayıcıda hatırlanır)
const simNo=x=>{ const m=String(x.pkg||"").match(/:c0*(\d+)$/); return m?Number(m[1]):null; };
const simPkg=x=>{ const m=String(x.pkg||"").match(/^ilk-nobet-(\d+):/); return m?Number(m[1]):null; };
function simBrowser(host,list,{admin,onOpen}){
  const KEY="simFilt_"+(admin?"a":"r"); let F={q:"",topic:"",st:"",pk:"",sort:"no"}; try{ F={...F,...JSON.parse(lsGet(KEY)||"{}")}; }catch(e){}
  const topicsOf=x=>String(x.topic||"Diğer").split("/").map(t=>t.trim()).filter(Boolean);
  const TP={}; list.forEach(x=>topicsOf(x).forEach(t=>TP[t]=(TP[t]||0)+1));
  const PK=[...new Set(list.map(simPkg).filter(Boolean))].sort((a,b)=>a-b);
  const stOf=x=>{ if(admin) return x.status==="pending"?"pending":x.published?"pub":"draft"; const r=L?.d.sim[x.id]; return !r?"new":r.best>=100?"full":"part"; };
  const ST=admin?[["","Tüm durumlar"],["pub","Yayında"],["draft","Taslak"],["pending","Onay bekliyor"]]:[["","Tümü"],["new","Hiç oynamadıklarım"],["part","%100'ü yakalamadıklarım"],["full","%100 olanlar"]];
  const card=x=>{ const r=L?.d.sim[x.id], no=simNo(x);
    return `<button class="simcard" data-sim="${esc(x.id)}">${no?`<span class="small muted">Vaka ${no}</span>`:""}<b>${esc(x.title||"Vaka")}</b><span class="small muted">${esc(x.topic||"")}${admin?` · ${Object.keys(x.nodes||{}).length} düğüm · en çok ${x.maxScore||"?"} puan`:""}</span><span class="clamp3 small">${esc(x.intro||"")}</span>
      <span class="row" style="gap:4px;margin-top:auto">${admin?`${pubBadge(x)}${x.author?`<span class="badge">${esc(x.author)}</span>`:""}`:r?`<span class="badge ${r.best>=100?"ok":"warn"}">En iyi %${r.best}</span><span class="badge">${r.n} kez</span>`:`<span class="badge acc">Yeni</span>`}</span></button>`; };
  const draw=()=>{ lsSet(KEY,JSON.stringify(F));
    const q=trLower(F.q);
    const hay=x=>x._hay||(x._hay=trLower(`${x.title} ${x.topic} ${x.intro} ${simNo(x)?"vaka "+simNo(x):""} ${admin?Object.values(x.nodes||{}).map(nd=>`${nd.title} ${nd.text} ${(nd.opts||[]).map(o=>`${o.label} ${o.res||""} ${o.fb||""}`).join(" ")}`).join(" "):""}`));
    const vis=list.filter(x=>(!q||hay(x).includes(q))&&(!F.topic||topicsOf(x).includes(F.topic))&&(!F.st||stOf(x)===F.st)&&(!F.pk||String(simPkg(x))===F.pk))
      .sort(F.sort==="ad"?(a,b)=>(a.title||"").localeCompare(b.title||"","tr"):F.sort==="yeni"?(a,b)=>(tsMs(b.createdAt)||0)-(tsMs(a.createdAt)||0):(a,b)=>((simNo(a)??1e4)-(simNo(b)??1e4))||(a.title||"").localeCompare(b.title||"","tr"));
    const any=F.q||F.topic||F.st||F.pk;
    host.innerHTML=`<div class="card pad simfilt"><input type="search" id="sfQ" placeholder="${admin?"Ara: başlık, konu, tanı, metin, vaka no…":"Ara: başlık, konu, öykü, vaka no…"}" value="${esc(F.q)}">
        <select id="sfT"><option value="">Tüm konular</option>${Object.keys(TP).sort((a,b)=>a.localeCompare(b,"tr")).map(t=>`<option value="${esc(t)}" ${F.topic===t?"selected":""}>${esc(t)} (${TP[t]})</option>`).join("")}</select>
        <select id="sfS">${ST.map(([v,l])=>`<option value="${v}" ${F.st===v?"selected":""}>${l}</option>`).join("")}</select>
        ${PK.length>1?`<select id="sfP"><option value="">Tüm paketler</option>${PK.map(n=>`<option value="${n}" ${F.pk===String(n)?"selected":""}>${n}. paket (vaka ${(n-1)*10+1}–${n*10})</option>`).join("")}</select>`:""}
        <select id="sfO"><option value="no" ${F.sort==="no"?"selected":""}>Vaka sırası</option><option value="ad" ${F.sort==="ad"?"selected":""}>Ada göre</option><option value="yeni" ${F.sort==="yeni"?"selected":""}>En yeni</option></select>
        <span class="small muted sfN">${vis.length} / ${list.length} vaka${any?` · <a href="#" id="sfX">filtreyi temizle</a>`:""}</span></div>
      ${vis.length?`<div class="simgrid">${vis.map(card).join("")}</div>`:`<div class="card empty">${list.length?"Filtreye uyan vaka yok.":admin?"Henüz vaka yok. “Yeni sanal hasta” ile başlayın ya da vaka paketi içe aktarın.":"Henüz yayınlanmış sanal hasta vakası yok."}</div>`}`;
    const qi=host.querySelector("#sfQ"); qi.oninput=()=>{ F.q=qi.value; const p=qi.selectionStart; draw(); const n=host.querySelector("#sfQ"); n.focus(); n.setSelectionRange(p,p); };
    host.querySelector("#sfT").onchange=e=>{ F.topic=e.target.value; draw(); };
    host.querySelector("#sfS").onchange=e=>{ F.st=e.target.value; draw(); };
    host.querySelector("#sfP")?.addEventListener("change",e=>{ F.pk=e.target.value; draw(); });
    host.querySelector("#sfO").onchange=e=>{ F.sort=e.target.value; draw(); };
    host.querySelector("#sfX")?.addEventListener("click",e=>{ e.preventDefault(); F={q:"",topic:"",st:"",pk:"",sort:F.sort}; draw(); });
    host.querySelectorAll("[data-sim]").forEach(b=>b.onclick=()=>onOpen(list.find(x=>x.id===b.dataset.sim)));
  };
  draw();
}

async function viewSimPlay(id,back){

  const D={id,...s.data()}, MAX=simMax(D);
  const G2={nid:D.start,score:0,min:0,log:[],open:{},fb:null,step:0,rev:{}};
  const draw=()=>{
    const n=D.nodes[G2.nid]; if(!n){ toast("Vaka yapısında hata",true); return goBack(back,simDefBack()); }

    const tests=(n.opts||[]).filter(o=>o.kind==="test"), acts=(n.opts||[]).filter(o=>o.kind==="act"), dos=(n.opts||[]).filter(o=>o.kind==="do"), op=G2.open[G2.nid]||(G2.open[G2.nid]=[]);

    paint(`<div class="page-head"><div><button class="btn sm ghost" id="bk">← Çık</button><h1>${esc(D.title||"Sanal hasta")}</h1><div class="sub">${esc(D.topic||"")}</div></div>
        <div class="row"><span class="badge">Adım ${G2.step+1}</span><span class="badge info">⏱ ${G2.min} dk</span>${S.mode!=="resident"&&canEdit(D)?`<button class="btn sm" id="sEd">Düzenle</button>`:rpBtn("sim",id,D.title||"Sanal hasta",n.title||"")}</div></div>
      ${G2.step===0&&D.intro?`<div class="case-box"><div class="lbl">Başvuru</div><div class="txt">${esc(D.intro)}</div></div>`:""}
      ${G2.fb?`<div class="pfb ${G2.fb.cls}" style="margin-bottom:12px">${md(G2.fb.text)}</div>`:""}
      <div class="sim">
        <div class="card pad"><h2 style="margin-top:0">${esc(n.title||"")}</h2>${vitOn?vitalsHtml(n.vitals):n.vitals?`<div class="vitals"><span class="muted">Vital bulgular henüz ölçülmedi</span></div>`:""}${n.text?md(n.text):""}${mediaHtml(n.imageId,n.dicomId)}
          ${dDone.length?`<h3 style="margin:16px 0 6px">İlk değerlendirme</h3>${dDone.map(o=>`<div class="simres simdo"><div class="lbl">${(Number(o.pts)||0)>0?"✓":(Number(o.pts)||0)<0?"✗":"•"} ${esc(o.label)}</div>${o.vit&&!o.res?`<div class="small muted">Vital bulgular yukarıda.</div>`:""}${o.res?md(o.res):""}${o.fb?`<div class="small muted" style="margin-top:6px">💬 ${esc(o.fb)}</div>`:""}</div>`).join("")}`:""}
          ${op.some(x=>tests.some(t=>t.id===x))?`<h3 style="margin:16px 0 6px">Sonuçlar</h3>${op.map(oid=>{ const o=tests.find(t=>t.id===oid); if(!o) return ""; const hid=hideOf(o)&&!G2.rev[G2.nid+":"+o.id];
            return `<div class="simres"><div class="lbl">${esc(o.label)}</div>${mediaHtml(o.resImg,o.resDcm)}${o.src?`<div class="small muted simsrc">Kaynak: ${esc(o.src)}</div>`:""}
              ${hid?`<div class="simhint"><span class="small">Önce görüntüyü kendiniz yorumlayın.</span><button class="btn sm" data-rv="${esc(o.id)}">💡 Yorumu göster${hpenOf(o)?` (−${hpenOf(o)} puan)`:""}</button></div>`
                :`${o.res?md(o.res):""}${o.fb?`<div class="small muted" style="margin-top:6px">💬 ${esc(o.fb)}</div>`:""}`}</div>`; }).join("")}`:""}</div>
        <div class="card pad sim-side">

      G2.rev[k]=1; const pen=hpenOf(o); G2.score-=pen; const le=G2.log.find(x=>x.oid===k); if(le) le.hid=false;
      G2.log.push({node:n.title||"",kind:"hint",label:`Yorum açıldı: ${o.label}`,pts:-pen,fb:""}); draw(); });

  const b=await r.blob(); const f=new File([b],url.split("/").pop()||"img.jpg",{type:b.type||"image/jpeg"});
  return cache[url]=await uploadImageNow(f); }
async function importPackage(P,onProg){
  if(!P||!Array.isArray(P.sims)) throw new Error("Geçersiz paket dosyası");
  const pid=String(P.id||"paket").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,40)||"paket";
  const [ss,qs,ps,ms,as]=await Promise.all([getDocs(collection(db,"sims")),getDocs(collection(db,"questions")),getDocs(collection(db,"pools")),getDocs(collection(db,"modules")),(P.atlas||[]).length?getDocs(collection(db,"atlas")):{docs:[]}]);
  const imgC={};
  const haveS={}, docS={}; ss.docs.forEach(d=>{ const k=d.data().pkg; if(k){ haveS[k]=d.id; docS[k]=d.data(); } });
  const mapOpt=(o,k,j)=>({id:o.id||`${k}o${j}`,kind:o.kind==="act"?"act":o.kind==="do"?"do":"test",label:o.label,pts:Number(o.pts)||0,min:Number(o.min)||0,fb:o.fb||"",
    ...(o.kind==="act"?{to:o.to}:o.kind==="do"?{res:o.res||"",...(o.vit?{vit:true}:{})}:{res:o.res||"",resImg:null,resDcm:null,src:o.src||"",...(o.hide!=null?{hide:!!o.hide}:{}),hpen:Number(o.hpen??1)})});
  const haveQ=new Set(qs.docs.map(d=>d.data().pkg).filter(Boolean));
  const ops=[], res={sims:0,skipS:0,upd:0,qs:0,skipQ:0,mod:false,atlas:0}, simId={};
  // atlas kayıtları (görüntüler URL'den indirilir)
  const haveA=new Set(as.docs.map(d=>d.data().pkg).filter(Boolean));
  for(const A of (P.atlas||[])){ const key=`${pid}:${A.key}`; if(haveA.has(key)) continue;
    onProg&&onProg(`Görüntü indiriliyor: ${A.title}`);
    const media=[]; for(const m of (A.media||[])) media.push({imageId:await imageFromUrl(m.url,imgC),dicomId:null,cap:m.cap||""});
    const d={title:A.title,cat:A.cat||"Diğer",topic:A.topic||"",desc:A.desc||"",pearls:A.pearls||"",media,imageId:media[0]?.imageId||null,dicomId:null,
      findings:(A.findings||[]).map(cleanShape),tasks:(A.tasks||[]).map(t=>({id:t.id,fid:t.fid,prompt:t.prompt})),published:false,pkg:key,source:A.source||P.source||"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()};
    ops.push(b=>b.set(doc(db,"atlas",newId()),d)); res.atlas++; }
  for(const x of P.sims){ const key=`${pid}:${x.key}`;
    if(haveS[key]){ simId[x.key]=haveS[key]; res.skipS++;
      // var olan vakaya yalnızca "ilk değerlendirme" adımlarını ekle (yöneticinin diğer düzenlemeleri korunur)
      const E0=docS[key], st=E0.start, en=E0.nodes?.[st], pn=x.nodes?.[x.start||"n1"], pd=(pn?.opts||[]).filter(o=>o.kind==="do");
      if(en&&pd.length&&!(en.opts||[]).some(o=>o.kind==="do")){ const used=new Set((en.opts||[]).map(o=>o.id));
        const nn={...en,text:pn.text||en.text,vitals:/SpO₂/.test(en.vitals||"")||!pn.vitals?en.vitals:pn.vitals,vh:!!pn.vh,opts:[...pd.map((o,j)=>mapOpt(o,st+"d",j)).filter(o=>!used.has(o.id)),...(en.opts||[])]};
        const D2={...E0,nodes:{...E0.nodes,[st]:nn}}; const sid=haveS[key];
        ops.push(b=>b.update(doc(db,"sims",sid),{[`nodes.${st}`]:nn,maxScore:simMax(D2),updatedAt:serverTimestamp()})); res.upd++; }
      continue; }
    const id=newId(); simId[x.key]=id; const order=x.order||Object.keys(x.nodes||{});
    const D={title:x.title,topic:x.topic||"",intro:x.intro||"",start:x.start||order[0],order,nodes:{}};
    order.forEach(k=>{ const n=x.nodes[k]; D.nodes[k]={title:n.title||"",text:n.text||"",vitals:n.vitals||"",...(n.vh?{vh:true}:{}),imageId:null,dicomId:null,end:!!n.end,outcome:n.end?(n.outcome||"mid"):null,
      opts:(n.opts||[]).map((o,j)=>mapOpt(o,k,j))}; });
    ops.push(b=>b.set(doc(db,"sims",id),{...D,maxScore:simMax(D),published:false,pkg:key,source:P.source||"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()})); res.sims++; }
  let poolId=null;
  if((P.questions||[]).length){ const pn=P.pool||P.title; const ex=ps.docs.find(d=>d.data().name===pn);
    poolId=ex?ex.id:newId(); if(!ex) ops.push(b=>b.set(doc(db,"pools",poolId),{name:pn,practice:false,createdAt:serverTimestamp()}));
    for(const [i,q] of P.questions.entries()){ const key=`${pid}:${q.key||"q"+i}`; if(haveQ.has(key)){ res.skipQ++; continue; }
      const imageId=q.imageUrl?await imageFromUrl(q.imageUrl,imgC):null;
      ops.push(b=>b.set(doc(db,"questions",newId()),{type:"mcq",stem:q.stem,options:q.options,correct:Number(q.correct)||0,points:1,topic:q.topic||"",explanation:q.explanation||"",caseId:null,imageId,poolId,practice:false,pkg:key,createdAt:serverTimestamp(),updatedAt:serverTimestamp()})); res.qs++; } }
  if(P.module&&!ms.docs.some(d=>d.data().pkg===pid)){ const M=P.module;
    const items=[...(M.intro?[{id:"intro",k:"text",title:M.introTitle||"Nasıl çalışılır?",body:M.intro,url:"",ref:""}]:[]),
      ...P.sims.map(x=>({id:"s_"+x.key,k:"sim",title:"",body:"",url:"",ref:simId[x.key]})),
      ...((P.questions||[]).length?[{id:"prac",k:"practice",title:"Pekiştirme soruları",body:M.practice||`Alıştırma sekmesinde “${P.pool||P.title}” havuzundaki soruları çözün.`,url:"",ref:""}]:[])];
    ops.push(b=>b.set(doc(db,"modules",newId()),{title:M.title||P.title,topic:M.topic||"",desc:M.desc||"",order:M.order??null,req:M.req||[],items,published:false,pkg:pid,createdAt:serverTimestamp(),updatedAt:serverTimestamp()})); res.mod=true; }
  onProg&&onProg(`${ops.length} kayıt yazılıyor…`);
  await batchOps(ops); S.questions=[]; return res;
}

        delete D.nodes[k]; D.order=D.order.filter(x=>x!==k); if(D.start===k) D.start=D.order[0]; Object.values(D.nodes).forEach(m=>(m.opts||[]).forEach(o=>{ if(o.to===k) o.to=null; })); drawN(); });

      el.querySelectorAll("[data-o]").forEach(oe=>{ const o=n.opts[Number(oe.dataset.o)];

        oe.querySelector("[data-odel]").onclick=()=>{ n.opts.splice(n.opts.indexOf(o),1); drawN(); };
        const mo=oe.querySelector(".mm-own"); if(mo) bindMiniMedia(mo,o,drawN); });
      el.querySelector("[data-addd]")?.addEventListener("click",()=>{ (n.opts=n.opts||[]).push({id:newId().slice(0,8),kind:"do",label:"",pts:1,min:2,res:"",fb:""}); drawN(); });
      el.querySelector("[data-addt]")?.addEventListener("click",()=>{ (n.opts=n.opts||[]).push({id:newId().slice(0,8),kind:"test",label:"",pts:1,min:10,res:"",fb:""}); drawN(); });
      el.querySelector("[data-adda]")?.addEventListener("click",()=>{ (n.opts=n.opts||[]).push({id:newId().slice(0,8),kind:"act",label:"",pts:0,min:0,to:null,fb:""}); drawN(); });
    });
    hydrateDicom($id("sN")); status();
  };
  $id("sAddN").onclick=()=>{ const nk=nextNid(); D.nodes[nk]={title:`Düğüm ${D.order.length+1}`,text:"",vitals:"",opts:[]}; D.order.push(nk); drawN(); $id("sN").lastElementChild?.scrollIntoView({behavior:"smooth"}); };
  // kaydederken seçenekler sıralanır: ilk değerlendirme → tetkik → karar; her grupta süreye (dk) göre artan
  const sortOpts=()=>D.order.forEach(k=>{ const n=D.nodes[k]; if(!n.opts) return; const g={do:0,test:1,act:2};
    n.opts=n.opts.map((o,i)=>[o,i]).sort((a,b)=>(g[a[0].kind]??1)-(g[b[0].kind]??1)||(Number(a[0].min)||0)-(Number(b[0].min)||0)||a[1]-b[1]).map(x=>x[0]); });
  const clean=()=>{ sortOpts(); const nodes={}; D.order.forEach(k=>{ const n=D.nodes[k];
    nodes[k]={title:String(n.title||"").trim(),text:String(n.text||"").trim(),vitals:String(n.vitals||"").trim(),...(n.vh&&!n.end?{vh:true}:{}),imageId:n.imageId||null,dicomId:n.dicomId||null,end:!!n.end,outcome:n.end?(n.outcome||"mid"):null,
      opts:n.end?[]:(n.opts||[]).filter(o=>String(o.label||"").trim()).map(o=>({id:o.id,kind:o.kind==="act"?"act":o.kind==="do"?"do":"test",label:String(o.label).trim(),pts:Number(o.pts)||0,min:Number(o.min)||0,fb:String(o.fb||"").trim(),
        ...(o.kind==="act"?{to:o.to||null}:o.kind==="do"?{res:String(o.res||"").trim(),...(o.vit?{vit:true}:{})}:{res:String(o.res||"").trim(),resImg:o.resImg||null,resDcm:o.resDcm||null,src:String(o.src||"").trim(),hide:!!(o.hide??!!(o.resImg||o.resDcm)),hpen:hpenOf(o)})}))}; });
    return nodes; };
  $id("sSave").onclick=async()=>{
    const title=$id("sTi").value.trim(); if(!title) return toast("Başlık girin",true);
    const nodes=clean(); const tmp={...D,nodes}; const iss=simIssues(tmp);
    if(isAdm&&$id("sPu").checked&&iss.length&&!await confirmDlg("Uyarılar var",`<p>Vaka yapısında ${iss.length} sorun var; asistan bir yerde takılabilir. Yine de yayınlansın mı?</p>`,"Yayınla")) return;
    const sid=id||newId();
    const data={title,topic:$id("sTo").value.trim(),intro:$id("sIn").value.trim(),start:D.start,order:D.order,nodes,maxScore:simMax(tmp),updatedAt:serverTimestamp(),...(id?{}:{createdAt:serverTimestamp()})};
    if(isAdm){ data.published=$id("sPu").checked; if(D.status&&D.status!=="approved") data.status="approved"; } else { data.status="pending"; data.author=S.email; data.published=false; }
    try{ $id("sSave").disabled=true; await setDoc(doc(db,"sims",sid),data,{merge:true}); toast(isAdm?"Kaydedildi — seçenekler süreye göre sıralandı":"Kaydedildi; yönetici onayına gönderildi");
      if(!id){ S.params={id:sid}; return viewSimEdit(sid); } $id("sSave").disabled=false; const y=window.scrollY; drawN(); window.scrollTo(0,y); }catch(e){ fail(e,"Kaydedilemedi"); $id("sSave").disabled=false; } };
  $id("sPrev")?.addEventListener("click",()=>go("simPlay",{id,back:{view:"simEdit",params:{id}}}));
  $id("sDel")?.addEventListener("click",async()=>{ if(!await confirmDlg("Vakayı sil","<p>Sanal hasta vakası kalıcı olarak silinecek.</p>","Sil",true)) return; try{ await deleteDoc(doc(db,"sims",id)); go("edu",{sec:"sims"}); }catch(e){ fail(e); } });
  drawN();
}

const MOD_KINDS={text:"📖 Okuma",video:"▶ Video / bağlantı",atlas:"🖼 Atlas görüntüsü",sim:"🩺 Sanal hasta",practice:"✎ Alıştırma"};
function modItemDone(m,it,AM){
  if(it.k==="atlas"){ const r=L?.d.atlas[it.ref]; const a=AM?.[it.ref]; return !!(r?.done||(r?.seen&&!(a?.tasks||[]).length)); }
  if(it.k==="sim") return !!(L?.d.sim[it.ref]?.n);
  return !!L?.d.mod[m.id]?.[it.id];
}
function modProg(m,AM){ const its=m.items||[]; const d=its.filter(it=>modItemDone(m,it,AM)).length; return {d,n:its.length,p:its.length?d/its.length*100:0}; }
const isReq=(m,k)=>Array.isArray(m.req)&&k!=null&&m.req.map(Number).includes(Number(k));
const progBar=p=>`<span class="track wide"><span style="width:${Math.max(0,Math.min(100,p))}%"></span></span>`;
const wkState=w=>{ const now=Date.now(), o=tsMs(w.openAt)||0, r=tsMs(w.revealAt)||0; return now<o?"soon":now<r?"open":"revealed"; };

       else { const r=await getDoc(doc(db,"weekly",w.id,"resp",uid)); mine=r.exists()?r.data():null; } }catch(e){ console.error(e); }

        <div class="row" style="justify-content:space-between"><span class="small muted" id="wkS">${mine?`Gönderildi · ${fmtDT(mine.at)}`:""}</span><button class="btn primary" id="wkGo">${mine?"Güncelle":"Gönder"}</button></div>`
      :`<div class="pearl" style="margin-top:12px"><div class="lbl">Cevap</div>${ans?md(ans):"<span class='muted'>—</span>"}</div>
        <details ${compact?"":"open"} style="margin-top:12px"><summary><b>Yorumlar (${all.length})</b>${mine?"":" · siz yorum yazmadınız"}</summary>
          <div class="wkresp">${all.map(r=>`<div class="${r.uid===uid?"me":""}"><b>${esc(r.name||"")}</b><span class="small muted"> · ${fmtDT(r.at)}</span><div class="txt">${esc(r.text||"")}</div></div>`).join("")||`<div class="small muted">Yorum yok.</div>`}</div></details>`}`;

          act=x?`<button class="btn sm primary" data-os="${esc(x.id)}">${L.d.sim[x.id]?`Yeniden oyna (en iyi %${L.d.sim[x.id].best})`:"Vakayı başlat"}</button>`:""; }

        return `<div class="card pad mitem ${done?"done":""}"><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:10px"><span class="mnum">${done?"✓":i+1}</span><div class="grow"><div class="small muted">${MOD_KINDS[it.k]||""}</div><h3 style="margin:2px 0 8px">${esc(it.title||(it.k==="atlas"?AM[it.ref]?.title:it.k==="sim"?SM[it.ref]?.title:"")||"")}</h3>${body}<div class="row" style="margin-top:10px;gap:6px">${act}</div></div></div></div>`; }).join("")||`<div class="card empty">Bu modülde henüz içerik yok.</div>`}</div>`);
    $id("bk").onclick=()=>go("learn");
    document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>toggle(its[Number(b.dataset.tg)]));
    document.querySelectorAll("[data-oa]").forEach(b=>b.onclick=()=>go("atlasView",{id:b.dataset.oa,back}));
    document.querySelectorAll("[data-os]").forEach(b=>b.onclick=()=>go("simPlay",{id:b.dataset.os,back}));
    document.querySelectorAll("[data-gp]").forEach(b=>b.onclick=()=>go("practice"));
    hydrateImages($app);
  };
  draw();
}

async function srsSession(keys){
  paint(`<div class="spinner"></div>`);
  const qC={}, aC={};
  const items=(await Promise.all(keys.map(async k=>{ const [t,a,b]=k.split(":");
    try{ if(t==="q"){ const s=await getDoc(doc(db,"questions",a)); if(!s.exists()) return null; return {k,t,q:{id:a,...s.data()}}; }
      if(t==="a"){ aC[a]=aC[a]||getDoc(doc(db,"atlas",a)); const s=await aC[a]; if(!s.exists()) return null; const A={id:a,...s.data()}, tk=(A.tasks||[]).find(x=>x.id===b), f=tk&&(A.findings||[]).find(x=>x.id===tk.fid); if(!f) return null; return {k,t,A,tk,f}; } }
    catch(e){ return null; } return null; }))).map((x,i)=>x||{k:keys[i],gone:true});
  items.filter(x=>x.gone).forEach(x=>delete L.d.srs[x.k]); if(items.some(x=>x.gone)) saveLearn();
  const Q=items.filter(x=>!x.gone); if(!Q.length){ toast("Bu kartların içeriği artık erişilebilir değil; listeden çıkarıldı"); return viewSrs(); }
  const ses={i:0,res:[],again:[]};
  const card=()=>{
    const it=Q[ses.i]; if(!it) return fin();
    const c=L.d.srs[it.k]||{}, lvl=c.b||0;
    const head=`<div class="page-head"><div><h1>Tekrar</h1><div class="sub">Kart ${ses.i+1} / ${Q.length} · ${ses.res.filter(r=>r).length} doğru</div></div><div class="row"><span class="srslvl" title="Kutu ${lvl}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=lvl?"on":""}"></i>`).join("")}</span><button class="btn" id="sEnd">Bitir</button></div></div>`;
    const grade=ok=>{ ses.res[ses.i]=ok; srsGrade(it.k,ok); };
    const nextBtn=()=>`<div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn sm ghost" id="sRm">Kartı listemden çıkar</button><button class="btn primary" id="sNx">${ses.i<Q.length-1?"Sonraki →":"Bitir"}</button></div>`;
    const bindNext=()=>{ $id("sNx").onclick=()=>{ ses.i++; card(); window.scrollTo({top:0}); }; $id("sNx").focus(); $id("sRm").onclick=()=>{ delete L.d.srs[it.k]; saveLearn(); toast("Kart çıkarıldı"); ses.i++; card(); }; };
    if(it.t==="q"){ const q=it.q, perm=q.type==="open"?[]:shuffle(q.options.map((_,j)=>j));
      paint(`${head}<div class="card pad" id="pq"><div class="qmeta">${q.topic?`<span class="badge">${esc(q.topic)}</span>`:""}<span class="badge info">Soru</span>${rpBtn("q",q.id,q.stem,"Tekrar")}</div><div class="q-stem">${esc(q.stem)}</div>${imgTag(q.imageId)}${dcmTag(q.dicomId)}
        ${q.type==="open"?`<div class="row" style="margin-top:12px"><button class="btn primary" id="sSh">Cevabı göster</button></div>`:`<div class="opts">${perm.map((o,p)=>`<button class="opt" data-o="${o}"><span class="L">${LET[p]}</span><span class="T">${esc(q.options[o])}</span></button>`).join("")}</div>`}<div id="sFb"></div></div>`);
      $id("sEnd").onclick=()=>fin();
      document.querySelectorAll("#pq [data-o]").forEach(b=>b.onclick=()=>{ if(ses.res[ses.i]!=null) return; const a=Number(b.dataset.o), ok=a===q.correct;
        document.querySelectorAll("#pq [data-o]").forEach(x=>{ const o=Number(x.dataset.o); x.classList.add("static"); if(o===q.correct) x.classList.add("right"); else if(o===a) x.classList.add("wrong"); });
        grade(ok); $id("sFb").innerHTML=`<div class="pfb ${ok?"ok":"bad"}"><b>${ok?"Doğru!":"Yanlış."}</b> ${ok?`Sonraki tekrar ${SRS_INT[(L.d.srs[it.k]?.b||1)-1]} gün sonra.`:"Kart başa döndü; yarın yeniden sorulacak."}${q.explanation?`<div class="expl" style="margin-top:8px">${esc(q.explanation)}</div>`:""}</div>${nextBtn()}`; bindNext(); });
      $id("sSh")?.addEventListener("click",()=>{ $id("sSh").remove(); $id("sFb").innerHTML=`<div class="expl"><b>Model cevap:</b> ${esc(q.explanation||"—")}</div>
        <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="sNo">Bilemedim</button><button class="btn primary" id="sYes">Biliyordum</button></div>`;
        const self=ok=>{ grade(ok); $id("sFb").insertAdjacentHTML("beforeend",nextBtn()); $id("sNo").remove(); $id("sYes").remove(); bindNext(); };
        $id("sYes").onclick=()=>self(true); $id("sNo").onclick=()=>self(false); });
    } else {
      const {A,tk,f}=it, shown=new Set();
      paint(`${head}<div class="atl"><div class="atl-media" id="sM"></div><div class="card pad atl-side"><div class="qmeta">${A.topic?`<span class="badge">${esc(A.topic)}</span>`:""}<span class="badge info">Atlas · ${esc(A.cat||"")}</span>${rpBtn("atlas",A.id,A.title||"Atlas",tk.prompt)}</div>
        <div class="qprompt">${esc(tk.prompt)}</div>${atlasMedia(A)[fM(f)]?.cap?`<div class="small"><b>Görüntü:</b> ${esc(atlasMedia(A)[fM(f)].cap)}</div>`:""}<div class="small muted">${atlasMedia(A)[fM(f)]?.dicomId?"Doğru kesite gidip bulgunun üzerine tıklayın.":"Görüntüde bulgunun üzerine tıklayın."} Tek hakkınız var.</div><div id="sFb"></div></div></div>`);
      $id("sEnd").onclick=()=>fin();
      const anno=new Anno({shapes:A.findings||[],mode:"pick",show:x=>shown.has(x.id),labels:true,filter:x=>fM(x)===fM(f)});
      const md0=atlasMedia(A)[fM(f)]||{};
      const M=mountMedia($id("sM"),md0,anno,{annoLabel:"Tıkla",tool:"ann"});
      anno.onPick=(p,z)=>{ if(ses.res[ses.i]!=null) return; const ok=shapeHit(f,p)&&sliceOk(f,z); anno.marks.push({x:p.x,y:p.y,z:M.isDcm?z:null,ok}); shown.add(f.id); anno.mode="view"; if(M.isDcm){ M.viewer.setTool("slice"); if(!ok) M.viewer.setSlice(f.z); } anno.redraw();
        grade(ok); $id("sFb").innerHTML=`<div class="pfb ${ok?"ok":"bad"}"><b>${ok?"Doğru!":"Bulgu burada."}</b> ${esc(f.label||"")}${f.text?`<div style="margin-top:6px">${md(f.text)}</div>`:""}</div>${nextBtn()}`; bindNext(); };
    }
  };
  const fin=()=>{ const n=ses.res.filter(r=>r!=null).length, ok=ses.res.filter(r=>r).length;
    paint(`<div class="page-head"><div><h1>Tekrar tamamlandı</h1></div></div><div class="card pad"><div class="scorebox"><div><div class="bigscore">${ok}/${n}</div><div class="muted">doğru</div></div>
      <div class="muted" style="flex:1;min-width:220px">Doğru bildiğiniz kartlar daha uzun aralıkla, yanlışlar yarın yeniden karşınıza çıkacak.</div></div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="sB">Tekrar sayfasına dön</button><button class="btn" id="sL">Öğren</button></div></div>`);
    saveLearn(true); $id("sB").onclick=()=>viewSrs(); $id("sL").onclick=()=>go("learn"); };
  card();
}

        :`<div class="card empty">Henüz modül yok.</div>`}`;
    $id("nM").onclick=()=>editModule({},atlas,sims,saved=>{ mods.push(saved); draw(); });

  };

      <label class="check"><input type="radio" name="la" value="all"> <span>Google hesabıyla giriş yapan herkes <span class="small muted">(ör. stajyer öğrenciler, kurs katılımcıları)</span></span></label></div>

async function viewLiveHost(gid){
  stopGame(); document.body.classList.add("game-mode");
  $app.innerHTML=gameShell(`<div class="spinner"></div>`);
  const ks=await getDoc(doc(db,"gameKeys",gid)); const KEY=ks.exists()?ks.data():{key:[],expl:[]};
  G={gid,unsubs:[],game:null,players:[],answers:[],key:KEY,localStart:0,busy:false};
  const draw=()=>{ if(!G||!G.game) return; const g=G.game, Q=g.questions||[], q=Q[g.qIndex], P=G.players;
    const top=`<div class="g-top"><button class="g-x" id="gx">← Oyunlar</button><b>${esc(g.title)}</b><span>PIN <b class="mono">${gid}</b> · ${P.length} oyuncu</span></div>`;

    if(g.state==="lobby"){

        <div class="g-qr">${qrSVG(gameLink(gid),230)}<div class="small">veya QR kodu okutun</div></div></div>
        <div class="g-plist">${P.map(p=>`<span class="g-pl">${esc(p.name)}</span>`).join("")||`<span class="g-wait">Oyuncular bekleniyor…</span>`}</div>
        <div class="g-act"><button class="g-btn" id="gStart" ${P.length?"":"disabled"}>Başlat (${Q.length} soru)</button></div>`;
    } else if(g.state==="question"){
      const ans=G.answers.filter(a=>a.qIndex===g.qIndex).length;
      body=`<div class="g-qh"><span>Soru ${g.qIndex+1} / ${Q.length}</span><span class="g-timer" id="gT">${g.qDuration}</span><span>${ans} / ${P.length} cevap</span></div>
        <div class="g-stem">${esc(q.stem)}</div>${q.imageId?`<div class="g-img">${imgTag(q.imageId)}${dcmTag(q.dicomId)}</div>`:""}${gameOpts(q)}
        <div class="g-act"><button class="g-btn ghost" id="gReveal">Süreyi bitir</button></div>`;
    } else if(g.state==="reveal"){
      const rv=g.reveal||{};
      body=`<div class="g-qh"><span>Soru ${g.qIndex+1} / ${Q.length}</span><span>${rv.n||0} cevap · ${rv.ok||0} doğru</span></div>
        <div class="g-stem">${esc(q.stem)}</div>${gameOpts(q,{reveal:rv.correct||[],dist:rv.dist||[]})}
        ${G.key.expl?.[g.qIndex]?`<div class="g-expl">${esc(G.key.expl[g.qIndex])}</div>`:""}
        <div class="g-act"><button class="g-btn" id="gLead">Puan tablosu →</button></div>`;
    } else if(g.state==="leader"){
      const s=[...P].sort((a,b)=>(b.score||0)-(a.score||0)), last=g.qIndex>=Q.length-1;
      body=`<h2 class="g-h">Puan tablosu</h2><div class="g-lead">${s.slice(0,8).map((p,i)=>`<div class="g-lr"><span class="g-rank">${i+1}</span><span class="g-ln">${esc(p.name)}</span>${p.last&&p.last.q===g.qIndex&&p.last.pts?`<span class="g-delta">+${p.last.pts}</span>`:""}<span class="g-ls">${p.score||0}</span></div>`).join("")}</div>
        <div class="g-act"><button class="g-btn" id="gNext">${last?"Sonuçları göster":"Sonraki soru →"}</button></div>`;
    } else {
      const s=[...P].sort((a,b)=>(b.score||0)-(a.score||0));
      body=`<h2 class="g-h">🏆 Sonuçlar</h2><div class="g-pod">${[1,0,2].map(i=>s[i]?`<div class="g-pd p${i+1}"><div class="g-pn">${esc(s[i].name)}</div><div class="g-ps">${s[i].score||0}</div><div class="g-pb">${i+1}</div></div>`:"").join("")}</div>
        <div class="g-lead small">${s.slice(3,15).map((p,i)=>`<div class="g-lr"><span class="g-rank">${i+4}</span><span class="g-ln">${esc(p.name)}</span><span class="g-ls">${p.score||0}</span></div>`).join("")}</div>
        <div class="g-act"><button class="g-btn ghost" id="gXls">Excel'e aktar</button><button class="g-btn" id="gx2">Oyunlar'a dön</button></div>`;
    }
    $app.innerHTML=gameShell(top+body,"host");
    hydrateImages($app);
    const on=(id,f)=>document.getElementById(id)?.addEventListener("click",f);
    on("gx",()=>go("games")); on("gx2",()=>go("games"));
    on("gStart",()=>startQ(0)); on("gReveal",reveal); on("gLead",()=>updateDoc(doc(db,"games",gid),{state:"leader"}).catch(fail));
    on("gNext",()=>g.qIndex>=Q.length-1?updateDoc(doc(db,"games",gid),{state:"end"}).catch(fail):startQ(g.qIndex+1));
    on("gXls",()=>liveExcel(gid,G.game,G.players,G.key));
  };
  const startQ=async i=>{ if(G.busy) return; G.busy=true; try{ G.localStart=Date.now(); await updateDoc(doc(db,"games",gid),{state:"question",qIndex:i,qStartAt:serverTimestamp(),reveal:null}); }catch(e){ fail(e); } G.busy=false; };
  const reveal=async()=>{ if(!G||G.busy||G.game.state!=="question") return; G.busy=true;
    try{ const g=G.game, i=g.qIndex, q=g.questions[i], corr=gkey(G.key,i), t0=tsMs(g.qStartAt)||G.localStart, dur=g.qDuration*1000;
      const ans=(await getDocs(collection(db,"games",gid,"answers"))).docs.map(d=>d.data()).filter(a=>a.qIndex===i);
      const dist=q.options.map((_,j)=>ans.filter(a=>a.choice===j).length);
      const byUid={}; ans.forEach(a=>byUid[a.uid]=a);
      const ops=G.players.map(p=>{ const a=byUid[p.uid]; const ok=!!a&&corr.includes(a.choice);
        const el=a?Math.max(0,(tsMs(a.at)||t0)-t0):dur; const pts=ok?Math.round(1000*(1-0.5*Math.min(1,el/dur))):0;
        return b=>b.update(doc(db,"games",gid,"players",p.uid),{score:(p.score||0)+pts,last:{q:i,pts,ok,choice:a?a.choice:null}}); });
      await batchOps([...ops,b=>b.update(doc(db,"games",gid),{state:"reveal",reveal:{q:i,correct:corr,dist,n:ans.length,ok:ans.filter(a=>corr.includes(a.choice)).length}})]);
    }catch(e){ fail(e); } G.busy=false; };
  G.unsubs.push(onSnapshot(doc(db,"games",gid),s=>{ if(!G) return; if(!s.exists()){ toast("Yarışma bulunamadı",true); return go("games"); }
    const prev=G.game; G.game={id:gid,...s.data()}; if(G.game.state==="question"&&(!prev||prev.qIndex!==G.game.qIndex||prev.state!=="question")&&!G.localStart) G.localStart=Date.now(); draw(); }));
  G.unsubs.push(onSnapshot(collection(db,"games",gid,"players"),s=>{ if(!G) return; G.players=s.docs.map(d=>({uid:d.id,...d.data()})); draw(); }));
  G.unsubs.push(onSnapshot(collection(db,"games",gid,"answers"),s=>{ if(!G) return; G.answers=s.docs.map(d=>d.data());
    const g=G.game; if(g&&g.state==="question"){ const n=G.answers.filter(a=>a.qIndex===g.qIndex).length; const el=document.querySelector(".g-qh span:last-child"); if(el) el.textContent=`${n} / ${G.players.length} cevap`;
      if(G.players.length&&n>=G.players.length) setTimeout(reveal,600); } }));
  G.tick=setInterval(()=>{ if(!G||!G.game||G.game.state!=="question") { if(G) G.localStart=G.game?.state==="question"?G.localStart:0; return; }
    const left=Math.ceil((G.localStart+G.game.qDuration*1000-Date.now())/1000); const el=document.getElementById("gT"); if(el){ el.textContent=Math.max(0,left); el.classList.toggle("low",left<=5); }
    if(left<=0) reveal(); },250);
}
async function liveExcel(gid,g,players,key){
  if(!window.XLSX) return toast("Excel kütüphanesi yüklenemedi",true);
  const ans=(await getDocs(collection(db,"games",gid,"answers"))).docs.map(d=>d.data());
  const s=[...players].sort((a,b)=>(b.score||0)-(a.score||0));
  const s1=s.map((p,i)=>({"Sıra":i+1,"Ad":p.name,"E-posta":p.email||"","Puan":p.score||0,"Doğru":ans.filter(a=>a.uid===p.uid&&gkey(key,a.qIndex).includes(a.choice)).length,"Cevaplanan":ans.filter(a=>a.uid===p.uid).length}));
  const s2=(g.questions||[]).map((q,i)=>{ const a=ans.filter(x=>x.qIndex===i); const ok=a.filter(x=>gkey(key,i).includes(x.choice)).length; const t=a.map(x=>(tsMs(x.at)||0)-(tsMs(g.qStartAt)||0));
    return {"No":i+1,"Konu":q.topic||"","Soru":q.stem,"Doğru cevap":gkey(key,i).map(j=>q.options[j]).join(" / "),"Cevaplayan":a.length,"Doğru":ok,"Doğru oranı %":a.length?Math.round(ok/a.length*100):""}; });
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(s1.length?s1:[{"Ad":"—"}]),"Sıralama"); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(s2),"Sorular");
  XLSX.writeFile(wb,`${g.title.replace(/[\\/:*?"<>|]/g,"_")} - sonuçlar.xlsx`);
}

    document.getElementById("bk")?.addEventListener("click",()=>{ stopGame(); go(S.mode==="player"?"join":"live"); });
    if(document.getElementById("rk")) getDocs(collection(db,"games",gid,"players")).then(s=>{ const arr=s.docs.map(d=>d.data()).sort((a,b)=>(b.score||0)-(a.score||0)); const r=arr.findIndex(p=>p.uid===uid)+1; const el=document.getElementById("rk"); if(el) el.textContent=`${r} / ${arr.length}`; }).catch(()=>{});
  };
  G.unsubs.push(onSnapshot(doc(db,"games",gid),s=>{ if(!G||!s.exists()) return; G.game=s.data(); if(G.game.state==="question"&&G.seenQ!==G.game.qIndex){ G.seenQ=G.game.qIndex; G.qLocal=Date.now(); } draw(); }));
  G.unsubs.push(onSnapshot(doc(db,"games",gid,"players",uid),s=>{ if(!G) return; G.me=s.exists()?s.data():null; draw(); }));
  G.tick=setInterval(()=>{ const el=document.getElementById("gT"); if(!el||!G?.game) return; const left=Math.ceil((G.qLocal+G.game.qDuration*1000-Date.now())/1000); el.textContent=Math.max(0,left); el.classList.toggle("low",left<=5); },250);
}

async function viewJPlay(id){
  stopGame(); document.body.classList.add("game-mode");
  $app.innerHTML=gameShell(`<div class="spinner"></div>`);
  const s=await getDoc(doc(db,"jeopardy",id)); if(!s.exists()){ stopGame(); toast("Tahta bulunamadı",true); return go("games"); }
  const B=s.data(); B.log=B.log||[]; G={unsubs:[]};
  const persist=()=>updateDoc(doc(db,"jeopardy",id),{teams:B.teams,cats:B.cats,log:B.log.slice(-200)}).catch(e=>console.error(e));
  const allCells=()=>B.cats.flatMap(c=>c.cells||[]).filter(x=>x&&x.qid);
  const draw=()=>{
    const done=allCells().every(x=>x.used), sorted=[...B.teams].sort((a,b)=>b.score-a.score);
    $app.innerHTML=gameShell(`<div class="g-top"><button class="g-x" id="gx">← Oyunlar</button><b>${esc(B.title)}</b><span><button class="g-x" id="jUndo" ${B.log.length?"":"disabled"}>↶ Geri al</button> <button class="g-x" id="jReset">Sıfırla</button></span></div>
      ${done?`<h2 class="g-h">🏆 ${esc(sorted[0]?.name||"")} kazandı!</h2>`:""}
      <div class="jb play" style="--n:${B.cats.length}">${B.cats.map(c=>`<div class="jh">${esc(c.title)}</div>`).join("")}
        ${B.values.map((v,r)=>B.cats.map((c,ci)=>{ const x=c.cells?.[r]; return x?.qid&&!x.used?`<button class="jcell" data-q="${ci}_${r}">${x.value}</button>`:`<div class="jcell used"></div>`; }).join("")).join("")}</div>
      <div class="jteams">${B.teams.map((t,ti)=>`<div class="jt ${done&&t===sorted[0]?"win":""}"><div class="jtn">${esc(t.name)}</div><div class="jts mono ${t.score<0?"neg":""}">${t.score}</div>
        <div class="jtb"><button data-adj="${ti}_-100">−100</button><button data-adj="${ti}_100">+100</button></div></div>`).join("")}</div>`,"jeo");
    const on=(i,f)=>document.getElementById(i)?.addEventListener("click",f);
    on("gx",()=>go("games"));
    on("jUndo",()=>{ const l=B.log.pop(); if(!l) return; B.teams[l.t]&&(B.teams[l.t].score-=l.d); if(l.close){ const x=B.cats[l.ci]?.cells?.[l.r]; if(x) x.used=false; } persist(); draw(); });
    on("jReset",async()=>{ if(!await confirmDlg("Tahtayı sıfırla","<p>Tüm skorlar sıfırlanır ve sorular yeniden açılır.</p>","Sıfırla",true)) return; B.teams.forEach(t=>t.score=0); allCells().forEach(x=>x.used=false); B.log=[]; persist(); draw(); });
    $app.querySelectorAll("[data-adj]").forEach(b=>b.onclick=()=>{ const [t,d]=b.dataset.adj.split("_").map(Number); B.teams[t].score+=d; B.log.push({t,d}); persist(); draw(); });
    $app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>openQ(...b.dataset.q.split("_").map(Number)));
  };
  const openQ=(ci,r)=>{ const c=B.cats[ci], x=c.cells[r]; let shown=false, opts=true;
    const ov=document.createElement("div"); ov.className="jq-ov"; document.body.appendChild(ov);
    const close=used=>{ ov.remove(); if(used){ x.used=true; persist(); } draw(); };
    const render=()=>{ ov.innerHTML=`<div class="jq"><div class="jq-h"><span>${esc(c.title)}</span><b class="mono">${x.value}</b></div>
      <div class="jq-stem">${esc(x.stem)}</div>${x.imageId?`<div class="g-img">${imgTag(x.imageId)}${dcmTag(x.dicomId)}</div>`:""}
      ${opts?`<div class="jq-opts">${x.options.map((o,j)=>`<div class="jq-o ${shown?(j===x.correct?"ok":"dim"):""}"><b>${LET[j]}</b> ${esc(o)}</div>`).join("")}</div>`:shown?`<div class="jq-o ok"><b>Cevap:</b> ${esc(x.options[x.correct])}</div>`:""}
      ${shown&&x.explanation?`<div class="g-expl">${esc(x.explanation)}</div>`:""}
      <div class="jq-act">${shown?"":`<button class="g-btn" id="qShow">Cevabı göster</button>`}<button class="g-btn ghost" id="qOpt">${opts?"Şıkları gizle":"Şıkları göster"}</button></div>
      <div class="jq-teams">${B.teams.map((t,ti)=>`<div class="jq-t"><span>${esc(t.name)} <b class="mono">${t.score}</b></span><button class="ok" data-w="${ti}_1">✓ +${x.value}</button><button class="bad" data-w="${ti}_-1">✗ −${x.value}</button></div>`).join("")}</div>
      <div class="jq-act"><button class="g-btn ghost" id="qNone">Kimse bilemedi · kapat</button><button class="g-btn ghost" id="qBack">Vazgeç (soruyu açık bırak)</button></div></div>`;
      hydrateImages(ov);
      ov.querySelector("#qShow")?.addEventListener("click",()=>{ shown=true; render(); });
      ov.querySelector("#qOpt").onclick=()=>{ opts=!opts; render(); };
      ov.querySelector("#qNone").onclick=()=>close(true); ov.querySelector("#qBack").onclick=()=>close(false);
      ov.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ const [t,s]=b.dataset.w.split("_").map(Number); const d=s*x.value; B.teams[t].score+=d;
        if(s>0){ B.log.push({t,d,ci,r,close:true}); close(true); } else { B.log.push({t,d}); persist(); render(); } });
    };
    render();
  };
  draw();
}

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function toward(v,k,t,r){const d=t-v[k];v[k]+=Math.sign(d)*Math.min(Math.abs(d),r)}
function sinusY(p){ if(p<.08) return 40-Math.sin(p/.08*Math.PI)*5; if(p>.14&&p<.16) return 46; if(p>=.16&&p<.19) return 8; if(p>=.19&&p<.22) return 52; if(p>.36&&p<.5) return 40-Math.sin((p-.36)/.14*Math.PI)*8; return 40; }

function ecg(c,win){
  if(!c||c._on) return; c._on=1; const ctx=c.getContext('2d'); let x=0,last=win.performance.now(),prevY=40; const st={phase:0,n:0,pa:0};
  const reduce=win.matchMedia('(prefers-reduced-motion: reduce)').matches;
  ctx.fillStyle='#0b1110'; ctx.fillRect(0,0,600,80);
  const frame=now=>{
    if(win.closed||!win.document.body.contains(c)) return;
    const dt=Math.min(.05,(now-last)/1000); last=now;
    if(R&&R.running&&!reduce){
      const steps=Math.max(1,Math.round(dt*160));
      for(let i=0;i<steps;i++){
        st.n++; st.phase+=((C.ecgRate?C.ecgRate(R):R.v.hr)/60)/160; if(st.phase>1) st.phase-=1;
        const y=C.ecgY?C.ecgY(R,st):sinusY(st.phase);
        ctx.fillStyle='#0b1110'; ctx.fillRect(x,0,8,80);
        ctx.strokeStyle='#3ddc84'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x-1,prevY); ctx.lineTo(x,y); ctx.stroke(); prevY=y;
        x+=1; if(x>=600) x=0;
      }
    }
    win.requestAnimationFrame(frame);
  };
  win.requestAnimationFrame(frame);
}

function score(alive,reason){
  const s=sc();
  const crit=s.crit.map(c=>{ let t=null, m=0, unr=false;
    if(c.from){ m=R.f.mark?.[c.from];
      if(m==null) unr=true;
      else { const ts=c.ids.flatMap(i=>(R.hist[i]||[]).filter(x=>x>=m)); if(ts.length) t=Math.min(...ts); else if(c.any&&c.ids.some(i=>(R.hist[i]||[]).length)) t=m; } }
    else { const ts=c.ids.map(i=>R.first[i]).filter(x=>x!=null); t=ts.length?Math.min(...ts):null; }
    const dt=t==null?null:t-(m||0), st=t==null?'n':(dt<=c.within?'y':'h');
    return {label:c.label,within:c.within,pts:c.pts,t,st,got:st==='y'?c.pts:st==='h'?Math.round(c.pts/2):0,...(c.from?{rel:dt,unr}:{})}; });
  const critSum=crit.reduce((a,c)=>a+c.got,0), critMax=crit.reduce((a,c)=>a+c.pts,0), penSum=R.pen.reduce((a,p)=>a+p.pts,0);
  const def=!!R.f.def, surv=alive?(def?50:20):0;
  return {mode:cfgCur.mode,team:cfgCur.team,members:cfgCur.members,scen:s.id,scenTitle:s.title,score:Math.round((alive?R.coins:0)+critSum-penSum+surv),alive,def,minutes:R.t,coinsLeft:R.coins,start:R.start,
    critSum,critMax,penSum,surv,crit,pen:R.pen,spent:R.spent,log:R.log.slice(-200).map(l=>({t:l.t,text:String(l.text).slice(0,400),cost:l.cost||0})),reason,
    vitals:C.snap(R)};
}

async function endGame(alive,reason){
  R.ended=true; pause();
  const res=score(alive,reason); R.res=res; pjEnd(res);
  $app.innerHTML=gameShell(`<div class="at-top"><button class="g-x" id="atX">← ${backTo==='games'?'Oyunlar':C.short}</button><b>Değerlendirme</b><span class="small" id="atSave">${S.preview?'Önizleme: sonuç kaydedilmedi':'Kaydediliyor…'}</span></div>
    ${debriefHtml(res)}<div class="g-act"><button class="g-btn ghost" id="atAgain">Aynı senaryoyu tekrar oyna</button><button class="g-btn" id="atNew">Yeni oyun</button></div>`,'atls');
  window.scrollTo(0,0);
  $('atX').onclick=exitGame; $('atAgain').onclick=()=>go(C.playView,{cfg:cfgCur,back:backTo}); $('atNew').onclick=()=>setupDlg(cfgCur.mode);
  if(S.preview) return;
  try{ await setDoc(doc(collection(db,C.coll)),{...res,uid:S.user.uid,email:S.email,name:S.resident?.name||S.user.displayName||S.email,at:serverTimestamp()});
    if($('atSave')) $('atSave').textContent='Sonuç kaydedildi'; }
  catch(e){ fail(e,'Sonuç kaydedilemedi'); if($('atSave')) $('atSave').textContent='Sonuç kaydedilemedi'; }
}

function base(R,lg,pen){
  const f=R.f;
  if(!f.arrest) return;
  if(f.cpr){
    f.cprMin=(f.cprMin||0)+1;
    if(R.t-f.lastSwap>=3){ f.cprQ=Math.max(.3,f.cprQ-.25); if(!f.tired){ f.tired=1; lg('sys','Göğüs basısı yapan kişi yoruldu: derinlik ve hız düşüyor. Bası yapan kişi her 2 dk’da değişmeli.'); } }
  } else {
    f.noflow=(f.noflow||0)+1;
    if(f.noflow===1) lg('sys','Hasta nabızsız ve göğüs basısı yapılmıyor!');
    if(f.noflow>=2) pen(10,'Arrestte KPR’siz geçen süre ≥ 2 dk');
  }
  if(f.roscReady){
    if(f.capno&&f.cpr&&!f.etMsg){ f.etMsg=1; lg('sys','EtCO₂ birden yükseldi (≈ 40 mmHg)!'); }
    f.roscWait=(f.roscWait||0)+1;
    if(f.roscWait>=3){ roscConfirm(R,lg,'Hasta öksürüyor ve kollarını hareket ettiriyor: nabız var — ROSC (ritim/nabız kontrolü yapılmadığı için geç fark edildi).'); pen(5,'ROSC geç fark edildi (zamanında ritim/nabız kontrolü yok)'); }
  }
}

function chrono(R,s,txt){
  if(inArr(R)) return {text:'Arrestte infüzyon yerine 1 mg bolus adrenalin kullanılır.',pen:[5,'Arrestte infüzyon vazopresör']};
  if(R.f.rosc){ R.f.norad=1; return {text:txt+' ROSC sonrası hipotansiyon için vazopresör desteği.'}; }
  if(s.brady){ R.f.chrono=1; return {text:txt+' Kalp hızı yükseliyor, TA düzeliyor.'}; }
  return {text:txt,pen:[10,'Taşikardide kronotrop / inotrop infüzyon']};
}
